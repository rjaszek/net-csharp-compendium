<script>
/* ==========================================================================
   .NET / C# Kompendium — logika aplikacji
   ========================================================================== */

(function () {
  "use strict";

  // Flatten helpers
  const flatTopics = [];
  CATS.forEach(cat => cat.topics.forEach(t => flatTopics.push({ ...t, catId: cat.id, catTitle: cat.title })));

  const totalTopicsCount = flatTopics.length;

  const navList = document.getElementById("navList");
  const contentEl = document.getElementById("content");
  const searchInput = document.getElementById("searchInput");
  const searchCount = document.getElementById("searchCount");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  const burgerBtn = document.getElementById("burgerBtn");
  const sidebarHead = document.getElementById("sidebarHead");
  const topbarBrand = document.getElementById("topbarBrand");
  const mainArea = document.getElementById("mainArea");
  const widthToggle = document.getElementById("widthToggle");
  const themeToggle = document.getElementById("themeToggle");

  let currentTopicId = null;

  /* ---------------- build sidebar nav ---------------- */
  function buildNav() {
    navList.innerHTML = "";
    CATS.forEach((cat, catIdx) => {
      const group = document.createElement("div");
      group.className = "nav-group";
      group.dataset.catId = cat.id;
      if (catIdx === 0) group.classList.add("open");

      const btn = document.createElement("button");
      btn.className = "nav-group-btn";
      btn.innerHTML = `
        <span style="display:flex;align-items:center;gap:.5rem;">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg>
          ${escapeHtml(cat.title)}
        </span>
        <span class="n">${cat.topics.length}</span>
      `;
      btn.addEventListener("click", () => group.classList.toggle("open"));

      const items = document.createElement("div");
      items.className = "nav-items";
      cat.topics.forEach(topic => {
        const item = document.createElement("div");
        item.className = "nav-item";
        item.dataset.topicId = topic.id;
        item.textContent = topic.title;
        item.addEventListener("click", () => {
          selectTopic(topic.id);
          closeMobileSidebar();
        });
        items.appendChild(item);
      });

      group.appendChild(btn);
      group.appendChild(items);
      navList.appendChild(group);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------------- home view ---------------- */
  function renderHome() {
    currentTopicId = null;
    document.querySelectorAll(".nav-item.active").forEach(el => el.classList.remove("active"));

    let cardsHtml = "";
    CATS.forEach(cat => {
      cardsHtml += `<div class="home-card" data-cat="${cat.id}">
        <div class="hc-title">${escapeHtml(cat.title)}</div>
        <div class="hc-count">${cat.topics.length} ${cat.topics.length === 1 ? "temat" : "tematów"}</div>
      </div>`;
    });

    contentEl.innerHTML = `
      <div class="home-view">
        <div class="crumb">.NET / C# <span class="sep">/</span> <span class="cat">Kompendium</span></div>
        <h2>Kompendium przed rozmową rekrutacyjną</h2>
        <p style="color:var(--text-dim); max-width:60ch;">
          Zbiór ${totalTopicsCount} tematów z rozmowy o C#, .NET, WPF, ASP.NET Core, EF Core, architekturze
          rozproszonej i algorytmach — pogrupowanych w ${CATS.length} działów. Wybierz temat z menu po lewej
          albo poniżej, albo skorzystaj z wyszukiwarki.
        </p>
        <div class="home-grid">${cardsHtml}</div>
      </div>
    `;

    contentEl.querySelectorAll(".home-card").forEach(card => {
      card.addEventListener("click", () => {
        const catId = card.dataset.cat;
        const group = navList.querySelector(`.nav-group[data-cat-id="${catId}"]`);
        if (group) {
          group.classList.add("open");
          const firstTopic = group.querySelector(".nav-item");
          if (firstTopic) selectTopic(firstTopic.dataset.topicId);
        }
      });
    });

    window.scrollTo(0, 0);
  }

  /* ---------------- topic view ---------------- */
  function selectTopic(topicId) {
    const topic = flatTopics.find(t => t.id === topicId);
    if (!topic) return;
    currentTopicId = topicId;

    document.querySelectorAll(".nav-item.active").forEach(el => el.classList.remove("active"));
    const navEl = navList.querySelector(`.nav-item[data-topic-id="${topicId}"]`);
    if (navEl) {
      navEl.classList.add("active");
      const group = navEl.closest(".nav-group");
      if (group) group.classList.add("open");
    }

    const idx = flatTopics.findIndex(t => t.id === topicId);
    const prev = flatTopics[idx - 1];
    const next = flatTopics[idx + 1];

    let navHtml = `<div class="topic-nav">`;
    navHtml += prev
      ? `<a class="prev" data-goto="${prev.id}"><span class="lbl">← wstecz</span>${escapeHtml(prev.title)}</a>`
      : `<span></span>`;
    navHtml += next
      ? `<a class="next" data-goto="${next.id}"><span class="lbl">dalej →</span>${escapeHtml(next.title)}</a>`
      : `<span></span>`;
    navHtml += `</div>`;

    contentEl.innerHTML = `
      <div class="topic">
        <div class="crumb">.NET / C# <span class="sep">/</span> <span class="cat">${escapeHtml(topic.catTitle)}</span></div>
        ${topic.body}
        ${navHtml}
      </div>
    `;

    contentEl.querySelectorAll("[data-goto]").forEach(el => {
      el.addEventListener("click", () => { selectTopic(el.dataset.goto); window.scrollTo(0, 0); });
    });

    if (window.hljs) {
      contentEl.querySelectorAll("pre code").forEach(block => hljs.highlightElement(block));
    }

    addCopyButtons();

    window.scrollTo(0, 0);
  }

  /* ---------------- copy-to-clipboard for code blocks ---------------- */
  const copyIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`;
  const checkIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  function addCopyButtons() {
    contentEl.querySelectorAll("pre").forEach(pre => {
      if (pre.parentElement.classList.contains("code-wrap")) return; // already wrapped

      const wrap = document.createElement("div");
      wrap.className = "code-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.type = "button";
      btn.innerHTML = `${copyIconSvg}<span>Kopiuj</span>`;
      btn.addEventListener("click", () => copyCodeBlock(pre, btn));
      wrap.appendChild(btn);
    });
  }

  function copyCodeBlock(pre, btn) {
    const code = pre.querySelector("code");
    const text = code ? code.innerText : pre.innerText;

    const done = () => {
      btn.classList.add("copied");
      btn.innerHTML = `${checkIconSvg}<span>Skopiowano</span>`;
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = `${copyIconSvg}<span>Kopiuj</span>`;
      }, 1600);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) { /* silent */ }
  }

  /* ---------------- search ---------------- */
  function applySearch(query) {
    const q = query.trim().toLowerCase();
    let visibleCount = 0;

    CATS.forEach(cat => {
      const group = navList.querySelector(`.nav-group[data-cat-id="${cat.id}"]`);
      let anyVisibleInGroup = false;

      cat.topics.forEach(topic => {
        const el = group.querySelector(`.nav-item[data-topic-id="${topic.id}"]`);
        const haystack = (topic.title + " " + (topic.tags || "")).toLowerCase();
        const match = q === "" || haystack.includes(q);
        el.classList.toggle("hidden", !match);
        if (match) { anyVisibleInGroup = true; visibleCount++; }
      });

      group.classList.toggle("hidden", !anyVisibleInGroup);
      if (q !== "" && anyVisibleInGroup) group.classList.add("open");
    });

    searchCount.textContent = q === "" ? "" : `${visibleCount} / ${totalTopicsCount} wyników`;
  }

  searchInput.addEventListener("input", e => applySearch(e.target.value));

  /* ---------------- mobile drawer ---------------- */
  function openMobileSidebar() { sidebar.classList.add("open"); overlay.classList.add("show"); }
  function closeMobileSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("show"); }
  burgerBtn.addEventListener("click", () => {
    sidebar.classList.contains("open") ? closeMobileSidebar() : openMobileSidebar();
  });
  overlay.addEventListener("click", closeMobileSidebar);

  /* ---------------- brand / title -> go home ---------------- */
  function goHome() {
    renderHome();
    closeMobileSidebar();
  }
  sidebarHead.addEventListener("click", goHome);
  topbarBrand.addEventListener("click", goHome);

  /* ---------------- dark / light theme toggle ---------------- */
  if (themeToggle) {
    function setTheme(theme) {
      // theme: "dark" albo "light"
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.classList.toggle("is-light", theme === "light");
      themeToggle.title = theme === "light" ? "Tryb ciemny" : "Tryb jasny";
      try { localStorage.setItem("kompendium-theme", theme); } catch (e) { /* ignore */ }
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      setTheme(current === "light" ? "dark" : "light");
    });

    let savedTheme = null;
    try { savedTheme = localStorage.getItem("kompendium-theme"); } catch (e) { /* ignore */ }
    if (savedTheme === "light" || savedTheme === "dark") {
      setTheme(savedTheme);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      setTheme(prefersLight ? "light" : "dark");
    }
  }

  /* ---------------- full-width toggle ---------------- */
  const wideIconExpand = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
  const wideIconCollapse = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="10" y1="14" x2="3" y2="21"/>`;

  function setWide(isWide) {
    mainArea.classList.toggle("wide", isWide);
    widthToggle.title = isWide ? "Wąska treść" : "Pełna szerokość";
    document.getElementById("widthToggleIcon").innerHTML = isWide ? wideIconCollapse : wideIconExpand;
  }

  widthToggle.addEventListener("click", () => {
    setWide(!mainArea.classList.contains("wide"));
  });

  // Strona domyślnie ZAWSZE otwiera się na pełną szerokość - użytkownik może
  // zwęzić treść przyciskiem, ale to nie jest zapamiętywane między wizytami.
  setWide(true);

  /* ---------------- init ---------------- */
  buildNav();
  renderHome();

})();

</script>
</body>
</html>
