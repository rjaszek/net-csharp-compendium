  { id:"ef-basics", title:"Podstawy EF Core", tags:"dbcontext dbset asnotracking include n+1 migrations",
  body:`
  <h1>Entity Framework Core - podstawy</h1>
<h2>DbContext i DbSet - fundament</h2>
<pre><code class="language-csharp">public class AppDbContext : DbContext
{
    public AppDbContext(DbContextOptions&lt;AppDbContext&gt; options) : base(options) { }

    public DbSet&lt;Order&gt; Orders { get; set; }
    public DbSet&lt;Customer&gt; Customers { get; set; }
    public DbSet&lt;OrderItem&gt; OrderItems { get; set; }

    protected override void OnModelCreating(ModelBuilder modelBuilder)
    {
        modelBuilder.Entity&lt;Order&gt;()
            .HasMany(o =&gt; o.Items)
            .WithOne(i =&gt; i.Order)
            .HasForeignKey(i =&gt; i.OrderId);
    }
}
</code></pre>
<p><code>DbSet&lt;T&gt;</code> reprezentuje tabelę w bazie i implementuje <code>IQueryable&lt;T&gt;</code> (o czym mówiliśmy wcześniej) - każde zapytanie na <code>DbSet</code> jest budowane jako drzewo wyrażeń, dopóki nie zażądasz materializacji.</p>
<h2>Change Tracking - domyślne zachowanie</h2>
<pre><code class="language-csharp">var order = await _context.Orders.FirstAsync(o =&gt; o.Id == 1);
order.Status = &quot;Shipped&quot;; // EF Core AUTOMATYCZNIE śledzi tę zmianę

await _context.SaveChangesAsync(); // generuje UPDATE tylko dla zmienionych pól
</code></pre>
<p>EF Core <strong>automatycznie wykrywa</strong> zmiany na obiektach, które zostały pobrane przez ten sam <code>DbContext</code> - nie musisz ręcznie mówić "ten obiekt się zmienił".</p>
<h2><code>AsNoTracking()</code> - wyłączenie trackingu dla odczytu</h2>
<pre><code class="language-csharp">// Ze trackingiem (domyślnie) - EF Core przechowuje &quot;snapshot&quot; do porównania przy SaveChanges
var orders = await _context.Orders.ToListAsync();

// Bez trackingu - szybsze, mniej pamięci, gdy TYLKO czytasz dane (nie będziesz ich modyfikować)
var readOnlyOrders = await _context.Orders.AsNoTracking().ToListAsync();
</code></pre>
<p><strong>Kiedy używać <code>AsNoTracking()</code>:</strong> dla wszystkich zapytań <strong>tylko do odczytu</strong> (np. wyświetlanie listy w API, raporty) - eliminuje narzut change trackera, co przy dużych zbiorach danych daje realną różnicę wydajnościową.</p>
<h2>Problem N+1 - klasyczna pułapka wydajnościowa</h2>
<pre><code class="language-csharp">// ❌ N+1 problem - jedno zapytanie po zamówienia + N zapytań po klienta dla każdego z nich
var orders = await _context.Orders.ToListAsync();
foreach (var order in orders)
{
    Console.WriteLine(order.Customer.Name); // LAZY LOADING - osobne zapytanie SQL dla KAŻDEGO order!
}
</code></pre>
<pre><code class="language-csharp">// ✅ Eager loading z Include - JEDNO zapytanie z JOIN
var orders = await _context.Orders
    .Include(o =&gt; o.Customer)
    .ToListAsync();

foreach (var order in orders)
{
    Console.WriteLine(order.Customer.Name); // dane już załadowane, brak dodatkowych zapytań
}
</code></pre>
<p><strong><code>Include()</code></strong> generuje <code>JOIN</code> w SQL i ładuje powiązane dane <strong>w tym samym zapytaniu</strong> - to jest standardowe rozwiązanie problemu N+1 w EF Core.</p>
<pre><code class="language-csharp">// Include wielopoziomowy (ThenInclude)
var orders = await _context.Orders
    .Include(o =&gt; o.Customer)
    .Include(o =&gt; o.Items).ThenInclude(i =&gt; i.Product)
    .ToListAsync();
</code></pre>
<h2>Migracje - zarządzanie schematem bazy</h2>
<pre><code class="language-bash">dotnet ef migrations add AddOrderStatusColumn   # generuje plik migracji na podstawie zmian w modelu
dotnet ef database update                        # stosuje migracje do bazy danych
dotnet ef migrations remove                       # usuwa ostatnią, jeszcze niezastosowaną migrację
dotnet ef database update PreviousMigrationName    # rollback do konkretnej migracji
</code></pre>
<p>Migracja to plik C# generowany automatycznie, opisujący <strong>różnicę</strong> między poprzednim a aktualnym modelem (<code>Up()</code>/<code>Down()</code>):</p>
<pre><code class="language-csharp">public partial class AddOrderStatusColumn : Migration
{
    protected override void Up(MigrationBuilder migrationBuilder)
    {
        migrationBuilder.AddColumn&lt;string&gt;(name: &quot;Status&quot;, table: &quot;Orders&quot;, type: &quot;nvarchar(50)&quot;, nullable: true);
    }

    protected override void Down(MigrationBuilder migrationBuilder)
    {
        migrationBuilder.DropColumn(name: &quot;Status&quot;, table: &quot;Orders&quot;);
    }
}
</code></pre>
<h2>Async guidelines - zawsze asynchronicznie</h2>
<pre><code class="language-csharp">// ✅ Poprawnie - EF Core operacje I/O powinny być zawsze async
var order = await _context.Orders.FirstOrDefaultAsync(o =&gt; o.Id == id);
await _context.SaveChangesAsync();

// ❌ Źle - blokuje wątek na czas I/O, marnuje zasoby (zwłaszcza w Web API pod obciążeniem)
var order = _context.Orders.FirstOrDefault(o =&gt; o.Id == id);
_context.SaveChanges();
</code></pre>
<h2>Podsumowanie kluczowych metod</h2>
<table>
<thead>
<tr>
<th>Metoda</th>
<th>Cel</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>AsNoTracking()</code></td>
<td>Wyłącza change tracking, szybsze zapytania tylko-do-odczytu</td>
</tr>
<tr>
<td><code>Include()</code>/<code>ThenInclude()</code></td>
<td>Eager loading, unika problemu N+1</td>
</tr>
<tr>
<td><code>FirstOrDefaultAsync()</code></td>
<td>Pobranie jednego rekordu lub null</td>
</tr>
<tr>
<td><code>AnyAsync()</code></td>
<td>Sprawdzenie istnienia bez pobierania danych</td>
</tr>
<tr>
<td><code>CountAsync()</code></td>
<td>Liczenie bez materializacji wszystkich rekordów</td>
</tr>
<tr>
<td><code>SaveChangesAsync()</code></td>
<td>Zapisanie wszystkich śledzonych zmian jako transakcja</td>
</tr>
</tbody>
</table>
  
  `},

  { id:"repo-uow", title:"Repository + Unit of Work nad EF Core", tags:"repository unit of work dbset savechanges extension methods",
  body:`
  <h1>Repository + Unit of Work z EF Core - czy to nadal potrzebne?</h1>
<h2>Tradycyjny wzorzec Repository</h2>
<pre><code class="language-csharp">public interface IOrderRepository
{
    Task&lt;Order&gt; GetByIdAsync(int id);
    Task&lt;List&lt;Order&gt;&gt; GetAllAsync();
    void Add(Order order);
    void Remove(Order order);
}

public class OrderRepository : IOrderRepository
{
    private readonly AppDbContext _context;
    public OrderRepository(AppDbContext context) =&gt; _context = context;

    public async Task&lt;Order&gt; GetByIdAsync(int id) =&gt; await _context.Orders.FindAsync(id);
    public async Task&lt;List&lt;Order&gt;&gt; GetAllAsync() =&gt; await _context.Orders.ToListAsync();
    public void Add(Order order) =&gt; _context.Orders.Add(order);
    public void Remove(Order order) =&gt; _context.Orders.Remove(order);
}
</code></pre>
<h2>Unit of Work - koordynacja transakcji między repozytoriami</h2>
<pre><code class="language-csharp">public interface IUnitOfWork
{
    IOrderRepository Orders { get; }
    ICustomerRepository Customers { get; }
    Task&lt;int&gt; SaveChangesAsync();
}

public class UnitOfWork : IUnitOfWork
{
    private readonly AppDbContext _context;
    public IOrderRepository Orders { get; }
    public ICustomerRepository Customers { get; }

    public UnitOfWork(AppDbContext context)
    {
        _context = context;
        Orders = new OrderRepository(context);
        Customers = new CustomerRepository(context);
    }

    public async Task&lt;int&gt; SaveChangesAsync() =&gt; await _context.SaveChangesAsync(); // JEDNA transakcja
}
</code></pre>
<pre><code class="language-csharp">// Użycie - obie zmiany zapisane ATOMOWO w jednej transakcji
await unitOfWork.Orders.AddAsync(order);
await unitOfWork.Customers.UpdateAsync(customer);
await unitOfWork.SaveChangesAsync(); // JEDNO wywołanie, JEDNA transakcja dla obu zmian
</code></pre>
<h2>Kontrowersja - dlaczego wielu twierdzi, że to zbędne z EF Core</h2>
<p>To jest <strong>częste pytanie dyskusyjne</strong> na rozmowach SE III - "czy warto owijać EF Core w Repository/UoW?" Argumenty <strong>przeciw</strong>:</p>
<p><strong>1. <code>DbContext</code> JUŻ JEST Unit of Work</strong></p>
<pre><code class="language-csharp">// DbContext SAM śledzi wszystkie zmiany i zapisuje je atomowo w JEDNEJ transakcji
_context.Orders.Add(order);
_context.Customers.Update(customer);
await _context.SaveChangesAsync(); // JEDNA transakcja, bez żadnego dodatkowego UnitOfWork
</code></pre>
<p><code>SaveChangesAsync()</code> <strong>domyślnie</strong> owija wszystkie zmiany w jedną transakcję - dodatkowy <code>IUnitOfWork</code> <strong>duplikuje</strong> funkcjonalność, którą <code>DbContext</code> już ma wbudowaną.</p>
<p><strong>2. <code>DbSet&lt;T&gt;</code> JUŻ JEST Repository</strong></p>
<pre><code class="language-csharp">// DbSet ma już CRUD + LINQ - &quot;repozytorium&quot; tylko dodaje kolejną warstwę wołającą to samo
_context.Orders.Add(order);
_context.Orders.Remove(order);
await _context.Orders.Where(o =&gt; o.Status == &quot;Pending&quot;).ToListAsync();
</code></pre>
<p><strong>3. Utrata mocy LINQ/<code>IQueryable</code></strong> - to jest <strong>najbardziej praktyczny</strong> argument, wracający do tego, o czym mówiliśmy przy <code>IQueryable</code>:</p>
<pre><code class="language-csharp">public interface IOrderRepository
{
    Task&lt;List&lt;Order&gt;&gt; GetAllAsync(); // ❌ Zwraca WSZYSTKO, nie da się dodać filtra z zewnątrz jako IQueryable
}

// Serwis MUSI filtrować w pamięci, bo Repository już zmaterializował dane
var orders = await _repository.GetAllAsync();
var filtered = orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // filtr W PAMIĘCI, nie w SQL!
</code></pre>
<p>Żeby to naprawić, repozytorium musiałoby zwracać <code>IQueryable&lt;Order&gt;</code>, ale to <strong>przecieka</strong> szczegóły EF Core przez interfejs repozytorium - co było głównym powodem, dla którego repozytorium miało istnieć (odizolowanie od konkretnej technologii dostępu do danych).</p>
<h2>Kiedy Repository/UoW MA sens - argumenty ZA</h2>
<p><strong>1. Rzeczywista abstrakcja od EF Core (rzadka, ale realna potrzeba)</strong> - jeśli <strong>naprawdę</strong> planujesz podmienić EF Core na coś innego (Dapper, inne ORM), albo testujesz logikę biznesową <strong>bez</strong> żadnej bazy (mockując cały interfejs).</p>
<p><strong>2. Enkapsulacja złożonych, powtarzalnych zapytań</strong></p>
<pre><code class="language-csharp">public interface IOrderRepository
{
    Task&lt;List&lt;Order&gt;&gt; GetOrdersWithPendingPaymentAsync(); // konkretna, nazwana operacja biznesowa
}

public class OrderRepository : IOrderRepository
{
    public async Task&lt;List&lt;Order&gt;&gt; GetOrdersWithPendingPaymentAsync()
    {
        return await _context.Orders
            .Include(o =&gt; o.Payments)
            .Where(o =&gt; o.Status == &quot;Pending&quot; &amp;&amp; o.Payments.All(p =&gt; p.Status != &quot;Completed&quot;))
            .ToListAsync();
    }
}
</code></pre>
<p>To jest <strong>specyficzny wzorzec</strong> repozytorium - nie generyczne CRUD, tylko <strong>nazwane metody odpowiadające konkretnym zapytaniom biznesowym</strong>, które enkapsulują złożoną logikę zapytania w jednym miejscu, reużywalną w wielu serwisach.</p>
<p><strong>3. CQRS z MediatR</strong> - w tym wzorcu (o którym rozmawialiśmy) Handler <strong>często</strong> wywołuje <code>DbContext</code> <strong>bezpośrednio</strong>, bez żadnego repozytorium - to jest zresztą dominujący styl w nowoczesnych aplikacjach .NET.</p>
<h2>Praktyczna rekomendacja - dominujący pogląd w środowisku .NET (2020s+)</h2>
<blockquote>
<p><strong>Nie owijaj <code>DbContext</code> w generyczne Repository/UoW "na wszelki wypadek"</strong> - to dodaje warstwę abstrakcji bez realnej korzyści, bo <code>DbContext</code>/<code>DbSet</code> już <strong>są</strong> Unit of Work/Repository. Zamiast tego: albo wołaj <code>DbContext</code> bezpośrednio z serwisu/Handlera CQRS, albo (jeśli chcesz enkapsulacji) twórz <strong>specyficzne</strong> metody repozytorium odpowiadające <strong>konkretnym zapytaniom biznesowym</strong> (jak <code>GetOrdersWithPendingPaymentAsync</code> wyżej), zwracające już zmaterializowane dane, nie generyczny <code>GetAll()</code>.</p>
</blockquote>
<h2>Tabela - kiedy co</h2>
<table>
<thead>
<tr>
<th>Podejście</th>
<th>Kiedy sensowne</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DbContext</code> bezpośrednio w serwisie/Handlerze</td>
<td>Domyślny wybór w większości nowoczesnych aplikacji .NET, zwłaszcza z CQRS</td>
</tr>
<tr>
<td>Specyficzne Repository (nazwane metody biznesowe)</td>
<td>Powtarzalne, złożone zapytania używane w wielu miejscach</td>
</tr>
<tr>
<td>Generyczne <code>IRepository&lt;T&gt;</code>/<code>IUnitOfWork</code></td>
<td>Rzadko - głównie gdy realnie testujesz bez żadnej bazy/EF Core, albo firma ma to jako standard architektoniczny</td>
</tr>
</tbody>
</table>
  
  `},

  { id:"ef-async", title:"Async w EF Core — kiedy tak, kiedy nie", tags:"async await io cpu bound task run warstwy",
  body:`
  <h1>Dobre praktyki async w EF Core</h1>
<h2>Zasada podstawowa - wszystko I/O powinno być async</h2>
<pre><code class="language-csharp">// ✅ Poprawnie
var order = await _context.Orders.FirstOrDefaultAsync(o =&gt; o.Id == id);
var count = await _context.Orders.CountAsync();
var exists = await _context.Orders.AnyAsync(o =&gt; o.Status == &quot;Pending&quot;);
await _context.SaveChangesAsync();

// ❌ Źle - blokuje wątek, marnuje throughput w Web API pod obciążeniem
var order = _context.Orders.FirstOrDefault(o =&gt; o.Id == id);
</code></pre>
<p>Jak omawialiśmy wcześniej - synchroniczne wywołanie I/O <strong>blokuje wątek</strong> z puli wątków na cały czas trwania zapytania do bazy (mogą to być milisekundy, ale przy dużym ruchu to się kumuluje). Async pozwala wątkowi wrócić do puli i obsłużyć inny request, podczas gdy czekamy na bazę.</p>
<h2>Pułapka #1: Nigdy nie współdziel jednego <code>DbContext</code> między równoległymi zadaniami</h2>
<pre><code class="language-csharp">// ❌ BŁĄD - DbContext NIE jest thread-safe (jak omawialiśmy przy Singleton/thread-safety)
var task1 = _context.Orders.ToListAsync();
var task2 = _context.Customers.ToListAsync();
await Task.WhenAll(task1, task2); // InvalidOperationException - &quot;A second operation was started...&quot;
</code></pre>
<pre><code class="language-csharp">// ✅ Poprawnie - osobne scope'y/DbContext dla równoległych operacji
using var scope1 = _scopeFactory.CreateScope();
using var scope2 = _scopeFactory.CreateScope();
var context1 = scope1.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();
var context2 = scope2.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();

var task1 = context1.Orders.ToListAsync();
var task2 = context2.Customers.ToListAsync();
await Task.WhenAll(task1, task2); // OK - różne instancje DbContext
</code></pre>
<p>To dokładnie nawiązuje do tego, co mówiliśmy o <code>IServiceScopeFactory</code> i Scoped lifetime - <code>DbContext</code> jest Scoped właśnie <strong>dlatego</strong>, że nie jest thread-safe, i próba jego współdzielenia między równoległymi task-ami (nawet w ramach tego samego requestu!) rzuci wyjątek.</p>
<h2>Pułapka #2: <code>ConfigureAwait(false)</code> w warstwie danych</h2>
<pre><code class="language-csharp">public class OrderRepository
{
    public async Task&lt;Order&gt; GetByIdAsync(int id)
    {
        // Jak mówiliśmy przy SynchronizationContext - warstwa danych/serwisy
        // NIE dotykają UI, więc ConfigureAwait(false) ma tu sens
        return await _context.Orders
            .FirstOrDefaultAsync(o =&gt; o.Id == id)
            .ConfigureAwait(false);
    }
}
</code></pre>
<h2>Pułapka #3: <code>.Result</code>/<code>.Wait()</code> - blokowanie na asynchronicznym kodzie</h2>
<pre><code class="language-csharp">// ❌ NIGDY - ryzyko deadlocku (jak w scenariuszu z WPF, o którym mówiliśmy)
var order = _context.Orders.FirstOrDefaultAsync(o =&gt; o.Id == id).Result;

// ✅ Async all the way
var order = await _context.Orders.FirstOrDefaultAsync(o =&gt; o.Id == id);
</code></pre>
<h2>Pułapka #4: <code>IEnumerable</code> vs <code>IQueryable</code> przy async</h2>
<pre><code class="language-csharp">// ❌ Problem - jeśli typ zmiennej to IEnumerable, TERAZ filtr NIE trafi do SQL
IEnumerable&lt;Order&gt; orders = _context.Orders;
var filtered = orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // w PAMIĘCI, po pobraniu WSZYSTKIEGO
var list = filtered.ToList(); // synchronicznie! (IEnumerable nie ma ToListAsync)

// ✅ Poprawnie - IQueryable aż do końca, materializacja asynchroniczna
IQueryable&lt;Order&gt; orders = _context.Orders;
var filtered = orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // trafia do SQL WHERE
var list = await filtered.ToListAsync();
</code></pre>
<h2><code>CancellationToken</code> - propagacja przez cały łańcuch async</h2>
<pre><code class="language-csharp">[HttpGet]
public async Task&lt;ActionResult&lt;List&lt;OrderDto&gt;&gt;&gt; GetOrders(CancellationToken cancellationToken)
{
    var orders = await _context.Orders.ToListAsync(cancellationToken); // przekazane DALEJ do EF Core
    return Ok(orders);
}
</code></pre>
<p>Jeśli użytkownik zamknie kartę przeglądarki/przerwie request, ASP.NET Core <strong>automatycznie</strong> odwoła (cancel) ten token - EF Core przerwie zapytanie SQL w toku, zamiast czekać na jego zakończenie i wyrzucać wynik. To realnie odciąża bazę danych pod dużym ruchem.</p>
<h2>Podsumowanie - checklist dobrych praktyk</h2>
<ol>
<li>Zawsze <code>async</code>/<code>await</code> dla operacji EF Core (<code>ToListAsync</code>, <code>FirstOrDefaultAsync</code>, <code>SaveChangesAsync</code>)</li>
<li>Nigdy nie współdziel jednego <code>DbContext</code> między równoległymi taskami - twórz osobne scope'y</li>
<li><code>ConfigureAwait(false)</code> w warstwie repozytoriów/serwisów (nie dotyczy kodu UI, jak omawialiśmy przy WPF)</li>
<li>Nigdy <code>.Result</code>/<code>.Wait()</code> na kodzie EF Core - ryzyko deadlocku</li>
<li>Trzymaj <code>IQueryable</code> aż do materializacji (<code>ToListAsync</code>), żeby filtr/paginacja trafiły do SQL</li>
<li>Propaguj <code>CancellationToken</code> przez cały łańcuch wywołań</li>
</ol>
  
  `},

  { id:"change-tracking", title:"Change Tracking pod spodem", tags:"snapshot statemanager detectchanges identity map entitystate",
  body:`
  <h1>Change Tracking w EF Core - wewnętrzny mechanizm</h1>
<h2>Jak EF Core "wie", co się zmieniło</h2>
<p>Gdy pobierasz encję przez śledzony <code>DbContext</code>, EF Core robi <strong>snapshot</strong> wartości wszystkich właściwości w momencie pobrania:</p>
<pre><code class="language-csharp">var order = await _context.Orders.FirstAsync(o =&gt; o.Id == 1);
// EF Core zapisuje wewnętrznie: { Id: 1, Status: &quot;Pending&quot;, TotalAmount: 100 } jako &quot;original values&quot;

order.Status = &quot;Shipped&quot;; // zmieniasz WŁAŚCIWOŚĆ obiektu w pamięci .NET, NIC więcej

await _context.SaveChangesAsync();
// Change Tracker PORÓWNUJE &quot;current values&quot; z &quot;original values&quot;
// Wykrywa: Status zmienił się z &quot;Pending&quot; na &quot;Shipped&quot;
// Generuje: UPDATE Orders SET Status = 'Shipped' WHERE Id = 1
</code></pre>
<h2>Stany encji - <code>EntityState</code></h2>
<p>Każda encja śledzona przez <code>DbContext</code> ma jeden z pięciu stanów:</p>
<pre><code class="language-csharp">public enum EntityState
{
    Detached,   // nieśledzona - EF Core o niej nie wie
    Unchanged,  // śledzona, bez zmian od pobrania
    Added,      // nowa, do wstawienia (INSERT)
    Modified,   // zmieniona, do aktualizacji (UPDATE)
    Deleted     // oznaczona do usunięcia (DELETE)
}
</code></pre>
<pre><code class="language-csharp">var order = new Order { CustomerName = &quot;Jan&quot; };
_context.Orders.Add(order);
Console.WriteLine(_context.Entry(order).State); // Added

var existingOrder = await _context.Orders.FirstAsync();
Console.WriteLine(_context.Entry(existingOrder).State); // Unchanged

existingOrder.Status = &quot;Shipped&quot;;
Console.WriteLine(_context.Entry(existingOrder).State); // Modified (automatycznie!)

_context.Orders.Remove(existingOrder);
Console.WriteLine(_context.Entry(existingOrder).State); // Deleted
</code></pre>
<h2><code>ChangeTracker.DetectChanges()</code> - kiedy faktycznie się wykonuje</h2>
<p>To jest szczegół, o który czasem pytają - wykrywanie zmian <strong>nie dzieje się w momencie ustawienia właściwości</strong>, tylko przy pewnych operacjach:</p>
<pre><code class="language-csharp">order.Status = &quot;Shipped&quot;; // NIE od razu wykrywane
// DetectChanges() wywoływane automatycznie przy: SaveChanges(), ChangeTracker.Entries(), niektórych LINQ na DbSet
await _context.SaveChangesAsync(); // TERAZ następuje pełne porównanie snapshot vs current
</code></pre>
<h2><code>AsNoTracking()</code> - dlaczego wyłącza to wszystko</h2>
<pre><code class="language-csharp">var readOnlyOrder = await _context.Orders.AsNoTracking().FirstAsync(o =&gt; o.Id == 1);
readOnlyOrder.Status = &quot;Shipped&quot;; // zmiana w PAMIĘCI, ale EF Core o niej NIE WIE

await _context.SaveChangesAsync(); // NIC się nie zapisze - encja nie jest śledzona!
</code></pre>
<p>Bez trackingu, EF Core <strong>nie robi</strong> snapshotu przy pobraniu, więc nie ma <strong>z czym porównać</strong> aktualnych wartości - stąd <code>AsNoTracking()</code> jest szybsze (mniej pamięci, brak porównywania), ale <strong>nie da się</strong> przez nią modyfikować i zapisywać zmian.</p>
<h2><code>Attach()</code> - ręczne dołączenie encji z zewnątrz do trackingu</h2>
<p>Przydatne, gdy dostajesz obiekt <strong>z innego</strong> <code>DbContext</code> (np. z warstwy API, po deserializacji z JSON) i chcesz go zaktualizować:</p>
<pre><code class="language-csharp">public async Task UpdateOrderAsync(OrderDto dto)
{
    var order = new Order { Id = dto.Id, Status = dto.Status }; // &quot;odłączony&quot; obiekt, nie z tego DbContext

    _context.Orders.Attach(order); // dołącz do trackingu jako Unchanged
    _context.Entry(order).Property(o =&gt; o.Status).IsModified = true; // oznacz TYLKO Status jako zmieniony

    await _context.SaveChangesAsync(); // generuje UPDATE tylko dla Status
}
</code></pre>
<p>To pozwala <strong>precyzyjnie</strong> kontrolować, które konkretne pole ma być zaktualizowane, bez pobierania całej encji z bazy najpierw.</p>
<h2>Dlaczego to jest ważne dla decyzji <code>class</code> vs <code>record</code> (nawiązanie)</h2>
<p>Wracając do wcześniejszej rozmowy o <code>record</code> vs <code>class</code> - to jest właśnie <strong>techniczny powód</strong>, dla którego encje EF Core prawie zawsze są <code>class</code> z <code>{ get; set; }</code>, nie <code>record</code> z <code>{ get; init; }</code>:</p>
<pre><code class="language-csharp">// ❌ Encja jako record z init-only properties - Change Tracking NIE MA JAK zadziałać
public record Order(int Id, string Status); // init-only - nie da się zmienić po utworzeniu!

var order = await _context.Orders.FirstAsync();
order.Status = &quot;Shipped&quot;; // ❌ Błąd kompilacji - init nie pozwala na set po utworzeniu
</code></pre>
<p>Change Tracker <strong>wymaga</strong> mutowalnych właściwości (<code>set</code>), żeby w ogóle mógł zarejestrować zmianę - to jest fundamentalny konflikt z filozofią niemutowalności <code>record</code>.</p>
<h2>Podsumowanie mechanizmu</h2>
<blockquote>
<p>Change Tracker w EF Core robi <strong>snapshot</strong> wartości właściwości w momencie pobrania encji przez śledzony <code>DbContext</code>. Przy <code>SaveChangesAsync()</code> (albo innych wywołaniach <code>DetectChanges()</code>) porównuje <strong>aktualne</strong> wartości właściwości obiektu z tym snapshotem i na tej podstawie generuje odpowiednie <code>UPDATE</code>/<code>INSERT</code>/<code>DELETE</code>. <code>AsNoTracking()</code> wyłącza tworzenie snapshotu (szybsze, ale bez możliwości zapisu zmian), a <code>Attach()</code> pozwala ręcznie dołączyć "odłączony" obiekt (np. z innego kontekstu/warstwy) do trackingu.</p>
</blockquote>
  
  `},

  { id:"migrations-team", title:"Migracje w zespole", tags:"migracje modelsnapshot konflikty git idempotent skrypt sql",
  body:`
  <h1>Migracje EF Core w pracy zespołowej</h1>
<h2>Problem - konflikty migracji przy pracy wielu osób</h2>
<p>Gdy kilka osób w zespole równolegle zmienia model danych, każda generuje <strong>własną</strong> migrację - klasyczny scenariusz konfliktu:</p>
<pre><code class="language-csharp">Deweloper A: dodaje kolumnę &quot;Status&quot; do Order      → migracja 20240115_AddOrderStatus
Deweloper B: dodaje kolumnę &quot;DiscountCode&quot; do Order → migracja 20240115_AddDiscountCode
</code></pre>
<p>Obie migracje bazują na <strong>tym samym</strong> modelu "przed zmianą" - gdy obie trafią do głównej gałęzi (np. przez merge), EF Core może się "pogubić" w kolejności, a snapshot modelu (<code>ModelSnapshot.cs</code>) będzie w konflikcie.</p>
<h2><code>ModelSnapshot.cs</code> - źródło konfliktów w Git</h2>
<p>EF Core przechowuje <strong>pełny snapshot</strong> aktualnego modelu w wygenerowanym pliku <code>AppDbContextModelSnapshot.cs</code> - to jest plik, który <strong>będzie miał konflikt merge</strong> przy równoległych migracjach, bo obie osoby modyfikują <strong>ten sam wygenerowany plik</strong>.</p>
<pre><code class="language-csharp">// AppDbContextModelSnapshot.cs (fragment, WYGENEROWANY, nie edytuj ręcznie)
[DbContext(typeof(AppDbContext))]
partial class AppDbContextModelSnapshot : ModelSnapshot
{
    protected override void BuildModel(ModelBuilder modelBuilder)
    {
        modelBuilder.Entity(&quot;MyApp.Order&quot;, b =&gt;
        {
            b.Property&lt;int&gt;(&quot;Id&quot;);
            b.Property&lt;string&gt;(&quot;Status&quot;); // dodane przez Dewelopera A
            b.Property&lt;string&gt;(&quot;DiscountCode&quot;); // dodane przez Dewelopera B - KONFLIKT MERGE
        });
    }
}
</code></pre>
<h2>Praktyczne rozwiązanie konfliktu</h2>
<p><strong>Krok 1:</strong> Po merge/rebase, jeśli jest konflikt w <code>ModelSnapshot.cs</code> - <strong>NIE</strong> próbuj ręcznie scalać tego pliku (jest generowany, ręczna edycja jest bardzo podatna na błędy).</p>
<p><strong>Krok 2:</strong> Usuń lokalnie migracje, które jeszcze nie trafiły do bazy produkcyjnej/współdzielonej:</p>
<pre><code class="language-bash">dotnet ef migrations remove  # usuwa OSTATNIĄ migrację (jeśli jeszcze nie zaaplikowana)
</code></pre>
<p><strong>Krok 3:</strong> Wygeneruj migrację <strong>na nowo</strong>, na podstawie już scalonego modelu (zawierającego zmiany OBU deweloperów):</p>
<pre><code class="language-bash">dotnet ef migrations add AddOrderStatusAndDiscountCode
</code></pre>
<p>Teraz EF Core generuje <strong>jedną, spójną</strong> migrację, bazującą na modelu zawierającym zmiany obu osób naraz - <code>ModelSnapshot.cs</code> jest odtwarzany bez konfliktu, bo to nowy, czysty plik po merge.</p>
<h2>Zasada zespołowa - komunikacja przed migracją</h2>
<p>Praktyczna rekomendacja, którą wiele zespołów stosuje: <strong>zanim wygenerujesz migrację, pociągnij (<code>git pull</code>) najnowsze zmiany z głównej gałęzi</strong>, żeby Twoja migracja bazowała na najświeższym modelu, a nie na przestarzałej wersji z rana.</p>
<h2>Kolejność stosowania migracji - <code>__EFMigrationsHistory</code></h2>
<p>EF Core śledzi, które migracje zostały już zastosowane do konkretnej bazy, w specjalnej tabeli:</p>
<pre><code class="language-sql">SELECT * FROM __EFMigrationsHistory ORDER BY MigrationId;
</code></pre>
<p>Jeśli dwie migracje z różnych brancherów mają <strong>kolidujące</strong> nazwy plików/timestampy, <code>dotnet ef database update</code> <strong>może próbować</strong> zastosować je w nieoczekiwanej kolejności - stąd zasada "usuń niezaaplikowaną migrację i wygeneruj ją na nowo po scaleniu kodu" jest bezpieczniejsza niż próba ręcznego scalania.</p>
<h2>Migracje "puste" (data seeding, operacje niereprezentowane w modelu)</h2>
<p>Czasem potrzebujesz migracji, która <strong>nie zmienia</strong> struktury tabel, tylko np. wypełnia dane:</p>
<pre><code class="language-bash">dotnet ef migrations add SeedDefaultStatuses --  # pusta migracja
</code></pre>
<pre><code class="language-csharp">protected override void Up(MigrationBuilder migrationBuilder)
{
    migrationBuilder.InsertData(
        table: &quot;OrderStatuses&quot;,
        columns: new[] { &quot;Id&quot;, &quot;Name&quot; },
        values: new object[] { 1, &quot;Pending&quot; });
}
</code></pre>
<h2>Rozdzielenie środowisk - <code>dotnet ef database update</code> w CI/CD</h2>
<p>W praktyce zespołowej migracje <strong>nie są stosowane ręcznie na produkcji</strong> przez developera - typowy pipeline CI/CD:</p>
<pre><code class="language-yaml"># Fragment pipeline (pseudo-YAML)
steps:
  - run: dotnet ef database update --connection &quot;$PROD_CONNECTION_STRING&quot;
    # stosowane AUTOMATYCZNIE przy deploy, po code review i testach
</code></pre>
<p>To minimalizuje ryzyko "zapomniałem zaktualizować bazę produkcyjną" albo zastosowania migracji w złym środowisku przez przypadek.</p>
<h2>Podsumowanie - checklist dla pracy zespołowej</h2>
<ol>
<li>Zawsze <code>git pull</code> najnowszy model przed wygenerowaniem nowej migracji</li>
<li>Konflikt w <code>ModelSnapshot.cs</code>? Usuń niezaaplikowaną lokalną migrację, wygeneruj ponownie po merge</li>
<li>Nigdy nie edytuj ręcznie wygenerowanych plików migracji/snapshotu</li>
<li>Migracje stosowane automatycznie przez CI/CD, nie ręcznie na produkcji</li>
<li>Dla danych seedowanych używaj dedykowanych, "pustych" migracji z <code>InsertData</code></li>
</ol>
  
  `},

  { id:"ef-transactions", title:"EF Core i transakcje", tags:"savechangesasync begintransaction executionstrategy isolation level savepoints",
  body:`
  <h1>Transakcje i poziomy izolacji w EF Core</h1>
<h2><code>SaveChangesAsync()</code> - domyślna transakcja "za darmo"</h2>
<pre><code class="language-csharp">_context.Orders.Add(newOrder);
_context.Customers.Update(customer);
await _context.SaveChangesAsync();
// EF Core AUTOMATYCZNIE owija WSZYSTKIE zmiany z tego wywołania w JEDNĄ transakcję SQL
// Jeśli COKOLWIEK zawiedzie - WSZYSTKO jest wycofane (rollback), nic częściowo nie zapisze
</code></pre>
<p>To jest ważny fakt - <strong>nie musisz</strong> ręcznie zarządzać transakcją dla pojedynczego <code>SaveChangesAsync()</code>, nawet jeśli modyfikujesz wiele różnych tabel naraz - EF Core robi to automatycznie.</p>
<h2>Kiedy potrzebujesz jawnej transakcji - wiele <code>SaveChangesAsync()</code> w jednej operacji</h2>
<pre><code class="language-csharp">public async Task TransferFundsAsync(int fromAccountId, int toAccountId, decimal amount)
{
    using var transaction = await _context.Database.BeginTransactionAsync();
    try
    {
        var fromAccount = await _context.Accounts.FindAsync(fromAccountId);
        fromAccount.Balance -= amount;
        await _context.SaveChangesAsync(); // pierwszy zapis

        var toAccount = await _context.Accounts.FindAsync(toAccountId);
        toAccount.Balance += amount;
        await _context.SaveChangesAsync(); // drugi zapis

        await transaction.CommitAsync(); // OBA zapisy zatwierdzone RAZEM
    }
    catch
    {
        await transaction.RollbackAsync(); // OBA zapisy wycofane, jeśli cokolwiek zawiedzie
        throw;
    }
}
</code></pre>
<p>Bez jawnej transakcji, gdyby drugi <code>SaveChangesAsync()</code> zawiódł (np. błąd sieci do bazy), <strong>pierwszy zapis już by został zapisany</strong> - konto źródłowe miałoby odjęte pieniądze, a docelowe by ich nie dostało. Jawna transakcja gwarantuje <strong>atomowość</strong> całej operacji.</p>
<h2>Savepoints - częściowy rollback wewnątrz transakcji</h2>
<pre><code class="language-csharp">using var transaction = await _context.Database.BeginTransactionAsync();

await _context.SaveChangesAsync(); // pierwsza operacja
await transaction.CreateSavepointAsync(&quot;AfterFirstStep&quot;);

try
{
    await SomeRiskyOperationAsync(); // np. wywołanie zewnętrznego serwisu
    await _context.SaveChangesAsync();
}
catch
{
    await transaction.RollbackToSavepointAsync(&quot;AfterFirstStep&quot;); // wycofaj TYLKO ryzykowną część
    // pierwsza operacja NADAL jest zachowana w transakcji
}

await transaction.CommitAsync();
</code></pre>
<p>To przydatne, gdy jedna transakcja ma <strong>kilka etapów</strong>, z których tylko część jest ryzykowna - nie musisz wycofywać wszystkiego, tylko fragment po ostatnim bezpiecznym punkcie.</p>
<h2>Poziomy izolacji transakcji (Isolation Levels)</h2>
<pre><code class="language-csharp">using var transaction = await _context.Database.BeginTransactionAsync(IsolationLevel.Serializable);
</code></pre>
<table>
<thead>
<tr>
<th>Poziom</th>
<th>Co gwarantuje</th>
<th>Koszt wydajnościowy</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ReadUncommitted</code></td>
<td>Może czytać niezatwierdzone zmiany innych transakcji ("dirty read")</td>
<td>Najniższy</td>
</tr>
<tr>
<td><code>ReadCommitted</code> (domyślny w SQL Server)</td>
<td>Czyta tylko zatwierdzone dane, ale mogą się zmienić między odczytami w tej samej transakcji</td>
<td>Niski</td>
</tr>
<tr>
<td><code>RepeatableRead</code></td>
<td>Te same wiersze dają ten sam wynik przy wielokrotnym odczycie w transakcji</td>
<td>Średni</td>
</tr>
<tr>
<td><code>Serializable</code></td>
<td>Pełna izolacja - transakcje zachowują się jakby wykonywały się jedna po drugiej</td>
<td>Najwyższy (najwięcej blokad, ryzyko deadlocków)</td>
</tr>
</tbody>
</table>
<p><strong>Praktyczna reguła:</strong> wyższy poziom izolacji = więcej bezpieczeństwa przed anomaliami współbieżności, ale <strong>więcej blokad</strong> i <strong>mniejszy throughput</strong> pod dużym obciążeniem. Domyślny <code>ReadCommitted</code> wystarcza w większości scenariuszy biznesowych; <code>Serializable</code> rezerwuje się dla operacji finansowych/krytycznych, gdzie nawet rzadka anomalia jest niedopuszczalna.</p>
<h2>Concurrency Conflicts - optymistyczna blokada (<code>RowVersion</code>)</h2>
<p>To jest inny mechanizm niż izolacja transakcji - chroni przed <strong>konfliktem edycji</strong> między dwoma niezależnymi requestami:</p>
<pre><code class="language-csharp">public class Order
{
    public int Id { get; set; }
    public string Status { get; set; }

    [Timestamp] // RowVersion - EF Core automatycznie sprawdza, czy wiersz się nie zmienił
    public byte[] Version { get; set; }
}
</code></pre>
<pre><code class="language-csharp">var order = await _context.Orders.FindAsync(1);
order.Status = &quot;Shipped&quot;;

try
{
    await _context.SaveChangesAsync();
}
catch (DbUpdateConcurrencyException)
{
    // Ktoś INNY zmienił ten wiersz między odczytem a zapisem - Twoja wersja jest przestarzała
    Console.WriteLine(&quot;Zamówienie zostało zmienione przez kogoś innego, odśwież dane&quot;);
}
</code></pre>
<p><code>RowVersion</code> generuje w SQL warunek <code>WHERE Id = 1 AND Version = @originalVersion</code> przy <code>UPDATE</code> - jeśli w międzyczasie ktoś inny zmienił wiersz (i tym samym <code>Version</code>), zapytanie <strong>nie znajdzie</strong> żadnego wiersza do zaktualizowania, i EF Core rzuca <code>DbUpdateConcurrencyException</code>.</p>
<h2>Podsumowanie - kiedy co</h2>
<table>
<thead>
<tr>
<th>Mechanizm</th>
<th>Chroni przed</th>
<th>Kiedy używać</th>
</tr>
</thead>
<tbody>
<tr>
<td>Domyślna transakcja <code>SaveChangesAsync()</code></td>
<td>Częściowym zapisem w RAMACH jednego wywołania</td>
<td>Zawsze, automatycznie</td>
</tr>
<tr>
<td>Jawna transakcja (<code>BeginTransactionAsync</code>)</td>
<td>Częściowym zapisem między WIELOMA <code>SaveChangesAsync()</code></td>
<td>Operacje wieloetapowe wymagające atomowości</td>
</tr>
<tr>
<td>Poziom izolacji</td>
<td>Anomaliami współbieżności (dirty/non-repeatable read)</td>
<td>Operacje finansowe/krytyczne wymagające <code>Serializable</code></td>
</tr>
<tr>
<td><code>RowVersion</code>/optimistic concurrency</td>
<td>Nadpisaniem zmian innego użytkownika</td>
<td>Edycja tego samego rekordu przez wielu userów naraz</td>
</tr>
</tbody>
</table>
  
  `},

  ]
},

  { id:"cqrs-what", title:"Czym jest CQRS", tags:"cqrs cqs command query segregation event sourcing eventual consistency",
  body:`
  <h1>CQRS - Command Query Responsibility Segregation</h1>
<h2>Fundamentalna idea</h2>
<p>CQRS to wzorzec architektoniczny, który mówi: <strong>operacje zmieniające stan (Command) powinny być rozdzielone od operacji tylko odczytujących dane (Query)</strong> - to dwa różne modele, nawet jeśli operują na tych samych danych.</p>
<pre><code class="language-csharp">// Command - ZMIENIA stan, zwykle nie zwraca danych (albo tylko Id/status)
public record CreateOrderCommand(string CustomerName, List&lt;OrderItemDto&gt; Items);

// Query - TYLKO CZYTA, nigdy nie zmienia stanu
public record GetOrderQuery(int OrderId);
</code></pre>
<h2>Dlaczego to rozdzielenie ma sens</h2>
<p><strong>Bez CQRS</strong> - jeden serwis robi wszystko, model danych do odczytu i zapisu jest identyczny:</p>
<pre><code class="language-csharp">public class OrderService
{
    public async Task&lt;Order&gt; GetOrderAsync(int id) { /* ... */ }
    public async Task CreateOrderAsync(Order order) { /* ... */ }
    public async Task UpdateOrderStatusAsync(int id, string status) { /* ... */ }
}
</code></pre>
<p>To działa dobrze dla prostych aplikacji CRUD, ale zaczyna szwankować, gdy:
- <strong>Odczyt i zapis mają zupełnie różne wymagania wydajnościowe</strong> - odczyt (Query) często potrzebuje zoptymalizowanych, zdenormalizowanych widoków (np. raport sprzedaży łączący dane z 5 tabel), a zapis (Command) potrzebuje pełnej walidacji i logiki biznesowej
- <strong>Model danych do wyświetlenia różni się od modelu domenowego</strong> - lista zamówień w UI potrzebuje innego "kształtu" danych niż encja <code>Order</code> używana przy przetwarzaniu zamówienia
- Chcesz <strong>oddzielnie skalować</strong> odczyty i zapisy (np. więcej instancji dla odczytu, bo tego jest więcej)</p>
<h2>Command - reprezentuje intencję zmiany</h2>
<pre><code class="language-csharp">public record PlaceOrderCommand(string CustomerName, List&lt;OrderItemDto&gt; Items);

public class PlaceOrderHandler
{
    private readonly AppDbContext _context;

    public async Task&lt;int&gt; Handle(PlaceOrderCommand command)
    {
        var order = new Order { CustomerName = command.CustomerName };
        // logika biznesowa, walidacja, itd.
        _context.Orders.Add(order);
        await _context.SaveChangesAsync();
        return order.Id; // zwraca TYLKO to, co niezbędne (np. Id nowego zamówienia)
    }
}
</code></pre>
<p><strong>Zasada:</strong> Command <strong>nie powinien</strong> zwracać dużych zestawów danych - to nie jego rola. Zwraca maksymalnie Id, status sukcesu, albo nic.</p>
<h2>Query - reprezentuje żądanie danych, BEZ efektów ubocznych</h2>
<pre><code class="language-csharp">public record GetOrderSummaryQuery(int OrderId);

public class GetOrderSummaryHandler
{
    private readonly AppDbContext _context;

    public async Task&lt;OrderSummaryDto&gt; Handle(GetOrderSummaryQuery query)
    {
        // Może to być zoptymalizowane zapytanie, inne niż to używane przy Command
        return await _context.Orders
            .Where(o =&gt; o.Id == query.OrderId)
            .Select(o =&gt; new OrderSummaryDto(o.Id, o.CustomerName, o.Items.Count, o.TotalAmount))
            .FirstOrDefaultAsync();
    }
}
</code></pre>
<p><strong>Zasada:</strong> Query <strong>nigdy</strong> nie zmienia stanu - to musi być całkowicie bezpieczne do wielokrotnego wywołania (idempotentne), bez żadnych efektów ubocznych.</p>
<h2>CQRS nie wymaga osobnych baz danych - to częste błędne przekonanie</h2>
<p>To jest <strong>ważne rozróżnienie</strong>, o które często pytają na rozmowach: CQRS to <strong>wzorzec na poziomie kodu/architektury aplikacji</strong> - rozdzielenie Command i Query jako osobnych klas/modeli. <strong>Nie musisz</strong> mieć osobnej bazy do odczytu i osobnej do zapisu (to jest <strong>dodatkowa, opcjonalna</strong> technika, nazywana <strong>CQRS z osobnymi magazynami danych</strong>, często łączona z Event Sourcing) - w większości aplikacji biznesowych CQRS działa na <strong>tej samej</strong> bazie danych, tylko z rozdzielonymi modelami/klasami w kodzie.</p>
<pre><code class="language-csharp">Prosty CQRS (najczęstszy w praktyce):
Command → ta sama baza danych ← Query
(rozdzielone tylko w KODZIE - różne klasy, różne modele)

Zaawansowany CQRS (rzadszy, dla dużej skali):
Command → baza zapisu (write model)
              ↓ synchronizacja (np. przez event/message queue)
Query → osobna baza odczytu (read model, zdenormalizowana, zoptymalizowana pod konkretne zapytania)
</code></pre>
<h2>Relacja do wcześniejszej rozmowy o Repository/UoW</h2>
<p>To nawiązuje do dyskusji o Repository - w architekturze CQRS <strong>Command Handler</strong> często pisze bezpośrednio przez <code>DbContext</code> (potrzebuje pełnego modelu domenowego z logiką biznesową), a <strong>Query Handler</strong> może pisać <strong>bardzo uproszczone, zoptymalizowane</strong> zapytania LINQ z projekcją bezpośrednio na DTO (<code>Select(o =&gt; new OrderSummaryDto(...))</code>), bez przechodzenia przez pełne encje domenowe - to jest miejsce, gdzie "generyczne repozytorium" (<code>GetAllAsync()</code> zwracające pełne encje) staje się szczególnie niewygodne, bo tłamsi możliwość takiej optymalizacji.</p>
<h2>Zalety CQRS</h2>
<ul>
<li><strong>Jasność intencji</strong> - patrząc na <code>PlaceOrderCommand</code>, wiesz dokładnie, co ta operacja robi, bez czytania implementacji</li>
<li><strong>Możliwość niezależnej optymalizacji</strong> odczytu i zapisu</li>
<li><strong>Łatwiejsze testowanie</strong> - Command/Query to proste, niemutowalne obiekty danych (świetny przykład dla <code>record</code>, o którym mówiliśmy!) z jednym Handlerem do przetestowania</li>
<li><strong>Skalowalność</strong> - w bardziej złożonych systemach, odczyty i zapisy mogą być skalowane niezależnie</li>
</ul>
<h2>Wady/koszty CQRS</h2>
<ul>
<li><strong>Więcej kodu</strong> dla prostych operacji CRUD - dla trywialnej aplikacji "dodaj/edytuj/usuń" bez złożonej logiki biznesowej, CQRS może być przerostem formy nad treścią</li>
<li><strong>Potencjalna duplikacja</strong> modeli (Command DTO, Query DTO, encja domenowa mogą wyglądać podobnie, ale są odrębnymi typami)</li>
</ul>
<h2>Kiedy stosować CQRS - praktyczna reguła</h2>
<blockquote>
<p>CQRS ma sens, gdy logika <strong>zapisu</strong> (walidacja, reguły biznesowe, efekty domenowe) jest <strong>istotnie różna</strong> od logiki <strong>odczytu</strong> (raportowanie, wyświetlanie, wyszukiwanie) - typowo w większych, złożonych systemach biznesowych. Dla prostych CRUD-ów (mały wewnętrzny panel administracyjny) klasyczny serwis z jedną klasą często wystarczy, bez narzutu dodatkowej struktury.</p>
</blockquote>
  
  `},

  { id:"cqrs-mediatr", title:"MediatR — jak działa i jak używać", tags:"mediatr irequest irequesthandler pipeline behavior send",
  body:`
  <h1>CQRS z MediatR - mechanika implementacji</h1>
<h2>MediatR - biblioteka implementująca wzorzec Mediator</h2>
<p>MediatR to popularna biblioteka .NET realizująca <strong>wzorzec Mediator</strong> - pośrednika, przez którego przechodzą wszystkie Command/Query, zamiast wywoływać Handler-y bezpośrednio.</p>
<pre><code class="language-csharp">// Definicja Command - implementuje IRequest&lt;TResponse&gt; z MediatR
public record PlaceOrderCommand(string CustomerName, List&lt;OrderItemDto&gt; Items) : IRequest&lt;int&gt;;

// Definicja Query
public record GetOrderQuery(int OrderId) : IRequest&lt;OrderDto&gt;;
</code></pre>
<h2>Handler - implementuje logikę dla konkretnego Command/Query</h2>
<pre><code class="language-csharp">public class PlaceOrderHandler : IRequestHandler&lt;PlaceOrderCommand, int&gt;
{
    private readonly AppDbContext _context;

    public PlaceOrderHandler(AppDbContext context) =&gt; _context = context;

    public async Task&lt;int&gt; Handle(PlaceOrderCommand request, CancellationToken cancellationToken)
    {
        var order = new Order { CustomerName = request.CustomerName };
        foreach (var item in request.Items)
        {
            order.Items.Add(new OrderItem { ProductId = item.ProductId, Quantity = item.Quantity });
        }

        _context.Orders.Add(order);
        await _context.SaveChangesAsync(cancellationToken);

        return order.Id;
    }
}
</code></pre>
<p><strong>Kluczowa zasada:</strong> <strong>jeden Handler na jeden Command/Query</strong> - to jest 1:1 mapowanie, w przeciwieństwie do tradycyjnego serwisu, który mógł mieć wiele metod. To wspiera Single Responsibility Principle (z SOLID) na poziomie <strong>operacji</strong>, nie tylko klasy.</p>
<h2>Kontroler - wysyła przez <code>IMediator</code>, nie woła serwisu bezpośrednio</h2>
<pre><code class="language-csharp">[ApiController]
[Route(&quot;api/[controller]&quot;)]
public class OrdersController : ControllerBase
{
    private readonly IMediator _mediator; // JEDYNA zależność - nie potrzeba wstrzykiwać 10 serwisów!

    public OrdersController(IMediator mediator) =&gt; _mediator = mediator;

    [HttpPost]
    public async Task&lt;ActionResult&lt;int&gt;&gt; CreateOrder(PlaceOrderCommand command)
    {
        var orderId = await _mediator.Send(command); // MediatR znajduje odpowiedni Handler i go wywołuje
        return CreatedAtAction(nameof(GetOrder), new { id = orderId }, orderId);
    }

    [HttpGet(&quot;{id}&quot;)]
    public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id)
    {
        var order = await _mediator.Send(new GetOrderQuery(id));
        return order == null ? NotFound() : Ok(order);
    }
}
</code></pre>
<p>To jest znacząca zmiana architektoniczna - Controller <strong>nie ma</strong> wstrzykiwanego <code>IOrderService</code> z dziesiątkami metod. Ma <strong>tylko</strong> <code>IMediator</code>, a MediatR <strong>automatycznie</strong> znajduje właściwy Handler na podstawie <strong>typu</strong> przekazanego Command/Query.</p>
<h2>Jak MediatR "wie", który Handler wywołać - mechanika</h2>
<pre><code class="language-csharp">// Rejestracja w DI (Program.cs)
builder.Services.AddMediatR(cfg =&gt; cfg.RegisterServicesFromAssembly(typeof(Program).Assembly));
</code></pre>
<p>MediatR przy starcie <strong>skanuje</strong> assembly, znajduje wszystkie klasy implementujące <code>IRequestHandler&lt;TRequest, TResponse&gt;</code>, i <strong>automatycznie rejestruje</strong> je w kontenerze DI. Gdy wywołujesz <code>_mediator.Send(command)</code>:</p>
<pre><code class="language-csharp">// W przybliżeniu, co dzieje się &quot;pod spodem&quot; w MediatR:
public async Task&lt;TResponse&gt; Send&lt;TResponse&gt;(IRequest&lt;TResponse&gt; request)
{
    var requestType = request.GetType(); // np. typeof(PlaceOrderCommand)
    var handlerType = typeof(IRequestHandler&lt;,&gt;).MakeGenericType(requestType, typeof(TResponse));

    var handler = _serviceProvider.GetRequiredService(handlerType); // rozwiązanie z DI kontenera

    return await ((dynamic)handler).Handle((dynamic)request, cancellationToken);
}
</code></pre>
<p>To jest w zasadzie <strong>generyczny Service Locator, ale zamknięty tylko na Command/Query</strong>, w kontrolowany sposób (w przeciwieństwie do anty-patternu Service Locator, o którym mówiliśmy przy sposobach DI, tutaj mapowanie typ→handler jest <strong>jawne i sprawdzane w compile-time</strong> przez system typów <code>IRequestHandler&lt;TRequest, TResponse&gt;</code>).</p>
<h2>Pipeline Behaviors - middleware dla Command/Query (bardzo praktyczna funkcja)</h2>
<p>To jest jedna z <strong>najbardziej wartościowych</strong> cech MediatR - możliwość dodania <strong>przekrojowej logiki</strong> (cross-cutting concerns), która wykonuje się dla WSZYSTKICH (albo wybranych) Command/Query, bez duplikowania kodu w każdym Handlerze:</p>
<pre><code class="language-csharp">public class ValidationBehavior&lt;TRequest, TResponse&gt; : IPipelineBehavior&lt;TRequest, TResponse&gt;
    where TRequest : IRequest&lt;TResponse&gt;
{
    private readonly IValidator&lt;TRequest&gt; _validator;

    public async Task&lt;TResponse&gt; Handle(
        TRequest request,
        RequestHandlerDelegate&lt;TResponse&gt; next, // &quot;kontynuacja&quot; - następny krok w łańcuchu
        CancellationToken cancellationToken)
    {
        var validationResult = await _validator.ValidateAsync(request);
        if (!validationResult.IsValid)
            throw new ValidationException(validationResult.Errors);

        return await next(); // przekazanie dalej, do właściwego Handlera (albo kolejnego behaviora)
    }
}
</code></pre>
<pre><code class="language-csharp">public class LoggingBehavior&lt;TRequest, TResponse&gt; : IPipelineBehavior&lt;TRequest, TResponse&gt;
{
    private readonly ILogger&lt;LoggingBehavior&lt;TRequest, TResponse&gt;&gt; _logger;

    public async Task&lt;TResponse&gt; Handle(TRequest request, RequestHandlerDelegate&lt;TResponse&gt; next, CancellationToken ct)
    {
        _logger.LogInformation($&quot;Przetwarzanie {typeof(TRequest).Name}&quot;);
        var response = await next();
        _logger.LogInformation($&quot;Zakończono {typeof(TRequest).Name}&quot;);
        return response;
    }
}
</code></pre>
<pre><code class="language-csharp">// Rejestracja - kolejność ma znaczenie, tworzy &quot;łańcuch&quot;
builder.Services.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(LoggingBehavior&lt;,&gt;));
builder.Services.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(ValidationBehavior&lt;,&gt;));
</code></pre>
<p>To jest <strong>dokładnie ten sam mechanizm IoC</strong> ("Twój kod jest wywoływany przez framework, w łańcuchu z <code>next()</code>"), o którym mówiliśmy przy ASP.NET Core middleware - Pipeline Behaviors w MediatR to <strong>middleware, ale na poziomie Command/Query</strong>, nie requestów HTTP.</p>
<p><strong>Praktyczne zastosowania Pipeline Behaviors:</strong>
- Walidacja (jak wyżej, często z biblioteką <strong>FluentValidation</strong>)
- Logowanie każdej operacji
- Transakcje (owinięcie <code>Handle()</code> w <code>BeginTransactionAsync</code>/<code>CommitAsync</code>)
- Cache'owanie wyników Query
- Pomiar czasu wykonania (performance monitoring)</p>
<h2>FluentValidation + MediatR - typowa kombinacja</h2>
<pre><code class="language-csharp">public class PlaceOrderCommandValidator : AbstractValidator&lt;PlaceOrderCommand&gt;
{
    public PlaceOrderCommandValidator()
    {
        RuleFor(x =&gt; x.CustomerName).NotEmpty().MaximumLength(100);
        RuleFor(x =&gt; x.Items).NotEmpty().WithMessage(&quot;Zamówienie musi mieć przynajmniej jedną pozycję&quot;);
    }
}
</code></pre>
<p>Handler <strong>nie musi</strong> zawierać ręcznej walidacji - <code>ValidationBehavior</code> (Pipeline Behavior wyżej) <strong>automatycznie</strong> ją wykonuje <strong>przed</strong> wywołaniem <code>Handle()</code> każdego Command/Query, dla którego istnieje odpowiedni walidator.</p>
<h2>Zalety takiej architektury</h2>
<ul>
<li><strong>Kontroler jest bardzo tani</strong> - jedna zależność (<code>IMediator</code>), zamiast rosnącej listy serwisów wstrzykiwanych przez konstruktor (wracamy do "constructor bloat", o którym mówiliśmy przy DI)</li>
<li><strong>Przekrojowa logika w jednym miejscu</strong> (Pipeline Behaviors) - nie musisz pamiętać o dodaniu logowania/walidacji w każdym nowym Handlerze</li>
<li><strong>Testowanie Handlera w izolacji</strong> - Handler to prosta klasa z jedną metodą <code>Handle()</code>, łatwa do przetestowania bez mockowania kontrolera czy HTTP</li>
</ul>
<h2>Wady/koszty</h2>
<ul>
<li><strong>"Magia" utrudniająca śledzenie przepływu</strong> - żeby zrozumieć, co się dzieje przy <code>_mediator.Send(command)</code>, musisz wiedzieć o istnieniu MediatR i mechanizmie rejestracji Handlerów - to nie jest tak jawne jak bezpośrednie wywołanie metody serwisu (<code>_orderService.CreateOrder(...)</code>)</li>
<li>Więcej <strong>plików/klas</strong> dla prostych operacji (Command + Handler + Validator dla czegoś, co mogłoby być jedną metodą serwisu)</li>
</ul>
<h2>Podsumowanie</h2>
<blockquote>
<p>MediatR implementuje CQRS przez wzorzec Mediator - Command/Query to proste, niemutowalne obiekty (dobre zastosowanie <code>record</code>, o którym rozmawialiśmy), Handler implementuje logikę dla jednego konkretnego typu żądania, a Pipeline Behaviors dodają przekrojową logikę (walidację, logowanie, transakcje) bez duplikacji kodu w każdym Handlerze. Kontroler staje się bardzo "tani" - potrzebuje tylko <code>IMediator</code>, resztę załatwia framework przez mechanizm rejestracji i rozwiązywania Handlerów z kontenera DI.</p>
</blockquote>
  
  `},

  ]
},

  { id:"xunit", title:"xUnit — podstawy", tags:"xunit fact theory inlinedata memberdata classfixture aaa",
  body:`
  <h1>xUnit - podstawy testowania w .NET</h1>
<h2>Struktura podstawowego testu</h2>
<pre><code class="language-csharp">public class OrderValidatorTests
{
    [Fact] // test bez parametrów, sprawdza JEDEN konkretny scenariusz
    public void Validate_EmptyOrder_ReturnsFalse()
    {
        // Arrange
        var validator = new OrderValidator();
        var order = new Order { Items = new List&lt;OrderItem&gt;() };

        // Act
        var result = validator.Validate(order);

        // Assert
        Assert.False(result);
    }
}
</code></pre>
<p><strong>Konwencja AAA (Arrange-Act-Assert)</strong> - trzy sekcje: przygotowanie danych, wykonanie akcji, sprawdzenie wyniku. To jest <strong>standard</strong> w testach jednostkowych, ułatwiający czytelność - patrząc na test od razu widzisz, co jest przygotowaniem, a co sprawdzeniem.</p>
<h2><code>[Theory]</code> - jeden test, wiele zestawów danych</h2>
<pre><code class="language-csharp">[Theory]
[InlineData(0, false)]
[InlineData(-5, false)]
[InlineData(100, true)]
public void Validate_TotalAmount_ReturnsExpectedResult(decimal amount, bool expected)
{
    var validator = new OrderValidator();
    var order = new Order { TotalAmount = amount };

    var result = validator.Validate(order);

    Assert.Equal(expected, result);
}
</code></pre>
<p><code>[Theory]</code> + <code>[InlineData]</code> pozwala <strong>uniknąć duplikacji</strong> - jeden test wykonuje się wielokrotnie z różnymi zestawami danych, zamiast pisać 3 osobne metody <code>[Fact]</code> różniące się tylko wartościami.</p>
<p><strong><code>[MemberData]</code></strong> - dla bardziej złożonych danych testowych, niereprezentowalnych jako literały w atrybucie:</p>
<pre><code class="language-csharp">public static IEnumerable&lt;object[]&gt; OrderTestCases()
{
    yield return new object[] { new Order { Items = new List&lt;OrderItem&gt;() }, false };
    yield return new object[] { new Order { Items = new List&lt;OrderItem&gt; { new() } }, true };
}

[Theory]
[MemberData(nameof(OrderTestCases))]
public void Validate_VariousOrders_ReturnsExpectedResult(Order order, bool expected)
{
    var result = new OrderValidator().Validate(order);
    Assert.Equal(expected, result);
}
</code></pre>
<h2><code>IClassFixture&lt;T&gt;</code> - współdzielony kontekst dla wielu testów w klasie</h2>
<p>To rozwiązuje problem, gdy przygotowanie danych testowych jest <strong>kosztowne</strong> (np. utworzenie połączenia do bazy testowej) i nie chcesz go powtarzać przed każdym testem:</p>
<pre><code class="language-csharp">public class DatabaseFixture : IDisposable
{
    public AppDbContext Context { get; }

    public DatabaseFixture()
    {
        var options = new DbContextOptionsBuilder&lt;AppDbContext&gt;()
            .UseInMemoryDatabase(&quot;TestDb&quot;) // baza w pamięci, bez realnego SQL Server
            .Options;

        Context = new AppDbContext(options);
        Context.Orders.Add(new Order { Id = 1, CustomerName = &quot;Test&quot; });
        Context.SaveChanges();
    }

    public void Dispose() =&gt; Context.Dispose();
}

public class OrderServiceTests : IClassFixture&lt;DatabaseFixture&gt;
{
    private readonly DatabaseFixture _fixture;

    public OrderServiceTests(DatabaseFixture fixture) // xUnit WSTRZYKUJE fixture do konstruktora
    {
        _fixture = fixture;
    }

    [Fact]
    public async Task GetOrder_ExistingId_ReturnsOrder()
    {
        var service = new OrderService(_fixture.Context);
        var order = await service.GetOrderAsync(1);
        Assert.NotNull(order);
    }
}
</code></pre>
<p><strong>Kluczowa cecha <code>IClassFixture</code>:</strong> fixture jest tworzony <strong>jeden raz</strong> dla <strong>wszystkich testów w danej klasie</strong> (nie przed każdym testem osobno) - konstruktor <code>DatabaseFixture</code> wykonuje się raz, <code>Dispose()</code> wywołuje się po zakończeniu <strong>wszystkich</strong> testów w klasie.</p>
<p><strong>Kontrast z konstruktorem klasy testowej</strong> - xUnit tworzy <strong>nową instancję klasy testowej dla KAŻDEGO testu</strong> (żeby testy były izolowane), ale <code>IClassFixture</code> <strong>przełamuje</strong> to, dając <strong>jedną</strong> współdzieloną instancję fixture między wszystkimi testami tej klasy.</p>
<h2><code>ICollectionFixture&lt;T&gt;</code> - współdzielenie między wieloma klasami testowymi</h2>
<pre><code class="language-csharp">[CollectionDefinition(&quot;Database collection&quot;)]
public class DatabaseCollection : ICollectionFixture&lt;DatabaseFixture&gt; { }

[Collection(&quot;Database collection&quot;)]
public class OrderServiceTests
{
    public OrderServiceTests(DatabaseFixture fixture) { }
}

[Collection(&quot;Database collection&quot;)] // TA SAMA fixture, współdzielona z OrderServiceTests
public class CustomerServiceTests
{
    public CustomerServiceTests(DatabaseFixture fixture) { }
}
</code></pre>
<h2>Podsumowanie kluczowych atrybutów</h2>
<table>
<thead>
<tr>
<th>Atrybut/Interfejs</th>
<th>Cel</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>[Fact]</code></td>
<td>Test pojedynczego, konkretnego scenariusza</td>
</tr>
<tr>
<td><code>[Theory]</code> + <code>[InlineData]</code></td>
<td>Test z wielokrotnymi, prostymi zestawami danych</td>
</tr>
<tr>
<td><code>[Theory]</code> + <code>[MemberData]</code></td>
<td>Test z bardziej złożonymi danymi testowymi</td>
</tr>
<tr>
<td><code>IClassFixture&lt;T&gt;</code></td>
<td>Współdzielony kontekst dla wszystkich testów w JEDNEJ klasie</td>
</tr>
<tr>
<td><code>ICollectionFixture&lt;T&gt;</code></td>
<td>Współdzielony kontekst między WIELOMA klasami testowymi</td>
</tr>
</tbody>
</table>
  
  `},

  { id:"moq", title:"Moq — mockowanie", tags:"moq mock setup verify times itisany callback",
  body:`
  <h1>Moq - mockowanie zależności w testach</h1>
<h2>Podstawowe użycie - tworzenie mocka i konfiguracja zachowania</h2>
<pre><code class="language-csharp">public interface IOrderRepository
{
    Task&lt;Order&gt; GetByIdAsync(int id);
    Task SaveAsync(Order order);
}

[Fact]
public async Task GetOrder_ExistingId_ReturnsOrder()
{
    // Arrange
    var mockRepository = new Mock&lt;IOrderRepository&gt;();
    mockRepository
        .Setup(r =&gt; r.GetByIdAsync(1))
        .ReturnsAsync(new Order { Id = 1, CustomerName = &quot;Jan&quot; });

    var service = new OrderService(mockRepository.Object); // .Object - właściwa implementacja mocka

    // Act
    var order = await service.GetOrderAsync(1);

    // Assert
    Assert.Equal(&quot;Jan&quot;, order.CustomerName);
}
</code></pre>
<p>Zamiast wołać prawdziwe repozytorium (które wymagałoby prawdziwej bazy danych), tworzysz <strong>atrapę</strong> (mock), która zwraca <strong>z góry zdefiniowane</strong> dane - dzięki temu test jest szybki, deterministyczny i nie zależy od zewnętrznej infrastruktury.</p>
<h2><code>It.IsAny&lt;T&gt;()</code> - dopasowanie dla dowolnego argumentu</h2>
<pre><code class="language-csharp">mockRepository
    .Setup(r =&gt; r.GetByIdAsync(It.IsAny&lt;int&gt;())) // dopasuje DOWOLNE id
    .ReturnsAsync(new Order { Id = 999, CustomerName = &quot;Test&quot; });
</code></pre>
<p>Przydatne, gdy nie chcesz sprawdzać konkretnej wartości argumentu, tylko interesuje Cię ogólne zachowanie mocka.</p>
<h2><code>Verify()</code> - sprawdzenie, że metoda została wywołana</h2>
<pre><code class="language-csharp">[Fact]
public async Task CreateOrder_ValidOrder_CallsSaveOnce()
{
    var mockRepository = new Mock&lt;IOrderRepository&gt;();
    var service = new OrderService(mockRepository.Object);

    await service.CreateOrderAsync(new Order { CustomerName = &quot;Jan&quot; });

    mockRepository.Verify(r =&gt; r.SaveAsync(It.IsAny&lt;Order&gt;()), Times.Once); // dokładnie RAZ
    mockRepository.Verify(r =&gt; r.SaveAsync(It.IsAny&lt;Order&gt;()), Times.Never); // sprawdza, że NIE wywołano
}
</code></pre>
<p>To pozwala testować <strong>zachowanie</strong>, nie tylko zwracaną wartość - np. "czy serwis faktycznie próbował zapisać zamówienie", niezależnie od tego, co repozytorium zwróciło.</p>
<h2>Mockowanie wyjątków - testowanie obsługi błędów</h2>
<pre><code class="language-csharp">[Fact]
public async Task GetOrder_RepositoryThrows_PropagatesException()
{
    var mockRepository = new Mock&lt;IOrderRepository&gt;();
    mockRepository
        .Setup(r =&gt; r.GetByIdAsync(It.IsAny&lt;int&gt;()))
        .ThrowsAsync(new InvalidOperationException(&quot;Błąd bazy danych&quot;));

    var service = new OrderService(mockRepository.Object);

    await Assert.ThrowsAsync&lt;InvalidOperationException&gt;(() =&gt; service.GetOrderAsync(1));
}
</code></pre>
<h2>Mockowanie sekwencji wywołań - różne wartości przy kolejnych wywołaniach</h2>
<pre><code class="language-csharp">mockRepository
    .SetupSequence(r =&gt; r.GetByIdAsync(1))
    .ReturnsAsync(new Order { Status = &quot;Pending&quot; })  // pierwsze wywołanie
    .ReturnsAsync(new Order { Status = &quot;Shipped&quot; });  // drugie wywołanie
</code></pre>
<h2>Callback - wykonanie dodatkowej logiki przy wywołaniu mocka</h2>
<pre><code class="language-csharp">var savedOrders = new List&lt;Order&gt;();

mockRepository
    .Setup(r =&gt; r.SaveAsync(It.IsAny&lt;Order&gt;()))
    .Callback&lt;Order&gt;(order =&gt; savedOrders.Add(order)) // przechwytujesz argument, robisz coś z nim
    .Returns(Task.CompletedTask);

await service.CreateOrderAsync(new Order { CustomerName = &quot;Jan&quot; });

Assert.Single(savedOrders);
Assert.Equal(&quot;Jan&quot;, savedOrders[0].CustomerName);
</code></pre>
<h2>Mockowanie zależności przy DI - integracja z tym, co już wiemy</h2>
<p>To jest naturalne rozwinięcie constructor injection, o którym mówiliśmy wcześniej - mock to po prostu <strong>alternatywna implementacja</strong> interfejsu, wstrzykiwana przez konstruktor <strong>tak samo</strong>, jak w prawdziwej aplikacji:</p>
<pre><code class="language-csharp">public class OrderService : IOrderService
{
    private readonly IOrderRepository _repository;
    private readonly ILogger&lt;OrderService&gt; _logger;

    public OrderService(IOrderRepository repository, ILogger&lt;OrderService&gt; logger)
    {
        _repository = repository;
        _logger = logger;
    }
}
</code></pre>
<pre><code class="language-csharp">[Fact]
public async Task Test()
{
    var mockRepository = new Mock&lt;IOrderRepository&gt;();
    var mockLogger = new Mock&lt;ILogger&lt;OrderService&gt;&gt;(); // MOŻNA mockować nawet ILogger

    var service = new OrderService(mockRepository.Object, mockLogger.Object); // DOKŁADNIE ten sam konstruktor
}
</code></pre>
<p>To jest właśnie <strong>dlaczego</strong> DI przez konstruktor (a nie Service Locator czy Ambient Context) jest tak wartościowe dla testowalności - każda zależność jest <strong>jawnie widoczna</strong> i <strong>łatwo podmienna</strong> na mocka, bez żadnych sztuczek.</p>
<h2>Podsumowanie kluczowych metod Moq</h2>
<table>
<thead>
<tr>
<th>Metoda</th>
<th>Cel</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Setup()</code></td>
<td>Konfiguracja zachowania mocka dla konkretnego wywołania</td>
</tr>
<tr>
<td><code>Returns()</code>/<code>ReturnsAsync()</code></td>
<td>Zwracana wartość (synchroniczna/asynchroniczna)</td>
</tr>
<tr>
<td><code>ThrowsAsync()</code></td>
<td>Symulacja rzucenia wyjątku</td>
</tr>
<tr>
<td><code>Verify()</code></td>
<td>Sprawdzenie, że metoda została wywołana (z jaką częstotliwością)</td>
</tr>
<tr>
<td><code>It.IsAny&lt;T&gt;()</code></td>
<td>Dopasowanie dla dowolnego argumentu danego typu</td>
</tr>
<tr>
<td><code>Callback()</code></td>
<td>Wykonanie dodatkowej logiki przy wywołaniu mocka</td>
</tr>
<tr>
<td><code>SetupSequence()</code></td>
<td>Różne wartości przy kolejnych wywołaniach tej samej metody</td>
</tr>
</tbody>
</table>
  
  `},

  { id:"integration-tests", title:"Testy integracyjne", tags:"webapplicationfactory testcontainers piramida testow inmemory",
  body:`
  <h1>Testy integracyjne w ASP.NET Core</h1>
<h2>Różnica względem testów jednostkowych</h2>
<p>Testy jednostkowe (z Moq) testują <strong>jedną klasę w izolacji</strong>, mockując wszystkie zależności. Testy integracyjne sprawdzają, jak <strong>wiele komponentów współpracuje</strong> - np. cały request HTTP przez middleware, kontroler, serwis, aż do (prawdziwej albo testowej) bazy danych.</p>
<h2><code>WebApplicationFactory&lt;T&gt;</code> - hostowanie aplikacji w testach</h2>
<pre><code class="language-csharp">public class OrdersControllerTests : IClassFixture&lt;WebApplicationFactory&lt;Program&gt;&gt;
{
    private readonly HttpClient _client;

    public OrdersControllerTests(WebApplicationFactory&lt;Program&gt; factory)
    {
        _client = factory.CreateClient(); // uruchamia CAŁĄ aplikację &quot;in-memory&quot;, bez realnego serwera
    }

    [Fact]
    public async Task GetOrder_ExistingId_ReturnsOkWithOrder()
    {
        var response = await _client.GetAsync(&quot;/api/orders/1&quot;);

        response.EnsureSuccessStatusCode();
        var order = await response.Content.ReadFromJsonAsync&lt;OrderDto&gt;();
        Assert.NotNull(order);
    }
}
</code></pre>
<p><code>WebApplicationFactory&lt;Program&gt;</code> <strong>uruchamia</strong> Twoją całą aplikację ASP.NET Core (<code>Program.cs</code>, cały pipeline middleware, DI, routing) w pamięci procesu testowego - <code>_client</code> wysyła prawdziwe requesty HTTP, przechodzące przez <strong>cały</strong> realny stack aplikacji, ale bez potrzeby uruchamiania osobnego serwera/portu.</p>
<h2>Podmiana zależności na potrzeby testów - <code>WithWebHostBuilder</code></h2>
<pre><code class="language-csharp">public class OrdersControllerTests : IClassFixture&lt;WebApplicationFactory&lt;Program&gt;&gt;
{
    private readonly HttpClient _client;

    public OrdersControllerTests(WebApplicationFactory&lt;Program&gt; factory)
    {
        var customFactory = factory.WithWebHostBuilder(builder =&gt;
        {
            builder.ConfigureServices(services =&gt;
            {
                // Usuwamy prawdziwy DbContext (skonfigurowany w Program.cs)
                var descriptor = services.SingleOrDefault(d =&gt; d.ServiceType == typeof(DbContextOptions&lt;AppDbContext&gt;));
                if (descriptor != null) services.Remove(descriptor);

                // Podmieniamy na bazę w pamięci (InMemory) na czas testów
                services.AddDbContext&lt;AppDbContext&gt;(options =&gt; options.UseInMemoryDatabase(&quot;TestDb&quot;));
            });
        });

        _client = customFactory.CreateClient();
    }
}
</code></pre>
<p>To pozwala <strong>zachować</strong> realną konfigurację middleware/routingu/DI, ale <strong>podmienić</strong> konkretne, "niewygodne" w testach zależności (np. prawdziwą bazę SQL Server na bazę w pamięci) - dokładnie ta sama idea co mockowanie w Moq, tylko na wyższym poziomie (cała aplikacja, nie pojedyncza klasa).</p>
<h2>Testcontainers - testy integracyjne z PRAWDZIWĄ bazą danych (w kontenerze Docker)</h2>
<p>To jest bardziej rygorystyczne podejście niż InMemory database - baza <code>InMemory</code> z EF Core <strong>nie zachowuje się identycznie</strong> jak prawdziwy SQL Server (np. inne zachowanie przy niektórych zapytaniach, ograniczenia transakcji) - <strong>Testcontainers</strong> rozwiązuje to, uruchamiając <strong>prawdziwą</strong> bazę danych w kontenerze Docker, tylko na czas testów.</p>
<pre><code class="language-csharp">public class DatabaseFixture : IAsyncLifetime
{
    private readonly MsSqlContainer _sqlContainer = new MsSqlBuilder().Build();
    public string ConnectionString =&gt; _sqlContainer.GetConnectionString();

    public async Task InitializeAsync()
    {
        await _sqlContainer.StartAsync(); // uruchamia PRAWDZIWY SQL Server w kontenerze Docker
    }

    public async Task DisposeAsync()
    {
        await _sqlContainer.DisposeAsync(); // zatrzymuje i usuwa kontener po testach
    }
}

public class OrderRepositoryIntegrationTests : IClassFixture&lt;DatabaseFixture&gt;
{
    private readonly AppDbContext _context;

    public OrderRepositoryIntegrationTests(DatabaseFixture fixture)
    {
        var options = new DbContextOptionsBuilder&lt;AppDbContext&gt;()
            .UseSqlServer(fixture.ConnectionString) // PRAWDZIWE zapytania SQL, nie symulacja InMemory
            .Options;
        _context = new AppDbContext(options);
        _context.Database.Migrate(); // stosuje migracje do &quot;świeżej&quot; bazy w kontenerze
    }

    [Fact]
    public async Task SaveOrder_WithItems_PersistsCorrectly()
    {
        var repository = new OrderRepository(_context);
        var order = new Order { CustomerName = &quot;Jan&quot;, Items = { new OrderItem { ProductId = 1 } } };

        await repository.AddAsync(order);
        await _context.SaveChangesAsync();

        var saved = await _context.Orders.Include(o =&gt; o.Items).FirstAsync(o =&gt; o.Id == order.Id);
        Assert.Single(saved.Items); // sprawdza RZECZYWISTE zachowanie SQL Server, nie symulację
    }
}
</code></pre>
<p><strong>Zaleta:</strong> testy sprawdzają <strong>rzeczywiste</strong> zachowanie bazy danych (constraints, typy danych, specyficzne zachowania SQL Server), nie tylko przybliżoną symulację <code>InMemory</code> provider'a.</p>
<p><strong>Koszt:</strong> wolniejsze (start kontenera Docker trwa kilka sekund), wymaga zainstalowanego Dockera na maszynie CI/CD i lokalnie u developerów.</p>
<h2>Piramida testów - gdzie to wszystko się układa</h2>
<pre><code class="language-csharp">        /\\
       /  \\    E2E (end-to-end) - najmniej, najwolniejsze, testują CAŁY system
      /----\\
     /      \\  Testy integracyjne (WebApplicationFactory, Testcontainers) - średnio
    /--------\\
   /          \\ Testy jednostkowe (xUnit + Moq) - najwięcej, najszybsze, testują izolowane klasy
  /------------\\
</code></pre>
<p><strong>Praktyczna reguła:</strong> większość testów powinna być <strong>jednostkowa</strong> (szybka, izolowana logika biznesowa z Moq), <strong>mniej</strong> integracyjnych (sprawdzających współpracę warstw - kontroler + DI + baza), a <strong>najmniej</strong> E2E (testujących cały system przez UI, najwolniejsze i najbardziej kruche).</p>
<h2>Podsumowanie - kiedy który typ testu</h2>
<table>
<thead>
<tr>
<th>Typ testu</th>
<th>Co sprawdza</th>
<th>Narzędzia</th>
<th>Szybkość</th>
</tr>
</thead>
<tbody>
<tr>
<td>Jednostkowy</td>
<td>Jedna klasa w izolacji</td>
<td>xUnit + Moq</td>
<td>Bardzo szybkie (ms)</td>
</tr>
<tr>
<td>Integracyjny (InMemory)</td>
<td>Współpraca warstw, przybliżone zachowanie bazy</td>
<td><code>WebApplicationFactory</code> + EF InMemory</td>
<td>Szybkie (dziesiątki ms)</td>
</tr>
<tr>
<td>Integracyjny (Testcontainers)</td>
<td>Współpraca warstw, RZECZYWISTE zachowanie bazy</td>
<td><code>WebApplicationFactory</code> + Testcontainers</td>
<td>Wolniejsze (sekundy, start kontenera)</td>
</tr>
<tr>
<td>E2E</td>
<td>Cały system, przez prawdziwe UI/API</td>
<td>Selenium, Playwright</td>
<td>Najwolniejsze</td>
</tr>
</tbody>
</table>
  
  `},

  ]
},
