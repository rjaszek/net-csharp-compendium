  { id:"bigo", title:"Big O i struktury danych .NET", tags:"big o złożoność hashset dictionary list queue stack",
  body:`
  <h1>Big-O i podstawowe struktury danych</h1>
<h2>Co to jest notacja Big-O</h2>
<p>Big-O opisuje, <strong>jak czas wykonania (albo zużycie pamięci) algorytmu rośnie względem rozmiaru danych wejściowych (n)</strong>, w najgorszym przypadku, ignorując stałe czynniki i mniej znaczące składniki.</p>
<pre><code class="language-csharp">// O(1) - stały czas, niezależnie od rozmiaru kolekcji
int first = list[0];

// O(n) - czas rośnie LINIOWO z rozmiarem
foreach (var item in list) { Console.WriteLine(item); }

// O(n²) - czas rośnie KWADRATOWO (pętla w pętli)
foreach (var a in list)
    foreach (var b in list)
        Compare(a, b);

// O(log n) - czas rośnie logarytmicznie (np. wyszukiwanie binarne)
int index = Array.BinarySearch(sortedArray, target);
</code></pre>
<h2>Złożoności podstawowych operacji na kolekcjach .NET</h2>
<table>
<thead>
<tr>
<th>Operacja</th>
<th><code>List&lt;T&gt;</code></th>
<th><code>Dictionary&lt;K,V&gt;</code></th>
<th><code>HashSet&lt;T&gt;</code></th>
<th><code>LinkedList&lt;T&gt;</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Dostęp po indeksie</td>
<td>O(1)</td>
<td>-</td>
<td>-</td>
<td>O(n)</td>
</tr>
<tr>
<td>Wyszukiwanie po wartości</td>
<td>O(n)</td>
<td>O(1)*</td>
<td>O(1)*</td>
<td>O(n)</td>
</tr>
<tr>
<td>Dodanie na koniec</td>
<td>O(1)**</td>
<td>O(1)*</td>
<td>O(1)*</td>
<td>O(1)</td>
</tr>
<tr>
<td>Dodanie na początek/w środku</td>
<td>O(n)</td>
<td>-</td>
<td>-</td>
<td>O(1)</td>
</tr>
<tr>
<td>Usunięcie</td>
<td>O(n)</td>
<td>O(1)*</td>
<td>O(1)*</td>
<td>O(1)</td>
</tr>
</tbody>
</table>
<p><em>Amortyzowane O(1) dla struktur haszowanych - w praktyce prawie zawsze stały czas, ale w rzadkich przypadkach kolizji może być gorzej.
</em>*<code>List&lt;T&gt;.Add()</code> jest O(1) amortyzowane - czasem trzeba powiększyć wewnętrzną tablicę, co jest O(n), ale zdarza się rzadko.</p>
<h2>Co właściwie znaczy zapis <code>O(...)</code></h2>
<p><strong>"O"</strong> pochodzi od "Order of" (rząd wielkości) - matematyczna notacja opisująca, <strong>jak szybko rośnie</strong> czas wykonania (albo pamięć) algorytmu, gdy rozmiar danych wejściowych rośnie. <strong>Nie mówi, ile to jest konkretnie milisekund</strong> - mówi o <strong>tempie wzrostu</strong> względem <code>n</code>.</p>
<p><strong><code>n</code></strong> to zawsze rozmiar danych wejściowych - liczba elementów w tablicy, liczba wierszy w bazie, długość stringa - cokolwiek, co "skaluje się" w Twoim problemie.</p>
<p>Kluczowa intuicja: Big-O odpowiada na pytanie <strong>"co się stanie, jeśli podwoję dane wejściowe?"</strong> - nie "jak szybko działa dla 10 elementów", ale "jak zachowanie zmienia się, gdy <code>n</code> rośnie do nieskończoności".</p>
<h3>O(1) - czas stały</h3>
<p>Czas wykonania <strong>nie zależy od <code>n</code></strong> - niezależnie czy masz 10 elementów czy 10 milionów, operacja trwa <strong>tyle samo</strong>.</p>
<pre><code class="language-csharp">int[] numbers = new int[1_000_000];

int first = numbers[0];             // O(1) - dostęp po indeksie, ZAWSZE jeden krok
int last = numbers[^1];             // O(1) - to samo, niezależnie od rozmiaru tablicy
bool isEmpty = numbers.Length == 0; // O(1) - Length jest już zapisane, nie liczone na nowo
</code></pre>
<p><strong>Ważna pułapka pojęciowa:</strong> O(1) <strong>nie znaczy "szybkie" w sensie absolutnym</strong> - znaczy tylko "stała liczba kroków". Coś, co robi 1000 operacji, ale <strong>zawsze</strong> 1000, niezależnie od <code>n</code>, to wciąż O(1):</p>
<pre><code class="language-csharp">// To JEST O(1), mimo że robi 1000 iteracji - liczba iteracji jest STAŁA, nie zależy od n
int Sum1000FixedNumbers()
{
    int sum = 0;
    for (int i = 0; i &lt; 1000; i++) sum += i; // ZAWSZE 1000, obojętnie jakie dane wejściowe
    return sum;
}
</code></pre>
<h3>O(n) - czas liniowy</h3>
<p>Czas wykonania rośnie <strong>proporcjonalnie</strong> do <code>n</code> - jeśli podwoisz dane wejściowe, operacja zajmie (z grubsza) <strong>dwa razy dłużej</strong>.</p>
<pre><code class="language-csharp">int Sum(int[] array) // O(n)
{
    int sum = 0;
    foreach (var n in array) // MUSI odwiedzić KAŻDY element - jeden raz
        sum += n;
    return sum;
}
</code></pre>
<p>Dla tablicy o 10 elementach - 10 kroków. Dla 1000 elementów - 1000 kroków. Dla miliona - milion kroków. Liczba operacji <strong>skaluje się razem z <code>n</code></strong>, w stosunku 1:1 (stąd "liniowy" - jak linia na wykresie).</p>
<pre><code class="language-csharp">bool Contains(int[] array, int target) // O(n) - w NAJGORSZYM przypadku
{
    foreach (var n in array)
        if (n == target) return true; // może znaleźć od razu (best case), albo dopiero na końcu (worst case)
    return false;
}
</code></pre>
<p><strong>Ważne:</strong> Big-O zwykle opisuje <strong>najgorszy przypadek</strong> (worst case) - <code>Contains</code> może teoretycznie znaleźć element na pierwszej pozycji (1 krok), ale Big-O mówi o <strong>granicy górnej</strong>, czyli sytuacji, gdy trzeba przejrzeć <strong>wszystko</strong> (element na końcu albo go nie ma).</p>
<h3>Wizualne porównanie - jak rosną razem z <code>n</code></h3>
<table>
<thead>
<tr>
<th><code>n</code> (rozmiar danych)</th>
<th>O(1) - liczba kroków</th>
<th>O(n) - liczba kroków</th>
</tr>
</thead>
<tbody>
<tr>
<td>10</td>
<td>1</td>
<td>10</td>
</tr>
<tr>
<td>100</td>
<td>1</td>
<td>100</td>
</tr>
<tr>
<td>10 000</td>
<td>1</td>
<td>10 000</td>
</tr>
<tr>
<td>1 000 000</td>
<td>1</td>
<td>1 000 000</td>
</tr>
</tbody>
</table>
<p>O(1) to <strong>płaska linia</strong> na wykresie - zawsze ta sama wysokość. O(n) to <strong>linia ukośna</strong> - rośnie równo z <code>n</code>.</p>
<h3>Częsty błąd - "jedna pętla = automatycznie O(n)"</h3>
<p>To jest uproszczenie, które <strong>czasem</strong> jest prawdą, ale nie zawsze - liczy się, <strong>ile razy odwiedzasz <code>n</code> elementów</strong>, nie liczba pętli w kodzie:</p>
<pre><code class="language-csharp">// JEDNA pętla, ale O(n) - odwiedza każdy element RAZ
foreach (var x in array) { Console.WriteLine(x); }

// DWIE pętle, ale WCIĄŻ O(n) - każda pętla osobno przechodzi przez n, więc n + n = 2n,
// a stałe czynniki (2) IGNORUJEMY w Big-O
foreach (var x in array) { /* ... */ }
foreach (var x in array) { /* ... */ }

// JEDNA pętla, ale O(1) - liczba iteracji ma STAŁY GÓRNY LIMIT, niezależny od &quot;n&quot;
int[] fixedFive = { 1, 2, 3, 4, 5 };
for (int i = 0; i &lt; fixedFive.Length; i++)
{
    Console.WriteLine(fixedFive[i]); // fixedFive.Length jest ZAWSZE 5, nie zmienna &quot;n&quot;
}
</code></pre>
<p>Ostatni przykład to zresztą częste pytanie-pułapka: <em>"Czy pętla <code>for</code> jest zawsze O(n)?"</em> - odpowiedź: <strong>nie</strong>, liczy się, czy górna granica pętli <strong>zależy</strong> od rozmiaru danych wejściowych, czy jest <strong>stałą</strong>. Pętla po tablicy o zawsze-znanym, sztywnym rozmiarze (tu: 5) to O(1), niezależnie od tego, że technicznie jest to "pętla po tablicy".</p>
<p><strong>Subtelniejszy przypadek</strong> - pętla ograniczona <code>Math.Min()</code>:</p>
<pre><code class="language-csharp">// Nadal O(1) - liczba iteracji jest OGRANICZONA Z GÓRY przez stałą (5),
// mimo że wyrażenie odwołuje się do array.Length
int limit = Math.Min(5, array.Length);
for (int i = 0; i &lt; limit; i++)
{
    Console.WriteLine(array[i]);
}
</code></pre>
<pre><code class="language-csharp">Jeśli array.Length = 3      → limit = 3   → 3 kroki
Jeśli array.Length = 1000   → limit = 5   → 5 kroków (ograniczone przez stałą!)
Jeśli array.Length = 10 000 → limit = 5   → 5 kroków (ograniczone przez stałą!)
</code></pre>
<p>To jest dokładnie ten sam mechanizm, na którym oparte jest np. <code>Take(5)</code> w LINQ - bierze maksymalnie 5 elementów, bez względu na to, czy kolekcja ma 5 czy 5 milionów.</p>
<h3>Dlaczego ignorujemy stałe czynniki</h3>
<p><code>2n</code> i <code>n</code> to <strong>wciąż to samo O(n)</strong> - Big-O interesuje <strong>tempo wzrostu</strong>, nie precyzyjną liczbę operacji. Dla dużych <code>n</code>, różnica między <code>n</code> a <code>2n</code> (dwukrotność) jest <strong>nieistotna</strong> w porównaniu do różnicy między <code>n</code> a <code>n²</code> (kwadrat) - to drugie rośnie <strong>znacznie</strong> szybciej i to jest sedno, o czym Big-O informuje.</p>
<pre><code class="language-csharp">n = 1000:
2n    = 2 000
n     = 1 000
n²    = 1 000 000   ← O(n²) jest dramatycznie gorsze, niezależnie od stałych czynników
</code></pre>
<h2>Praktyczny przykład - dlaczego to ma znaczenie</h2>
<pre><code class="language-csharp">// ❌ O(n²) - dla każdego zamówienia, PRZESZUKUJE całą listę klientów
public List&lt;OrderWithCustomer&gt; Combine(List&lt;Order&gt; orders, List&lt;Customer&gt; customers)
{
    var result = new List&lt;OrderWithCustomer&gt;();
    foreach (var order in orders) // n razy
    {
        var customer = customers.FirstOrDefault(c =&gt; c.Id == order.CustomerId); // m operacji - LINIOWE przeszukanie!
        result.Add(new OrderWithCustomer(order, customer));
    }
    return result;
} // Całość: O(n * m)

// ✅ O(n) - jednorazowe zbudowanie słownika, potem O(1) dostęp
public List&lt;OrderWithCustomer&gt; Combine(List&lt;Order&gt; orders, List&lt;Customer&gt; customers)
{
    var customerById = customers.ToDictionary(c =&gt; c.Id); // O(m) - JEDEN raz

    var result = new List&lt;OrderWithCustomer&gt;();
    foreach (var order in orders) // n razy
    {
        customerById.TryGetValue(order.CustomerId, out var customer); // O(1) każde wyszukanie!
        result.Add(new OrderWithCustomer(order, customer));
    }
    return result;
} // Całość: O(n + m)
</code></pre>
<p>Dla 10 000 zamówień i 1000 klientów: pierwsza wersja to <strong>10 milionów</strong> operacji porównania, druga to <strong>11 000</strong>. To jest różnica, która na produkcji przechodzi z "działa błyskawicznie" do "timeout po 30 sekundach".</p>
<h2>Złożoność pamięciowa (Space Complexity)</h2>
<p>Big-O opisuje też <strong>zużycie pamięci</strong>, nie tylko czas:</p>
<pre><code class="language-csharp">// O(1) pamięci dodatkowej - modyfikuje w miejscu
void ReverseInPlace(int[] array)
{
    Array.Reverse(array);
}

// O(n) pamięci dodatkowej - tworzy NOWĄ tablicę
int[] ReverseCopy(int[] array)
{
    return array.Reverse().ToArray();
}
</code></pre>
<h2>Typowe klasy złożoności - od najlepszej do najgorszej</h2>
<pre><code class="language-csharp">O(1)      &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)
konstant.   logarytm.  linio.  liniowo-log.  kwadr.  wykładn.  faktorialna
</code></pre>
<p><strong>Praktyczne przykłady algorytmów:</strong>
- <code>O(log n)</code> - wyszukiwanie binarne w sortowanej tablicy
- <code>O(n log n)</code> - efektywne algorytmy sortowania (<code>Array.Sort</code>, quicksort, mergesort)
- <code>O(n²)</code> - naiwne sortowanie bąbelkowe, zagnieżdżone pętle po tej samej kolekcji</p>
<h2>Dlaczego to jest istotne na rozmowach SE III</h2>
<p>To nie jest pytanie o "znajomość teorii dla teorii" - w praktyce chodzi o rozpoznanie <strong>konkretnych antywzorców</strong> w kodzie, jak przykład z <code>FirstOrDefault</code> w pętli wyżej. Najczęstsze pytanie-pułapka: <em>"Co jest nie tak z tym kodem?"</em> z fragmentem zawierającym zagnieżdżone <code>Where</code>/<code>FirstOrDefault</code> po niezindeksowanej kolekcji - dobra odpowiedź rozpoznaje <strong>złożoność kwadratową</strong> i proponuje <strong><code>Dictionary</code>/<code>HashSet</code></strong> jako rozwiązanie.</p>

  { id:"hashset", title:"HashSet<T>", tags:"hashset unikalne elementy equalitycomparer intersect union except",
  body:`
  <h1>HashSet\\&lt;T&gt; w C</h1>
<h2>Co to jest i jak działa "pod spodem"</h2>
<p><code>HashSet&lt;T&gt;</code> to kolekcja przechowująca <strong>unikalne</strong> elementy, oparta na <strong>tablicy haszującej</strong> (hash table) - dokładnie ten sam mechanizm co <code>Dictionary&lt;K,V&gt;</code>, tylko bez wartości, tylko klucze.</p>
<pre><code class="language-csharp">var uniqueIds = new HashSet&lt;int&gt;();
uniqueIds.Add(1); // true - dodano
uniqueIds.Add(2); // true - dodano
uniqueIds.Add(1); // false - JUŻ ISTNIEJE, nie dodano duplikatu

Console.WriteLine(uniqueIds.Count); // 2, nie 3
</code></pre>
<h2>Jak działa hashowanie - dlaczego O(1)</h2>
<pre><code class="language-csharp">public class Order
{
    public int Id { get; set; }
    public override int GetHashCode() =&gt; Id.GetHashCode(); // KLUCZOWE dla HashSet&lt;Order&gt;
    public override bool Equals(object obj) =&gt; obj is Order o &amp;&amp; o.Id == Id;
}
</code></pre>
<p>Kiedy wywołujesz <code>hashSet.Add(order)</code>, <code>HashSet&lt;T&gt;</code> wywołuje <code>GetHashCode()</code> na obiekcie, żeby obliczyć, <strong>do którego "kubełka" (bucket)</strong> wewnętrznej tablicy element powinien trafić. Sprawdzenie "czy element już istnieje" polega na: obliczeniu hasha (O(1)), znalezieniu odpowiedniego kubełka (O(1)), i porównaniu (<code>Equals</code>) z elementami <strong>w tym jednym kubełku</strong> (zwykle 0-1 elementów, nie cała kolekcja) - stąd średnio <strong>O(1)</strong>, w przeciwieństwie do <code>List&lt;T&gt;.Contains()</code>, które musi przeszukać <strong>wszystkie</strong> elementy liniowo, O(n).</p>
<p>To nawiązuje wprost do wcześniejszej rozmowy o <code>Equals</code>/<code>GetHashCode</code> - <strong>jeśli nadpiszesz <code>Equals</code> bez <code>GetHashCode</code>, <code>HashSet&lt;T&gt;</code> będzie działać błędnie</strong> (dwa "logicznie równe" obiekty mogą trafić do różnych kubełków i HashSet uzna je za różne elementy), dokładnie tak, jak to opisywałem przy tamtym przykładzie.</p>
<h2>Operacje na zbiorach - matematyczna teoria mnogości w praktyce</h2>
<pre><code class="language-csharp">var setA = new HashSet&lt;int&gt; { 1, 2, 3, 4 };
var setB = new HashSet&lt;int&gt; { 3, 4, 5, 6 };

var union = new HashSet&lt;int&gt;(setA);
union.UnionWith(setB); // {1,2,3,4,5,6} - suma zbiorów

var intersection = new HashSet&lt;int&gt;(setA);
intersection.IntersectWith(setB); // {3,4} - przecięcie (elementy WSPÓLNE)

var difference = new HashSet&lt;int&gt;(setA);
difference.ExceptWith(setB); // {1,2} - różnica (elementy TYLKO w A)

var symmetricDiff = new HashSet&lt;int&gt;(setA);
symmetricDiff.SymmetricExceptWith(setB); // {1,2,5,6} - elementy w A LUB B, ale NIE w obu
</code></pre>
<h2>Praktyczne zastosowanie #1 - eliminacja duplikatów</h2>
<pre><code class="language-csharp">List&lt;int&gt; withDuplicates = new() { 1, 2, 2, 3, 3, 3, 4 };
var unique = new HashSet&lt;int&gt;(withDuplicates); // {1, 2, 3, 4}

// Alternatywnie przez LINQ (wewnętrznie też używa HashSet)
var uniqueLinq = withDuplicates.Distinct().ToList();
</code></pre>
<h2>Praktyczne zastosowanie #2 - szybkie sprawdzanie przynależności (bezpośrednie nawiązanie do Big-O)</h2>
<pre><code class="language-csharp">// ❌ O(n) dla KAŻDEGO sprawdzenia - przy dużej liście, bardzo kosztowne w pętli
List&lt;int&gt; blockedUserIds = GetBlockedUserIds(); // powiedzmy, 10 000 elementów
foreach (var user in allUsers) // 100 000 elementów
{
    if (blockedUserIds.Contains(user.Id)) // O(n) - PRZESZUKUJE listę liniowo!
    {
        // ...
    }
} // Całość: O(n * m) = 100 000 * 10 000 = 1 MILIARD operacji!

// ✅ O(1) per sprawdzenie
HashSet&lt;int&gt; blockedUserIds = GetBlockedUserIds().ToHashSet(); // JEDNORAZOWA konwersja O(m)
foreach (var user in allUsers) // 100 000 elementów
{
    if (blockedUserIds.Contains(user.Id)) // O(1) - natychmiastowe sprawdzenie!
    {
        // ...
    }
} // Całość: O(n + m) = 110 000 operacji
</code></pre>
<p>To jest <strong>dokładnie ten sam wzorzec optymalizacji</strong>, o którym mówiłem przy Big-O z <code>Dictionary</code> - <code>HashSet&lt;T&gt;</code> to naturalny wybór, gdy interesuje Cię <strong>tylko</strong> "czy element istnieje", bez potrzeby przechowywania dodatkowej wartości powiązanej z kluczem (do tego służy <code>Dictionary&lt;K,V&gt;</code>).</p>
<h2><code>HashSet&lt;T&gt;</code> vs <code>Dictionary&lt;K,V&gt;</code> - kiedy który</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>HashSet&lt;T&gt;</code></th>
<th><code>Dictionary&lt;K,V&gt;</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Przechowuje</td>
<td>Tylko elementy (klucze)</td>
<td>Pary klucz-wartość</td>
</tr>
<tr>
<td>Kiedy używać</td>
<td>"Czy X istnieje w zbiorze?"</td>
<td>"Jaka wartość odpowiada kluczowi X?"</td>
</tr>
<tr>
<td>Przykład</td>
<td>Zbiór zablokowanych ID, unikalne tagi</td>
<td>Mapowanie ID → obiekt, cache</td>
</tr>
</tbody>
</table>
<h2>Custom <code>IEqualityComparer&lt;T&gt;</code> - niestandardowa logika porównania</h2>
<pre><code class="language-csharp">public class OrderByIdComparer : IEqualityComparer&lt;Order&gt;
{
    public bool Equals(Order x, Order y) =&gt; x?.Id == y?.Id;
    public int GetHashCode(Order obj) =&gt; obj.Id.GetHashCode();
}

var orders = new HashSet&lt;Order&gt;(new OrderByIdComparer()); // porównanie TYLKO po Id, niezależnie od Equals na Order
</code></pre>
<p>To dokładnie ten mechanizm <code>IEqualityComparer&lt;T&gt;</code>, o którym mówiliśmy przy porównywaniu <code>record</code>/<code>class</code> - działa identycznie z <code>HashSet&lt;T&gt;</code> jak z każdą inną kolekcją.</p>
<h2>Podsumowanie</h2>
<blockquote>
<p><code>HashSet&lt;T&gt;</code> to struktura oparta na tablicy haszującej, dająca średnio <strong>O(1)</strong> dla dodawania, usuwania i sprawdzania przynależności - w przeciwieństwie do <code>List&lt;T&gt;.Contains()</code>, które jest <strong>O(n)</strong>. Kluczowy warunek poprawnego działania to <strong>spójna implementacja <code>Equals</code>/<code>GetHashCode</code></strong> na przechowywanym typie (albo dostarczenie własnego <code>IEqualityComparer&lt;T&gt;</code>). Najczęstsze praktyczne zastosowanie to eliminacja duplikatów i <strong>szybkie sprawdzanie przynależności</strong> w pętli, co zamienia złożoność <code>O(n*m)</code> na <code>O(n+m)</code> - to jest jeden z najbardziej praktycznych, "darmowych" usprawnień wydajnościowych, jakie można wprowadzić do kodu.</p>
</blockquote>
  
  `},

  { id:"extension-methods", title:"Extension Methods", tags:"extension methods this static linq where select",
  body:`
  <h1>Metody rozszerzające (Extension Methods) w C</h1>
<h2>Co to jest - dodawanie metod do typu, którego nie możesz (albo nie chcesz) modyfikować</h2>
<p>Extension methods pozwalają "dodać" metodę do istniejącego typu (nawet takiego, do którego nie masz dostępu do kodu źródłowego, np. <code>string</code> czy <code>List&lt;T&gt;</code> z .NET), bez dziedziczenia czy modyfikowania oryginalnej klasy.</p>
<pre><code class="language-csharp">public static class StringExtensions
{
    // &quot;this&quot; przed pierwszym parametrem - TO oznacza, że jest to extension method
    public static bool IsValidEmail(this string input)
    {
        return !string.IsNullOrWhiteSpace(input) &amp;&amp; input.Contains(&quot;@&quot;);
    }
}
</code></pre>
<pre><code class="language-csharp">string email = &quot;test@example.com&quot;;
bool valid = email.IsValidEmail(); // wywołanie WYGLĄDA jak normalna metoda instancji!
</code></pre>
<h2>Jak to działa "pod spodem" - cukier składniowy</h2>
<p>To jest kluczowe do zrozumienia - <code>email.IsValidEmail()</code> to <strong>tylko składnia</strong>, kompilator <strong>faktycznie</strong> generuje wywołanie statycznej metody:</p>
<pre><code class="language-csharp">// To co piszesz:
bool valid = email.IsValidEmail();

// To co kompiluje się &quot;pod spodem&quot;:
bool valid = StringExtensions.IsValidEmail(email);
</code></pre>
<p><code>string</code> <strong>fizycznie nie zmienia się</strong> - nie dostaje nowej metody "wewnątrz" swojej definicji. To jest tylko <strong>wygodna składnia</strong> dla wywołania statycznej metody, gdzie pierwszy parametr staje się "obiektem", na którym wywołujesz metodę.</p>
<h2>Wymagania składniowe</h2>
<pre><code class="language-csharp">public static class OrderExtensions       // 1. Klasa MUSI być statyczna
{
    public static decimal GetDiscountedTotal(this Order order, decimal discountPercent) // 2. Metoda MUSI być statyczna, &quot;this&quot; na pierwszym parametrze
    {
        return order.TotalAmount * (1 - discountPercent / 100);
    }
}
</code></pre>
<ul>
<li>Klasa zawierająca extension methods musi być <code>static</code></li>
<li>Metoda musi być <code>static</code></li>
<li>Pierwszy parametr musi mieć modyfikator <code>this</code>, wskazujący typ, który "rozszerzasz"</li>
</ul>
<h2>Najbardziej znany przykład - CAŁE LINQ to extension methods</h2>
<p>To jest coś, czego być może nie zauważyłeś, mimo używania tego codziennie:</p>
<pre><code class="language-csharp">public static class Enumerable // fragment prawdziwego kodu .NET (uproszczony)
{
    public static IEnumerable&lt;T&gt; Where&lt;T&gt;(this IEnumerable&lt;T&gt; source, Func&lt;T, bool&gt; predicate)
    {
        foreach (var item in source)
            if (predicate(item)) yield return item;
    }

    public static IEnumerable&lt;TResult&gt; Select&lt;T, TResult&gt;(this IEnumerable&lt;T&gt; source, Func&lt;T, TResult&gt; selector)
    {
        foreach (var item in source)
            yield return selector(item);
    }
}
</code></pre>
<pre><code class="language-csharp">var orders = new List&lt;Order&gt; { /* ... */ };
var expensiveOrderIds = orders.Where(o =&gt; o.Total &gt; 1000).Select(o =&gt; o.Id); // Where/Select to EXTENSION METHODS!
</code></pre>
<p><strong>Cała biblioteka LINQ</strong> (<code>Where</code>, <code>Select</code>, <code>OrderBy</code>, <code>FirstOrDefault</code>, <code>ToList</code>...) to zbiór extension methods na <code>IEnumerable&lt;T&gt;</code> - to jest właśnie <strong>dlaczego</strong> LINQ "po prostu działa" na dowolnej kolekcji implementującej <code>IEnumerable&lt;T&gt;</code>, nawet napisanej przez kogoś innego, bez modyfikowania jej kodu.</p>
<h2>Praktyczne zastosowanie #1 - "rozszerzanie" typów wbudowanych .NET</h2>
<pre><code class="language-csharp">public static class DateTimeExtensions
{
    public static bool IsWeekend(this DateTime date)
        =&gt; date.DayOfWeek == DayOfWeek.Saturday || date.DayOfWeek == DayOfWeek.Sunday;

    public static DateTime StartOfMonth(this DateTime date)
        =&gt; new DateTime(date.Year, date.Month, 1);
}
</code></pre>
<pre><code class="language-csharp">if (DateTime.Now.IsWeekend()) { Console.WriteLine(&quot;Weekend!&quot;); }
var start = DateTime.Now.StartOfMonth();
</code></pre>
<p>Nie możesz dziedziczyć po <code>DateTime</code> (to <code>struct</code>, jak omawialiśmy, nie wspiera dziedziczenia) ani zmodyfikować jego kodu źródłowego (to wbudowany typ .NET) - extension method to jedyny sposób na dodanie "własnych" metod do takiego typu.</p>
<h2>Praktyczne zastosowanie #2 - metody pomocnicze dla interfejsów</h2>
<pre><code class="language-csharp">public interface IOrderRepository
{
    Task&lt;Order&gt; GetByIdAsync(int id);
    Task&lt;List&lt;Order&gt;&gt; GetAllAsync();
}

public static class OrderRepositoryExtensions
{
    // Metoda &quot;wygodna&quot;, zbudowana na bazie podstawowych metod interfejsu -
    // NIE trzeba jej implementować w KAŻDEJ klasie implementującej IOrderRepository
    public static async Task&lt;bool&gt; ExistsAsync(this IOrderRepository repository, int id)
    {
        var order = await repository.GetByIdAsync(id);
        return order != null;
    }
}
</code></pre>
<pre><code class="language-csharp">IOrderRepository repo = new OrderRepository(context);
bool exists = await repo.ExistsAsync(5); // działa dla KAŻDEJ implementacji IOrderRepository automatycznie
</code></pre>
<p>To jest przydatna technika - jeśli chcesz dodać "wygodną" metodę pochodną od podstawowego kontraktu interfejsu, <strong>nie musisz</strong> dodawać jej do samego interfejsu (co wymusiłoby implementację we WSZYSTKICH klasach implementujących) - extension method daje ją "za darmo" wszystkim implementacjom naraz.</p>
<h2>Ograniczenia extension methods</h2>
<p><strong>1. Nie mają dostępu do <code>private</code>/<code>protected</code> członków</strong> - działają tylko przez publiczne API typu, który rozszerzają:</p>
<pre><code class="language-csharp">public static class OrderExtensions
{
    public static void Broken(this Order order)
    {
        // order._internalField; // ❌ błąd - extension method nie ma dostępu do private/protected
    }
}
</code></pre>
<p><strong>2. Metody instancyjne zawsze mają PRIORYTET nad extension methods</strong> - jeśli klasa ma "prawdziwą" metodę o tej samej sygnaturze, ta prawdziwa zawsze "wygrywa":</p>
<pre><code class="language-csharp">public class Order
{
    public string Describe() =&gt; &quot;Prawdziwa metoda&quot;; // metoda INSTANCYJNA
}

public static class OrderExtensions
{
    public static string Describe(this Order order) =&gt; &quot;Extension method&quot;; // ta SAMA nazwa
}

var order = new Order();
order.Describe(); // &quot;Prawdziwa metoda&quot; - metoda instancyjna ZAWSZE wygrywa
</code></pre>
<p><strong>3. Wymagają <code>using</code> odpowiedniej przestrzeni nazw</strong>, żeby były widoczne:</p>
<pre><code class="language-csharp">using MyApp.Extensions; // MUSISZ zaimportować namespace, w którym jest OrderExtensions
</code></pre>
<h2>Podsumowanie</h2>
<blockquote>
<p>Extension methods to statyczne metody w statycznej klasie, z modyfikatorem <code>this</code> na pierwszym parametrze - kompilator tłumaczy wywołanie <code>obj.Method()</code> na <code>StaticClass.Method(obj)</code>, dając <strong>wrażenie</strong> dodania nowej metody do typu, bez faktycznej modyfikacji jego definicji. To jest fundament LINQ (<code>Where</code>, <code>Select</code> to extension methods na <code>IEnumerable&lt;T&gt;</code>) i praktyczny sposób na dodanie "wygodnych" metod do typów wbudowanych .NET albo do interfejsów, bez wymuszania ich implementacji na każdej klasie implementującej ten interfejs.</p>
</blockquote>
  
  `},

  ]

{
  id: "automapper",
  title: "AutoMapper",
  topics: [

  { id:"automapper-basics", title:"AutoMapper", tags:"automapper profile projectto reversemap assertconfigurationisvalid",
  body:`
  <h1>AutoMapper - mapowanie obiektów</h1>
<h2>Problem, który rozwiązuje - ręczne mapowanie jest nudne i podatne na błędy</h2>
<pre><code class="language-csharp">// Ręczne mapowanie - działa, ale rozrasta się i łatwo o pomyłkę przy dodaniu nowego pola
public OrderDto MapToDto(Order order)
{
    return new OrderDto
    {
        Id = order.Id,
        CustomerName = order.Customer.Name, // nawigacja
        Total = order.TotalAmount,
        ItemCount = order.Items.Count
    };
}
</code></pre>
<p>Dla dużych obiektów z dziesiątkami pól, ręczne mapowanie to sporo powtarzalnego kodu - i <strong>łatwo zapomnieć</strong> zmapować nowe pole po dodaniu go do encji/DTO.</p>
<h2>Podstawowa konfiguracja Profile</h2>
<pre><code class="language-csharp">public class OrderMappingProfile : Profile
{
    public OrderMappingProfile()
    {
        CreateMap&lt;Order, OrderDto&gt;()
            .ForMember(dest =&gt; dest.CustomerName, opt =&gt; opt.MapFrom(src =&gt; src.Customer.Name))
            .ForMember(dest =&gt; dest.ItemCount, opt =&gt; opt.MapFrom(src =&gt; src.Items.Count));
        // Total → TotalAmount mapowane AUTOMATYCZNIE, jeśli nazwy się różnią tylko konwencją,
        // albo Id → Id, CustomerName → CustomerName gdy nazwy IDENTYCZNE - bez ForMember
    }
}
</code></pre>
<p><strong>Konwencja automatycznego mapowania:</strong> AutoMapper domyślnie mapuje właściwości o <strong>identycznych nazwach</strong> bez żadnej konfiguracji - <code>ForMember</code> potrzebny jest tylko dla pól wymagających <strong>niestandardowej</strong> logiki (inna nazwa, transformacja, nawigacja przez zagnieżdżone obiekty).</p>
<h2>Rejestracja w DI</h2>
<pre><code class="language-csharp">builder.Services.AddAutoMapper(typeof(OrderMappingProfile).Assembly); // skanuje assembly, rejestruje WSZYSTKIE profile
</code></pre>
<h2>Użycie przez <code>IMapper</code> (wstrzykiwane przez DI - constructor injection, jak zawsze)</h2>
<pre><code class="language-csharp">public class OrderService : IOrderService
{
    private readonly AppDbContext _context;
    private readonly IMapper _mapper;

    public OrderService(AppDbContext context, IMapper mapper)
    {
        _context = context;
        _mapper = mapper;
    }

    public async Task&lt;OrderDto&gt; GetOrderAsync(int id)
    {
        var order = await _context.Orders.Include(o =&gt; o.Customer).FirstOrDefaultAsync(o =&gt; o.Id == id);
        return _mapper.Map&lt;OrderDto&gt;(order); // jedna linia zamiast ręcznego mapowania
    }
}
</code></pre>
<h2><code>ProjectTo&lt;T&gt;()</code> - mapowanie NA POZIOMIE SQL (kluczowa optymalizacja z EF Core)</h2>
<p>To jest <strong>najważniejsza</strong> rzecz do wiedzenia o AutoMapper w kontekście EF Core - i nawiązuje wprost do rozmowy o <code>IQueryable</code>/<code>IEnumerable</code>:</p>
<pre><code class="language-csharp">// ❌ NIEEFEKTYWNE - najpierw materializuje WSZYSTKIE kolumny, POTEM mapuje w pamięci
var orders = await _context.Orders.ToListAsync(); // SELECT * (wszystkie kolumny!)
var dtos = _mapper.Map&lt;List&lt;OrderDto&gt;&gt;(orders); // mapowanie w C#, po pobraniu WSZYSTKIEGO

// ✅ EFEKTYWNE - ProjectTo tłumaczy mapowanie NA SQL SELECT z konkretnymi kolumnami
var dtos = await _context.Orders
    .ProjectTo&lt;OrderDto&gt;(_mapper.ConfigurationProvider) // generuje SELECT TYLKO potrzebnych kolumn!
    .ToListAsync();
</code></pre>
<p><code>ProjectTo&lt;T&gt;()</code> <strong>działa na <code>IQueryable</code></strong> (dokładnie ten interfejs, o którym mówiliśmy szczegółowo) - AutoMapper <strong>analizuje</strong> konfigurację mapowania i <strong>wbudowuje</strong> ją w drzewo wyrażeń zapytania, więc EF Core generuje SQL <code>SELECT</code> z <strong>wyłącznie potrzebnymi kolumnami</strong>, zamiast pobierać całą encję i mapować w pamięci C#.</p>
<pre><code class="language-sql">-- Map() po ToListAsync() - EF Core generuje:
SELECT * FROM Orders  -- WSZYSTKIE kolumny, w tym te niepotrzebne do OrderDto

-- ProjectTo() - EF Core generuje:
SELECT Id, TotalAmount, (SELECT COUNT(*) FROM OrderItems WHERE OrderId = Orders.Id) AS ItemCount
FROM Orders -- TYLKO kolumny potrzebne do OrderDto
</code></pre>
<h2>Custom Value Resolvers - złożona logika mapowania</h2>
<pre><code class="language-csharp">public class DiscountResolver : IValueResolver&lt;Order, OrderDto, decimal&gt;
{
    public decimal Resolve(Order source, OrderDto destination, decimal destMember, ResolutionContext context)
    {
        return source.TotalAmount * (source.Customer.IsVip ? 0.9m : 1.0m); // logika zbyt złożona na ForMember
    }
}

CreateMap&lt;Order, OrderDto&gt;()
    .ForMember(dest =&gt; dest.DiscountedTotal, opt =&gt; opt.MapFrom&lt;DiscountResolver&gt;());
</code></pre>
<h2>Mapowanie odwrotne - <code>ReverseMap()</code></h2>
<pre><code class="language-csharp">CreateMap&lt;Order, OrderDto&gt;()
    .ReverseMap(); // automatycznie generuje TEŻ mapowanie OrderDto → Order
</code></pre>
<h2>Walidacja konfiguracji - <code>AssertConfigurationIsValid()</code></h2>
<pre><code class="language-csharp">// W testach - sprawdza, że WSZYSTKIE mapowania są kompletne (żadne pole nieprzypisane bez wyjątku)
var config = new MapperConfiguration(cfg =&gt; cfg.AddProfile&lt;OrderMappingProfile&gt;());
config.AssertConfigurationIsValid();
</code></pre>
<p>To jest ważna praktyka - AutoMapper domyślnie <strong>nie rzuca błędu</strong>, jeśli jakieś pole docelowe nie ma odpowiadającego źródła (zostaje z wartością domyślną) - <code>AssertConfigurationIsValid()</code> w teście wychwytuje takie przypadki <strong>przed</strong> wdrożeniem, zamiast dowiadywać się o tym z pustych danych na produkcji.</p>
<h2>Kontrowersje wokół AutoMapper - warto znać na rozmowie</h2>
<p>To jest częsty temat dyskusyjny (podobny do Repository/UoW) - część zespołów <strong>unika</strong> AutoMapper na rzecz <strong>ręcznych metod mapujących</strong> albo generatorów kodu (np. <strong>Mapperly</strong> - nowsza alternatywa generująca kod w compile-time):</p>
<p><strong>Argumenty przeciw AutoMapper:</strong>
- "Magia" utrudnia debugowanie - błąd mapowania ujawnia się w <strong>runtime</strong>, nie w compile-time
- Refaktoryzacja (zmiana nazwy pola) <strong>nie jest bezpieczna</strong> - <code>ForMember(dest =&gt; dest.OldName, ...)</code> po zmianie nazwy property nadal się skompiluje, ale przestanie działać poprawnie
- Narzut wydajnościowy dla prostego mapowania 1:1 (choć <code>ProjectTo</code> częściowo to łagodzi)</p>
<p><strong>Argumenty za:</strong>
- Mniej powtarzalnego kodu przy dużej liczbie DTO
- <code>ProjectTo</code> daje realną, praktyczną optymalizację SQL bez ręcznego pisania projekcji LINQ</p>
<h2>Podsumowanie</h2>
<blockquote>
<p>AutoMapper eliminuje powtarzalny kod ręcznego mapowania między encjami i DTO, przez konfigurację w <code>Profile</code> i konwencję dopasowania po nazwach właściwości. Kluczowa, praktyczna optymalizacja to <code>ProjectTo&lt;T&gt;()</code>, które - w przeciwieństwie do <code>Map()</code> wywoływanego po materializacji - działa na poziomie <code>IQueryable</code>, tłumacząc mapowanie na SQL <code>SELECT</code> z tylko potrzebnymi kolumnami, zamiast pobierać całą encję i mapować ją w pamięci C#.</p>
</blockquote>
  
  `},

  ]
},

  { id:"saga", title:"Saga Pattern", tags:"saga orchestration choreography compensating transaction idempotencja",
  body:`
  <h1>Saga Pattern - zarządzanie rozproszonymi transakcjami</h1>
<h2>Problem, który Saga rozwiązuje - brak transakcji ACID między mikroserwisami</h2>
<p>W monolicie, transakcja obejmująca wiele operacji (np. utworzenie zamówienia + odjęcie stanu magazynowego + obciążenie płatności) jest prosta - jedna transakcja bazodanowa, <code>BeginTransaction</code>/<code>Commit</code>/<code>Rollback</code>, jak omawialiśmy przy EF Core.</p>
<p><strong>W architekturze mikroserwisów</strong> te operacje żyją w <strong>różnych serwisach</strong>, z <strong>różnymi bazami danych</strong>:</p>
<pre><code class="language-csharp">OrderService (własna baza) → InventoryService (własna baza) → PaymentService (własna baza)
</code></pre>
<p>Nie możesz po prostu owinąć tego w jedną transakcję SQL - <strong>nie ma</strong> jednej bazy danych, którą mógłbyś objąć transakcją <code>BeginTransactionAsync()</code>. Klasyczne dwufazowe zatwierdzanie (2PC - Two-Phase Commit) na poziomie rozproszonym jest w praktyce <strong>rzadko używane</strong> w mikroserwisach - jest wolne, blokujące i słabo się skaluje.</p>
<p><strong>Saga Pattern</strong> to odpowiedź na ten problem: rozbija dużą operację biznesową na <strong>sekwencję mniejszych, lokalnych transakcji</strong>, każda w obrębie jednego serwisu, z mechanizmem <strong>kompensacji</strong> (compensating actions) w przypadku niepowodzenia jednego z kroków.</p>
<h2>Skąd nazwa "Saga"</h2>
<p>Nazwa pochodzi z <strong>oryginalnej pracy naukowej z 1987 roku</strong> (Hector Garcia-Molina, Kenneth Salem) opisującej długotrwałe transakcje, które - jak epicka saga - składają się z wielu następujących po sobie "rozdziałów" (kroków), zamiast jednego, atomowego zdarzenia.</p>
<h2>Dwa modele implementacji Sagi</h2>
<h3>1. Choreography (Choreografia) - brak centralnego koordynatora</h3>
<p>Każdy serwis <strong>nasłuchuje</strong> zdarzeń i <strong>reaguje</strong>, publikując własne zdarzenia - nikt "nie dyryguje" całością, to zdecentralizowany, zdarzeniowy przepływ.</p>
<pre><code class="language-csharp">// OrderService
public class OrderCreatedHandler
{
    public async Task Handle(OrderCreatedEvent orderCreated)
    {
        // Utworzono zamówienie, publikuj zdarzenie
        await _eventBus.PublishAsync(new OrderPlacedEvent(orderCreated.OrderId, orderCreated.Items));
    }
}

// InventoryService - nasłuchuje OrderPlacedEvent
public class OrderPlacedHandler
{
    public async Task Handle(OrderPlacedEvent orderPlaced)
    {
        var reserved = await _inventoryRepository.TryReserveStockAsync(orderPlaced.Items);

        if (reserved)
            await _eventBus.PublishAsync(new StockReservedEvent(orderPlaced.OrderId));
        else
            await _eventBus.PublishAsync(new StockReservationFailedEvent(orderPlaced.OrderId)); // KOMPENSACJA
    }
}

// PaymentService - nasłuchuje StockReservedEvent
public class StockReservedHandler
{
    public async Task Handle(StockReservedEvent stockReserved)
    {
        var charged = await _paymentGateway.ChargeAsync(stockReserved.OrderId);

        if (charged)
            await _eventBus.PublishAsync(new PaymentCompletedEvent(stockReserved.OrderId));
        else
            await _eventBus.PublishAsync(new PaymentFailedEvent(stockReserved.OrderId)); // KOMPENSACJA
    }
}

// OrderService - nasłuchuje StockReservationFailedEvent / PaymentFailedEvent - KOMPENSACJA
public class SagaCompensationHandler
{
    public async Task Handle(PaymentFailedEvent paymentFailed)
    {
        await _orderRepository.CancelOrderAsync(paymentFailed.OrderId);
        await _eventBus.PublishAsync(new ReleaseStockEvent(paymentFailed.OrderId)); // każ InventoryService zwolnić rezerwację
    }
}
</code></pre>
<p><strong>Zalety Choreography:</strong>
- Prostota dla <strong>małej liczby</strong> kroków - brak dodatkowego, scentralizowanego komponentu do zbudowania
- Naturalna <strong>słaba spójność</strong> (loose coupling) - serwisy nie znają się nawzajem, tylko zdarzenia</p>
<p><strong>Wady:</strong>
- <strong>Trudność w śledzeniu</strong> całego przepływu - żeby zrozumieć "co się dzieje przy tworzeniu zamówienia", musisz przejrzeć handlery w <strong>kilku różnych</strong> serwisach, bez jednego, czytelnego miejsca opisującego cały proces
- <strong>Ryzyko cyklicznych zależności</strong> zdarzeń przy złożonych sagach z wieloma krokami
- Trudniejsze testowanie end-to-end całego przepływu</p>
<h3>2. Orchestration (Orkiestracja) - centralny koordynator</h3>
<p>Dedykowany komponent (<strong>Saga Orchestrator</strong>) <strong>jawnie</strong> koordynuje wszystkie kroki, wysyłając komendy do poszczególnych serwisów i decydując, co robić w przypadku błędu.</p>
<pre><code class="language-csharp">public class OrderSagaOrchestrator
{
    private readonly IInventoryServiceClient _inventoryClient;
    private readonly IPaymentServiceClient _paymentClient;
    private readonly IOrderRepository _orderRepository;

    public async Task ExecuteAsync(int orderId, List&lt;OrderItemDto&gt; items, decimal amount)
    {
        try
        {
            // Krok 1
            await _inventoryClient.ReserveStockAsync(orderId, items);

            try
            {
                // Krok 2
                await _paymentClient.ChargeAsync(orderId, amount);
            }
            catch (PaymentFailedException)
            {
                // KOMPENSACJA dla Kroku 1 - musimy wycofać rezerwację magazynową
                await _inventoryClient.ReleaseStockAsync(orderId, items);
                throw;
            }

            // Krok 3
            await _orderRepository.MarkAsConfirmedAsync(orderId);
        }
        catch (Exception)
        {
            await _orderRepository.MarkAsFailedAsync(orderId);
            throw;
        }
    }
}
</code></pre>
<p><strong>Wersja z jawną maszyną stanów (State Machine)</strong> - częsta w praktyce, np. z biblioteką <strong>MassTransit</strong> (obsługującą Sagi natywnie):</p>
<pre><code class="language-csharp">public class OrderSaga : MassTransitStateMachine&lt;OrderSagaState&gt;
{
    public State AwaitingStockReservation { get; private set; }
    public State AwaitingPayment { get; private set; }
    public State Completed { get; private set; }
    public State Failed { get; private set; }

    public Event&lt;OrderPlacedEvent&gt; OrderPlaced { get; private set; }
    public Event&lt;StockReservedEvent&gt; StockReserved { get; private set; }
    public Event&lt;PaymentCompletedEvent&gt; PaymentCompleted { get; private set; }
    public Event&lt;PaymentFailedEvent&gt; PaymentFailed { get; private set; }

    public OrderSaga()
    {
        InstanceState(x =&gt; x.CurrentState);

        Initially(
            When(OrderPlaced)
                .Then(context =&gt; context.Saga.OrderId = context.Message.OrderId)
                .TransitionTo(AwaitingStockReservation)
                .Publish(context =&gt; new ReserveStockCommand(context.Message.OrderId)));

        During(AwaitingStockReservation,
            When(StockReserved)
                .TransitionTo(AwaitingPayment)
                .Publish(context =&gt; new ChargePaymentCommand(context.Saga.OrderId)));

        During(AwaitingPayment,
            When(PaymentCompleted)
                .TransitionTo(Completed),
            When(PaymentFailed)
                .Publish(context =&gt; new ReleaseStockCommand(context.Saga.OrderId)) // KOMPENSACJA
                .TransitionTo(Failed));
    }
}
</code></pre>
<p><strong>Zalety Orchestration:</strong>
- <strong>Jasny, scentralizowany</strong> przepływ - cały proces biznesowy widoczny w JEDNYM miejscu (klasa Orchestratora/State Machine)
- Łatwiejsze testowanie i debugowanie całej sekwencji
- Łatwiej dodać <strong>timeout</strong>y i bardziej złożoną logikę warunkową</p>
<p><strong>Wady:</strong>
- Orchestrator staje się <strong>punktem centralnym</strong> - większa odpowiedzialność w jednym miejscu (choć nie jest to "single point of failure" w sensie dostępności, jeśli jest odpowiednio zaprojektowany)
- Serwisy uczestniczące muszą "znać" Orchestratora (przynajmniej format komend, które odbierają)</p>
<h2>Kompensacja (Compensating Transactions) - fundament Sagi</h2>
<p>To jest <strong>najważniejsza koncepcja</strong> w całym wzorcu - skoro nie ma rozproszonego rollbacku (jak w klasycznej transakcji SQL), <strong>każdy krok Sagi musi mieć zdefiniowaną akcję kompensującą</strong>, która "odwraca" jego efekt:</p>
<table>
<thead>
<tr>
<th>Krok</th>
<th>Akcja</th>
<th>Kompensacja</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Rezerwacja stanu magazynowego</td>
<td><code>ReserveStock()</code></td>
<td><code>ReleaseStock()</code></td>
</tr>
<tr>
<td>2. Obciążenie płatności</td>
<td><code>ChargePayment()</code></td>
<td><code>RefundPayment()</code></td>
</tr>
<tr>
<td>3. Potwierdzenie zamówienia</td>
<td><code>ConfirmOrder()</code></td>
<td><code>CancelOrder()</code></td>
</tr>
</tbody>
</table>
<p><strong>Ważna właściwość kompensacji:</strong> nie musi być "dosłownym cofnięciem" - to jest <strong>semantyczne odwrócenie efektu biznesowego</strong>. Np. jeśli płatność już przeszła i towar został wysłany, "kompensacja" może oznaczać <strong>zwrot pieniędzy</strong> i <strong>proces reklamacyjny</strong>, nie magiczne "usunięcie" faktu, że transakcja się wydarzyła.</p>
<h2>Idempotencja - wymóg praktyczny dla wszystkich kroków Sagi</h2>
<p>Skoro komunikacja między serwisami odbywa się przez sieć (message queue, HTTP), <strong>wiadomości mogą być dostarczone wielokrotnie</strong> (retry po timeout, brak potwierdzenia ACK) - każdy krok Sagi (i jego kompensacja) <strong>musi być idempotentny</strong>, czyli bezpieczny do wielokrotnego wykonania z tym samym skutkiem:</p>
<pre><code class="language-csharp">public async Task ReserveStockAsync(int orderId, List&lt;OrderItemDto&gt; items)
{
    // ✅ Idempotentne - sprawdza, czy JUŻ zarezerwowano dla tego orderId, zanim zrobi to ponownie
    var existingReservation = await _context.StockReservations
        .FirstOrDefaultAsync(r =&gt; r.OrderId == orderId);

    if (existingReservation != null) return; // już wykonane, nic nie robimy

    // faktyczna logika rezerwacji
}
</code></pre>
<h2>Kiedy stosować Sagę - praktyczna reguła</h2>
<blockquote>
<p>Saga ma sens, gdy masz <strong>operację biznesową obejmującą wiele niezależnych serwisów/baz danych</strong>, którą trzeba przeprowadzić w skoordynowany sposób, bez klasycznej rozproszonej transakcji ACID. Dla <strong>prostych</strong> przepływów (2-3 kroki, mało warunków błędu) Choreography jest szybsza do zaimplementowania. Dla <strong>złożonych</strong> przepływów (wiele kroków, warunki, timeouty, potrzeba śledzenia stanu) Orchestration (zwłaszcza z gotową biblioteką jak MassTransit) daje dużo lepszą czytelność i testowalność.</p>
</blockquote>
<h2>Podsumowanie</h2>
<blockquote>
<p>Saga Pattern rozwiązuje problem transakcji rozproszonych między mikroserwisami przez rozbicie dużej operacji na sekwencję lokalnych transakcji, każda z zdefiniowaną akcją kompensującą na wypadek niepowodzenia kolejnego kroku. Dwa modele implementacji - <strong>Choreography</strong> (zdecentralizowana, przez zdarzenia, prostsza dla małych sag) i <strong>Orchestration</strong> (scentralizowany koordynator/maszyna stanów, lepsza czytelność i testowalność dla złożonych przepływów) - różnią się głównie tym, <strong>kto</strong> podejmuje decyzje o kolejnym kroku: w Choreography każdy serwis reaguje samodzielnie na zdarzenia, w Orchestration jeden komponent jawnie steruje całym procesem. Kluczowe wymogi praktyczne to <strong>kompensacja</strong> dla każdego kroku i <strong>idempotencja</strong> wszystkich operacji, bo komunikacja sieciowa nie gwarantuje dostarczenia "exactly once".</p>
</blockquote>
  
  `},

  { id:"outbox", title:"Outbox Pattern", tags:"outbox pattern dual write at least once idempotent cdc debezium",
  body:`
  <h1>Outbox Pattern - gwarancja spójności między bazą danych i publikacją zdarzeń</h1>
<h2>Problem, który Outbox rozwiązuje - "dual write problem"</h2>
<p>To jest bezpośrednie nawiązanie do Sagi (Choreography), o której właśnie mówiliśmy - żeby Saga działała, serwisy muszą <strong>publikować zdarzenia</strong> po zapisaniu zmian w swojej bazie danych. Ale co, jeśli zapis do bazy się powiedzie, a publikacja zdarzenia <strong>zawiedzie</strong> (np. broker wiadomości jest chwilowo niedostępny)?</p>
<pre><code class="language-csharp">// ❌ NIEBEZPIECZNE - dwa niezależne systemy, dwa niezależne punkty awarii
public async Task PlaceOrderAsync(Order order)
{
    _context.Orders.Add(order);
    await _context.SaveChangesAsync(); // ✅ zapisano do bazy danych

    // Co jeśli SERWER PADNIE właśnie TUTAJ, między tymi dwoma liniami?
    await _eventBus.PublishAsync(new OrderPlacedEvent(order.Id)); // ❌ zdarzenie NIGDY nie zostanie opublikowane!
}
</code></pre>
<p>To jest <strong>dual write problem</strong> - zapisujesz do <strong>dwóch różnych systemów</strong> (baza danych + broker wiadomości), które <strong>nie mają</strong> wspólnej transakcji. Nie da się tego owinąć w <code>BeginTransactionAsync()</code>, bo broker wiadomości (Kafka, RabbitMQ) <strong>nie uczestniczy</strong> w transakcjach SQL Server/PostgreSQL.</p>
<p><strong>Konsekwencja w kontekście Sagi:</strong> jeśli <code>OrderPlacedEvent</code> nigdy nie zostanie opublikowany, <strong>cała Saga się zatrzymuje</strong> - <code>InventoryService</code> nigdy nie zarezerwuje towaru, mimo że zamówienie <strong>istnieje</strong> w bazie <code>OrderService</code>. To jest <strong>niespójność</strong> między stanem faktycznym a tym, co "wie" resztę systemu.</p>
<h2>Rozwiązanie - zapisz zdarzenie DO TEJ SAMEJ bazy danych, w tej samej transakcji</h2>
<p>Outbox Pattern polega na: <strong>zamiast</strong> publikować zdarzenie bezpośrednio do brokera, <strong>zapisz je jako wiersz w tabeli "outbox" w TEJ SAMEJ bazie danych</strong>, w <strong>tej samej transakcji</strong> co Twoje właściwe dane biznesowe.</p>
<pre><code class="language-csharp">public class OutboxMessage
{
    public Guid Id { get; set; }
    public string EventType { get; set; }
    public string Payload { get; set; } // JSON zawierający dane zdarzenia
    public DateTime CreatedAt { get; set; }
    public DateTime? ProcessedAt { get; set; } // null = jeszcze nieopublikowane
}
</code></pre>
<pre><code class="language-csharp">// ✅ BEZPIECZNE - JEDNA transakcja SQL obejmuje OBA zapisy
public async Task PlaceOrderAsync(Order order)
{
    _context.Orders.Add(order);

    _context.OutboxMessages.Add(new OutboxMessage
    {
        Id = Guid.NewGuid(),
        EventType = nameof(OrderPlacedEvent),
        Payload = JsonSerializer.Serialize(new OrderPlacedEvent(order.Id, order.Items)),
        CreatedAt = DateTime.UtcNow
    });

    await _context.SaveChangesAsync(); // JEDNA transakcja - ALBO obie zmiany się zapiszą, ALBO żadna
}
</code></pre>
<p>Teraz <code>SaveChangesAsync()</code> (jak omawialiśmy przy transakcjach EF Core) <strong>automatycznie</strong> owija oba zapisy (<code>Order</code> + <code>OutboxMessage</code>) w jedną transakcję SQL - <strong>niemożliwe</strong> jest zapisanie zamówienia bez zapisania odpowiadającego mu wiersza w outboxie (i vice versa).</p>
<h2>Krok 2 - osobny proces publikujący zdarzenia z outboxa</h2>
<p>To jest druga część wzorca - <strong>background worker</strong> (dokładnie <code>BackgroundService</code>, o którym mówiliśmy przy <code>IServiceScopeFactory</code>), który <strong>regularnie</strong> sprawdza tabelę outbox i publikuje niewysłane jeszcze wiadomości:</p>
<pre><code class="language-csharp">public class OutboxPublisherService : BackgroundService
{
    private readonly IServiceScopeFactory _scopeFactory;
    private readonly IEventBus _eventBus;

    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
    {
        while (!stoppingToken.IsCancellationRequested)
        {
            using var scope = _scopeFactory.CreateScope(); // Scoped DbContext, jak omawialiśmy wcześniej
            var context = scope.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();

            var pendingMessages = await context.OutboxMessages
                .Where(m =&gt; m.ProcessedAt == null)
                .OrderBy(m =&gt; m.CreatedAt)
                .Take(20)
                .ToListAsync(stoppingToken);

            foreach (var message in pendingMessages)
            {
                try
                {
                    await _eventBus.PublishAsync(message.EventType, message.Payload);
                    message.ProcessedAt = DateTime.UtcNow; // oznacz jako wysłane
                }
                catch (Exception)
                {
                    // NIE oznaczaj jako przetworzone - kolejna iteracja pętli spróbuje PONOWNIE
                    break;
                }
            }

            await context.SaveChangesAsync(stoppingToken);
            await Task.Delay(TimeSpan.FromSeconds(2), stoppingToken);
        }
    }
}
</code></pre>
<p><strong>Kluczowa gwarancja:</strong> jeśli publikacja do brokera zawiedzie, wiersz <strong>zostaje</strong> w tabeli outbox z <code>ProcessedAt = null</code> - następna iteracja worker'a <strong>spróbuje ponownie</strong>. Nic nie zostaje "zgubione", nawet jeśli cały proces aplikacji padnie w międzyczasie - po restarcie worker po prostu <strong>kontynuuje</strong> od miejsca, gdzie tabela outbox wskazuje niewysłane wiadomości.</p>
<h2>"At-least-once delivery" - konsekwencja, którą trzeba obsłużyć</h2>
<p>Outbox gwarantuje, że zdarzenie <strong>zostanie opublikowane przynajmniej raz</strong> - ale <strong>może</strong> zostać opublikowane <strong>więcej niż raz</strong> (np. worker opublikował zdarzenie, ale padł zanim zapisał <code>ProcessedAt</code>, więc następna iteracja publikuje je <strong>ponownie</strong>).</p>
<p>To jest bezpośrednie nawiązanie do <strong>idempotencji</strong>, o której mówiłem przy Sadze - konsument zdarzenia (np. <code>InventoryService</code> z poprzedniego przykładu) <strong>musi</strong> być odporny na duplikaty:</p>
<pre><code class="language-csharp">public async Task Handle(OrderPlacedEvent orderPlaced)
{
    // Idempotencja - sprawdź, czy TO KONKRETNE zdarzenie już przetworzono
    var alreadyProcessed = await _context.ProcessedEvents.AnyAsync(e =&gt; e.EventId == orderPlaced.EventId);
    if (alreadyProcessed) return;

    // ... właściwa logika ...

    _context.ProcessedEvents.Add(new ProcessedEvent { EventId = orderPlaced.EventId });
    await _context.SaveChangesAsync();
}
</code></pre>
<h2>Alternatywa - Change Data Capture (CDC), bardziej zaawansowana wersja</h2>
<p>W niektórych architekturach, zamiast dedykowanego workera odpytującego tabelę outbox (polling), używa się <strong>CDC</strong> (np. Debezium z Kafka Connect) - narzędzia, które <strong>nasłuchuje bezpośrednio na logu transakcyjnym bazy danych</strong> i automatycznie publikuje zmiany do Kafki, bez potrzeby pisania własnego <code>BackgroundService</code>. To rozwiązuje ten sam problem (dual write), ale przenosi odpowiedzialność za "publikowanie" do infrastruktury, nie do kodu aplikacji.</p>
<h2>Podsumowanie - relacja Outbox ↔ Saga</h2>
<blockquote>
<p>Outbox Pattern rozwiązuje <strong>fundamentalny problem inżynierski</strong> leżący pod każdą implementacją Sagi w stylu Choreography: jak <strong>atomowo</strong> zapisać zmianę stanu <strong>i</strong> opublikować odpowiadające jej zdarzenie, gdy te dwie operacje dotyczą <strong>różnych</strong> systemów (baza danych vs broker wiadomości). Rozwiązanie: zapisz zdarzenie jako wiersz w tabeli <strong>tej samej</strong> bazy danych, w <strong>tej samej</strong> transakcji co dane biznesowe (<code>SaveChangesAsync()</code> gwarantuje atomowość), a osobny proces w tle (<code>BackgroundService</code>) asynchronicznie publikuje te zdarzenia do brokera, z retry w przypadku niepowodzenia. To jest jeden z fundamentalnych "cegiełek" niezbędnych, żeby Saga Choreography działała bezpiecznie w praktyce.</p>
</blockquote>

  { id:"reference-data", title:"Dane słownikowe między mikroserwisami", tags:"reference data słowniki denormalizacja synchroniczne odpytywanie cache ttl",
  body:`
  <h1>Zarządzanie danymi referencyjnymi/słownikowymi w architekturze mikroserwisów</h1>
<h2>Problem - dane słownikowe potrzebne w wielu serwisach</h2>
<p>Dane referencyjne (np. lista krajów, statusów zamówień, kategorii produktów, kursy walut) są potrzebne w <strong>wielu</strong> mikroserwisach naraz - <code>OrderService</code> potrzebuje statusów zamówień, <code>PaymentService</code> potrzebuje kursów walut, <code>ShippingService</code> potrzebuje listy krajów. Pytanie: <strong>gdzie te dane powinny "żyć"</strong> i jak każdy serwis ma do nich dostęp?</p>
<h2>Podejście #1 - dedykowany serwis danych referencyjnych + synchroniczne wywołania</h2>
<pre><code class="language-csharp">public interface IReferenceDataClient
{
    Task&lt;List&lt;CountryDto&gt;&gt; GetCountriesAsync();
    Task&lt;string&gt; GetCurrencyRateAsync(string code);
}
</code></pre>
<pre><code class="language-csharp">public class ReferenceDataClient : IReferenceDataClient
{
    private readonly HttpClient _httpClient;

    public async Task&lt;List&lt;CountryDto&gt;&gt; GetCountriesAsync()
    {
        return await _httpClient.GetFromJsonAsync&lt;List&lt;CountryDto&gt;&gt;(&quot;api/reference/countries&quot;);
    }
}
</code></pre>
<p><strong>Zaleta:</strong> jedno źródło prawdy (single source of truth) - dane zawsze aktualne, bez ryzyka niespójności między serwisami.</p>
<p><strong>Wada:</strong> każde wywołanie wymaga <strong>synchronicznego</strong> requestu do innego serwisu - jeśli <code>ReferenceDataService</code> jest wolny/niedostępny, <strong>wszystkie</strong> serwisy zależne od niego są tym obciążone (klasyczny problem <strong>kaskadowej awarii</strong> w mikroserwisach).</p>
<h2>Podejście #2 - lokalna replikacja (caching) danych referencyjnych w każdym serwisie</h2>
<p>To jest <strong>znacznie częstsze</strong> podejście w praktyce - każdy serwis <strong>przechowuje własną, lokalną kopię</strong> danych referencyjnych, zsynchronizowaną asynchronicznie:</p>
<pre><code class="language-csharp">public class OrderService
{
    private readonly IMemoryCache _cache;
    private readonly IReferenceDataClient _referenceDataClient;

    public async Task&lt;List&lt;CountryDto&gt;&gt; GetCountriesAsync()
    {
        return await _cache.GetOrCreateAsync(&quot;countries&quot;, async entry =&gt;
        {
            entry.AbsoluteExpirationRelativeToNow = TimeSpan.FromHours(1); // cache na godzinę
            return await _referenceDataClient.GetCountriesAsync();
        });
    }
}
</code></pre>
<p><strong>Zaleta:</strong> brak zależności synchronicznej od innego serwisu przy każdym requeście - odczyt z lokalnego cache jest natychmiastowy.</p>
<p><strong>Wada:</strong> dane mogą być <strong>przez chwilę nieaktualne</strong> (eventual consistency) - jeśli status "Pending" zmieni nazwę na "Oczekujące", serwisy z cache będą pokazywać starą nazwę do wygaśnięcia cache'a.</p>
<h2>Podejście #3 - propagacja przez zdarzenia (Event-Driven Reference Data)</h2>
<p>To jest podejście <strong>łączące</strong> poprzednie dwa, wykorzystujące dokładnie ten sam mechanizm publikowania zdarzeń, o którym mówiliśmy przy Sadze i Outboxie:</p>
<pre><code class="language-csharp">// ReferenceDataService publikuje zdarzenie przy KAŻDEJ zmianie danych referencyjnych
public async Task UpdateCountryAsync(int id, string newName)
{
    var country = await _context.Countries.FindAsync(id);
    country.Name = newName;
    await _context.SaveChangesAsync();

    await _eventBus.PublishAsync(new CountryUpdatedEvent(id, newName)); // + Outbox Pattern dla atomowości!
}

// KAŻDY zainteresowany serwis nasłuchuje i AKTUALIZUJE swoją LOKALNĄ kopię
public class CountryUpdatedHandler
{
    public async Task Handle(CountryUpdatedEvent evt)
    {
        var localCountry = await _context.LocalCountryReplicas.FindAsync(evt.CountryId);
        localCountry.Name = evt.NewName;
        await _context.SaveChangesAsync(); // LOKALNA replika, w bazie TEGO serwisu
    }
}
</code></pre>
<p><strong>Zaleta:</strong> brak synchronicznej zależności między serwisami (odczyt zawsze z lokalnej bazy), a jednocześnie dane są <strong>względnie szybko</strong> (nie natychmiast, ale sekundy, nie godziny jak przy zwykłym cache TTL) propagowane po zmianie, bez czekania na wygaśnięcie cache'a.</p>
<p><strong>Wada:</strong> więcej infrastruktury (broker wiadomości, obsługa zdarzeń w każdym serwisie), oraz każdy serwis <strong>duplikuje</strong> dane referencyjne we własnej bazie.</p>
<h2>Kiedy które podejście</h2>
<table>
<thead>
<tr>
<th>Podejście</th>
<th>Kiedy stosować</th>
</tr>
</thead>
<tbody>
<tr>
<td>Synchroniczne wywołania (bez cache)</td>
<td>Dane rzadko odpytywane, wymóg absolutnej świeżości, tolerancja na zależność między serwisami</td>
</tr>
<tr>
<td>Lokalny cache z TTL</td>
<td>Dane zmieniają się rzadko, akceptowalna chwilowa nieaktualność (minuty/godziny)</td>
</tr>
<tr>
<td>Propagacja przez zdarzenia + lokalna replika</td>
<td>Dane potrzebne bardzo często (każdy request), wymagana niezależność od dostępności innego serwisu, ale też względna świeżość</td>
</tr>
</tbody>
</table>
<h2>Ważna zasada - dane referencyjne "właścicielem" jednego serwisu</h2>
<p>Niezależnie od podejścia synchronizacji, <strong>jeden konkretny serwis</strong> powinien być <strong>właścicielem (source of truth)</strong> danego zestawu danych referencyjnych - inne serwisy <strong>czytają</strong> (i ewentualnie cache'ują/replikują), ale <strong>nie modyfikują</strong> tych danych bezpośrednio w swojej bazie. To jest analogiczne do zasady "jeden Bounded Context = jeden właściciel danych" z Domain-Driven Design.</p>
<h2>Podsumowanie</h2>
<blockquote>
<p>W architekturze mikroserwisów dane referencyjne wymagają świadomej decyzji o kompromisie między <strong>świeżością danych</strong> i <strong>niezależnością serwisów</strong>. Synchroniczne wywołania dają zawsze aktualne dane, ale tworzą zależność czasową między serwisami. Lokalny cache z TTL eliminuje tę zależność, kosztem chwilowej nieaktualności. Propagacja przez zdarzenia (wykorzystująca ten sam Outbox Pattern, o którym mówiliśmy) daje najlepszy kompromis dla danych często odpytywanych - lokalna replika bez zależności synchronicznej, z względnie szybką propagacją zmian.</p>
</blockquote>
