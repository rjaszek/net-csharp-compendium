  body:`
  <h1>Modyfikatory dziedziczenia/polimorfizmu w C</h1>
<h2><code>virtual</code> - metoda z domyślną implementacją, opcjonalnie nadpisywalna</h2>
<pre><code class="language-csharp">public class OrderProcessor
{
    public virtual void Process(Order order)
    {
        Console.WriteLine(&quot;Standardowe przetwarzanie&quot;);
    }
}

public class PriorityOrderProcessor : OrderProcessor
{
    public override void Process(Order order) // nadpisanie OPCJONALNE
    {
        Console.WriteLine(&quot;Priorytetowe&quot;);
        base.Process(order); // można wywołać oryginalną implementację
    }
}
</code></pre>
<p>Klasa pochodna <strong>może, ale nie musi</strong> nadpisać - jeśli nie nadpisze, dziedziczy zachowanie bazowe. Wiązanie <strong>dynamiczne</strong> (polimorfizm) - o wersji metody decyduje faktyczny typ obiektu w runtime, nie typ zmiennej.</p>
<h2><code>abstract</code> - metoda bez implementacji, WYMUSZONE nadpisanie</h2>
<pre><code class="language-csharp">public abstract class OrderProcessorBase
{
    public abstract void Process(Order order); // brak ciała - żadnej implementacji
}

public class StandardOrderProcessor : OrderProcessorBase
{
    public override void Process(Order order) // MUSI nadpisać, inaczej błąd kompilacji
    {
        Console.WriteLine(&quot;Przetwarzanie&quot;);
    }
}
</code></pre>
<p>Klasa zawierająca metodę <code>abstract</code> <strong>sama musi być <code>abstract</code></strong> - nie da się jej zainstancjonować (<code>new OrderProcessorBase()</code> to błąd kompilacji). Jak omawialiśmy przy Inversion of Control - to fundament Template Method Pattern.</p>
<h2><code>override</code> - faktyczne nadpisanie metody <code>virtual</code>/<code>abstract</code></h2>
<pre><code class="language-csharp">public class Base
{
    public virtual void Method() =&gt; Console.WriteLine(&quot;Base&quot;);
}

public class Derived : Base
{
    public override void Method() =&gt; Console.WriteLine(&quot;Derived&quot;); // NADPISUJE, nie ukrywa
}
</code></pre>
<pre><code class="language-csharp">Base obj = new Derived();
obj.Method(); // &quot;Derived&quot; - wiązanie DYNAMICZNE, decyduje faktyczny typ obiektu w runtime
</code></pre>
<p>Wymagania: ta sama sygnatura (nazwa, parametry, typ zwracany), widoczność nie może być zawężona względem metody bazowej.</p>
<h2><code>sealed</code> - blokada dalszego nadpisywania/dziedziczenia</h2>
<p><strong>Na metodzie</strong> (musi być połączone z <code>override</code>) - "zapieczętowuje" konkretne nadpisanie, blokując kolejne poziomy:</p>
<pre><code class="language-csharp">public class Base
{
    public virtual void Method() { }
}

public class Middle : Base
{
    public sealed override void Method() { } // ostatnie możliwe nadpisanie w łańcuchu
}

public class Derived : Middle
{
    public override void Method() { } // ❌ Błąd - Method jest sealed w Middle
}
</code></pre>
<p><strong>Na klasie</strong> - blokuje całe dziedziczenie:</p>
<pre><code class="language-csharp">public sealed class OrderValidator
{
    public void Validate(Order order) { }
}

public class CustomValidator : OrderValidator { } // ❌ Błąd - nie można dziedziczyć po sealed class
</code></pre>
<p>Dobra praktyka: klasy nieprzemyślane pod kątem dziedziczenia (bez <code>virtual</code> zaplanowanego świadomie) warto oznaczać jako <code>sealed</code>, żeby uniknąć nieprzewidzianych problemów przy próbie rozszerzenia.</p>
<h2><code>new</code> - ukrywanie metody (method hiding), NIE nadpisywanie</h2>
<pre><code class="language-csharp">public class Base
{
    public void Show() =&gt; Console.WriteLine(&quot;Base&quot;); // BRAK virtual
}

public class Derived : Base
{
    public new void Show() =&gt; Console.WriteLine(&quot;Derived&quot;); // &quot;new&quot; zamiast &quot;override&quot;
}
</code></pre>
<pre><code class="language-csharp">Base obj = new Derived();
obj.Show(); // &quot;Base&quot;! - wiązanie STATYCZNE, decyduje typ ZMIENNEJ w compile-time

Derived obj2 = new Derived();
obj2.Show(); // &quot;Derived&quot; - bo typ zmiennej to Derived
</code></pre>
<p><strong>To jest klasyczna pułapka na rozmowie</strong> - <code>new</code> <strong>ukrywa</strong> metodę bazową zamiast jej nadpisywać. W przeciwieństwie do <code>override</code> (wiązanie dynamiczne - decyduje faktyczny typ obiektu), <code>new</code> to wiązanie <strong>statyczne</strong> - decyduje typ zmiennej, przez którą wywołujesz metodę, niezależnie od faktycznego typu obiektu w pamięci.</p>
<h2>Tabela zbiorcza modyfikatorów dziedziczenia</h2>
<table>
<thead>
<tr>
<th>Modyfikator</th>
<th>Wymaga bazowej <code>virtual</code>/<code>abstract</code>?</th>
<th>Implementacja w bazie?</th>
<th>Nadpisanie wymagane?</th>
<th>Wiązanie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>virtual</code> (na bazowej)</td>
<td>-</td>
<td>Tak</td>
<td>Opcjonalne (<code>override</code>)</td>
<td>Dynamiczne</td>
</tr>
<tr>
<td><code>abstract</code> (na bazowej)</td>
<td>-</td>
<td>Nie</td>
<td>Wymagane</td>
<td>Dynamiczne</td>
</tr>
<tr>
<td><code>override</code> (na pochodnej)</td>
<td>Tak</td>
<td>-</td>
<td>To JEST nadpisanie</td>
<td>Dynamiczne</td>
</tr>
<tr>
<td><code>sealed override</code> (na pochodnej)</td>
<td>Tak</td>
<td>-</td>
<td>Blokuje DALSZE nadpisania</td>
<td>Dynamiczne, zamrożone</td>
</tr>
<tr>
<td><code>new</code> (na pochodnej)</td>
<td>Nie (działa nawet bez <code>virtual</code>)</td>
<td>-</td>
<td>Nie nadpisuje, tylko ukrywa</td>
<td>Statyczne</td>
</tr>
</tbody>
</table>
<h2>Jak te dwie kategorie się łączą - pełny przykład</h2>
<pre><code class="language-csharp">public abstract class ViewModelBase // klasa: nie można instancjonować bezpośrednio
{
    protected readonly ILogger _logger; // private/protected - modyfikator DOSTĘPU

    protected ViewModelBase(ILogger logger) =&gt; _logger = logger;

    // protected + virtual: widoczne dla podklas (dostęp) ORAZ opcjonalnie nadpisywalne (dziedziczenie)
    protected virtual void OnPropertyChanged(string propertyName) { }

    // public + abstract: widoczne wszędzie (dostęp) ORAZ WYMUSZA nadpisanie (dziedziczenie)
    public abstract void Refresh();
}

public sealed class OrderViewModel : ViewModelBase // sealed: nikt nie może dziedziczyć DALEJ po tej klasie
{
    public OrderViewModel(ILogger logger) : base(logger) { }

    public override void Refresh() { /* wymagana implementacja */ }

    protected override void OnPropertyChanged(string propertyName)
    {
        Console.WriteLine($&quot;Zmiana: {propertyName}&quot;);
        base.OnPropertyChanged(propertyName);
    }
}
</code></pre>
<p>To pokazuje, że <strong>modyfikator dostępu i modyfikator dziedziczenia to dwie niezależne, ortogonalne decyzje</strong> przy projektowaniu każdej metody - pierwsza odpowiada "kto może to zobaczyć", druga "czy i jak można to zmienić w podklasach".</p>
<hr />
<h1>Kiedy metoda może być nadpisana (override) w C</h1>
<h2>Warunek podstawowy - <code>virtual</code>, <code>abstract</code> lub <code>override</code> w klasie bazowej</h2>
<p>Metoda <strong>musi być jawnie oznaczona</strong> jako możliwa do nadpisania - w C#, w przeciwieństwie do np. Javy, <strong>domyślnie metody NIE są nadpisywalne</strong>.</p>
<pre><code class="language-csharp">public class Animal
{
    public void MakeSound() // zwykła metoda - NIE da się nadpisać
    {
        Console.WriteLine(&quot;Jakiś dźwięk&quot;);
    }

    public virtual void Move() // virtual - MOŻNA nadpisać
    {
        Console.WriteLine(&quot;Porusza się&quot;);
    }
}

public class Dog : Animal
{
    // ❌ Błąd kompilacji - MakeSound nie jest virtual, nie można użyć override
    public override void MakeSound() { }

    // ✅ OK - Move jest virtual w klasie bazowej
    public override void Move()
    {
        Console.WriteLine(&quot;Biegnie&quot;);
    }
}
</code></pre>
<h2>Warunki, które MUSZĄ być spełnione przy <code>override</code></h2>
<h3>Ta sama sygnatura (nazwa, parametry, typ zwracany)</h3>
<pre><code class="language-csharp">public class Base
{
    public virtual int Calculate(int x) =&gt; x * 2;
}

public class Derived : Base
{
    // ❌ Błąd - inna sygnatura (inny typ parametru) to NIE override, to OVERLOAD (przeciążenie)
    public override int Calculate(double x) =&gt; (int)(x * 2); // nie skompiluje się z &quot;override&quot;

    // ✅ OK - dokładnie ta sama sygnatura
    public override int Calculate(int x) =&gt; x * 3;
}
</code></pre>
<h3>Widoczność (dostępność) nie może być zawężona</h3>
<pre><code class="language-csharp">public class Base
{
    public virtual void DoWork() { }
}

public class Derived : Base
{
    protected override void DoWork() { } // ❌ Błąd - nie można zmniejszyć dostępności z public na protected
    public override void DoWork() { }    // ✅ OK - taka sama lub szersza widoczność
}
</code></pre>
<h2>Żaden modyfikator dostępu nie wymusza nadpisania - to częsta pułapka pojęciowa</h2>
<p>To pytanie miesza dwie <strong>różne kategorie</strong> modyfikatorów w C#, które łatwo pomylić.</p>
<p><strong>Modyfikatory dostępu (access modifiers)</strong> - kontrolują <strong>widoczność</strong> (kto może zobaczyć/wywołać): <code>public, private, protected, internal, protected internal, private protected</code></p>
<p><strong>Modyfikatory dziedziczenia/polimorfizmu (inheritance modifiers)</strong> - kontrolują <strong>czy i jak metoda może być nadpisana</strong>: <code>virtual, abstract, override, sealed, new</code></p>
<p>To są <strong>zupełnie osobne osie</strong> - możesz je łączyć ze sobą, ale żaden modyfikator dostępu <strong>sam z siebie</strong> nie wymusza nadpisania.</p>
<p><code>abstract</code> to modyfikator z <strong>drugiej kategorii</strong> (dziedziczenia), nie modyfikator dostępu. Możesz go <strong>łączyć</strong> z dowolnym modyfikatorem dostępu:</p>
<pre><code class="language-csharp">public abstract void Process(Order order);      // publiczne, wymuszone nadpisanie
protected abstract void Validate(Order order);   // chronione, wymuszone nadpisanie
</code></pre>
<p><strong><code>private</code> + <code>virtual</code>/<code>abstract</code> to błąd kompilacji:</strong></p>
<pre><code class="language-csharp">public class Base
{
    private virtual void DoWork() { } // ❌ Błąd kompilacji: &quot;virtual member cannot be private&quot;
}
</code></pre>
<p><code>private</code> oznacza "niewidoczne poza tą klasą", więc klasa pochodna <strong>nie może nawet zobaczyć</strong> tej metody, a co dopiero ją nadpisać. Modyfikator dostępu <strong>ogranicza możliwości</strong> modyfikatora dziedziczenia, ale go nie zastępuje.</p>
<h2>Podsumowanie - poprawna odpowiedź na to pytanie</h2>
<blockquote>
<p><strong>Żaden modyfikator dostępu (<code>public</code>/<code>protected</code>/<code>private</code>/<code>internal</code>) nie wymusza nadpisania - to nie jest ich rola.</strong> Modyfikator dostępu odpowiada na pytanie "kto może to zobaczyć/wywołać". Wymuszenie nadpisania to rola modyfikatora <code>abstract</code> (osobna kategoria - modyfikator dziedziczenia), który można łączyć z dowolnym modyfikatorem dostępu poza <code>private</code> (bo <code>private</code> czyni metodę niewidoczną dla klas pochodnych, więc nadpisanie byłoby niemożliwe fizycznie).</p>
</blockquote>
  
  `},

  { id:"lock-mutex-semaphore", title:"lock, Mutex, Semaphore", tags:"lock mutex semaphore semaphoreslim thread synchronization async",
  body:`
  <h1><code>lock</code>, <code>Mutex</code>, <code>Semaphore</code> - synchronizacja w C</h1>
<p>To nawiązuje wprost do tematu thread-safety, o którym mówiliśmy przy Singletonach - wszystkie trzy mechanizmy służą do <strong>kontrolowania dostępu wielu wątków do współdzielonego zasobu</strong>, ale różnią się zasięgiem, semantyką i kosztem.</p>
<h2><code>lock</code> - najprostszy, w ramach jednego procesu</h2>
<p><code>lock</code> to <strong>cukier składniowy</strong> nad <code>Monitor.Enter</code>/<code>Monitor.Exit</code> - zapewnia, że <strong>tylko jeden wątek naraz</strong> może wykonywać dany blok kodu.</p>
<pre><code class="language-csharp">public class CounterService
{
    private readonly object _lockObject = new object();
    private int _count = 0;

    public void Increment()
    {
        lock (_lockObject) // tylko JEDEN wątek na raz może wejść do tego bloku
        {
            _count++;
        }
    }
}
</code></pre>
<p>To dokładnie rozwiązanie, o którym wspominałem przy race condition z <code>_count++</code> - <code>lock</code> gwarantuje, że cała operacja odczyt-dodaj-zapisz wykona się <strong>atomowo</strong> względem innych wątków próbujących wejść w ten sam <code>lock</code>.</p>
<p><strong>Co dzieje się "pod spodem":</strong></p>
<pre><code class="language-csharp">// lock (_lockObject) { _count++; } kompiluje się w przybliżeniu do:
bool lockTaken = false;
try
{
    Monitor.Enter(_lockObject, ref lockTaken);
    _count++;
}
finally
{
    if (lockTaken) Monitor.Exit(_lockObject);
}
</code></pre>
<p><strong>Kluczowe ograniczenia <code>lock</code>:</strong>
- Działa <strong>tylko w ramach jednego procesu</strong> (jednej aplikacji) - inny proces nie ma jak "zobaczyć" tego locka
- Blokuje <strong>dokładnie jeden</strong> wątek na raz (jak <code>Mutex</code> z licznikiem 1, ale bez możliwości konfiguracji)
- <strong>Nie da się użyć <code>await</code> wewnątrz <code>lock</code></strong> - to jest częsta pułapka na rozmowie:</p>
<pre><code class="language-csharp">lock (_lockObject)
{
    await SomeAsyncMethod(); // ❌ Błąd kompilacji: &quot;cannot await in the body of a lock statement&quot;
}
</code></pre>
<p>To ograniczenie wynika z tego, że <code>lock</code> musi być zwolniony <strong>na tym samym wątku</strong>, który go zajął - <code>await</code> może wznowić wykonanie na <strong>innym</strong> wątku (jak omawialiśmy przy <code>SynchronizationContext</code>), co złamałoby tę gwarancję.</p>
<h2>Mutex - jak <code>lock</code>, ale między procesami</h2>
<p><code>Mutex</code> (Mutual Exclusion) to synchronizacja <strong>na poziomie systemu operacyjnego</strong> - może działać nie tylko między wątkami w jednym procesie, ale <strong>między różnymi procesami</strong> na tym samym komputerze.</p>
<pre><code class="language-csharp">// Named Mutex - widoczny dla WSZYSTKICH procesów w systemie pod tą nazwą
using var mutex = new Mutex(false, &quot;Global\\\\MyApp_SingleInstanceMutex&quot;);

if (mutex.WaitOne(TimeSpan.Zero)) // próbuj przejąć mutex, nie czekaj długo
{
    try
    {
        // Tylko JEDNA instancja aplikacji w całym systemie wykona ten kod naraz
        RunApplication();
    }
    finally
    {
        mutex.ReleaseMutex(); // MUSISZ zwolnić ręcznie
    }
}
else
{
    Console.WriteLine(&quot;Aplikacja już działa!&quot;);
}
</code></pre>
<p><strong>Klasyczne zastosowanie</strong> - wymuszenie <strong>jednej instancji aplikacji</strong> na komputerze (Named Mutex widoczny globalnie w systemie):</p>
<pre><code class="language-csharp">static void Main()
{
    using var mutex = new Mutex(true, &quot;Global\\\\MyWpfApp&quot;, out bool isNewInstance);
    if (!isNewInstance)
    {
        MessageBox.Show(&quot;Aplikacja już jest uruchomiona!&quot;);
        return; // zamknij tę drugą instancję
    }
    // normalny start aplikacji WPF
}
</code></pre>
<p><strong>Ważna różnica względem <code>lock</code> - kto może zwolnić:</strong></p>
<pre><code class="language-csharp">mutex.ReleaseMutex(); // MUSI być wywołane przez TEN SAM wątek, który wywołał WaitOne()
// inaczej: SynchronizationLockException
</code></pre>
<p><strong>Koszt:</strong> <code>Mutex</code> jest <strong>znacznie wolniejszy</strong> niż <code>lock</code>, bo wymaga przejścia przez jądro systemu operacyjnego (kernel-mode) nawet przy braku rywalizacji o zasób - <code>lock</code>/<code>Monitor</code> w braku rywalizacji działa <strong>całkowicie w user-mode</strong>, bez wołania systemu operacyjnego, stąd jest szybszy.</p>
<h2>Semaphore/SemaphoreSlim - pozwala na WIELE równoczesnych wątków (nie tylko jeden)</h2>
<p>To jest <strong>fundamentalna różnica koncepcyjna</strong> względem <code>lock</code>/<code>Mutex</code> - semafor <strong>nie ogranicza do jednego wątku</strong>, tylko do <strong>określonej liczby</strong> równoczesnych wątków.</p>
<pre><code class="language-csharp">// Maksymalnie 3 wątki mogą jednocześnie wykonywać kod chroniony semaforem
private readonly SemaphoreSlim _semaphore = new SemaphoreSlim(3, 3); // (początkowa liczba miejsc, maksymalna)

public async Task ProcessOrderAsync(Order order)
{
    await _semaphore.WaitAsync(); // czeka, aż zwolni się &quot;miejsce&quot;
    try
    {
        await CallExternalApiAsync(order); // np. limit 3 równoczesnych requestów do zewnętrznego API
    }
    finally
    {
        _semaphore.Release(); // zwalnia &quot;miejsce&quot; dla kolejnego wątku
    }
}
</code></pre>
<p><strong>Klasyczne zastosowanie: ograniczanie liczby równoczesnych operacji</strong> (throttling) - np. gdy zewnętrzne API pozwala na maksymalnie N równoczesnych requestów:</p>
<pre><code class="language-csharp">private readonly SemaphoreSlim _apiThrottle = new SemaphoreSlim(5); // max 5 naraz

public async Task&lt;List&lt;OrderDto&gt;&gt; FetchAllOrdersAsync(List&lt;int&gt; orderIds)
{
    var tasks = orderIds.Select(async id =&gt;
    {
        await _apiThrottle.WaitAsync();
        try
        {
            return await _httpClient.GetFromJsonAsync&lt;OrderDto&gt;($&quot;api/orders/{id}&quot;);
        }
        finally
        {
            _apiThrottle.Release();
        }
    });

    return (await Task.WhenAll(tasks)).ToList();
}
</code></pre>
<p>Mimo że startujesz np. 100 requestów naraz (<code>Task.WhenAll</code>), semafor gwarantuje, że <strong>maksymalnie 5</strong> z nich faktycznie wykonuje się równocześnie - reszta czeka w kolejce na <code>WaitAsync()</code>.</p>
<h3><code>SemaphoreSlim</code> vs <code>Semaphore</code> - która wersja</h3>
<pre><code class="language-csharp">var semaphoreSlim = new SemaphoreSlim(3);  // ✅ preferowany - lekki, tylko w ramach procesu, wspiera async
var semaphore = new Semaphore(3, 3, &quot;Global\\\\MySemaphore&quot;); // named, między procesami, ale WOLNIEJSZY
</code></pre>
<p><code>SemaphoreSlim</code> (dodany w .NET 4) jest <strong>lżejszy</strong> i <strong>wspiera <code>WaitAsync()</code></strong> (kluczowe - w przeciwieństwie do <code>lock</code>, semafor <strong>można</strong> bezpiecznie łączyć z <code>await</code>), ale działa tylko w ramach jednego procesu. Zwykły <code>Semaphore</code> może być named (między procesami, jak <code>Mutex</code>), ale jest znacznie wolniejszy.</p>
<p><strong>To jest zresztą kluczowa praktyczna zaleta semafora nad <code>lock</code> w kodzie asynchronicznym:</strong></p>
<pre><code class="language-csharp">// ❌ lock - NIE MOŻNA użyć await w środku
lock (_lockObject) { await SomeAsyncMethod(); } // błąd kompilacji

// ✅ SemaphoreSlim - MOŻNA używać await
await _semaphore.WaitAsync();
try { await SomeAsyncMethod(); } // OK!
finally { _semaphore.Release(); }
</code></pre>
<p>To jest zresztą częsty powód, dla którego w nowoczesnym, asynchronicznym kodzie .NET (Web API) używa się <code>SemaphoreSlim(1, 1)</code> <strong>zamiast</strong> <code>lock</code>, gdy chroniony kod musi zawierać <code>await</code>:</p>
<pre><code class="language-csharp">private readonly SemaphoreSlim _semaphore = new SemaphoreSlim(1, 1); // odpowiednik &quot;async lock&quot;

public async Task UpdateCacheAsync()
{
    await _semaphore.WaitAsync();
    try
    {
        var freshData = await _apiClient.GetDataAsync(); // await wewnątrz - niemożliwe z lock
        _cache = freshData;
    }
    finally
    {
        _semaphore.Release();
    }
}
</code></pre>
<h2>Tabela porównawcza</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>lock</code></th>
<th><code>Mutex</code></th>
<th><code>Semaphore</code>/<code>SemaphoreSlim</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Ile wątków naraz</td>
<td>1</td>
<td>1</td>
<td>N (konfigurowalne)</td>
</tr>
<tr>
<td>Zasięg</td>
<td>Jeden proces</td>
<td>Może być między procesami (named)</td>
<td><code>SemaphoreSlim</code>: jeden proces; <code>Semaphore</code>: może być named</td>
</tr>
<tr>
<td>Wsparcie dla <code>await</code></td>
<td>❌ Nie</td>
<td>❌ Nie (<code>WaitOne</code> blokujący)</td>
<td>✅ Tak (<code>WaitAsync</code> w <code>SemaphoreSlim</code>)</td>
</tr>
<tr>
<td>Wydajność</td>
<td>Najszybszy (user-mode)</td>
<td>Wolniejszy (kernel-mode)</td>
<td><code>SemaphoreSlim</code>: szybki; <code>Semaphore</code>: wolniejszy</td>
</tr>
<tr>
<td>Kto może zwolnić</td>
<td>Musi być ten sam wątek (przez <code>lock</code>/<code>Monitor</code>)</td>
<td>Musi być ten sam wątek</td>
<td>Może zwolnić INNY wątek niż ten, który czekał</td>
</tr>
<tr>
<td>Typowe zastosowanie</td>
<td>Ochrona współdzielonego stanu w pamięci (jak <code>_count</code> w Singletonie)</td>
<td>Jedna instancja aplikacji, synchronizacja między procesami</td>
<td>Throttling/limit równoczesnych operacji (np. requestów HTTP)</td>
</tr>
</tbody>
</table>
<h2>Nawiązanie do wcześniejszej rozmowy o Singleton/thread-safety</h2>
<p>Jeśli masz Singleton z mutowalnym stanem:</p>
<pre><code class="language-csharp">public class CacheService // zarejestrowany jako Singleton
{
    private readonly Dictionary&lt;string, object&gt; _cache = new(); // NIE thread-safe samo z siebie
    private readonly SemaphoreSlim _lock = new SemaphoreSlim(1, 1);

    public async Task&lt;object&gt; GetOrAddAsync(string key, Func&lt;Task&lt;object&gt;&gt; factory)
    {
        if (_cache.TryGetValue(key, out var cached)) return cached;

        await _lock.WaitAsync();
        try
        {
            if (_cache.TryGetValue(key, out cached)) return cached; // double-check po wejściu do sekcji krytycznej

            var value = await factory(); // await wewnątrz - dlatego SemaphoreSlim, nie lock
            _cache[key] = value;
            return value;
        }
        finally
        {
            _lock.Release();
        }
    }
}
</code></pre>
<p>To jest <strong>realny wzorzec</strong> ("double-checked locking" z asynchronicznym semaforem) - dokładnie ten typ kodu, który musisz napisać poprawnie, gdy Singleton ma mutowalny, współdzielony stan <strong>i</strong> wymaga operacji asynchronicznych przy jego modyfikacji.</p>
<h2>Podsumowanie - kiedy który</h2>
<blockquote>
<p><strong><code>lock</code></strong> - domyślny wybór dla prostej ochrony sekcji krytycznej <strong>bez</strong> <code>await</code> w środku, w ramach jednego procesu - najszybszy.
<strong><code>Mutex</code></strong> - gdy potrzebujesz synchronizacji <strong>między procesami</strong> (np. jedna instancja aplikacji) - rzadziej używany w typowym kodzie aplikacyjnym.
<strong><code>SemaphoreSlim</code></strong> - gdy potrzebujesz <strong>(a)</strong> ograniczyć liczbę równoczesnych operacji do więcej niż jednej (throttling), <strong>lub (b)</strong> chronić sekcję kodu, która zawiera <code>await</code> (wtedy nawet z limitem 1, jako "async-friendly lock").</p>
</blockquote>
  
  `},

  { id:"struct", title:"struct", tags:"struct value type stack boxing readonly struct",
  body:`
  <h1><code>struct</code> w C</h1>
<h2>Fundamentalna różnica - typ wartościowy vs referencyjny</h2>
<p>To jest <strong>najważniejsza</strong> rzecz do zrozumienia - <code>struct</code> to <strong>typ wartościowy</strong> (value type), w przeciwieństwie do <code>class</code>, która jest <strong>typem referencyjnym</strong> (reference type).</p>
<pre><code class="language-csharp">public struct Point
{
    public int X { get; set; }
    public int Y { get; set; }
}

public class PointClass
{
    public int X { get; set; }
    public int Y { get; set; }
}
</code></pre>
<h2>Gdzie żyją w pamięci - stos vs sterta</h2>
<pre><code class="language-csharp">Point p1 = new Point { X = 1, Y = 2 }; // żyje na STOSIE (zazwyczaj, patrz niżej o wyjątkach)
PointClass c1 = new PointClass { X = 1, Y = 2 }; // c1 to referencja NA STOSIE, obiekt NA STERCIE
</code></pre>
<p><strong>Struct</strong> - dane przechowywane <strong>bezpośrednio w miejscu, gdzie zmienna jest zadeklarowana</strong> (na stosie, jeśli to zmienna lokalna; wewnątrz obiektu, jeśli to pole klasy).</p>
<p><strong>Class</strong> - zmienna to <strong>referencja</strong> (wskaźnik) do obiektu żyjącego na stercie; sama referencja jest mała (jak wskaźnik), ale prawdziwe dane są gdzie indziej.</p>
<h2>Kluczowa konsekwencja - kopiowanie przez wartość</h2>
<pre><code class="language-csharp">public struct Point { public int X { get; set; } public int Y { get; set; } }

Point p1 = new Point { X = 1, Y = 2 };
Point p2 = p1; // KOPIUJE całą strukturę - p2 to NIEZALEŻNA kopia

p2.X = 100;

Console.WriteLine(p1.X); // 1 - p1 się NIE zmieniło!
Console.WriteLine(p2.X); // 100
</code></pre>
<pre><code class="language-csharp">public class PointClass { public int X { get; set; } public int Y { get; set; } }

PointClass c1 = new PointClass { X = 1, Y = 2 };
PointClass c2 = c1; // KOPIUJE tylko REFERENCJĘ - c1 i c2 wskazują na TEN SAM obiekt

c2.X = 100;

Console.WriteLine(c1.X); // 100 - c1 TEŻ się zmieniło! To ten sam obiekt
Console.WriteLine(c2.X); // 100
</code></pre>
<p>To jest <strong>fundamentalna</strong> różnica, o której trzeba pamiętać - przypisanie struct <strong>kopiuje cały obiekt</strong>, przypisanie class <strong>kopiuje tylko referencję</strong>.</p>
<h2>To samo dotyczy przekazywania do metod</h2>
<pre><code class="language-csharp">void ModifyStruct(Point p) { p.X = 999; } // otrzymuje KOPIĘ

var point = new Point { X = 1 };
ModifyStruct(point);
Console.WriteLine(point.X); // 1 - oryginał niezmieniony, metoda dostała kopię

void ModifyClass(PointClass c) { c.X = 999; } // otrzymuje REFERENCJĘ do tego samego obiektu

var pointClass = new PointClass { X = 1 };
ModifyClass(pointClass);
Console.WriteLine(pointClass.X); // 999 - oryginał ZMIENIONY, bo to ta sama referencja
</code></pre>
<p><strong>Wyjątek - przekazanie przez <code>ref</code>:</strong></p>
<pre><code class="language-csharp">void ModifyStructByRef(ref Point p) { p.X = 999; }

var point = new Point { X = 1 };
ModifyStructByRef(ref point);
Console.WriteLine(point.X); // 999 - TERAZ się zmieniło, bo przekazaliśmy referencję do struktury
</code></pre>
<h2>Wbudowane typy .NET, które są <code>struct</code> - częściej używasz ich niż myślisz</h2>
<p>Większość <strong>prymitywnych typów</strong> w C# to w rzeczywistości <code>struct</code>:</p>
<pre><code class="language-csharp">int, double, decimal, bool, char, DateTime, TimeSpan, Guid // WSZYSTKIE to struct!
</code></pre>
<pre><code class="language-csharp">int a = 5;
int b = a; // kopiowanie przez wartość - dokładnie ta sama semantyka co Point wyżej
b = 10;
Console.WriteLine(a); // 5 - niezmienione
</code></pre>
<p>To wyjaśnia, dlaczego <code>int</code>/<code>double</code>/<code>bool</code> <strong>zawsze</strong> zachowują się "intuicyjnie" (kopiowanie wartości) - bo to structy, tak jak Twój własny <code>Point</code>.</p>
<h2>Domyślna wartość - <code>struct</code> nie może być <code>null</code> (bez <code>Nullable&lt;T&gt;</code>)</h2>
<pre><code class="language-csharp">Point p; // ✅ OK, ma DOMYŚLNĄ wartość (X=0, Y=0) - struct NIE MOŻE być &quot;niezainicjalizowany&quot; jako null
p = null; // ❌ Błąd kompilacji - struct nie jest referencyjny, nie może być null

PointClass c; // deklaracja bez wartości - ale UŻYCIE bez przypisania to błąd kompilacji
c = null; // ✅ OK - class może być null, bo to referencja
</code></pre>
<p>Żeby struct mógł reprezentować "brak wartości", potrzebujesz <code>Nullable&lt;T&gt;</code> (składnia <code>Point?</code>):</p>
<pre><code class="language-csharp">Point? maybePoint = null; // ✅ teraz OK - Nullable&lt;Point&gt;
if (maybePoint.HasValue) { var p = maybePoint.Value; }
</code></pre>
<h2>Dziedziczenie - struct NIE wspiera (poza interfejsami)</h2>
<pre><code class="language-csharp">public struct Point : IComparable&lt;Point&gt; // ✅ MOŻE implementować interfejsy
{
    public int CompareTo(Point other) =&gt; 0;
}

public struct ColoredPoint : Point { } // ❌ Błąd kompilacji - struct NIE MOŻE dziedziczyć po innym struct
</code></pre>
<p>Każdy <code>struct</code> <strong>niejawnie dziedziczy</strong> po <code>System.ValueType</code> (który z kolei dziedziczy po <code>object</code>), i to jest <strong>koniec</strong> hierarchii - nie da się z niego dalej dziedziczyć, ani samemu dziedziczyć po innym struct. To jest zresztą powód, dla którego <code>record struct</code> (o którym mówiliśmy) <strong>nie może</strong> mieć hierarchii dziedziczenia, w przeciwieństwie do <code>record class</code>.</p>
<h2>Kiedy używać <code>struct</code> - praktyczna reguła (Microsoft Guidelines)</h2>
<p>Microsoft rekomenduje <code>struct</code> gdy <strong>wszystkie</strong> poniższe warunki są spełnione:
- Reprezentuje <strong>pojedynczą wartość</strong>, koncepcyjnie podobną do prymitywów (<code>int</code>, <code>DateTime</code>) - np. <code>Point</code>, <code>Money</code>, <code>Coordinates</code>
- Ma <strong>mały rozmiar</strong> (rekomendowane <strong>do 16 bajtów</strong> - większe struktury tracą zaletę wydajnościową przy kopiowaniu)
- Jest <strong>niemutowalna</strong> (albo przynajmniej projektowana z myślą o tym)
- Nie musisz często "boxować" jej do <code>object</code>/interfejsu (patrz niżej o boxing)</p>
<pre><code class="language-csharp">// Dobry kandydat na struct - mały, wartość, niemutowalny
public readonly struct Money
{
    public decimal Amount { get; }
    public string Currency { get; }
    public Money(decimal amount, string currency) { Amount = amount; Currency = currency; }
}
</code></pre>
<p><code>readonly struct</code> (C# 7.2+) - kompilator <strong>wymusza</strong> niemutowalność wszystkich pól, co pozwala na dodatkowe optymalizacje (kompilator wie, że nie musi robić defensywnych kopii przy każdym dostępie).</p>
<h2>Dlaczego NIE nadużywać <code>struct</code> - koszt kopiowania</h2>
<pre><code class="language-csharp">public struct BigStruct // ŹLE - za duży struct
{
    public int Field1, Field2, Field3, Field4, Field5, Field6, Field7, Field8, Field9, Field10;
    // 40 bajtów - każde przekazanie do metody KOPIUJE wszystkie 40 bajtów
}

void ProcessMany(List&lt;BigStruct&gt; items)
{
    foreach (var item in items) // KAŻDA iteracja kopiuje 40 bajtów struktury
    {
        DoSomething(item); // KOLEJNA kopia przy przekazaniu do metody
    }
}
</code></pre>
<p>Dla dużych struktur, <strong>częste kopiowanie</strong> (przy przekazywaniu do metod, przy iteracji) staje się <strong>droższe</strong> niż użycie <code>class</code> (gdzie kopiuje się tylko małą referencję, niezależnie od rozmiaru obiektu). To jest powód limitu "do 16 bajtów" w wytycznych Microsoftu.</p>
<h2>Boxing - koszt przy używaniu struct jako <code>object</code>/interfejsu</h2>
<pre><code class="language-csharp">Point p = new Point { X = 1, Y = 2 };
object boxed = p; // BOXING - struct zostaje &quot;opakowany&quot; i skopiowany NA STERTĘ

IComparable&lt;Point&gt; comparable = p; // TEŻ boxing, jeśli Point implementuje interfejs
</code></pre>
<p><strong>Boxing</strong> to kosztowna operacja - struct, który normalnie żyje na stosie, zostaje skopiowany na stertę i opakowany jako obiekt referencyjny, żeby mógł być traktowany jako <code>object</code>/interfejs. To jest coś, czego <code>class</code> <strong>nigdy nie robi</strong> (bo już jest na stercie).</p>
<pre><code class="language-csharp">List&lt;object&gt; list = new List&lt;object&gt;();
for (int i = 0; i &lt; 1000; i++)
{
    list.Add(i); // KAŻDE dodanie int (struct) do List&lt;object&gt; to BOXING - 1000 alokacji na stercie!
}
</code></pre>
<p>To jest zresztą powód, dla którego generyczne kolekcje (<code>List&lt;int&gt;</code> zamiast <code>List&lt;object&gt;</code>, albo <code>List&lt;T&gt;</code> w ogóle) są tak ważne w .NET - <strong>unikają boxing</strong> dla typów wartościowych.</p>
<h2><code>record struct</code> - łączenie obu światów</h2>
<pre><code class="language-csharp">public record struct PointDto(int X, int Y);
</code></pre>
<p>To jest dokładnie <code>struct</code> (semantyka pamięciowa: kopiowanie przez wartość, stos) <strong>plus</strong> automatycznie generowany <code>Equals</code>/<code>GetHashCode</code>/<code>ToString</code> (semantyka <code>record</code>) - najlepsze z obu, dla małych, niemutowalnych danych.</p>
<h2>Tabela porównawcza <code>struct</code> vs <code>class</code></h2>
<table>
<thead>
<tr>
<th></th>
<th><code>struct</code></th>
<th><code>class</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Typ</td>
<td>Wartościowy</td>
<td>Referencyjny</td>
</tr>
<tr>
<td>Gdzie żyje</td>
<td>Stos (zwykle) / inline w obiekcie</td>
<td>Sterta</td>
</tr>
<tr>
<td>Przypisanie/przekazanie</td>
<td>Kopiuje CAŁY obiekt</td>
<td>Kopiuje tylko referencję</td>
</tr>
<tr>
<td>Może być <code>null</code></td>
<td>Nie (bez <code>Nullable&lt;T&gt;</code>/<code>?</code>)</td>
<td>Tak</td>
</tr>
<tr>
<td>Dziedziczenie</td>
<td>Nie (tylko interfejsy)</td>
<td>Tak (jedna klasa bazowa)</td>
</tr>
<tr>
<td>Domyślna wartość</td>
<td>Zainicjalizowana zerami (nie null)</td>
<td><code>null</code></td>
</tr>
<tr>
<td>Koszt przy dużym rozmiarze</td>
<td>Rośnie (kopiowanie)</td>
<td>Stały (kopiuje tylko referencję)</td>
</tr>
<tr>
<td>Boxing przy użyciu jako object/interfejs</td>
<td>Tak (kosztowne)</td>
<td>Nie (już na stercie)</td>
</tr>
<tr>
<td>Typowe zastosowanie</td>
<td>Małe, niemutowalne wartości (<code>Point</code>, <code>Money</code>, <code>DateTime</code>)</td>
<td>Encje, serwisy, obiekty z tożsamością/zachowaniem</td>
</tr>
</tbody>
</table>
<h2>Pytanie-pułapka na rozmowie</h2>
<p><em>"Czy <code>struct</code> może mieć metody?"</em> - <strong>Tak</strong>, i to jest częste zaskoczenie dla osób kojarzących <code>struct</code> wyłącznie z C/C++ (gdzie to "goła" struktura danych bez zachowania). W C# <code>struct</code> może mieć metody, właściwości, konstruktory (ale <strong>nie</strong> bezparametrowy jawny do C# 10 - jest <strong>zawsze</strong> niejawny, zerujący pola), implementować interfejsy - różni się od <code>class</code> <strong>głównie</strong> semantyką pamięciową (wartość vs referencja) i brakiem dziedziczenia, nie brakiem możliwości posiadania logiki.</p>
<hr />
  
  `},

  { id:"struct-vs-record", title:"struct vs record", tags:"record struct readonly record struct wartość referencja",
  body:`
  <h1>Różnica między <code>struct</code> a <code>record</code></h1>
<h2>To pytanie miesza dwie osie</h2>
<p><code>struct</code> i <code>record</code> odpowiadają na <strong>dwa różne pytania</strong>:
- <strong><code>struct</code> vs <code>class</code></strong> - pytanie o <strong>semantykę pamięciową</strong> (typ wartościowy vs referencyjny)
- <strong><code>record</code> vs zwykła deklaracja</strong> - pytanie o <strong>semantykę równości</strong></p>
<p><strong><code>record</code> to NIE jest alternatywa dla <code>struct</code></strong> - to modyfikator, którego możesz użyć <strong>razem z</strong> <code>class</code> (domyślnie) <strong>albo razem z</strong> <code>struct</code> (jawnie, przez <code>record struct</code>).</p>
<h2>Cztery kombinacje, nie dwie</h2>
<pre><code class="language-csharp">public class OrderClass { }               // typ referencyjny, równość przez referencję
public record OrderRecord { }             // typ referencyjny (!), równość przez wartość
public struct PointStruct { }             // typ wartościowy, równość przez wartość (ale ręcznie/refleksja)
public record struct PointRecordStruct { } // typ wartościowy, równość przez wartość (generowana)
</code></pre>
<p><strong><code>record</code> bez dopisku <code>struct</code> domyślnie generuje <code>class</code>.</strong></p>
<pre><code class="language-csharp">public record OrderRecord(int Id); // to jest DE FACTO klasa!

OrderRecord r1 = new OrderRecord(1);
OrderRecord r2 = r1;
// r1 i r2 to WCIĄŻ dwie referencje do TEGO SAMEGO obiektu na stercie (jak przy class)
// ALE r1 == r2 zwróci true niezależnie, bo to porównanie WARTOŚCIOWE, nie referencyjne
</code></pre>
<h2>Porównanie "czystego" <code>struct</code> z "czystym" <code>record</code></h2>
<table>
<thead>
<tr>
<th></th>
<th><code>struct</code></th>
<th><code>record</code> (= <code>record class</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Typ pamięciowy</td>
<td><strong>Wartościowy</strong> (stos/inline)</td>
<td><strong>Referencyjny</strong> (sterta)</td>
</tr>
<tr>
<td>Kopiowanie przy przypisaniu</td>
<td>Kopiuje CAŁY obiekt</td>
<td>Kopiuje tylko referencję</td>
</tr>
<tr>
<td>Domyślna równość</td>
<td>Porównanie pól przez <strong>refleksję</strong> (wolne!) w <code>ValueType.Equals</code></td>
<td>Wygenerowany, <strong>wydajny</strong> kod porównujący pola</td>
</tr>
<tr>
<td>Może być <code>null</code></td>
<td>Nie</td>
<td>Tak</td>
</tr>
<tr>
<td>Dziedziczenie</td>
<td>Nie</td>
<td>Tak</td>
</tr>
<tr>
<td><code>with</code> expression</td>
<td>Nie</td>
<td>Tak</td>
</tr>
</tbody>
</table>
<p><strong>Zaskakujący fakt:</strong> zwykły <code>struct</code> <strong>też</strong> ma "równość po wartości" w pewnym sensie:</p>
<pre><code class="language-csharp">public struct PointStruct { public int X; public int Y; }

var p1 = new PointStruct { X = 1, Y = 2 };
var p2 = new PointStruct { X = 1, Y = 2 };
p1.Equals(p2); // true - ALE przez refleksję, WOLNE (ValueType.Equals używa reflection)
</code></pre>
<p><code>record struct</code> <strong>rozwiązuje</strong> dokładnie ten problem wydajnościowy.</p>
<h2><code>record struct</code> - gdzie te dwie koncepcje się łączą</h2>
<pre><code class="language-csharp">public record struct PointRecordStruct(int X, int Y);
</code></pre>
<pre><code class="language-csharp">var p1 = new PointRecordStruct(1, 2);
var p2 = p1; // KOPIUJE (struct)
p2.X = 100; // MOŻNA zmieniać - record struct BEZ readonly nie jest init-only

Console.WriteLine(p1.X); // 1 - niezmienione
var p3 = p1 with { X = 100 }; // &quot;with&quot; działa też dla record struct
</code></pre>
<p><strong>Ważna różnica względem <code>record class</code>:</strong> <code>record struct</code> domyślnie <strong>NIE jest</strong> init-only - właściwości mają <code>{ get; set; }</code>, nie <code>{ get; init; }</code> (chyba że dodasz <code>readonly record struct</code>). To jest odwrotność tego, co dzieje się w <code>record class</code>.</p>
<pre><code class="language-csharp">public record struct MutablePoint(int X, int Y); // set, MOŻNA zmieniać po utworzeniu
public readonly record struct ImmutablePoint(int X, int Y); // init, niemutowalne, jak record class
</code></pre>
<h2>Praktyczna reguła</h2>
<pre><code class="language-csharp">Potrzebujesz reprezentować DANE (nie zachowanie/tożsamość)?
├── Małe (≤16 bajtów), wartość jak prymityw (Point, Money, współrzędne)?
│   └── record struct (najlepsze z obu światów)
├── Większe dane, DTO, Command/Query (CQRS)?
│   └── record (= record class)
└── Potrzebujesz mutowalnego stanu z tożsamością (encja EF, ViewModel, serwis)?
    └── zwykła class
</code></pre>
  
  `},

  { id:"icomparable", title:"IComparable", tags:"icomparable compareto sortowanie comparer sort orderby",
  body:`
  <h1><code>IComparable</code> - jak porównuje się obiekty w C#</h1>
<h2>Trzy różne pytania o "porównywanie" obiektów</h2>
<p>Zanim przejdziemy do <code>IComparable</code>, warto rozdzielić trzy <strong>różne</strong> pytania, które łatwo się myli, bo wszystkie nazywamy "porównywaniem":</p>
<ol>
<li><strong>"Czy te dwa obiekty są takie same?"</strong> - to jest <code>Equals()</code>/<code>GetHashCode()</code>, o czym mówiliśmy przy <code>record</code> vs <code>class</code></li>
<li><strong>"Który obiekt jest mniejszy/większy?"</strong> - to jest <code>IComparable&lt;T&gt;</code>/<code>CompareTo()</code> - <strong>temat tej strony</strong></li>
<li><strong>"Czy ten obiekt jest identyczny w pamięci?"</strong> - to jest <code>ReferenceEquals()</code></li>
</ol>
<p><code>IComparable</code> odpowiada <strong>tylko</strong> na drugie pytanie - definiuje <strong>naturalną kolejność sortowania</strong> dla typu.</p>
<h2>Interfejs <code>IComparable&lt;T&gt;</code> - definicja</h2>
<pre><code class="language-csharp">public interface IComparable&lt;T&gt;
{
    int CompareTo(T other);
}
</code></pre>
<p><strong>Kontrakt zwracanej wartości</strong> - to jest najważniejsza rzecz do zapamiętania:</p>
<table>
<thead>
<tr>
<th>Wynik <code>CompareTo()</code></th>
<th>Znaczenie</th>
</tr>
</thead>
<tbody>
<tr>
<td>Wartość <strong>ujemna</strong> (np. -1)</td>
<td>Obiekt bieżący jest "mniejszy" niż <code>other</code></td>
</tr>
<tr>
<td><strong>Zero</strong></td>
<td>Obiekty są "równe" pod względem kolejności sortowania</td>
</tr>
<tr>
<td>Wartość <strong>dodatnia</strong> (np. 1)</td>
<td>Obiekt bieżący jest "większy" niż <code>other</code></td>
</tr>
</tbody>
</table>
<p><strong>Ważna pułapka pojęciowa:</strong> <code>CompareTo() == 0</code> <strong>nie musi</strong> oznaczać, że obiekty są "równe" w sensie <code>Equals()</code> - to są <strong>dwa niezależne</strong> kontrakty. Może się zdarzyć, że sortujesz zamówienia po dacie, i dwa różne zamówienia mają identyczną datę (<code>CompareTo() == 0</code>), ale to zupełnie różne obiekty (<code>Equals()</code> zwróci <code>false</code>).</p>
<h2>Implementacja - konkretny przykład</h2>
<pre><code class="language-csharp">public class Order : IComparable&lt;Order&gt;
{
    public int Id { get; set; }
    public decimal TotalAmount { get; set; }

    public int CompareTo(Order other)
    {
        if (other == null) return 1; // każdy obiekt jest &quot;większy&quot; niż null
        return TotalAmount.CompareTo(other.TotalAmount); // deleguj do CompareTo typu decimal
    }
}
</code></pre>
<pre><code class="language-csharp">var order1 = new Order { Id = 1, TotalAmount = 100 };
var order2 = new Order { Id = 2, TotalAmount = 250 };

int result = order1.CompareTo(order2); // -1 (albo inna wartość ujemna) - order1 jest &quot;mniejszy&quot;
</code></pre>
<p>Zauważ, że implementacja <strong>deleguje</strong> porównanie do <code>TotalAmount.CompareTo(other.TotalAmount)</code> - <code>decimal</code> (podobnie jak <code>int</code>, <code>string</code>, <code>DateTime</code>) <strong>już implementuje</strong> <code>IComparable&lt;T&gt;</code> wewnętrznie, więc nie musisz pisać logiki porównania "ręcznie" (sprawdzać <code>&lt;</code>, <code>&gt;</code> osobno).</p>
<h2>Dlaczego to jest przydatne - <code>Array.Sort()</code> / <code>List&lt;T&gt;.Sort()</code></h2>
<pre><code class="language-csharp">var orders = new List&lt;Order&gt;
{
    new Order { Id = 1, TotalAmount = 300 },
    new Order { Id = 2, TotalAmount = 100 },
    new Order { Id = 3, TotalAmount = 200 }
};

orders.Sort(); // działa TYLKO dlatego, że Order implementuje IComparable&lt;Order&gt;!
// wynik: [100, 200, 300] - sortowanie po TotalAmount, bo tak zdefiniowaliśmy CompareTo
</code></pre>
<p>Bez implementacji <code>IComparable&lt;Order&gt;</code>, wywołanie <code>orders.Sort()</code> <strong>nie skompilowałoby się</strong> (albo, dla starszego niegenerycznego <code>IComparable</code>, rzuciłoby wyjątek w runtime) - <code>List&lt;T&gt;.Sort()</code> <strong>bezparametrowe</strong> wymaga, żeby typ elementów <strong>sam wiedział</strong>, jak się porównywać.</p>
<pre><code class="language-csharp">SortedSet&lt;Order&gt; sortedOrders = new(); // TEŻ wymaga IComparable&lt;Order&gt; (albo IComparer&lt;Order&gt;)
sortedOrders.Add(order1);
sortedOrders.Add(order2); // automatycznie wstawiony we WŁAŚCIWYM miejscu, zgodnie z CompareTo
</code></pre>
<h2><code>IComparer&lt;T&gt;</code> - gdy potrzebujesz WIELU różnych sposobów porównywania</h2>
<p><code>IComparable&lt;T&gt;</code> daje tylko <strong>jedną</strong>, "naturalną" kolejność (tu: po <code>TotalAmount</code>). Co, jeśli czasem chcesz sortować po nazwie klienta, a czasem po dacie? Do tego służy <strong>osobny</strong> interfejs <code>IComparer&lt;T&gt;</code> - <strong>zewnętrzny</strong> komparator, niezależny od samej klasy:</p>
<pre><code class="language-csharp">public class OrderByCustomerNameComparer : IComparer&lt;Order&gt;
{
    public int Compare(Order x, Order y) =&gt; string.Compare(x.CustomerName, y.CustomerName);
}

public class OrderByDateComparer : IComparer&lt;Order&gt;
{
    public int Compare(Order x, Order y) =&gt; x.CreatedDate.CompareTo(y.CreatedDate);
}
</code></pre>
<pre><code class="language-csharp">orders.Sort(new OrderByCustomerNameComparer()); // sortowanie po IMIENIU klienta
orders.Sort(new OrderByDateComparer());          // sortowanie po DACIE
orders.Sort();                                    // domyślne CompareTo - po TotalAmount
</code></pre>
<p><strong>Różnica w skrócie:</strong> <code>IComparable&lt;T&gt;</code> implementujesz <strong>na samej klasie</strong> (jedna, "naturalna" kolejność), <code>IComparer&lt;T&gt;</code> piszesz jako <strong>osobną</strong> klasę, kiedy potrzebujesz <strong>wielu, alternatywnych</strong> sposobów sortowania tego samego typu.</p>
<h2>LINQ <code>OrderBy</code> - NIE wymaga <code>IComparable</code> na Twojej klasie</h2>
<p>To jest częsta pułapka pojęciowa, warto rozróżnić:</p>
<pre><code class="language-csharp">// OrderBy w LINQ - działa BEZ implementowania IComparable na Order!
var sorted = orders.OrderBy(o =&gt; o.TotalAmount); // wymaga IComparable TYLKO na TYPIE KLUCZA (decimal), nie na Order
var sortedByName = orders.OrderBy(o =&gt; o.CustomerName); // string też ma wbudowany IComparable
</code></pre>
<p><code>OrderBy(keySelector)</code> wymaga, żeby <strong>typ zwracany przez lambdę</strong> (tu: <code>decimal</code>, <code>string</code>) implementował <code>IComparable</code> - <strong>nie</strong> wymaga tego od całej klasy <code>Order</code>. Dlatego <code>OrderBy</code> działa na dowolnej klasie, nawet bez żadnej implementacji <code>IComparable</code>, o ile wybierasz klucz sortowania, który sam jest porównywalny (co dotyczy praktycznie wszystkich wbudowanych typów: <code>int</code>, <code>string</code>, <code>DateTime</code>, <code>decimal</code>).</p>
<pre><code class="language-csharp">orders.Sort();                    // ❌ Błąd kompilacji, jeśli Order NIE implementuje IComparable&lt;Order&gt;
orders.OrderBy(o =&gt; o.TotalAmount); // ✅ Działa ZAWSZE, niezależnie od tego, czy Order implementuje IComparable
</code></pre>
<h2><code>IComparable</code> a operatory <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code></h2>
<p>Implementacja <code>IComparable&lt;T&gt;</code> <strong>nie</strong> daje Ci automatycznie możliwości pisania <code>order1 &lt; order2</code> - żeby to uzyskać, musisz <strong>osobno</strong> przeciążyć operatory:</p>
<pre><code class="language-csharp">public class Order : IComparable&lt;Order&gt;
{
    public decimal TotalAmount { get; set; }

    public int CompareTo(Order other) =&gt; TotalAmount.CompareTo(other?.TotalAmount ?? 0);

    // Operatory to ODDZIELNA deklaracja - IComparable ich NIE daje &quot;za darmo&quot;
    public static bool operator &lt;(Order left, Order right) =&gt; left.CompareTo(right) &lt; 0;
    public static bool operator &gt;(Order left, Order right) =&gt; left.CompareTo(right) &gt; 0;
    public static bool operator &lt;=(Order left, Order right) =&gt; left.CompareTo(right) &lt;= 0;
    public static bool operator &gt;=(Order left, Order right) =&gt; left.CompareTo(right) &gt;= 0;
}
</code></pre>
<pre><code class="language-csharp">if (order1 &lt; order2) { /* ... */ } // TERAZ działa, bo jawnie przeciążyliśmy operator
</code></pre>
<h2>Niegeneryczny <code>IComparable</code> (bez <code>&lt;T&gt;</code>) - historyczna wersja</h2>
<p>Warto wiedzieć, że istnieje też starsza, <strong>niegeneryczna</strong> wersja z czasów przed generykami w .NET (C# 1.0):</p>
<pre><code class="language-csharp">public interface IComparable
{
    int CompareTo(object obj); // przyjmuje &quot;object&quot;, wymaga rzutowania w środku
}
</code></pre>
<pre><code class="language-csharp">public class Order : IComparable
{
    public int CompareTo(object obj)
    {
        if (obj is not Order other) throw new ArgumentException(&quot;Obiekt musi być typu Order&quot;);
        return TotalAmount.CompareTo(other.TotalAmount);
    }
}
</code></pre>
<p><strong>Dlaczego generyczny <code>IComparable&lt;T&gt;</code> jest lepszy:</strong> unika <strong>boxing</strong> (dla structów - wracając do rozmowy o <code>struct</code>) i rzutowania w runtime - <code>CompareTo(Order other)</code> jest sprawdzane przez kompilator w compile-time, <code>CompareTo(object obj)</code> rzuca wyjątek w <strong>runtime</strong>, jeśli ktoś przekaże złudny typ. W nowoczesnym kodzie <strong>zawsze</strong> implementuj generyczną wersję (<code>IComparable&lt;T&gt;</code>), niegeneryczna jest zachowana głównie dla kompatybilności ze starszym kodem.</p>
<h2>Podsumowanie - zwięzła odpowiedź na rozmowę</h2>
<blockquote>
<p><code>IComparable&lt;T&gt;</code> definiuje <strong>naturalną kolejność sortowania</strong> obiektu przez metodę <code>CompareTo()</code>, zwracającą wartość ujemną/zero/dodatnią w zależności od tego, czy obiekt jest mniejszy, równy (pod względem porządku, nie tożsamości!) czy większy od porównywanego. Implementacja tego interfejsu jest <strong>wymagana</strong>, żeby bezparametrowe <code>List&lt;T&gt;.Sort()</code> czy <code>SortedSet&lt;T&gt;</code> w ogóle działały. Gdy potrzebujesz <strong>wielu</strong> różnych sposobów sortowania tego samego typu, używasz zamiast tego (albo dodatkowo) osobnych klas implementujących <code>IComparer&lt;T&gt;</code>. LINQ <code>OrderBy(keySelector)</code> <strong>nie wymaga</strong> <code>IComparable</code> na całej klasie - tylko na typie klucza wybranego w lambdzie, co jest częstym źródłem nieporozumień przy porównywaniu tych dwóch mechanizmów sortowania.</p>
</blockquote>
  `},

  { id:"ienumerable-iqueryable", title:"IEnumerable vs IQueryable", tags:"ienumerable iqueryable expression func deferred execution ef core",
  body:`
  <h1><code>IEnumerable&lt;T&gt;</code> vs <code>IQueryable&lt;T&gt;</code> - kluczowa różnica w LINQ</h1>
<p>To jest jedno z <strong>najczęściej zadawanych</strong> pytań na rozmowach .NET - fundament rozumienia, jak LINQ to Entities (EF Core) w ogóle działa.</p>
<h2>Podstawowa definicja - <code>IQueryable&lt;T&gt;</code> dziedziczy po <code>IEnumerable&lt;T&gt;</code></h2>
<pre><code class="language-csharp">public interface IEnumerable&lt;T&gt; : IEnumerable
{
    IEnumerator&lt;T&gt; GetEnumerator();
}

public interface IQueryable&lt;T&gt; : IEnumerable&lt;T&gt;, IQueryable
{
    Type ElementType { get; }
    Expression Expression { get; }
    IQueryProvider Provider { get; }
}
</code></pre>
<p><code>IQueryable&lt;T&gt;</code> <strong>jest</strong> <code>IEnumerable&lt;T&gt;</code> (dziedziczy po nim) plus <strong>dodatkowe informacje</strong> potrzebne do zbudowania i przetłumaczenia zapytania na inny język (najczęściej SQL).</p>
<h2>Gdzie wykonuje się filtrowanie - kluczowa różnica</h2>
<pre><code class="language-csharp">// IEnumerable - filtrowanie W PAMIĘCI, w C#
IEnumerable&lt;Order&gt; orders = context.Orders.ToList(); // ⚠️ ToList() już pobrał WSZYSTKO z bazy!
var filtered = orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // filtrowanie odbywa się TERAZ, w pamięci .NET

// IQueryable - filtrowanie NA BAZIE DANYCH, w SQL
IQueryable&lt;Order&gt; query = context.Orders; // jeszcze BRAK zapytania SQL
var filtered2 = query.Where(o =&gt; o.Status == &quot;Pending&quot;); // WCIĄŻ brak SQL - tylko rozbudowa wyrażenia
var result = filtered2.ToList(); // DOPIERO TERAZ generowany i wykonywany SQL: WHERE Status = 'Pending'
</code></pre>
<p><strong>To jest fundamentalna praktyczna konsekwencja:</strong> <code>IEnumerable</code> <strong>pobiera wszystkie dane, a potem filtruje w C#</strong>; <code>IQueryable</code> <strong>tłumaczy filtr na SQL i filtruje bezpośrednio w bazie danych</strong>, przesyłając przez sieć tylko wynikowe wiersze.</p>
<h2>Demonstracja problemu wydajnościowego - klasyczne pytanie-pułapka</h2>
<pre><code class="language-csharp">// ❌ BARDZO NIEEFEKTYWNE
public List&lt;Order&gt; GetPendingOrders(AppDbContext context)
{
    IEnumerable&lt;Order&gt; orders = context.Orders; // niejawna konwersja na IEnumerable!
    return orders.Where(o =&gt; o.Status == &quot;Pending&quot;).ToList();
}
// Co się faktycznie dzieje: EF Core widzi typ IEnumerable, więc NIE MOŻE zbudować SQL z filtrem
// -&gt; pobiera WSZYSTKIE zamówienia z całej tabeli (SELECT * FROM Orders, BEZ WHERE)
// -&gt; filtrowanie &quot;Status == Pending&quot; dzieje się DOPIERO w pamięci C#, po pobraniu WSZYSTKIEGO
</code></pre>
<pre><code class="language-csharp">// ✅ EFEKTYWNE
public List&lt;Order&gt; GetPendingOrders(AppDbContext context)
{
    IQueryable&lt;Order&gt; orders = context.Orders; // pozostaje IQueryable
    return orders.Where(o =&gt; o.Status == &quot;Pending&quot;).ToList();
}
// SQL: SELECT * FROM Orders WHERE Status = 'Pending' - filtr wykonany NA BAZIE,
// przez sieć leci TYLKO pasujące wiersze
</code></pre>
<p><strong>To jest realny, częsty bug w kodzie produkcyjnym</strong> - jeśli <strong>gdziekolwiek</strong> po drodze zmienisz typ zmiennej na <code>IEnumerable&lt;T&gt;</code> (albo wywołasz metodę przyjmującą <code>IEnumerable&lt;T&gt;</code> zamiast <code>IQueryable&lt;T&gt;</code>), <strong>tracisz</strong> możliwość tłumaczenia dalszych operacji na SQL - wszystko od tego momentu wykonuje się w pamięci, po pobraniu (potencjalnie) całej tabeli.</p>
<h2>Jak to się dzieje "pod spodem" - <code>Expression</code> vs <code>Func</code></h2>
<pre><code class="language-csharp">// IEnumerable.Where przyjmuje SKOMPILOWANY delegat
public static IEnumerable&lt;T&gt; Where&lt;T&gt;(this IEnumerable&lt;T&gt; source, Func&lt;T, bool&gt; predicate)
{
    foreach (var item in source)
        if (predicate(item)) yield return item; // wykonuje faktyczny kod C# na KAŻDYM elemencie
}

// IQueryable.Where przyjmuje DRZEWO WYRAŻEŃ (Expression Tree) - reprezentację STRUKTURY, nie kod
public static IQueryable&lt;T&gt; Where&lt;T&gt;(this IQueryable&lt;T&gt; source, Expression&lt;Func&lt;T, bool&gt;&gt; predicate)
{
    // NIE wykonuje predicate! Zamiast tego DOKŁADA je do drzewa Expression,
    // które Provider (np. EF Core) przeanalizuje i przetłumaczy na SQL
}
</code></pre>
<p><code>o =&gt; o.Status == "Pending"</code> jako <code>Func&lt;Order, bool&gt;</code> to <strong>gotowy, skompilowany kod</strong> - da się go tylko <strong>wykonać</strong>, nie da się "zajrzeć do środka" i zobaczyć, co robi. Ten sam kod jako <code>Expression&lt;Func&lt;Order, bool&gt;&gt;</code> to <strong>struktura danych</strong> opisująca: "porównanie własności <code>Status</code> obiektu z literałem <code>"Pending"</code>" - EF Core <strong>czyta</strong> tę strukturę i <strong>generuje</strong> odpowiadający fragment SQL.</p>
<h2>Konsekwencja - <code>IQueryable</code> nie akceptuje dowolnego kodu C</h2>
<pre><code class="language-csharp">// ❌ Rzuci wyjątek w runtime - EF Core nie umie przetłumaczyć DOWOLNEJ metody C# na SQL
var orders = context.Orders.Where(o =&gt; IsValidCustomLogic(o)).ToList();
// &quot;The LINQ expression could not be translated&quot;

private bool IsValidCustomLogic(Order o) =&gt; /* dowolna złożona logika C# */;

// ✅ Działa - proste wyrażenia, które EF Core UMIE przetłumaczyć na SQL
var orders = context.Orders.Where(o =&gt; o.TotalAmount &gt; 100 &amp;&amp; o.Status == &quot;Pending&quot;).ToList();
</code></pre>
<p>To jest ograniczenie, którego <strong>nie ma</strong> przy <code>IEnumerable</code> - tam <strong>każdy</strong> kod C#, jakikolwiek by nie był, po prostu <strong>się wykonuje</strong>, bo to zwykły, skompilowany delegat, a nie struktura do analizy.</p>
<h2>Deferred execution (odroczone wykonanie) - wspólna cecha, ale różny "moment" wykonania</h2>
<pre><code class="language-csharp">// IEnumerable - odracza WYKONANIE KODU C#, ale sama iteracja i tak dzieje się w pamięci
IEnumerable&lt;int&gt; query = numbers.Where(n =&gt; n &gt; 5); // NIC się jeszcze nie wykonało
foreach (var n in query) { } // TERAZ faktycznie iteruje i filtruje - ale WCIĄŻ w pamięci .NET

// IQueryable - odracza WYKONANIE ZAPYTANIA (i jego BUDOWĘ jako SQL)
IQueryable&lt;Order&gt; query2 = context.Orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // brak SQL
var list = query2.ToList(); // TERAZ generowany SQL I wysyłany do bazy
</code></pre>
<h2>Kiedy dochodzi do "przejścia" z <code>IQueryable</code> na <code>IEnumerable</code> - materializacja</h2>
<pre><code class="language-csharp">IQueryable&lt;Order&gt; query = context.Orders.Where(o =&gt; o.Status == &quot;Pending&quot;); // wciąż IQueryable, brak SQL

List&lt;Order&gt; materialized = query.ToList(); // .ToList() WYKONUJE zapytanie - wynik to LISTA, konkretne dane w pamięci

// Od TEGO MOMENTU dalsze Where/OrderBy działają JUŻ w pamięci (na List&lt;T&gt;, czyli IEnumerable)
var furtherFiltered = materialized.Where(o =&gt; o.TotalAmount &gt; 500); // TO JUŻ nie dotyka bazy - filtr w C#
</code></pre>
<p>To jest kluczowy moment "materializacji" - <code>ToList()</code>, <code>ToArray()</code>, <code>First()</code>, <code>Count()</code> <strong>wykonują</strong> zapytanie SQL i zwracają <strong>konkretne dane w pamięci</strong> - wszystko, co robisz <strong>po tym momencie</strong>, to już zwykłe operacje <code>IEnumerable</code> w C#, nie SQL.</p>
<h2>Praktyczna reguła - buduj CAŁE zapytanie jako <code>IQueryable</code>, materializuj na końcu</h2>
<pre><code class="language-csharp">// ✅ Dobra praktyka - WSZYSTKIE warunki dodane, ZANIM wywołasz ToListAsync()
public async Task&lt;List&lt;OrderDto&gt;&gt; SearchOrdersAsync(string status, decimal? minAmount, int page)
{
    IQueryable&lt;Order&gt; query = _context.Orders; // zaczynasz jako IQueryable

    if (!string.IsNullOrEmpty(status))
        query = query.Where(o =&gt; o.Status == status); // wciąż IQueryable - dokłada do SQL

    if (minAmount.HasValue)
        query = query.Where(o =&gt; o.TotalAmount &gt;= minAmount); // wciąż IQueryable

    query = query.Skip((page - 1) * 20).Take(20); // paginacja TEŻ w SQL (OFFSET/FETCH), nie w pamięci!

    return await query.Select(o =&gt; new OrderDto(o.Id, o.CustomerName, o.TotalAmount)) // projekcja w SQL
        .ToListAsync(); // DOPIERO TERAZ - jedno, kompletne zapytanie SQL z WSZYSTKIMI warunkami
}
</code></pre>
<p>To jest dokładnie ten wzorzec paginacji + filtrowania, który powinien <strong>zawsze</strong> zostać jako <code>IQueryable</code> aż do samego końca - jeśli <strong>przedwcześnie</strong> zmaterializujesz (<code>ToList()</code> za wcześnie), paginacja (<code>Skip</code>/<code>Take</code>) wykona się <strong>w pamięci</strong> po pobraniu <strong>wszystkich</strong> wierszy z bazy, co dla dużej tabeli jest katastrofalne wydajnościowo.</p>
<h2>Tabela porównawcza</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>IEnumerable&lt;T&gt;</code></th>
<th><code>IQueryable&lt;T&gt;</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Gdzie wykonuje się logika (<code>Where</code>, <code>Select</code>)</td>
<td>W pamięci, w C# (skompilowany kod)</td>
<td>Tłumaczone na SQL, wykonywane w bazie danych</td>
</tr>
<tr>
<td>Typ parametru w <code>Where</code>/<code>Select</code></td>
<td><code>Func&lt;T, bool&gt;</code> (delegat)</td>
<td><code>Expression&lt;Func&lt;T, bool&gt;&gt;</code> (drzewo wyrażeń)</td>
</tr>
<tr>
<td>Źródło danych</td>
<td>Kolekcje w pamięci (<code>List&lt;T&gt;</code>, tablice) LUB już pobrane dane</td>
<td>Źródła z providerem LINQ (EF Core, LINQ to SQL)</td>
</tr>
<tr>
<td>Wydajność przy dużych zbiorach danych</td>
<td>Słaba - trzeba pobrać wszystko do pamięci najpierw</td>
<td>Dobra - filtr/paginacja wykonują się w bazie, przesyłane tylko wynikowe dane</td>
</tr>
<tr>
<td>Dowolny kod C# w predykacie</td>
<td>✅ Zawsze działa</td>
<td>❌ Tylko wyrażenia tłumaczalne na SQL</td>
</tr>
<tr>
<td>Relacja</td>
<td>Bazowy interfejs</td>
<td>Dziedziczy po <code>IEnumerable&lt;T&gt;</code>, dodaje <code>Expression</code>/<code>Provider</code></td>
</tr>
</tbody>
</table>
<h2>Podsumowanie - zwięzła odpowiedź na rozmowę</h2>
<blockquote>
<p><em>"<code>IQueryable&lt;T&gt;</code> dziedziczy po <code>IEnumerable&lt;T&gt;</code>, ale reprezentuje zapytanie jako drzewo wyrażeń (<code>Expression</code>), które dopiero przy materializacji (<code>ToList()</code>, <code>ToListAsync()</code>) zostaje przetłumaczone przez providera - w przypadku EF Core na SQL - i wykonane bezpośrednio na bazie danych. <code>IEnumerable&lt;T&gt;</code> operuje na już posiadanych danych w pamięci, wykonując skompilowany kod C# (<code>Func&lt;T,bool&gt;</code>), bez żadnego tłumaczenia. Praktyczna konsekwencja: jeśli w łańcuchu LINQ nad <code>DbSet&lt;T&gt;</code> typ zmienna zostanie w jakimś miejscu zrzutowany na <code>IEnumerable&lt;T&gt;</code>, wszystkie dalsze operacje (<code>Where</code>, paginacja) wykonują się w pamięci PO pobraniu danych z bazy, zamiast być przetłumaczone na SQL - to jest częsty, kosztowny błąd wydajnościowy, więc dobra praktyka to trzymanie typu <code>IQueryable&lt;T&gt;</code> aż do samego końca budowy zapytania, materializując dopiero na sam koniec."</em></p>
</blockquote>
  
  `},

  ]
},
