  { id:"webapi-mvc", title:"Web API jako implementacja MVC", tags:"webapi mvc controller dto apicontroller minimal api",
  body:`
  <h1>ASP.NET Core Web API oraz Blazor - MVC i pokrewne wzorce</h1>
<p>Web API to rzeczywiście implementacja wzorca MVC (a właściwie okrojonego "MC" - bez V, bo zwraca dane, nie widoki), natomiast Blazor nie jest MVC - to komponentowy model UI, bliższy React/Angular niż tradycyjnemu MVC.</p>
<h2>Przypomnienie: MVC (Model-View-Controller)</h2>
<ul>
<li><strong>Model</strong> - dane i logika biznesowa</li>
<li><strong>View</strong> - warstwa prezentacji (co widzi użytkownik)</li>
<li><strong>Controller</strong> - odbiera request, koordynuje Model i View, zwraca odpowiedź</li>
</ul>
<h2>ASP.NET Core Web API jako implementacja MVC</h2>
<p>Web API to w praktyce <strong>MVC bez V</strong> - zamiast zwracać HTML (View), zwraca dane (JSON/XML). Struktura jest bardzo podobna do WPF-owego MVVM - Controller pełni trochę rolę pośrednika, podobnie jak ViewModel.</p>
<h3>Controller - punkt wejścia requestu</h3>
<pre><code class="language-csharp">[ApiController]
[Route(&quot;api/[controller]&quot;)]
public class OrdersController : ControllerBase
{
    private readonly IOrderService _orderService; // DI

    public OrdersController(IOrderService orderService)
    {
        _orderService = orderService;
    }

    [HttpGet(&quot;{id}&quot;)]
    public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id)
    {
        var order = await _orderService.GetOrderAsync(id);
        if (order == null) return NotFound();
        return Ok(order);
    }

    [HttpPost]
    public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; CreateOrder(CreateOrderRequest request)
    {
        var order = await _orderService.CreateOrderAsync(request);
        return CreatedAtAction(nameof(GetOrder), new { id = order.Id }, order);
    }
}
</code></pre>
<p><strong><code>[ApiController]</code></strong> - atrybut włączający konwencje specyficzne dla API: automatyczna walidacja modelu (400 Bad Request bez ręcznego <code>if (!ModelState.IsValid)</code>), automatyczne binowanie parametrów z route/body, lepsze komunikaty błędów.</p>
<h3>Model - DTO zamiast encji domenowej</h3>
<p>Ważna praktyka: <strong>nie zwracaj bezpośrednio encji EF Core z API</strong> - zwracasz DTO (Data Transfer Object).</p>
<pre><code class="language-csharp">// Encja domenowa - używana wewnętrznie, ma nawigacje, może mieć pola techniczne
public class Order
{
    public int Id { get; set; }
    public Customer Customer { get; set; } // nawigacja EF - ryzyko cyklicznej serializacji
    public ICollection&lt;OrderItem&gt; Items { get; set; }
}

// DTO - dokładnie to, co ma zobaczyć klient, nic więcej
public record OrderDto(int Id, string CustomerName, decimal Total, List&lt;OrderItemDto&gt; Items);
</code></pre>
<p><strong>Dlaczego to ważne:</strong>
- Unikasz przypadkowego wycieku danych wrażliwych (np. pole <code>PasswordHash</code> w encji <code>User</code>)
- Unikasz cyklicznych referencji przy serializacji JSON (<code>Order.Customer.Orders.First().Customer...</code>)
- Kontrakt API jest niezależny od struktury bazy danych - możesz zmienić model EF bez łamania API</p>
<h3>Routing - Attribute-based (dominujący w Web API)</h3>
<pre><code class="language-csharp">[HttpGet(&quot;{id}&quot;)]                    // GET api/orders/5
[HttpGet(&quot;search&quot;)]                  // GET api/orders/search
[HttpGet(&quot;{id}/items&quot;)]              // GET api/orders/5/items
[HttpPost]                           // POST api/orders
[HttpPut(&quot;{id}&quot;)]                    // PUT api/orders/5
[HttpDelete(&quot;{id}&quot;)]                 // DELETE api/orders/5
</code></pre>
<h3>Middleware pipeline - IoC w praktyce</h3>
<pre><code class="language-csharp">var app = builder.Build();

app.UseHttpsRedirection();
app.UseAuthentication();
app.UseAuthorization();
app.MapControllers();

app.Run();
</code></pre>
<p>To dokładnie ten mechanizm IoC z middleware - framework sam decyduje, kiedy wywołać który middleware, w jakiej kolejności, Ty tylko rejestrujesz "co ma się stać".</p>
<h3>Minimal APIs - alternatywa dla kontrolerów (nowsze podejście, .NET 6+)</h3>
<pre><code class="language-csharp">app.MapGet(&quot;/api/orders/{id}&quot;, async (int id, IOrderService orderService) =&gt;
{
    var order = await orderService.GetOrderAsync(id);
    return order != null ? Results.Ok(order) : Results.NotFound();
});
</code></pre>
<p>To wciąż jest <strong>MVC-podobne konceptualnie</strong> (endpoint = mini-kontroler), tylko bez klasy <code>Controller</code> - lżejsze, mniej boilerplate'u, popularne w mikroserwisach.</p>
<h2>Warstwowa architektura Web API</h2>
<pre><code class="language-csharp">Controller (MVC)
    ↓
Service (logika biznesowa)
    ↓
Repository (EF Core)
    ↓
Baza danych
</code></pre>
<pre><code class="language-csharp">[ApiController]
public class OrdersController : ControllerBase
{
    private readonly IOrderService _orderService; // Controller NIE zna EF Core bezpośrednio
    // ...
}
</code></pre>
<p>Controller <strong>nie powinien</strong> zawierać logiki biznesowej ani bezpośrednio wołać <code>DbContext</code> - to jest analogiczne do tego, co mówiliśmy o ViewModelu w WPF: cienka warstwa koordynująca, cała logika w serwisie.</p>
<hr />
<h2>Blazor - dlaczego to NIE jest MVC</h2>
<p>To jest kluczowy punkt do zaznaczenia na rozmowie, bo błędne przypisanie Blazor do MVC to sygnał powierzchownej wiedzy. Blazor to framework <strong>komponentowy</strong> (podobny filozoficznie do React czy Angular), a nie MVC.</p>
<h3>Dwa modele hostingu Blazor</h3>
<p><strong>Blazor Server</strong> - logika wykonuje się na serwerze, UI aktualizowane przez SignalR (WebSocket) w czasie rzeczywistym.</p>
<p><strong>Blazor WebAssembly (WASM)</strong> - cały kod C# kompilowany do WebAssembly i wykonywany <strong>w przeglądarce</strong>, bez round-tripów do serwera przy każdej interakcji.</p>
<h3>Komponent Blazor - odpowiednik "View + trochę logiki"</h3>
<pre><code class="language-razor">@page &quot;/orders/{id:int}&quot;
@inject IOrderService OrderService

&lt;h3&gt;Zamówienie #@Order?.Id&lt;/h3&gt;

@if (Order == null)
{
    &lt;p&gt;Ładowanie...&lt;/p&gt;
}
else
{
    &lt;p&gt;Klient: @Order.CustomerName&lt;/p&gt;
    &lt;p&gt;Suma: @Order.Total zł&lt;/p&gt;
    &lt;button @onclick=&quot;ShipOrder&quot;&gt;Wyślij zamówienie&lt;/button&gt;
}

@code {
    [Parameter] public int Id { get; set; }
    private OrderDto Order;

    protected override async Task OnInitializedAsync()
    {
        Order = await OrderService.GetOrderAsync(Id);
    }

    private async Task ShipOrder()
    {
        await OrderService.ShipOrderAsync(Id);
        Order = await OrderService.GetOrderAsync(Id);
    }
}
</code></pre>
<h2>Dlaczego to bliżej MVVM niż MVC</h2>
<p>To jest ciekawe spostrzeżenie do pokazania na rozmowie - komponent Blazor <strong>łączy</strong> to, co w MVC było rozdzielone na Controller + View, w <strong>jedną jednostkę</strong>:</p>
<table>
<thead>
<tr>
<th></th>
<th>MVC</th>
<th>Blazor</th>
<th>MVVM (WPF)</th>
</tr>
</thead>
<tbody>
<tr>
<td>UI (znaczniki)</td>
<td>View (<code>.cshtml</code>)</td>
<td>Sekcja HTML w <code>.razor</code></td>
<td>XAML</td>
</tr>
<tr>
<td>Logika prezentacji</td>
<td>Controller</td>
<td>Sekcja <code>@code</code> w tym samym pliku</td>
<td>ViewModel (osobny plik)</td>
</tr>
<tr>
<td>Odświeżanie UI</td>
<td>Pełne przeładowanie strony (albo ręczny JS)</td>
<td><strong>Automatyczne re-renderowanie</strong> przy zmianie stanu</td>
<td>Automatyczne przez <code>INotifyPropertyChanged</code>/binding</td>
</tr>
<tr>
<td>DI</td>
<td>Przez konstruktor kontrolera</td>
<td><code>@inject</code></td>
<td>Przez konstruktor ViewModelu</td>
</tr>
</tbody>
</table>
<p><strong><code>@inject</code></strong> w Blazor to DI - dokładnie ten sam kontener <code>Microsoft.Extensions.DependencyInjection</code>, który już znasz z Web API i WPF:</p>
<pre><code class="language-csharp">// Program.cs
builder.Services.AddScoped&lt;IOrderService, OrderService&gt;();
</code></pre>
<pre><code class="language-razor">@inject IOrderService OrderService
</code></pre>
<p>To pokazuje spójność ekosystemu .NET - <strong>ten sam mechanizm DI działa identycznie</strong> w Web API, Blazor i (jak pokazywaliśmy) w WPF.</p>
<h2>Component lifecycle - odpowiednik cyklu życia, o którym mówiliśmy przy WPF</h2>
<pre><code class="language-csharp">protected override void OnInitialized() { }           // odpowiednik konstruktora ViewModelu
protected override async Task OnInitializedAsync() { } // dla async inicjalizacji (np. pierwsze pobranie danych)
protected override void OnParametersSet() { }           // gdy zmienią się [Parameter]
protected override bool ShouldRender() =&gt; true;          // kontrola czy re-renderować (optymalizacja)
</code></pre>
<h2>StateHasChanged - ręczne odświeżenie UI</h2>
<pre><code class="language-csharp">private async Task LoadDataInBackground()
{
    var data = await _service.GetDataAsync();
    Orders = data;
    StateHasChanged(); // każ Blazorowi przerenderować komponent
}
</code></pre>
<p>To jest koncepcyjnie <strong>bardzo bliskie</strong> temu, co robi <code>PropertyChanged</code> w WPF - tam framework nasłuchuje eventu i sam odświeża UI, tutaj czasem trzeba to wywołać jawnie (np. gdy zmiana stanu dzieje się poza normalnym cyklem eventów Blazora, np. w callbacku z zewnętrznego serwisu).</p>
<h2>Blazor Server vs WASM - różnice praktyczne (częste pytanie)</h2>
<table>
<thead>
<tr>
<th></th>
<th>Blazor Server</th>
<th>Blazor WebAssembly</th>
</tr>
</thead>
<tbody>
<tr>
<td>Gdzie wykonuje się kod</td>
<td>Serwer</td>
<td>Przeglądarka (WASM)</td>
</tr>
<tr>
<td>Komunikacja</td>
<td>SignalR (stałe połączenie WebSocket)</td>
<td>Bezpośrednio w przeglądarce, HTTP do API gdy trzeba</td>
</tr>
<tr>
<td>Opóźnienie interakcji</td>
<td>Zależne od sieci (każdy klik = round-trip do serwera)</td>
<td>Natychmiastowe (kod lokalnie)</td>
</tr>
<tr>
<td>Rozmiar pobrania</td>
<td>Mały (brak runtime .NET w przeglądarce)</td>
<td>Duży (pobiera cały runtime .NET)</td>
</tr>
<tr>
<td>Offline</td>
<td>❌ Nie działa bez połączenia</td>
<td>✅ Może działać offline (PWA)</td>
</tr>
<tr>
<td>Skalowanie serwera</td>
<td>Każdy user = stały stan na serwerze (pamięć, SignalR connection)</td>
<td>Serwer tylko serwuje pliki statyczne + API</td>
</tr>
</tbody>
</table>
<p><strong>Blazor United / Blazor Web App (.NET 8+)</strong> - warto wspomnieć, że nowsze .NET pozwala <strong>mieszać</strong> oba modele w jednej aplikacji, z tzw. render modes (Static SSR, Server, WebAssembly, Auto) wybieranymi per-komponent.</p>
<h2>Gdzie Web API i Blazor się spotykają w architekturze</h2>
<p>Typowy układ, analogiczny do tego, co omawialiśmy z WPF:</p>
<pre><code class="language-csharp">Blazor WASM (frontend, działa w przeglądarce)
    ↓ HttpClient → wywołania HTTP
ASP.NET Core Web API (backend)
    ↓
Service (logika biznesowa)
    ↓
EF Core → baza danych
</code></pre>
<pre><code class="language-csharp">// W komponencie Blazor WASM
@inject HttpClient Http

@code {
    private List&lt;OrderDto&gt; orders;

    protected override async Task OnInitializedAsync()
    {
        orders = await Http.GetFromJsonAsync&lt;List&lt;OrderDto&gt;&gt;(&quot;api/orders&quot;);
    }
}
</code></pre>
<p>To jest <strong>strukturalnie identyczne</strong> do architektury WPF → API, którą omawialiśmy przy okazji async/EF Core - różni się tylko technologia frontendu (Blazor WASM w przeglądarce zamiast WPF na desktopie), ale warstwy backendowe (Controller → Service → Repository → EF) są <strong>dokładnie te same</strong>.</p>
<p><strong>Blazor Server</strong> natomiast <strong>nie potrzebuje</strong> oddzielnego Web API pośrodku - komponent może bezpośrednio wstrzyknąć <code>IOrderService</code> przez DI i wywołać go lokalnie (bo kod i tak wykonuje się na serwerze) - to jest różnica architektoniczna, o którą czasem pytają: <em>"Czy w Blazor Server potrzebujesz osobnego Web API?"</em> - odpowiedź: niekoniecznie, możesz wstrzyknąć serwisy bezpośrednio, chyba że ten sam backend ma też obsługiwać inne klienty (mobile, WPF, Blazor WASM) - wtedy Web API jako wspólna warstwa ma sens.</p>
<h2>Podsumowanie różnicy koncepcyjnej</h2>
<blockquote>
<p><em>"ASP.NET Core Web API to rzeczywiście implementacja MVC, tylko bez View - Controller zwraca dane (JSON) zamiast HTML. Blazor natomiast to framework komponentowy, konceptualnie bliższy MVVM albo React niż klasycznemu MVC - komponent łączy w jednym pliku to, co w MVC byłoby rozdzielone na View i Controller, a stan komponentu automatycznie synchronizuje się z UI, podobnie jak binding w WPF. Oba używają tego samego mechanizmu DI z Microsoft.Extensions.DependencyInjection, co pokazuje spójność całego ekosystemu ASP.NET Core."</em></p>
</blockquote>
  
  `},

  { id:"model-binding", title:"Model Binding i [FromBody]", tags:"fromroute fromquery frombody fromheader fromservices apicontroller",
  body:`
  <h1>Routing/Model Binding w Web API, SignalR w Blazor Server, PWA, Render Modes</h1>
<h2>Model Binding w Web API - skąd biorą się wartości parametrów</h2>
<p>Model binding to mechanizm, który <strong>automatycznie wypełnia parametry akcji kontrolera</strong> danymi z requestu HTTP - z URL-a, query stringa, body, nagłówków. ASP.NET Core ma <strong>domyślne konwencje</strong>, ale atrybuty pozwalają to jawnie kontrolować.</p>
<h3><code>[FromRoute]</code> - z segmentu URL</h3>
<pre><code class="language-csharp">[HttpGet(&quot;{id}&quot;)] // api/orders/5
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder([FromRoute] int id)
{
    // id = 5, wzięte z segmentu URL
}

// [FromRoute] często pomijalny - EF automatycznie dopasuje {id} do parametru &quot;id&quot;
[HttpGet(&quot;{id}&quot;)]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id) // działa identycznie
</code></pre>
<h3><code>[FromQuery]</code> - z query stringa</h3>
<pre><code class="language-csharp">// GET api/orders/search?status=Pending&amp;minAmount=100
[HttpGet(&quot;search&quot;)]
public async Task&lt;ActionResult&lt;List&lt;OrderDto&gt;&gt;&gt; Search(
    [FromQuery] string status,
    [FromQuery] decimal? minAmount)
{
    // status = &quot;Pending&quot;, minAmount = 100
}

// Można też zbindować cały obiekt naraz
public class OrderSearchParams
{
    public string Status { get; set; }
    public decimal? MinAmount { get; set; }
    public int Page { get; set; } = 1;
}

[HttpGet(&quot;search&quot;)]
public async Task&lt;ActionResult&lt;List&lt;OrderDto&gt;&gt;&gt; Search([FromQuery] OrderSearchParams searchParams)
{
    // GET api/orders/search?status=Pending&amp;minAmount=100&amp;page=2
    // ASP.NET Core automatycznie mapuje query params na property obiektu
}
</code></pre>
<h3><code>[FromBody]</code> - z ciała requestu (JSON)</h3>
<pre><code class="language-csharp">[HttpPost]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; CreateOrder([FromBody] CreateOrderRequest request)
{
    // request zdeserializowany z JSON w body POST-a
}

// [FromBody] JEST wymagany dla złożonych typów w POST/PUT - bez niego
// framework domyślnie próbowałby czytać z query string dla prostych typów,
// ale dla złożonego obiektu i tak domyślnie szuka w body (w [ApiController])
</code></pre>
<p><strong>Ważna zasada:</strong> w metodzie może być <strong>tylko jeden</strong> parametr <code>[FromBody]</code> - body requestu to jeden strumień, nie da się go "podzielić" na dwa osobne obiekty.</p>
<h3><code>[FromHeader]</code> - z nagłówka HTTP</h3>
<pre><code class="language-csharp">[HttpGet]
public async Task&lt;ActionResult&gt; GetData([FromHeader(Name = &quot;X-Correlation-Id&quot;)] string correlationId)
{
    // wartość nagłówka X-Correlation-Id
}
</code></pre>
<h3><code>[FromServices]</code> - wstrzyknięcie zależności bezpośrednio do metody (Method Injection z poprzedniej rozmowy!)</h3>
<pre><code class="language-csharp">[HttpPost]
public async Task&lt;ActionResult&gt; CreateOrder(
    CreateOrderRequest request,
    [FromServices] IEmailService emailService) // wstrzyknięte TYLKO dla tej metody, nie w konstruktorze
{
    await emailService.SendAsync(...);
}
</code></pre>
<p>To jest dokładnie <strong>Method Injection</strong>, o którym mówiłem przy sposobach wdrażania DI - przydatne, gdy zależność jest potrzebna tylko w jednej konkretnej akcji kontrolera, a nie chcesz jej trzymać jako pole całej klasy.</p>
<h3>Domyślne konwencje (gdy nie ma atrybutu) w <code>[ApiController]</code></h3>
<table>
<thead>
<tr>
<th>Typ parametru</th>
<th>Domyślne źródło</th>
</tr>
</thead>
<tbody>
<tr>
<td>Prosty typ (int, string, Guid) niebędący w route</td>
<td>Query string</td>
</tr>
<tr>
<td>Złożony obiekt (klasa)</td>
<td>Body (JSON)</td>
</tr>
<tr>
<td>Parametr pasujący nazwą do <code>{segment}</code> w route</td>
<td>Route</td>
</tr>
</tbody>
</table>
<p>To dlatego <code>int id</code> w <code>GetOrder(int id)</code> przy <code>[HttpGet("{id}")]</code> działa bez jawnego <code>[FromRoute]</code> - nazwa parametru dopasowuje się do placeholdera w route.</p>
<h3>Walidacja modelu - automatyczna dzięki <code>[ApiController]</code></h3>
<pre><code class="language-csharp">public class CreateOrderRequest
{
    [Required]
    [StringLength(100)]
    public string CustomerName { get; set; }

    [Range(0.01, double.MaxValue)]
    public decimal TotalAmount { get; set; }
}

[HttpPost]
public async Task&lt;ActionResult&gt; CreateOrder(CreateOrderRequest request)
{
    // [ApiController] SAM sprawdza ModelState.IsValid PRZED wejściem do tej metody
    // jeśli walidacja nie przejdzie - automatyczny 400 Bad Request, ten kod się nawet nie wykona
    var order = await _orderService.CreateOrderAsync(request);
    return Ok(order);
}
</code></pre>
<p>Bez <code>[ApiController]</code> musiałbyś ręcznie sprawdzać <code>if (!ModelState.IsValid) return BadRequest(ModelState);</code> w każdej akcji.</p>
<h2>Czy <code>[FromBody]</code> jest wymagane?</h2>
<h3>Krótka odpowiedź: <strong>Nie, jeśli kontroler ma atrybut <code>[ApiController]</code></strong></h3>
<p><code>[ApiController]</code> <strong>automatycznie</strong> wnioskuje <code>[FromBody]</code> dla złożonych typów, więc w praktyce w Web API prawie nigdy nie musisz go pisać jawnie.</p>
<h3>Demonstracja - działa identycznie z i bez atrybutu</h3>
<pre><code class="language-csharp">[ApiController] // ← to jest kluczowe
[Route(&quot;api/[controller]&quot;)]
public class OrdersController : ControllerBase
{
    // Z jawnym [FromBody]
    [HttpPost]
    public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; CreateOrder([FromBody] CreateOrderRequest request)
    {
        // ...
    }

    // BEZ [FromBody] - działa DOKŁADNIE tak samo dzięki [ApiController]
    [HttpPost]
    public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; CreateOrder(CreateOrderRequest request)
    {
        // ...
    }
}
</code></pre>
<p><code>[ApiController]</code> stosuje regułę: <strong>złożony typ (klasa/record), który nie pasuje do żadnego segmentu route</strong> → domyślnie bindowany z body.</p>
<h3>Kiedy <code>[ApiController]</code> NIE ma i <code>[FromBody]</code> faktycznie jest wymagany</h3>
<pre><code class="language-csharp">[Route(&quot;api/[controller]&quot;)]
public class OrdersController : Controller // ⚠️ zwykły Controller, BEZ [ApiController]
{
    [HttpPost]
    public async Task&lt;ActionResult&gt; CreateOrder(CreateOrderRequest request)
    {
        // ❌ BEZ [FromBody] - request będzie PUSTY (albo z domyślnymi wartościami)!
        // Framework bez [ApiController] domyślnie próbuje bindować złożone typy
        // z form-data, NIE z JSON body, chyba że jawnie powiesz inaczej
    }

    [HttpPost]
    public async Task&lt;ActionResult&gt; CreateOrder([FromBody] CreateOrderRequest request)
    {
        // ✅ Poprawnie - jawnie wymuszasz bindowanie z JSON body
    }
}
</code></pre>
<p>To dotyczy głównie <strong>starszych kontrolerów MVC</strong> (te renderujące widoki, dziedziczące po <code>Controller</code>, nie po <code>ControllerBase</code> z <code>[ApiController]</code>) - tam <code>[FromBody]</code> jest <strong>konieczny</strong>, bo bez niego framework nie wie, że masz na myśli JSON z body, a nie np. dane z formularza.</p>
<h3>Dlaczego mimo to WARTO pisać <code>[FromBody]</code> jawnie</h3>
<p>Mimo że technicznie zbędny w <code>[ApiController]</code>, wielu zespołów (i wytyczne stylu) i tak <strong>zalecają jawne atrybuty</strong>:</p>
<p><strong>1. Czytelność / samodokumentujący się kod</strong></p>
<pre><code class="language-csharp">// Bez atrybutów - musisz PAMIĘTAĆ konwencje, żeby wiedzieć skąd co przychodzi
public async Task&lt;ActionResult&gt; Search(string status, int page, CreateOrderRequest request)

// Z atrybutami - widać OD RAZU, patrząc na sygnaturę
public async Task&lt;ActionResult&gt; Search(
    [FromQuery] string status,
    [FromQuery] int page,
    [FromBody] CreateOrderRequest request)
</code></pre>
<p><strong>2. Bezpieczeństwo przy refaktoryzacji</strong> - jeśli ktoś kiedyś usunie <code>[ApiController]</code> z klasy (np. przy migracji/łączeniu kontrolerów), kod z jawnymi atrybutami <strong>dalej działa poprawnie</strong>; kod polegający na domyślnych konwencjach <strong>cicho się zepsuje</strong>.</p>
<p><strong>3. Jednoznaczność przy wielu parametrach złożonych typów</strong> - jeśli metoda ma zarówno parametr z route, jak i z query, i coś złożonego - jawność eliminuje niejednoznaczność dla innych czytających kod.</p>
<h3>Praktyczna rekomendacja</h3>
<blockquote>
<p>W nowym kodzie z <code>[ApiController]</code> - <strong><code>[FromBody]</code> jest opcjonalny dla POST/PUT z pojedynczym złożonym parametrem</strong>, ale wielu programistów (i część zespołowych code style guide'ów) i tak go dopisuje dla czytelności.</p>
</blockquote>
<h3>Pytanie-pułapka, jakie mogą zadać na rozmowie</h3>
<p><em>"Co się stanie, jeśli usuniesz <code>[FromBody]</code> z kontrolera BEZ <code>[ApiController]</code>?"</em> - odpowiedź: request <strong>zostanie zbindowany błędnie</strong> (framework spróbuje czytać z form-data/query zamiast z JSON), co w praktyce oznacza, że <strong>wszystkie property obiektu będą miały wartości domyślne</strong> (null, 0, false) - to jeden z klasycznych, trudnych do zdiagnozowania bugów u osób migrujących ze starszego MVC albo pomijających <code>[ApiController]</code> "przez przypadek".</p>
  
  `},

  { id:"actionresult", title:"ActionResult<T> — zwracanie wyniku i błędów", tags:"actionresult ok notfound badrequest problemdetails result pattern",
  body:`
  <h1>Zwracanie rezultatu z Web API - <code>ActionResult&lt;T&gt;</code></h1>
<h2>Podstawowy wzorzec</h2>
<pre><code class="language-csharp">[HttpGet(&quot;{id}&quot;)]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id)
{
    var order = await _orderService.GetOrderAsync(id);
    if (order == null)
        return NotFound(); // 404, bez wartości

    return Ok(order); // 200 + wartość w body
}
</code></pre>
<p><code>ActionResult&lt;T&gt;</code> pozwala zwrócić <strong>albo</strong> wartość typu <code>T</code> (niejawnie konwertowaną na <code>200 OK</code>), <strong>albo</strong> dowolny inny <code>IActionResult</code> (błąd, inny status).</p>
<h2>Typowe metody pomocnicze (<code>ControllerBase</code>)</h2>
<pre><code class="language-csharp">return Ok(order);                          // 200
return Ok();                                // 200 bez body
return NotFound();                          // 404
return BadRequest(&quot;Nieprawidłowe dane&quot;);    // 400
return BadRequest(ModelState);              // 400 z błędami walidacji
return Conflict();                          // 409
return Unauthorized();                      // 401
return Forbid();                            // 403
return NoContent();                         // 204 - typowe dla DELETE/PUT bez zwracanej treści
return CreatedAtAction(nameof(GetOrder), new { id = order.Id }, order); // 201 + Location header
</code></pre>
<h2>Obsługa błędów - dwa podejścia</h2>
<p><strong>1. Zwracanie kodu błędu bezpośrednio (jak wyżej)</strong> - dobre dla typowych, oczekiwanych sytuacji (404, 400).</p>
<p><strong>2. Wyjątki + globalny middleware (dla nieoczekiwanych błędów)</strong></p>
<pre><code class="language-csharp">// Middleware do globalnej obsługi wyjątków
app.UseExceptionHandler(errorApp =&gt;
{
    errorApp.Run(async context =&gt;
    {
        context.Response.StatusCode = 500;
        var error = context.Features.Get&lt;IExceptionHandlerFeature&gt;();
        await context.Response.WriteAsJsonAsync(new { message = &quot;Wystąpił błąd serwera&quot; });
    });
});
</code></pre>
<p><strong>Wzorzec Result/OneOf (alternatywa dla wyjątków, częsta przy CQRS)</strong> - zamiast rzucać wyjątek, zwracasz obiekt reprezentujący sukces/porażkę:</p>
<pre><code class="language-csharp">public class Result&lt;T&gt;
{
    public bool IsSuccess { get; }
    public T Value { get; }
    public string Error { get; }

    public static Result&lt;T&gt; Success(T value) =&gt; new(true, value, null);
    public static Result&lt;T&gt; Failure(string error) =&gt; new(false, default, error);
}

[HttpGet(&quot;{id}&quot;)]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id)
{
    var result = await _orderService.GetOrderAsync(id);
    return result.IsSuccess ? Ok(result.Value) : NotFound(result.Error);
}
</code></pre>
<p>To unika kosztu wyjątków dla <strong>oczekiwanych</strong> błędów biznesowych (np. "zamówienie nie istnieje" to nie jest wyjątkowa sytuacja, tylko normalny wynik zapytania).</p>
<h2>ProblemDetails - standardowy format błędów (RFC 7807)</h2>
<pre><code class="language-csharp">[HttpGet(&quot;{id}&quot;)]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; GetOrder(int id)
{
    var order = await _orderService.GetOrderAsync(id);
    if (order == null)
        return NotFound(new ProblemDetails
        {
            Title = &quot;Zamówienie nie znalezione&quot;,
            Status = 404,
            Detail = $&quot;Zamówienie o id {id} nie istnieje&quot;
        });
    return Ok(order);
}
</code></pre>
<p><code>[ApiController]</code> automatycznie zwraca <code>ProblemDetails</code> dla błędów walidacji (400) - to jest <strong>standaryzowany</strong> format JSON dla błędów API, który klienci (WPF, Blazor) mogą jednolicie parsować.</p>
  
  `},

  { id:"actionresult-client", title:"ActionResult po stronie klienta", tags:"httpclient apiresult wpf blazor consuming api statuscode",
  body:`
  <h1>Wykorzystanie <code>ActionResult</code> po stronie klienta (WPF/Blazor konsumujące Web API)</h1>
<h2>Kluczowe rozróżnienie na start</h2>
<p><code>ActionResult&lt;T&gt;</code> to typ <strong>zwracany przez kontroler po stronie serwera</strong> - klient (WPF, Blazor WASM, konsola) <strong>nigdy go nie widzi bezpośrednio</strong>. Klient dostaje tylko <strong>surową odpowiedź HTTP</strong> - kod statusu (200, 404, 400...) i ewentualnie JSON w body. Zadanie klienta to <strong>zinterpretować</strong> tę odpowiedź HTTP i przełożyć ją z powrotem na coś sensownego w Twoim kodzie (sukces + dane, albo błąd + komunikat).</p>
<h2>Podstawowe podejście - <code>HttpClient</code> + sprawdzanie <code>StatusCode</code></h2>
<pre><code class="language-csharp">public class OrderApiClient : IOrderApiClient
{
    private readonly HttpClient _httpClient;
    public OrderApiClient(HttpClient httpClient) =&gt; _httpClient = httpClient;

    public async Task&lt;OrderDto&gt; GetOrderAsync(int id)
    {
        var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;);

        if (response.StatusCode == HttpStatusCode.NotFound)
            return null; // serwer zwrócił NotFound() -&gt; tu interpretujemy to jako &quot;brak zamówienia&quot;

        response.EnsureSuccessStatusCode(); // rzuci wyjątek dla innych błędów (4xx/5xx)

        return await response.Content.ReadFromJsonAsync&lt;OrderDto&gt;(); // deserializacja JSON -&gt; OrderDto
    }
}
</code></pre>
<h2>Wzorzec <code>Result&lt;T&gt;</code> po stronie klienta - odzwierciedlenie tego, co serwer zwraca</h2>
<pre><code class="language-csharp">public class ApiResult&lt;T&gt;
{
    public bool IsSuccess { get; private set; }
    public T Value { get; private set; }
    public string ErrorMessage { get; private set; }
    public HttpStatusCode StatusCode { get; private set; }

    public static ApiResult&lt;T&gt; Success(T value, HttpStatusCode statusCode)
        =&gt; new() { IsSuccess = true, Value = value, StatusCode = statusCode };

    public static ApiResult&lt;T&gt; Failure(string error, HttpStatusCode statusCode)
        =&gt; new() { IsSuccess = false, ErrorMessage = error, StatusCode = statusCode };
}
</code></pre>
<pre><code class="language-csharp">public class OrderApiClient : IOrderApiClient
{
    private readonly HttpClient _httpClient;

    public async Task&lt;ApiResult&lt;OrderDto&gt;&gt; GetOrderAsync(int id)
    {
        var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;);

        if (response.IsSuccessStatusCode)
        {
            var order = await response.Content.ReadFromJsonAsync&lt;OrderDto&gt;();
            return ApiResult&lt;OrderDto&gt;.Success(order, response.StatusCode);
        }

        // Próba odczytania ProblemDetails, jeśli serwer go zwrócił
        var problem = await response.Content.ReadFromJsonAsync&lt;ProblemDetails&gt;();
        var errorMessage = problem?.Detail ?? &quot;Wystąpił nieoczekiwany błąd&quot;;

        return ApiResult&lt;OrderDto&gt;.Failure(errorMessage, response.StatusCode);
    }
}
</code></pre>
<h2>Użycie w WPF ViewModel</h2>
<pre><code class="language-csharp">public class OrderDetailsViewModel : ViewModelBase
{
    private readonly IOrderApiClient _apiClient;

    private OrderDto _order;
    public OrderDto Order
    {
        get =&gt; _order;
        set =&gt; SetProperty(ref _order, value);
    }

    private string _errorMessage;
    public string ErrorMessage
    {
        get =&gt; _errorMessage;
        set =&gt; SetProperty(ref _errorMessage, value);
    }

    private bool _isLoading;
    public bool IsLoading
    {
        get =&gt; _isLoading;
        set =&gt; SetProperty(ref _isLoading, value);
    }

    public ICommand LoadOrderCommand { get; }

    public OrderDetailsViewModel(IOrderApiClient apiClient)
    {
        _apiClient = apiClient;
        LoadOrderCommand = new AsyncRelayCommand(LoadOrderAsync);
    }

    private async Task LoadOrderAsync()
    {
        IsLoading = true;
        ErrorMessage = null;

        var result = await _apiClient.GetOrderAsync(orderId: 5);

        if (result.IsSuccess)
        {
            Order = result.Value;
        }
        else if (result.StatusCode == HttpStatusCode.NotFound)
        {
            ErrorMessage = &quot;Zamówienie nie istnieje.&quot;;
        }
        else
        {
            ErrorMessage = result.ErrorMessage; // pokazujesz błąd w UI, binding automatycznie odświeży
        }

        IsLoading = false;
    }
}
</code></pre>
<pre><code class="language-xml">&lt;StackPanel&gt;
    &lt;TextBlock Text=&quot;{Binding ErrorMessage}&quot; Foreground=&quot;Red&quot;
               Visibility=&quot;{Binding ErrorMessage, Converter={StaticResource StringToVisibilityConverter}}&quot; /&gt;
    &lt;ProgressBar IsIndeterminate=&quot;{Binding IsLoading}&quot; /&gt;
    &lt;TextBlock Text=&quot;{Binding Order.CustomerName}&quot; /&gt;
&lt;/StackPanel&gt;
</code></pre>
<h2>Obsługa operacji zapisu (POST) - <code>CreatedAtAction</code> po stronie klienta</h2>
<p>Serwer:</p>
<pre><code class="language-csharp">[HttpPost]
public async Task&lt;ActionResult&lt;OrderDto&gt;&gt; CreateOrder(CreateOrderRequest request)
{
    var order = await _orderService.CreateOrderAsync(request);
    return CreatedAtAction(nameof(GetOrder), new { id = order.Id }, order); // 201 + Location header
}
</code></pre>
<p>Klient:</p>
<pre><code class="language-csharp">public async Task&lt;ApiResult&lt;OrderDto&gt;&gt; CreateOrderAsync(CreateOrderRequest request)
{
    var response = await _httpClient.PostAsJsonAsync(&quot;api/orders&quot;, request);

    if (response.StatusCode == HttpStatusCode.Created) // 201
    {
        var order = await response.Content.ReadFromJsonAsync&lt;OrderDto&gt;();
        return ApiResult&lt;OrderDto&gt;.Success(order, response.StatusCode);
    }

    if (response.StatusCode == HttpStatusCode.BadRequest) // 400 - błędy walidacji
    {
        var validationErrors = await response.Content.ReadFromJsonAsync&lt;ValidationProblemDetails&gt;();
        var messages = string.Join(&quot;, &quot;, validationErrors.Errors.SelectMany(e =&gt; e.Value));
        return ApiResult&lt;OrderDto&gt;.Failure(messages, response.StatusCode);
    }

    return ApiResult&lt;OrderDto&gt;.Failure(&quot;Nieznany błąd&quot;, response.StatusCode);
}
</code></pre>
<h2>Blazor - identyczny mechanizm, inny kontekst</h2>
<pre><code class="language-razor">@inject IOrderApiClient ApiClient

&lt;button @onclick=&quot;LoadOrder&quot;&gt;Załaduj zamówienie&lt;/button&gt;
@if (isLoading) { &lt;p&gt;Ładowanie...&lt;/p&gt; }
@if (errorMessage != null) { &lt;p class=&quot;text-danger&quot;&gt;@errorMessage&lt;/p&gt; }
@if (order != null) { &lt;p&gt;@order.CustomerName&lt;/p&gt; }

@code {
    private OrderDto order;
    private string errorMessage;
    private bool isLoading;

    private async Task LoadOrder()
    {
        isLoading = true;
        var result = await ApiClient.GetOrderAsync(5);

        if (result.IsSuccess) order = result.Value;
        else errorMessage = result.ErrorMessage;

        isLoading = false;
        StateHasChanged(); // ręczne odświeżenie, jeśli poza normalnym cyklem eventów
    }
}
</code></pre>
<h2>Obsługa wyjątków sieciowych (osobna kategoria od błędów HTTP)</h2>
<p>To jest <strong>inna kategoria</strong> problemów niż "serwer zwrócił 404" - tu chodzi o sytuacje, gdy <strong>w ogóle nie udało się</strong> dotrzeć do serwera:</p>
<pre><code class="language-csharp">public async Task&lt;ApiResult&lt;OrderDto&gt;&gt; GetOrderAsync(int id)
{
    try
    {
        var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;);
        // ... obsługa jak wyżej
    }
    catch (HttpRequestException ex)
    {
        // Brak połączenia, DNS się nie rozwiązał, serwer offline itd.
        return ApiResult&lt;OrderDto&gt;.Failure(&quot;Brak połączenia z serwerem&quot;, HttpStatusCode.ServiceUnavailable);
    }
    catch (TaskCanceledException ex) when (ex.InnerException is TimeoutException)
    {
        // Timeout - HttpClient.Timeout został przekroczony
        return ApiResult&lt;OrderDto&gt;.Failure(&quot;Przekroczono czas oczekiwania&quot;, HttpStatusCode.RequestTimeout);
    }
}
</code></pre>
<p>To jest ważne, żeby WPF/Blazor <strong>nigdy nie crashowało</strong> przy zerwanym połączeniu internetowym - zamiast tego pokazuje sensowny komunikat użytkownikowi.</p>
<h2>Typowany klient generowany automatycznie - alternatywa (Refit/OpenAPI)</h2>
<p>Warto wspomnieć jako ciekawostkę - zamiast ręcznie pisać <code>OrderApiClient</code> z <code>HttpClient</code>, biblioteki jak <strong>Refit</strong> pozwalają zdefiniować kontrakt jako interfejs:</p>
<pre><code class="language-csharp">public interface IOrderApi
{
    [Get(&quot;/api/orders/{id}&quot;)]
    Task&lt;ApiResponse&lt;OrderDto&gt;&gt; GetOrderAsync(int id); // ApiResponse&lt;T&gt; z Refit - opakowuje HttpResponseMessage + dane

    [Post(&quot;/api/orders&quot;)]
    Task&lt;ApiResponse&lt;OrderDto&gt;&gt; CreateOrderAsync([Body] CreateOrderRequest request);
}
</code></pre>
<p><code>ApiResponse&lt;T&gt;</code> z Refit ma podobną rolę do mojego ręcznego <code>ApiResult&lt;T&gt;</code> - opakowuje zarówno <code>StatusCode</code>, jak i zdeserializowaną wartość, żeby nie trzeba było ręcznie pisać <code>HttpClient.GetAsync</code> + sprawdzania statusu za każdym razem.</p>
<h2>Podsumowanie - most między serwerem a klientem</h2>
<blockquote>
<p>Serwerowy <code>ActionResult&lt;T&gt;</code> (<code>Ok(order)</code>, <code>NotFound()</code>, <code>BadRequest(...)</code>) tłumaczy się <strong>wyłącznie</strong> na kod statusu HTTP + opcjonalne body JSON - klient <strong>nie ma dostępu</strong> do tego, że serwer "zwrócił NotFound()", widzi tylko <code>response.StatusCode == HttpStatusCode.NotFound</code>. Dlatego kluczowe jest <strong>symetryczne</strong> zaprojektowanie obu stron: serwer konsekwentnie zwraca odpowiednie kody statusu dla różnych sytuacji, a klient (przez własny wrapper typu <code>ApiResult&lt;T&gt;</code>, albo bibliotekę jak Refit) konsekwentnie je interpretuje z powrotem na coś, co ViewModel/komponent Blazor może pokazać użytkownikowi - błąd, brak danych, albo sukces z wartością.</p>
</blockquote>
  
  `},

  { id:"db-webapi", title:"Podłączenie bazy danych do Web API", tags:"dbcontext connection string appsettings migrations di",
  body:`
  <h1>Podłączenie bazy danych do Web API</h1>
<h2>Krok 1: Pakiety NuGet</h2>
<pre><code class="language-bash">dotnet add package Microsoft.EntityFrameworkCore.SqlServer
dotnet add package Microsoft.EntityFrameworkCore.Design
</code></pre>
<h2>Krok 2: Connection string w konfiguracji</h2>
<pre><code class="language-json">// appsettings.json
{
  &quot;ConnectionStrings&quot;: {
    &quot;DefaultConnection&quot;: &quot;Server=localhost;Database=OrderDb;Trusted_Connection=True;TrustServerCertificate=True&quot;
  }
}
</code></pre>
<h2>Krok 3: DbContext</h2>
<pre><code class="language-csharp">public class AppDbContext : DbContext
{
    public AppDbContext(DbContextOptions&lt;AppDbContext&gt; options) : base(options) { }

    public DbSet&lt;Order&gt; Orders { get; set; }
    public DbSet&lt;Customer&gt; Customers { get; set; }
}
</code></pre>
<h2>Krok 4: Rejestracja w DI (<code>Program.cs</code>)</h2>
<pre><code class="language-csharp">var builder = WebApplication.CreateBuilder(args);

builder.Services.AddDbContext&lt;AppDbContext&gt;(options =&gt;
    options.UseSqlServer(builder.Configuration.GetConnectionString(&quot;DefaultConnection&quot;)));
// domyślnie Scoped - dokładnie tak, jak omawialiśmy przy Singleton/Scoped/Transient

builder.Services.AddScoped&lt;IOrderService, OrderService&gt;();
builder.Services.AddControllers();

var app = builder.Build();
app.MapControllers();
app.Run();
</code></pre>
<h2>Krok 5: Migracje - utworzenie schematu bazy</h2>
<pre><code class="language-bash">dotnet ef migrations add InitialCreate
dotnet ef database update
</code></pre>
<h2>Krok 6: Użycie w kontrolerze/serwisie (przez DI, constructor injection)</h2>
<pre><code class="language-csharp">public class OrderService : IOrderService
{
    private readonly AppDbContext _context;
    public OrderService(AppDbContext context) =&gt; _context = context; // wstrzyknięty automatycznie

    public async Task&lt;OrderDto&gt; GetOrderAsync(int id)
    {
        var order = await _context.Orders.AsNoTracking().FirstOrDefaultAsync(o =&gt; o.Id == id);
        return order == null ? null : new OrderDto(order.Id, order.CustomerName, order.TotalAmount);
    }
}
</code></pre>
<h2>Alternatywa: różne connection stringi per środowisko</h2>
<pre><code class="language-json">// appsettings.Development.json
{ &quot;ConnectionStrings&quot;: { &quot;DefaultConnection&quot;: &quot;Server=(localdb)\\\\mssqllocaldb;Database=OrderDb_Dev;...&quot; } }

// appsettings.Production.json (albo zmienne środowiskowe/Key Vault w praktyce)
{ &quot;ConnectionStrings&quot;: { &quot;DefaultConnection&quot;: &quot;...&quot; } }
</code></pre>
<p>ASP.NET Core automatycznie ładuje właściwy plik na podstawie <code>ASPNETCORE_ENVIRONMENT</code> - connection string <strong>nigdy nie powinien</strong> być hardcodowany, a w produkcji zwykle trafia do <strong>Azure Key Vault</strong>/zmiennych środowiskowych, nie do pliku w repozytorium.</p>
<h2>Podsumowanie w 4 punktach</h2>
<ol>
<li>Pakiet EF Core dla konkretnej bazy (<code>SqlServer</code>/<code>Npgsql</code> dla PostgreSQL/<code>Sqlite</code>)</li>
<li><code>DbContext</code> z <code>DbSet&lt;T&gt;</code> dla każdej tabeli</li>
<li><code>AddDbContext&lt;T&gt;()</code> w DI z connection stringiem z konfiguracji</li>
<li>Migracje (<code>dotnet ef migrations add</code> + <code>database update</code>) do utworzenia/aktualizacji schematu</li>
</ol>
  
  `},

  { id:"blazor-mvc", title:"Blazor — NIE jest MVC", tags:"blazor komponent mvvm razor lifecycle",
  body:`
  <h1>Blazor - dlaczego to NIE jest MVC</h1>
<p>To jest kluczowy punkt do zaznaczenia na rozmowie, bo błędne przypisanie Blazor do MVC to sygnał powierzchownej wiedzy. Blazor to framework <strong>komponentowy</strong> (podobny filozoficznie do React czy Angular), a nie MVC.</p>
<h2>Dwa modele hostingu Blazor</h2>
<p><strong>Blazor Server</strong> - logika wykonuje się na serwerze, UI aktualizowane przez SignalR (WebSocket) w czasie rzeczywistym.</p>
<p><strong>Blazor WebAssembly (WASM)</strong> - cały kod C# kompilowany do WebAssembly i wykonywany <strong>w przeglądarce</strong>, bez round-tripów do serwera przy każdej interakcji.</p>
<h2>Komponent Blazor - odpowiednik "View + trochę logiki"</h2>
<pre><code class="language-razor">@page &quot;/orders/{id:int}&quot;
@inject IOrderService OrderService

&lt;h3&gt;Zamówienie #@Order?.Id&lt;/h3&gt;

@if (Order == null)
{
    &lt;p&gt;Ładowanie...&lt;/p&gt;
}
else
{
    &lt;p&gt;Klient: @Order.CustomerName&lt;/p&gt;
    &lt;p&gt;Suma: @Order.Total zł&lt;/p&gt;
    &lt;button @onclick=&quot;ShipOrder&quot;&gt;Wyślij zamówienie&lt;/button&gt;
}

@code {
    [Parameter] public int Id { get; set; }
    private OrderDto Order;

    protected override async Task OnInitializedAsync()
    {
        Order = await OrderService.GetOrderAsync(Id);
    }

    private async Task ShipOrder()
    {
        await OrderService.ShipOrderAsync(Id);
        Order = await OrderService.GetOrderAsync(Id);
    }
}
</code></pre>
<h2>Dlaczego to bliżej MVVM niż MVC</h2>
<p>Komponent Blazor <strong>łączy</strong> to, co w MVC było rozdzielone na Controller + View, w <strong>jedną jednostkę</strong>:</p>
<table>
<thead>
<tr>
<th></th>
<th>MVC</th>
<th>Blazor</th>
<th>MVVM (WPF)</th>
</tr>
</thead>
<tbody>
<tr>
<td>UI (znaczniki)</td>
<td>View (<code>.cshtml</code>)</td>
<td>Sekcja HTML w <code>.razor</code></td>
<td>XAML</td>
</tr>
<tr>
<td>Logika prezentacji</td>
<td>Controller</td>
<td>Sekcja <code>@code</code> w tym samym pliku</td>
<td>ViewModel (osobny plik)</td>
</tr>
<tr>
<td>Odświeżanie UI</td>
<td>Pełne przeładowanie strony (albo ręczny JS)</td>
<td><strong>Automatyczne re-renderowanie</strong> przy zmianie stanu</td>
<td>Automatyczne przez <code>INotifyPropertyChanged</code>/binding</td>
</tr>
<tr>
<td>DI</td>
<td>Przez konstruktor kontrolera</td>
<td><code>@inject</code></td>
<td>Przez konstruktor ViewModelu</td>
</tr>
</tbody>
</table>
<p><strong><code>@inject</code></strong> w Blazor to DI - dokładnie ten sam kontener <code>Microsoft.Extensions.DependencyInjection</code>:</p>
<pre><code class="language-csharp">// Program.cs
builder.Services.AddScoped&lt;IOrderService, OrderService&gt;();
</code></pre>
<pre><code class="language-razor">@inject IOrderService OrderService
</code></pre>
<h2>Component lifecycle</h2>
<pre><code class="language-csharp">protected override void OnInitialized() { }           // odpowiednik konstruktora ViewModelu
protected override async Task OnInitializedAsync() { } // dla async inicjalizacji
protected override void OnParametersSet() { }           // gdy zmienią się [Parameter]
protected override bool ShouldRender() =&gt; true;          // kontrola czy re-renderować
</code></pre>
<h2>StateHasChanged - ręczne odświeżenie UI</h2>
<pre><code class="language-csharp">private async Task LoadDataInBackground()
{
    var data = await _service.GetDataAsync();
    Orders = data;
    StateHasChanged(); // każ Blazorowi przerenderować komponent
}
</code></pre>
<p>To jest koncepcyjnie bardzo bliskie temu, co robi <code>PropertyChanged</code> w WPF.</p>
<h2>Blazor Server vs WASM - różnice praktyczne</h2>
<table>
<thead>
<tr>
<th></th>
<th>Blazor Server</th>
<th>Blazor WebAssembly</th>
</tr>
</thead>
<tbody>
<tr>
<td>Gdzie wykonuje się kod</td>
<td>Serwer</td>
<td>Przeglądarka (WASM)</td>
</tr>
<tr>
<td>Komunikacja</td>
<td>SignalR (stałe połączenie WebSocket)</td>
<td>Bezpośrednio w przeglądarce, HTTP do API gdy trzeba</td>
</tr>
<tr>
<td>Opóźnienie interakcji</td>
<td>Zależne od sieci</td>
<td>Natychmiastowe (kod lokalnie)</td>
</tr>
<tr>
<td>Rozmiar pobrania</td>
<td>Mały</td>
<td>Duży (pobiera cały runtime .NET)</td>
</tr>
<tr>
<td>Offline</td>
<td>❌ Nie</td>
<td>✅ Może działać offline (PWA)</td>
</tr>
<tr>
<td>Skalowanie serwera</td>
<td>Każdy user = stały stan na serwerze</td>
<td>Serwer tylko serwuje pliki statyczne + API</td>
</tr>
</tbody>
</table>
<h2>Gdzie Web API i Blazor się spotykają w architekturze</h2>
<pre><code class="language-csharp">Blazor WASM (frontend) → HttpClient → ASP.NET Core Web API (backend) → Service → EF Core → baza
</code></pre>
<pre><code class="language-csharp">@inject HttpClient Http

@code {
    private List&lt;OrderDto&gt; orders;
    protected override async Task OnInitializedAsync()
    {
        orders = await Http.GetFromJsonAsync&lt;List&lt;OrderDto&gt;&gt;(&quot;api/orders&quot;);
    }
}
</code></pre>
<p><strong>Blazor Server</strong> natomiast <strong>nie potrzebuje</strong> oddzielnego Web API pośrodku - komponent może bezpośrednio wstrzyknąć <code>IOrderService</code> przez DI i wywołać go lokalnie (bo kod i tak wykonuje się na serwerze).</p>
  
  `},

  { id:"signalr-blazor", title:"SignalR w Blazor Server", tags:"signalr circuit websocket blazor server sticky sessions",
  body:`
  <h1>SignalR w Blazor Server - jak działa pod spodem</h1>
<h2>Fundamentalna różnica względem tradycyjnego web</h2>
<p>W klasycznym modelu request-response HTTP, każda interakcja (kliknięcie, wpisanie tekstu) wymaga osobnego requestu i odpowiedzi - połączenie się kończy po dostarczeniu odpowiedzi. <strong>Blazor Server działa inaczej</strong> - utrzymuje <strong>stałe, dwukierunkowe połączenie</strong> (WebSocket, z fallbackiem na Long Polling) przez SignalR przez cały czas trwania sesji użytkownika.</p>
<h2>Przepływ krok po kroku</h2>
<pre><code class="language-csharp">1. Przeglądarka ładuje stronę → mały plik HTML/JS (blazor.server.js), praktycznie bez logiki
2. JS nawiązuje połączenie SignalR (WebSocket) z serwerem
3. Serwer tworzy obiekt &quot;circuit&quot; - stan Twojej sesji Blazor (instancje komponentów, ich pola, itd.)
4. Serwer renderuje komponent do drzewa różnic (diff) i wysyła instrukcje renderowania przez WebSocket
5. Przeglądarka aplikuje te instrukcje do prawdziwego DOM (JS interop, ale minimalny)
</code></pre>
<h2>Co się dzieje przy interakcji użytkownika (np. kliknięcie)</h2>
<pre><code class="language-razor">&lt;button @onclick=&quot;ShipOrder&quot;&gt;Wyślij zamówienie&lt;/button&gt;

@code {
    private async Task ShipOrder()
    {
        await OrderService.ShipOrderAsync(Order.Id);
        Order.Status = &quot;Shipped&quot;;
    }
}
</code></pre>
<pre><code class="language-csharp">1. User klika przycisk w przeglądarce
2. JS (blazor.server.js) NIE wykonuje żadnej logiki lokalnie -
   wysyła przez WebSocket wiadomość do serwera: &quot;kliknięto onclick na tym elemencie&quot;
3. Serwer odbiera event, znajduje odpowiednią instancję komponentu (w &quot;circuit&quot;),
   wywołuje metodę ShipOrder() - CAŁA logika C# wykonuje się na serwerze
4. await OrderService.ShipOrderAsync(...) - normalny async call, jak w każdym backendzie
5. Order.Status = &quot;Shipped&quot; - zmiana stanu w pamięci NA SERWERZE
6. Blazor automatycznie wykrywa zmianę stanu, przelicza różnicę (diff) w wirtualnym drzewie UI
7. Serwer wysyła przez WebSocket TYLKO różnicę (np. &quot;zmień tekst tego elementu na X&quot;),
   NIE całą stronę na nowo
8. JS w przeglądarce aplikuje tę małą zmianę do prawdziwego DOM
</code></pre>
<p><strong>Kluczowy wniosek:</strong> żaden kod C# <strong>nigdy nie trafia do przeglądarki</strong> w Blazor Server - przeglądarka to w praktyce "cienki terminal" wyświetlający UI i przekazujący eventy, cała logika i cały stan żyje na serwerze przez cały czas trwania sesji.</p>
<h2>"Circuit" - koszt utrzymania stanu na serwerze</h2>
<p>To jest częste pytanie o wady tego podejścia - każdy podłączony użytkownik to <strong>osobny "circuit"</strong> trzymany w pamięci serwera, ze stanem wszystkich swoich komponentów (analogicznie do Scoped lifetime, o którym mówiliśmy przy DI - circuit to praktycznie odpowiednik "scope" per użytkownik, trwający cały czas sesji, a nie tylko jeden request).</p>
<p><strong>Konsekwencje praktyczne:</strong>
- Utrata połączenia (np. zerwanie WiFi) = po pewnym czasie serwer <strong>usuwa circuit</strong> i cały stan ginie - użytkownik musi odświeżyć stronę
- Skalowanie horyzontalne wymaga tzw. <strong>sticky sessions</strong> (load balancer musi kierować tego samego użytkownika zawsze do tego samego serwera, bo circuit żyje tylko na jednej instancji) - to jest realne ograniczenie architektoniczne
- Duża liczba jednoczesnych użytkowników = dużo pamięci zajętej przez stany circuitów na serwerze</p>
<p>To jest dokładnie przeciwieństwo tego, co omawialiśmy przy <code>DbContext</code>/Scoped w ASP.NET Core Web API, gdzie stan żyje tylko na czas jednego requestu i natychmiast się zwalnia.</p>
  
  `},

  { id:"pwa-rendermodes", title:"PWA i Render Modes", tags:"pwa progressive web app service worker render modes blazor united",
  body:`
  <h1>PWA (Progressive Web App) w kontekście Blazor</h1>
<h2>Co to jest PWA - ogólnie</h2>
<p>PWA to zestaw technik webowych sprawiających, że <strong>strona internetowa zachowuje się jak natywna aplikacja</strong>: można ją "zainstalować" (ikonka na pulpicie/ekranie głównym), może działać (częściowo) offline, może wysyłać powiadomienia push, otwiera się w osobnym oknie bez paska adresu przeglądarki.</p>
<h2>Kluczowe elementy PWA</h2>
<p><strong>1. Web App Manifest</strong> (<code>manifest.json</code>) - metadane aplikacji:</p>
<pre><code class="language-json">{
  &quot;name&quot;: &quot;Order Management System&quot;,
  &quot;short_name&quot;: &quot;OrderMgmt&quot;,
  &quot;start_url&quot;: &quot;/&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;icons&quot;: [
    { &quot;src&quot;: &quot;icon-512.png&quot;, &quot;sizes&quot;: &quot;512x512&quot;, &quot;type&quot;: &quot;image/png&quot; }
  ]
}
</code></pre>
<p>To pozwala przeglądarce pokazać opcję "Zainstaluj aplikację" i sprawić, że otwiera się jak natywne okno, bez UI przeglądarki.</p>
<p><strong>2. Service Worker</strong> - skrypt JS działający <strong>w tle</strong>, niezależnie od otwartej karty, przechwytujący requesty sieciowe:</p>
<pre><code class="language-javascript">// service-worker.js (uproszczony przykład)
self.addEventListener('fetch', event =&gt; {
  event.respondWith(
    caches.match(event.request).then(cached =&gt; cached || fetch(event.request))
  );
});
</code></pre>
<p>Service Worker <strong>cache'uje</strong> pliki statyczne (HTML, CSS, JS, a w przypadku Blazor WASM - też skompilowane assembly .NET), dzięki czemu aplikacja może się załadować i częściowo działać <strong>bez połączenia internetowego</strong>.</p>
<h2>PWA + Blazor WebAssembly - naturalne połączenie</h2>
<p>To jest ważny punkt koncepcyjny: <strong>PWA ma sens praktyczny głównie z Blazor WASM, nie z Blazor Server</strong>.</p>
<p><strong>Dlaczego:</strong>
- Blazor WASM uruchamia <strong>cały</strong> kod aplikacji lokalnie w przeglądarce (skompilowany do WebAssembly) - jeśli te pliki są scache'owane przez Service Worker, aplikacja <strong>faktycznie może działać offline</strong> (UI się renderuje, lokalna logika działa)
- Blazor Server <strong>wymaga stałego połączenia WebSocket z serwerem</strong> (cały "circuit" i stan żyje na serwerze) - offline w ogóle nie ma sensu, bo bez połączenia <strong>nic nie może się wykonać</strong> (nawet kliknięcie przycisku wymaga round-tripu do serwera)</p>
<pre><code class="language-bash">dotnet new blazorwasm --pwa -o MyApp
</code></pre>
<p>Ten szablon generuje projekt Blazor WASM z gotowym <code>manifest.json</code> i <code>service-worker.js</code>.</p>
<h2>Ograniczenia PWA z Blazor WASM w praktyce</h2>
<ul>
<li>Dane wymagające <strong>backendu</strong> (baza danych, autoryzacja serwerowa) i tak nie zadziałają offline - PWA daje offline dla <strong>UI i logiki lokalnej</strong>, nie dla operacji wymagających serwera</li>
<li>Synchronizacja danych po powrocie online wymaga <strong>własnej logiki</strong> (np. kolejkowanie zmian lokalnie, wysłanie ich gdy połączenie wróci) - Blazor tego nie robi automatycznie</li>
<li>Rozmiar pobrania jest większy (cały runtime .NET do WASM), więc pierwsze ładowanie offline-first bywa wolniejsze niż klasyczny SPA w czystym JS</li>
</ul>
<hr />
<h2>Render Modes w Blazor (.NET 8+) - "Blazor United"</h2>
<p>To jest jeden z <strong>największych architektonicznych zwrotów</strong> w Blazor - .NET 8 połączył Blazor Server i WASM w jeden model, z możliwością <strong>wyboru trybu renderowania per komponent</strong>.</p>
<h2>Cztery tryby renderowania</h2>
<h3>1. Static Server Rendering (SSR) - domyślny, bez interaktywności</h3>
<pre><code class="language-razor">@page &quot;/orders&quot;
@rendermode InteractiveServer  &lt;!-- lub brak = static --&gt;
</code></pre>
<p>Renderowane <strong>raz</strong> na serwerze do statycznego HTML, wysłane do przeglądarki. <strong>Brak interaktywności</strong> - żadnych <code>@onclick</code>, żadnego stanu C# działającego po stronie klienta. To jak klasyczny, tradycyjny server-rendered HTML (podobne do starego Razor Pages/MVC).</p>
<p><strong>Kiedy:</strong> strony treściowe (blog, dokumentacja, landing page) - szybkie, bez narzutu SignalR/WASM.</p>
<h3>2. Interactive Server</h3>
<pre><code class="language-razor">@page &quot;/orders&quot;
@rendermode InteractiveServer
</code></pre>
<p>To jest dokładnie ten model Blazor Server, który opisałem wyżej - SignalR, circuit na serwerze, cała logika C# wykonuje się server-side.</p>
<p><strong>Kiedy:</strong> aplikacje wymagające szybkiego czasu do pierwszej interakcji (nie czekasz na pobranie WASM), gdzie stały ruch sieciowy nie jest problemem (np. wewnętrzne narzędzia firmowe, intranet).</p>
<h3>3. Interactive WebAssembly</h3>
<pre><code class="language-razor">@page &quot;/orders&quot;
@rendermode InteractiveWebAssembly
</code></pre>
<p>To klasyczny Blazor WASM opisany wcześniej - kod pobrany i wykonywany w przeglądarce.</p>
<p><strong>Kiedy:</strong> potrzebujesz PWA/offline, chcesz odciążyć serwer (logika działa u klienta), aplikacja publiczna z wieloma jednoczesnymi userami (nie martwisz się o circuits/pamięć serwera).</p>
<h3>4. Interactive Auto - "najlepsze z obu światów"</h3>
<pre><code class="language-razor">@page &quot;/orders&quot;
@rendermode InteractiveAuto
</code></pre>
<p><strong>Najciekawszy, nowy tryb:</strong> przy <strong>pierwszym</strong> ładowaniu strony używa <strong>Blazor Server</strong> (szybki start, bez czekania na pobranie WASM), a <strong>w tle po cichu pobiera</strong> pliki WebAssembly. Przy <strong>kolejnych</strong> odwiedzinach tej samej aplikacji (WASM już scache'owany w przeglądarce) automatycznie <strong>przełącza się na WebAssembly</strong> - szybsze interakcje, mniej obciążenia serwera.</p>
<p>To rozwiązuje klasyczny dylemat "Server (szybki start, ale zależny od sieci) vs WASM (wolny start, ale szybki potem)" - użytkownik dostaje szybki start <strong>za pierwszym razem</strong> i szybkie działanie <strong>za każdym kolejnym</strong>.</p>
<h2>Per-komponent, nie tylko per-aplikacja</h2>
<p>Kluczowa elastyczność .NET 8 - <strong>różne komponenty w tej samej aplikacji mogą mieć różne render mode</strong>:</p>
<pre><code class="language-razor">@* Strona główna - statyczna, szybka, SEO-friendly *@
@page &quot;/&quot;
&lt;HomePage /&gt;

@* Panel administracyjny - interaktywny, server-side *@
@page &quot;/admin&quot;
@rendermode InteractiveServer
&lt;AdminDashboard /&gt;

@* Kalkulator w przeglądarce - offline-capable *@
@page &quot;/calculator&quot;
@rendermode InteractiveWebAssembly
&lt;Calculator /&gt;
</code></pre>
<p>To pozwala <strong>świadomie dobrać</strong> technologię do konkretnej części aplikacji - strona marketingowa nie potrzebuje SignalR ani WASM, panel admina może korzystać z Blazor Server (mało userów, dane wrażliwe lepiej zostają na serwerze), a publiczny kalkulator może być WASM (offline, brak obciążenia serwera).</p>
<h2>Tabela porównawcza wszystkich trybów</h2>
<table>
<thead>
<tr>
<th></th>
<th>Static SSR</th>
<th>Interactive Server</th>
<th>Interactive WASM</th>
<th>Interactive Auto</th>
</tr>
</thead>
<tbody>
<tr>
<td>Gdzie logika</td>
<td>Serwer (jednorazowo)</td>
<td>Serwer (cały czas)</td>
<td>Przeglądarka</td>
<td>Server → potem WASM</td>
</tr>
<tr>
<td>Interaktywność</td>
<td>❌ Brak</td>
<td>✅ Tak</td>
<td>✅ Tak</td>
<td>✅ Tak</td>
</tr>
<tr>
<td>Czas pierwszego ładowania</td>
<td>Najszybszy</td>
<td>Szybki</td>
<td>Wolny (pobiera WASM)</td>
<td>Szybki (jak Server)</td>
</tr>
<tr>
<td>Wymaga stałego połączenia</td>
<td>Nie</td>
<td>Tak (WebSocket)</td>
<td>Nie (po załadowaniu)</td>
<td>Zależnie od fazy</td>
</tr>
<tr>
<td>Offline/PWA</td>
<td>Nie dotyczy</td>
<td>❌ Nie</td>
<td>✅ Tak</td>
<td>✅ Po przełączeniu na WASM</td>
</tr>
<tr>
<td>Obciążenie serwera</td>
<td>Minimalne</td>
<td>Wysokie (stan per user)</td>
<td>Minimalne (tylko API)</td>
<td>Malejące w czasie</td>
</tr>
</tbody>
</table>
<h2>Podsumowanie - dobra odpowiedź na rozmowę o Render Modes</h2>
<blockquote>
<p><em>"Render Modes w .NET 8 rozwiązują odwieczny dylemat Blazor Server vs WASM, pozwalając wybrać model per-komponent zamiast dla całej aplikacji. Static SSR do treści bez interaktywności, Interactive Server gdy zależy mi na szybkim starcie i nie przeszkadza stałe połączenie WebSocket, Interactive WebAssembly gdy potrzebuję PWA/offline albo chcę odciążyć serwer, a Interactive Auto to kompromis - szybki start przez Server przy pierwszej wizycie, płynne przejście na WASM przy kolejnych, gdy pliki są już scache'owane."</em></p>
</blockquote>
  
  `},

  { id:"blazor-structure", title:"Struktura projektu Blazor", tags:"blazor wasm server struktura projektu shared client program.cs",
  body:`
  <h1>Standardowa struktura projektu Blazor</h1>
<h2>Blazor WebAssembly (samodzielny, bez osobnego backendu)</h2>
<pre><code class="language-csharp">MyBlazorApp/
├── wwwroot/                       ← pliki statyczne, serwowane bezpośrednio
│   ├── css/
│   │   └── app.css
│   ├── index.html                 ← jedyny &quot;prawdziwy&quot; plik HTML, punkt wejścia SPA
│   ├── favicon.png
│   ├── manifest.json              ← z rozmowy o PWA
│   └── service-worker.js          ← z rozmowy o PWA
├── Pages/                         ← komponenty routowalne (@page)
│   ├── Home.razor
│   ├── Counter.razor
│   ├── Orders/
│   │   ├── OrderList.razor
│   │   └── OrderDetails.razor
├── Shared/                        ← komponenty współdzielone, layouty
│   ├── MainLayout.razor
│   ├── NavMenu.razor
│   └── OrderCard.razor            ← reużywalny komponent (bez @page)
├── Models/                        ← modele/DTO używane w UI
│   └── OrderDto.cs
├── Services/                      ← logika, klienci API
│   ├── IOrderApiClient.cs
│   └── OrderApiClient.cs
├── wwwroot/appsettings.json       ← konfiguracja (adres API itp.)
├── _Imports.razor                 ← globalne &quot;using&quot; dla wszystkich .razor
├── App.razor                      ← korzeń routingu (&lt;Router&gt;)
├── Program.cs                     ← punkt startowy, konfiguracja DI
└── MyBlazorApp.csproj
</code></pre>
<h2>Kluczowe pliki - co robią</h2>
<p><strong><code>Program.cs</code></strong> - punkt startowy, DI (dokładnie ten sam kontener, o którym mówiliśmy przy WPF/Web API):</p>
<pre><code class="language-csharp">var builder = WebAssemblyHostBuilder.CreateDefault(args);
builder.RootComponents.Add&lt;App&gt;(&quot;#app&quot;);

builder.Services.AddHttpClient&lt;IOrderApiClient, OrderApiClient&gt;(client =&gt;
    client.BaseAddress = new Uri(builder.Configuration[&quot;ApiBaseUrl&quot;]));
builder.Services.AddScoped&lt;IOrderApiClient, OrderApiClient&gt;();

await builder.Build().RunAsync();
</code></pre>
<p><strong><code>App.razor</code></strong> - korzeń aplikacji, definiuje routing:</p>
<pre><code class="language-razor">&lt;Router AppAssembly=&quot;@typeof(App).Assembly&quot;&gt;
    &lt;Found Context=&quot;routeData&quot;&gt;
        &lt;RouteView RouteData=&quot;@routeData&quot; DefaultLayout=&quot;@typeof(MainLayout)&quot; /&gt;
    &lt;/Found&gt;
    &lt;NotFound&gt;
        &lt;LayoutView Layout=&quot;@typeof(MainLayout)&quot;&gt;
            &lt;p&gt;Strona nie znaleziona&lt;/p&gt;
        &lt;/LayoutView&gt;
    &lt;/NotFound&gt;
&lt;/Router&gt;
</code></pre>
<p><strong><code>_Imports.razor</code></strong> - globalne <code>using</code>, żeby nie powtarzać w każdym komponencie:</p>
<pre><code class="language-razor">@using System.Net.Http
@using Microsoft.AspNetCore.Components.Routing
@using MyBlazorApp.Models
@using MyBlazorApp.Services
</code></pre>
<p><strong><code>wwwroot/index.html</code></strong> - punkt wejścia dla WASM (jedyny "prawdziwy" HTML):</p>
<pre><code class="language-html">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;link href=&quot;css/app.css&quot; rel=&quot;stylesheet&quot; /&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div id=&quot;app&quot;&gt;Ładowanie...&lt;/div&gt;
    &lt;script src=&quot;_framework/blazor.webassembly.js&quot;&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
</code></pre>
<p><strong><code>Shared/MainLayout.razor</code></strong> - wspólny layout (nagłówek, menu, stopka):</p>
<pre><code class="language-razor">@inherits LayoutComponentBase

&lt;div class=&quot;page&quot;&gt;
    &lt;NavMenu /&gt;
    &lt;main&gt;
        @Body
    &lt;/main&gt;
&lt;/div&gt;
</code></pre>
<hr />
<h2>Blazor Server - struktura minimalnie inna</h2>
<pre><code class="language-csharp">MyBlazorServerApp/
├── wwwroot/
│   └── css/site.css
├── Pages/
│   ├── _Host.cshtml               ← plik startowy (Razor Page, nie .razor!), serwuje pierwszą stronę
│   ├── Home.razor
│   └── Orders/
├── Shared/
│   ├── MainLayout.razor
│   └── NavMenu.razor
├── Data/                          ← często zamiast Services/ w domyślnym szablonie
│   └── OrderService.cs
├── Hubs/                          ← opcjonalnie, jeśli własne SignalR huby poza domyślnym Blazor
├── App.razor
├── Program.cs
├── appsettings.json                ← configi PO STRONIE SERWERA (connection stringi itd.)
└── MyBlazorServerApp.csproj
</code></pre>
<p><strong>Kluczowa różnica:</strong> <code>Pages/_Host.cshtml</code> (Razor Page, nie komponent Blazor) - to jest <strong>klasyczna</strong> strona ASP.NET Core, która renderuje <strong>pierwszy</strong> komponent Blazor i ładuje skrypt <code>blazor.server.js</code> (SignalR). Bezpośredni dostęp do bazy z <code>Data/OrderService.cs</code> jest tu bardziej naturalny (bo kod i tak wykonuje się na serwerze, jak omawialiśmy przy SignalR/circuit).</p>
<pre><code class="language-csharp">// Program.cs - Blazor Server
builder.Services.AddRazorPages();
builder.Services.AddServerSideBlazor();
builder.Services.AddDbContext&lt;AppDbContext&gt;(options =&gt; options.UseSqlServer(connectionString)); // bezpośredni EF Core

app.MapBlazorHub(); // endpoint SignalR
app.MapFallbackToPage(&quot;/_Host&quot;);
</code></pre>
<hr />
<h2>.NET 8+ Blazor Web App (połączony model, z Render Modes)</h2>
<p>Nowy, ujednolicony szablon łączący wszystko, o czym mówiliśmy przy Render Modes:</p>
<pre><code class="language-csharp">MyBlazorWebApp/
├── Client/                        ← osobny PROJEKT dla komponentów WASM
│   ├── Program.cs
│   ├── _Imports.razor
│   └── Pages/
│       └── Counter.razor          ← komponent renderowany jako WASM
├── Components/                    ← komponenty renderowane server-side (domyślnie)
│   ├── Layout/
│   │   ├── MainLayout.razor
│   │   └── NavMenu.razor
│   ├── Pages/
│   │   ├── Home.razor
│   │   └── Weather.razor
│   ├── App.razor                  ← korzeń, teraz zawiera &lt;html&gt;/&lt;head&gt;/&lt;body&gt;
│   └── Routes.razor                ← wydzielony routing (osobno od App.razor)
├── wwwroot/
├── Program.cs                     ← host WSZYSTKICH render modes naraz
└── MyBlazorWebApp.csproj
</code></pre>
<p><strong>Kluczowa nowość</strong> - <code>Program.cs</code> konfiguruje <strong>oba</strong> modele naraz:</p>
<pre><code class="language-csharp">builder.Services.AddRazorComponents()
    .AddInteractiveServerComponents()      // Interactive Server
    .AddInteractiveWebAssemblyComponents(); // Interactive WebAssembly

app.MapRazorComponents&lt;App&gt;()
    .AddInteractiveServerRenderMode()
    .AddInteractiveWebAssemblyRenderMode()
    .AddAdditionalAssemblies(typeof(MyBlazorWebApp.Client._Imports).Assembly); // odwołanie do projektu Client
</code></pre>
<p><strong><code>Client/</code></strong> to <strong>osobny projekt</strong> (<code>.csproj</code>) w tym samym rozwiązaniu - kod tam skompilowany do WASM i faktycznie pobierany przez przeglądarkę, podczas gdy <code>Components/</code> w głównym projekcie domyślnie renderuje się server-side, chyba że komponent jawnie oznaczysz <code>@rendermode InteractiveWebAssembly</code>.</p>
<hr />
<h2>Typowa architektura z osobnym Web API</h2>
<p>Dla Blazor WASM komunikującego się z <strong>osobnym</strong> backendem (dokładnie architektura "WPF/Blazor → Web API → EF Core"):</p>
<pre><code class="language-csharp">MySolution/
├── MyApp.Client/              ← Blazor WASM (frontend)
│   ├── Pages/
│   ├── Services/
│   │   └── OrderApiClient.cs  ← HttpClient do wywołań API
│   └── Program.cs
├── MyApp.Api/                 ← ASP.NET Core Web API (backend)
│   ├── Controllers/
│   │   └── OrdersController.cs
│   ├── Services/
│   │   └── OrderService.cs
│   ├── Data/
│   │   └── AppDbContext.cs
│   └── Program.cs
└── MyApp.Shared/              ← WSPÓLNY projekt z DTO, używany przez OBA powyższe
    └── DTOs/
        └── OrderDto.cs
</code></pre>
<p><strong><code>MyApp.Shared</code></strong> to ważny, praktyczny wzorzec - projekt z <strong>wspólnymi DTO/Command/Query</strong>, referencowany zarówno przez <code>Client</code>, jak i <code>Api</code>. Dzięki temu <code>OrderDto</code> w <code>record</code> (jak omawialiśmy) jest <strong>zdefiniowany raz</strong>, a nie duplikowany po obu stronach - zmiana kontraktu w jednym miejscu jest widoczna po obu stronach kompilacji.</p>
<h2>Podsumowanie - jak wybrać strukturę</h2>
<table>
<thead>
<tr>
<th>Scenariusz</th>
<th>Struktura</th>
</tr>
</thead>
<tbody>
<tr>
<td>Prosta aplikacja WASM, mały zespół</td>
<td>Standardowy szablon <code>blazorwasm</code> (Pages/Shared/Services)</td>
</tr>
<tr>
<td>Blazor Server, dostęp bezpośrednio do bazy</td>
<td>Standardowy szablon <code>blazorserver</code> (Data/ zamiast Services/)</td>
</tr>
<tr>
<td>.NET 8+, chcesz elastyczność Render Modes</td>
<td>Blazor Web App (Client + Components w jednym rozwiązaniu)</td>
</tr>
<tr>
<td>WASM + osobny, reużywalny Web API (np. też dla WPF/mobile)</td>
<td>Trzy projekty: <code>Client</code>, <code>Api</code>, <code>Shared</code> (DTO)</td>
</tr>
</tbody>
</table>
