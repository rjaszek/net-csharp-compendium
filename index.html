const CATS = [

/* ============================== 1. SOLID / CLEAN CODE / DI ============================== */
{
  id: "solid",
  title: "SOLID, Clean Code, DI",
  topics: [

  { id:"oop-enterprise", title:"OOP i \"Enterprise OOP\"", tags:"oop encapsulation inheritance polymorphism abstraction enterprise overengineering yagni",
  body:`
  <h1>OOP i "Enterprise OOP"</h1>
<h2>OOP - cztery filary</h2>
<p>Programowanie obiektowe opiera się na czterech zasadach, które w praktyce już wielokrotnie przewijały się w naszej rozmowie (SOLID, modyfikatory dziedziczenia, <code>abstract</code>/<code>interface</code>) - tu zbieram je w jedną, zwięzłą odpowiedź na klasyczne pytanie "co to jest OOP".</p>
<h3>1. Encapsulation (hermetyzacja)</h3>
<p>Ukrycie wewnętrznego stanu obiektu i kontrola dostępu do niego przez publiczne API.</p>
<pre><code class="language-csharp">public class BankAccount
{
    private decimal _balance; // stan UKRYTY, niedostępny z zewnątrz

    public decimal Balance =&gt; _balance; // tylko odczyt z zewnątrz

    public void Deposit(decimal amount)
    {
        if (amount &lt;= 0) throw new ArgumentException(&quot;Kwota musi być pozytywna&quot;);
        _balance += amount; // jedyny sposób modyfikacji - przez kontrolowaną metodę
    }
}
</code></pre>
<p>To wraca do modyfikatorów dostępu, o których mówiliśmy - <code>private</code>/<code>protected</code> to mechanizm, który to fizycznie wymusza.</p>
<h3>2. Inheritance (dziedziczenie)</h3>
<p>Klasa pochodna dziedziczy zachowanie i stan klasy bazowej - to dokładnie <code>virtual</code>/<code>override</code>/<code>abstract</code>, które już omawialiśmy przy modyfikatorach dziedziczenia.</p>
<h3>3. Polymorphism (polimorfizm)</h3>
<p>Ten sam interfejs/metoda zachowuje się różnie zależnie od faktycznego typu obiektu w runtime.</p>
<pre><code class="language-csharp">Animal[] animals = { new Dog(), new Cat() };
foreach (var a in animals) a.MakeSound(); // WOŁA różną implementację, ta SAMA linijka kodu
</code></pre>
<h3>4. Abstraction (abstrakcja)</h3>
<p>Ukrycie złożoności implementacji za prostym interfejsem - <code>IOrderRepository</code> nie mówi Ci <em>jak</em> dane są zapisywane, tylko <em>co</em> można z nim zrobić.</p>
<hr />
<h2>"Enterprise OOP" - termin krytyczny, nie techniczny</h2>
<p>To jest ważne rozróżnienie: <strong>"Enterprise OOP" nie jest formalną nazwą kolejnego wzorca projektowego</strong> - to <strong>potoczny, lekko ironiczny termin</strong> opisujący patologiczne nadużycie zasad OOP/SOLID w dużych, korporacyjnych kodowbazach (klasycznie kojarzone z Java EE/Spring z lat 2000., ale to samo zdarza się w .NET) - gdzie proste zadanie zostaje owinięte w kilkanaście warstw abstrakcji "na wszelki wypadek", bez realnej potrzeby biznesowej.</p>
<h3>Skąd się to bierze - historyczny punkt odniesienia</h3>
<p>Istnieje słynny, satyryczny projekt open-source <strong>FizzBuzzEnterpriseEdition</strong> - implementacja trywialnego zadania rekrutacyjnego FizzBuzz (wypisz liczby 1-100, "Fizz" dla podzielnych przez 3, "Buzz" dla podzielnych przez 5) rozdmuchana do dziesiątek klas, fabryk, strategii i interfejsów - żeby w praktyce pokazać, jak wygląda ten antywzorzec, kiedy zastosuje się "wszystkie dobre praktyki" bez zastanowienia, czy problem tego wymaga.</p>
<h2>Rozbudowany przykład - kalkulacja rabatu zamówienia</h2>
<p>To jest częste zadanie rekrutacyjne w wersji biznesowej (nie abstrakcyjnej jak FizzBuzz): <em>"oblicz cenę zamówienia po rabacie - 10% zniżki, jeśli suma przekracza 1000 zł"</em>. Zobaczmy, jak wygląda to samo zadanie w stylu "Enterprise OOP" i jak wygląda pragmatyczne rozwiązanie - to jest dobry materiał do pokazania na rozmowie, że rozumiesz <strong>różnicę</strong>, nie tylko potrafisz wymienić wzorce.</p>
<h3>Wersja "Enterprise OOP" - 9 typów, żeby policzyć jeden rabat</h3>
<pre><code class="language-csharp">// --- Kontrakty ---
public enum DiscountPolicyType { Standard, None }

public interface IDiscountPolicy
{
    decimal Apply(decimal amount);
}

public interface IDiscountPolicyFactory
{
    IDiscountPolicy Create(DiscountPolicyType type);
}

public interface IDiscountPolicyFactoryProvider
{
    IDiscountPolicyFactory GetFactory();
}

public interface IOrderDiscountOrchestrator
{
    decimal Calculate(OrderDiscountRequest request);
}

// --- DTO żądania (bo przekazanie samego &quot;decimal&quot; byłoby &quot;nieelastyczne&quot;) ---
public sealed class OrderDiscountRequest
{
    public decimal Amount { get; init; }
    public DiscountPolicyType PolicyType { get; init; }
}

// --- Implementacje polityk rabatowych ---
public sealed class StandardDiscountPolicy : IDiscountPolicy
{
    private const decimal Threshold = 1000m;
    private const decimal Rate = 0.10m;

    public decimal Apply(decimal amount)
        =&gt; amount &gt;= Threshold ? amount - amount * Rate : amount;
}

public sealed class NoDiscountPolicy : IDiscountPolicy
{
    public decimal Apply(decimal amount) =&gt; amount;
}

// --- Fabryka polityk ---
public sealed class DiscountPolicyFactory : IDiscountPolicyFactory
{
    public IDiscountPolicy Create(DiscountPolicyType type) =&gt; type switch
    {
        DiscountPolicyType.Standard =&gt; new StandardDiscountPolicy(),
        _ =&gt; new NoDiscountPolicy()
    };
}

// --- Dostawca fabryki - bo &quot;a co jeśli w przyszłości będzie WIELE fabryk?&quot; ---
public sealed class DiscountPolicyFactoryProvider : IDiscountPolicyFactoryProvider
{
    public IDiscountPolicyFactory GetFactory() =&gt; new DiscountPolicyFactory();
}

// --- &quot;Orchestrator&quot; - bo samo wywołanie polityki byłoby zbyt bezpośrednie ---
public sealed class OrderDiscountOrchestrator : IOrderDiscountOrchestrator
{
    private readonly IDiscountPolicyFactoryProvider _provider;

    public OrderDiscountOrchestrator(IDiscountPolicyFactoryProvider provider)
        =&gt; _provider = provider;

    public decimal Calculate(OrderDiscountRequest request)
    {
        var factory = _provider.GetFactory();
        var policy = factory.Create(request.PolicyType);
        return policy.Apply(request.Amount);
    }
}

// --- Rejestracja w DI - i tak trzeba to WSZYSTKO podłączyć ---
var services = new ServiceCollection(); // z Microsoft.Extensions.DependencyInjection
services.AddSingleton&lt;IDiscountPolicyFactoryProvider, DiscountPolicyFactoryProvider&gt;();
services.AddSingleton&lt;IOrderDiscountOrchestrator, OrderDiscountOrchestrator&gt;();
var serviceProvider = services.BuildServiceProvider(); // zamienia rejestr w działający kontener

// --- Użycie ---
var orchestrator = serviceProvider.GetRequiredService&lt;IOrderDiscountOrchestrator&gt;();
var total = orchestrator.Calculate(new OrderDiscountRequest
{
    Amount = 1200m,
    PolicyType = DiscountPolicyType.Standard
});
</code></pre>
<p><strong>Policzmy:</strong> 4 interfejsy, 5 klas, 1 enum, 1 DTO, 2 rejestracje DI - <strong>9 typów</strong>, żeby wykonać jedno porównanie i jedno mnożenie. Każdy z tych elementów "broni się" pojedynczo (Factory Pattern! Dependency Inversion! Single Responsibility!), ale <strong>razem</strong> rozwiązują problem, który w ogóle nie istnieje: nikt nie zgłosił potrzeby wielu fabryk polityk, ani wielu dostawców fabryk.</p>
<h3>Wersja pragmatyczna - to samo zadanie</h3>
<pre><code class="language-csharp">public static class OrderPricing
{
    private const decimal DiscountThreshold = 1000m;
    private const decimal DiscountRate = 0.10m;

    public static decimal CalculateTotal(decimal amount)
        =&gt; amount &gt;= DiscountThreshold ? amount * (1 - DiscountRate) : amount;
}
</code></pre>
<pre><code class="language-csharp">var total = OrderPricing.CalculateTotal(1200m); // 1080
</code></pre>
<p><strong>1 metoda, 2 stałe.</strong> Identyczny wynik, w pełni testowalna (<code>[Theory]</code>/<code>[InlineData]</code>, jak omawialiśmy przy xUnit), czytelna dla każdego, kto otworzy ten plik po raz pierwszy.</p>
<h3>Kiedy wersja "enterprise" faktycznie miałaby sens</h3>
<p>Żeby być fair - rozbudowana wersja <strong>przestaje być patologią</strong>, gdy realnie potrzebujesz: różnych polityk rabatowych <strong>wybieranych w runtime</strong> na podstawie konfiguracji/segmentu klienta, <strong>wielu niezależnych</strong> dostawców fabryk (np. per-region, per-tenant w multi-tenant SaaS), albo gdy <code>IDiscountPolicy</code> ma <strong>rzeczywiście wiele</strong> implementacji używanych zamiennie w produkcji. Różnica między dobrym designem a "Enterprise OOP" to nie <strong>obecność</strong> abstrakcji, tylko czy abstrakcja odpowiada na <strong>istniejącą, potwierdzoną</strong> potrzebę, czy tylko na hipotetyczną "a może kiedyś".</p>
<h2>Jak rozpoznać "Enterprise OOP" w praktyce - checklist</h2>
<table>
<thead>
<tr>
<th>Sygnał</th>
<th>Przykład</th>
</tr>
</thead>
<tbody>
<tr>
<td>Interfejs z <strong>jedną</strong> implementacją, na zawsze</td>
<td><code>IOrderValidator</code> z jedyną klasą <code>OrderValidator</code>, nigdy podmienioną</td>
</tr>
<tr>
<td>Głęboka hierarchia dziedziczenia "na przyszłość"</td>
<td><code>AbstractBaseServiceProviderFactoryManager</code></td>
</tr>
<tr>
<td>Wzorzec projektowy zastosowany bez problemu, który rozwiązuje</td>
<td>Strategy dla logiki, która nigdy się nie zmienia</td>
</tr>
<tr>
<td>Warstwy pośredniczące niedodające wartości</td>
<td>Generyczne Repository nad EF Core, o którym mówiliśmy - <code>GetAllAsync()</code> zwracające to, co <code>DbSet</code> już daje</td>
</tr>
<tr>
<td>"Provider" dostawcy fabryki dostawcy</td>
<td>Jak w przykładzie wyżej - <code>IDiscountPolicyFactoryProvider</code></td>
</tr>
<tr>
<td>Nazwy klas dłuższe niż ich zawartość</td>
<td><code>AbstractSingletonProxyFactoryBean</code> (prawdziwa klasa ze Springa, klasyczny żart w tym środowisku)</td>
</tr>
</tbody>
</table>
<h2>Dlaczego to jest ważne na rozmowie SE III</h2>
<p>To jest właściwie <strong>domknięcie</strong> tematu SOLID, o którym rozmawialiśmy na samym początku - dobra odpowiedź na "co sądzisz o SOLID" nie kończy się na entuzjastycznym wyliczeniu zasad, tylko pokazuje <strong>umiar</strong>: znajomość <strong>YAGNI</strong> ("You Aren't Gonna Need It") i <strong>KISS</strong> ("Keep It Simple") jako przeciwwagi. Rozmówca na poziomie SE III często właśnie tego szuka - czy kandydat wie, <strong>kiedy przestać</strong> stosować wzorce, a nie tylko że je zna.</p>
<div class="callout"><strong>Dobra, zwięzła odpowiedź na rozmowie:</strong> "OOP to encapsulation, inheritance, polymorphism i abstraction - fundament, na którym stoi SOLID. 'Enterprise OOP' to nieformalny, krytyczny termin na nadużywanie tych zasad - tworzenie abstrakcji, fabryk i interfejsów bez realnej, potwierdzonej potrzeby, tylko 'bo to dobra praktyka'. Klasyczny przykład to satyryczny projekt FizzBuzzEnterpriseEdition. Dobre wykorzystanie OOP to nie maksymalizacja liczby wzorców w kodzie, tylko rozwiązanie konkretnego problemu z odpowiednim, minimalnym poziomem abstrakcji - a każdą dodatkową warstwę powinieneś umieć uzasadnić konkretną, istniejącą potrzebą, nie hipotetyczną przyszłością."</div>
  
  `},

  { id:"solid-basics", title:"Zasady SOLID", tags:"solid srp ocp lsp isp dip",
  body:`
  <h1>SOLID - zasady projektowania obiektowego</h1>
<p>SOLID to akronim pięciu zasad programowania obiektowego, sformułowanych głównie przez Roberta C. Martina ("Uncle Bob"), które pomagają pisać kod łatwiejszy w utrzymaniu, testowaniu i rozszerzaniu.</p>
<h2>S - Single Responsibility Principle (Zasada pojedynczej odpowiedzialności)</h2>
<p>Klasa powinna mieć tylko jeden powód do zmiany - czyli odpowiadać tylko za jedną rzecz.</p>
<pre><code class="language-csharp">// Źle - klasa robi za dużo
public class User
{
    public void SaveToDatabase() { /* ... */ }
    public void SendEmail() { /* ... */ }
    public void ValidateData() { /* ... */ }
}

// Dobrze - rozdzielone odpowiedzialności
public class User { /* tylko dane użytkownika */ }
public class UserRepository { public void SaveToDatabase(User user) { /* ... */ } }
public class EmailService { public void SendEmail(User user) { /* ... */ } }
public class UserValidator { public void Validate(User user) { /* ... */ } }
</code></pre>
<h2>O - Open/Closed Principle (Zasada otwarte-zamknięte)</h2>
<p>Kod powinien być otwarty na rozszerzenie, ale zamknięty na modyfikację. Zamiast zmieniać istniejący kod, dodajesz nowy.</p>
<pre><code class="language-csharp">// Źle - trzeba modyfikować przy każdym nowym typie
public class PaymentProcessor
{
    public void Process(string type)
    {
        if (type == &quot;card&quot;) { /* ... */ }
        else if (type == &quot;blik&quot;) { /* ... */ }
    }
}

// Dobrze - dodajesz nową klasę zamiast modyfikować istniejący kod
public interface IPaymentMethod { void Process(); }
public class CardPayment : IPaymentMethod { public void Process() { /* ... */ } }
public class BlikPayment : IPaymentMethod { public void Process() { /* ... */ } }
</code></pre>
<h2>L - Liskov Substitution Principle (Zasada podstawienia Liskov)</h2>
<p>Obiekty klasy pochodnej muszą dać się podstawić w miejsce obiektów klasy bazowej bez zaburzenia poprawności programu.</p>
<pre><code class="language-csharp">// Źle - narusza LSP, bo Ostrich &quot;łamie&quot; zachowanie Bird
public class Bird { public virtual void Fly() { /* ... */ } }
public class Ostrich : Bird
{
    public override void Fly() { throw new Exception(&quot;Struś nie lata!&quot;); }
}

// Dobrze - osobna hierarchia dla ptaków nielatających
public class Bird { public virtual void Move() { /* ... */ } }
public class FlyingBird : Bird { public virtual void Fly() { /* ... */ } }
public class Ostrich : Bird { /* nie ma Fly() */ }
</code></pre>
<h2>I - Interface Segregation Principle (Zasada segregacji interfejsów)</h2>
<p>Lepiej mieć wiele małych, wyspecjalizowanych interfejsów niż jeden duży - klient nie powinien być zmuszany do implementowania metod, których nie potrzebuje.</p>
<pre><code class="language-csharp">// Źle - jeden &quot;gruby&quot; interfejs
public interface IWorker
{
    void Work();
    void Eat();
}

// Dobrze - rozdzielone interfejsy
public interface IWorkable { void Work(); }
public interface IEatable { void Eat(); }
public class Robot : IWorkable { public void Work() { /* ... */ } } // nie musi implementować Eat()
</code></pre>
<h2>D - Dependency Inversion Principle (Zasada odwrócenia zależności)</h2>
<p>Moduły wysokiego poziomu nie powinny zależeć od modułów niskiego poziomu - obie strony powinny zależeć od abstrakcji (interfejsów), nie od konkretnych implementacji.</p>
<pre><code class="language-csharp">// Źle - bezpośrednia zależność od konkretnej implementacji
public class OrderService
{
    private MySqlDatabase _db = new MySqlDatabase();
}

// Dobrze - zależność od abstrakcji, wstrzykiwana z zewnątrz
public interface IDatabase { void Save(object data); }
public class OrderService
{
    private readonly IDatabase _db;
    public OrderService(IDatabase db) { _db = db; } // MySQL, Postgres, cokolwiek
}
</code></pre>
<hr />
<p>Praktyczny sens SOLID nie polega na stosowaniu tego dogmatycznie w każdej linijce kodu (łatwo popaść w przesadny abstrakcjonizm), ale na tym, żeby mieć te zasady z tyłu głowy, gdy kod zaczyna być trudny w testowaniu, sztywny na zmiany albo gdy jedna zmiana w jednym miejscu psuje coś w drugim - to zwykle sygnał, że któraś z tych zasad jest łamana.</p>
  
  `},

  body:`
  <h1>Clean Code - czysty kod</h1>
<p>Clean Code to zbiór zasad i praktyk pisania kodu, który jest <strong>czytelny, zrozumiały i łatwy w utrzymaniu</strong> - nie tylko dla komputera, ale przede wszystkim dla ludzi, którzy będą go czytać i modyfikować (włącznie z Tobą za pół roku). Termin spopularyzował Robert C. Martin w książce "Clean Code" (2008).</p>
<p>Kluczowa idea: <strong>kod czyta się dużo częściej niż się go pisze</strong>, więc optymalizacja pod czytelność się opłaca.</p>
<h2>Główne zasady</h2>
<h3>1. Nazewnictwo ma znaczenie</h3>
<p>Nazwy zmiennych, funkcji i klas powinny jasno mówić, co robią - bez potrzeby komentarza.</p>
<pre><code class="language-csharp">// Źle
var d = 30; // dni do wygaśnięcia
decimal Calc(decimal a, decimal b) =&gt; a * b * 0.23m;

// Dobrze
var daysUntilExpiration = 30;
decimal CalculateVatAmount(decimal netPrice, decimal quantity)
{
    return netPrice * quantity * VAT_RATE;
}
</code></pre>
<h3>2. Funkcje robią jedną rzecz i są krótkie</h3>
<p>Jeśli funkcja ma nazwę z "i" ("PobierzIZapisz") albo trzeba przewijać, żeby ją przeczytać - to sygnał, że robi za dużo.</p>
<pre><code class="language-csharp">// Źle - funkcja robi 3 różne rzeczy
public async Task ProcessOrder(Order order)
{
    // walidacja
    if (order.Items.Count == 0) throw new Exception(&quot;empty&quot;);
    // zapis do bazy
    await db.Orders.InsertAsync(order);
    // wysyłka maila
    await mailer.Send(order.CustomerEmail, &quot;Potwierdzenie&quot;);
}

// Dobrze - rozbite na czytelne kroki
public async Task ProcessOrder(Order order)
{
    ValidateOrder(order);
    await SaveOrder(order);
    await SendConfirmationEmail(order);
}
</code></pre>
<h3>3. Unikaj duplikacji (DRY - Don't Repeat Yourself)</h3>
<p>Powtarzający się kod to miejsce, gdzie błąd trzeba będzie poprawić w wielu miejscach naraz.</p>
<h3>4. Komentarze tłumaczą "dlaczego", nie "co"</h3>
<p>Dobry kod sam mówi <em>co</em> robi. Komentarz ma sens tam, gdzie trzeba wyjaśnić decyzję, która nie jest oczywista z samego kodu.</p>
<pre><code class="language-csharp">// Źle - komentarz opisuje oczywisty kod
// zwiększ licznik o 1
counter++;

// Dobrze - komentarz tłumaczy nieoczywisty powód
// Retry z opóźnieniem, bo API hub.ag3nts.org czasem zwraca 429
// przy równoległych requestach z wielu agentów
await Task.Delay(1000);
</code></pre>
<h3>5. Małe klasy/moduły z jasną odpowiedzialnością</h3>
<p>To w zasadzie SOLID w pigułce - każdy moduł powinien mieć jeden, jasny powód istnienia (patrz Single Responsibility Principle, o którym rozmawialiśmy przy SOLID).</p>
<h3>6. Obsługa błędów jest częścią logiki, nie dodatkiem</h3>
<pre><code class="language-csharp">// Źle - błąd ginie po cichu
try
{
    await agent.Run();
}
catch (Exception e)
{
    Console.WriteLine(&quot;error&quot;);
}

// Dobrze - błąd jest widoczny i informacyjny
try
{
    await agent.Run();
}
catch (Exception error)
{
    logger.Error($&quot;Agent {agent.Name} failed: {error.Message}&quot;, error);
    throw new AgentExecutionException(agent.Name, error);
}
</code></pre>
<h3>7. Konsystencja i formatowanie</h3>
<p>Jeden styl w całym projekcie (stąd popularność ESLint/Prettier w JS, StyleCop/EditorConfig w C#) - mniej "szumu" wizualnego, mózg nie musi się przestawiać między konwencjami.</p>
<h2>Test na "czysty kod"</h2>
<p>Kilka pytań pomocniczych, które warto sobie zadać patrząc na kod:
- Czy ktoś inny (albo ja za 3 miesiące) zrozumie to bez tłumaczenia?
- Czy nazwa funkcji mówi dokładnie to, co ona robi - nic więcej, nic mniej?
- Czy mógłbym to przetestować bez owijania połowy aplikacji mockami?
- Czy zmiana w jednym miejscu nie wymusza zmian w pięciu innych?</p>
<hr />
<p>Clean Code i SOLID mocno się przenikają - SOLID to bardziej reguły <em>strukturalne</em> (jak dzielić odpowiedzialności między klasy/moduły), a Clean Code to szerszy zestaw praktyk na poziomie <em>stylu i czytelności</em> pojedynczych funkcji, nazw, komentarzy.</p>
  
  `},

  { id:"di-mvvm-concept", title:"DI w MVVM — koncepcja", tags:"di dependency injection mvvm viewmodel",
  body:`
  <h1>Dependency Injection w architekturze MVVM</h1>
<h2>Krótkie przypomnienie: czym jest MVVM</h2>
<p><strong>MVVM (Model-View-ViewModel)</strong> to wzorzec architektoniczny dzielący aplikację na trzy warstwy:</p>
<ul>
<li><strong>Model</strong> - dane i logika biznesowa (np. pobieranie danych z API, baza danych)</li>
<li><strong>View</strong> - warstwa UI (komponenty, ekrany) - "głupia", tylko wyświetla</li>
<li><strong>ViewModel</strong> - pośrednik między Model a View - trzyma stan UI, reaguje na akcje użytkownika, woła Model</li>
</ul>
<p>View "obserwuje" ViewModel (przez binding/reaktywność), a ViewModel nie wie nic o View - to kluczowe dla testowalności.</p>
<h2>Gdzie w tym wszystkim jest DI?</h2>
<p>Problem: ViewModel <strong>potrzebuje</strong> dostępu do Modelu (np. serwisu API, repozytorium danych), żeby wykonać swoją pracę. Pytanie brzmi - <strong>skąd ViewModel bierze te zależności?</strong></p>
<h3>Bez DI (źle) - ViewModel sam tworzy swoje zależności</h3>
<pre><code class="language-csharp">public class UserProfileViewModel
{
    private readonly UserApiService _apiService = new UserApiService(); // sztywno wpisana konkretna klasa
    private readonly ConsoleLogger _logger = new ConsoleLogger();

    public async Task LoadUser(string id)
    {
        _logger.Log(&quot;Loading user...&quot;);
        var user = await _apiService.GetUser(id);
    }
}
</code></pre>
<p>To narusza Dependency Inversion Principle, o którym rozmawialiśmy przy SOLID - ViewModel jest <strong>ciasno powiązany</strong> (tightly coupled) z konkretną implementacją <code>UserApiService</code>. Skutki:
- Nie da się podmienić na mocka w testach jednostkowych
- Nie da się użyć innego źródła danych (np. cache, inny endpoint) bez zmiany kodu ViewModelu
- Trudno zarządzać cyklem życia zależności (np. singleton vs nowa instancja)</p>
<h3>Z DI (dobrze) - zależności są wstrzykiwane z zewnątrz</h3>
<pre><code class="language-csharp">public interface IUserApiService
{
    Task&lt;User&gt; GetUser(string id);
}

public interface ILogger
{
    void Log(string message);
}

public class UserProfileViewModel
{
    private readonly IUserApiService _apiService;
    private readonly ILogger _logger;

    public UserProfileViewModel(IUserApiService apiService, ILogger logger)
    {
        _apiService = apiService;
        _logger = logger;
    }

    public async Task LoadUser(string id)
    {
        _logger.Log(&quot;Loading user...&quot;);
        var user = await _apiService.GetUser(id);
    }
}

// Tworzenie ViewModelu - zależności &quot;wstrzyknięte&quot; z zewnątrz
var viewModel = new UserProfileViewModel(
    new UserApiService(),
    new ConsoleLogger()
);
</code></pre>
<p>ViewModel zależy teraz od <strong>abstrakcji (interfejsów)</strong>, nie od konkretnych klas - dokładnie zasada D z SOLID.</p>
<h2>Dlaczego to jest szczególnie ważne właśnie w MVVM</h2>
<ol>
<li><strong>Testowalność ViewModelu bez UI</strong> - to główny sens MVVM. Możesz przetestować logikę ViewModelu, wstrzykując mocki zamiast prawdziwych serwisów:</li>
</ol>
<pre><code class="language-csharp">var mockApiService = new Mock&lt;IUserApiService&gt;();
mockApiService.Setup(s =&gt; s.GetUser(&quot;1&quot;)).ReturnsAsync(new User { Id = &quot;1&quot;, Name = &quot;Test User&quot; });

var viewModel = new UserProfileViewModel(mockApiService.Object, new NoOpLogger());
await viewModel.LoadUser(&quot;1&quot;);
mockApiService.Verify(s =&gt; s.GetUser(&quot;1&quot;), Times.Once);
</code></pre>
<p>Bez DI musiałbyś odpalać prawdziwe requesty API w testach, albo robić brzydkie hacki z podmianą modułów.</p>
<ol>
<li>
<p><strong>Rozdzielenie odpowiedzialności</strong> - ViewModel nie musi wiedzieć, <em>jak</em> skonstruować swoje zależności (np. że <code>UserApiService</code> potrzebuje URL-a bazowego, tokenu auth itd.) - to zadanie zewnętrznego "kompozytora".</p>
</li>
<li>
<p><strong>Reużywalność</strong> - ten sam ViewModel może działać z różnymi implementacjami (np. <code>FakeUserApiService</code> w trybie offline/demo).</p>
</li>
</ol>
<h2>Kontener DI (Dependency Injection Container)</h2>
<p>W większych aplikacjach ręczne tworzenie i przekazywanie zależności (jak wyżej) robi się uciążliwe, więc używa się <strong>kontenera DI</strong>, który automatycznie tworzy i wstrzykuje zależności na podstawie rejestracji:</p>
<pre><code class="language-csharp">using Microsoft.Extensions.DependencyInjection; // pakiet NuGet z tym samym API co w ASP.NET Core

// 1. Stwórz kolekcję serwisów - to jest &quot;rejestr&quot;, w którym zapisujesz,
//    co ma być czym (interfejs -&gt; konkretna implementacja)
var services = new ServiceCollection();

// 2. Rejestracja (raz, przy starcie aplikacji)
services.AddSingleton&lt;ILogger, ConsoleLogger&gt;();
services.AddSingleton&lt;IUserApiService, UserApiService&gt;();

// WAŻNE: ViewModel też musi być zarejestrowany, inaczej GetRequiredService
// poniżej rzuci wyjątkiem &quot;Unable to resolve service&quot; - resolwowanie
// dotyczy WSZYSTKIEGO, co ma powstać przez kontener, nie tylko &quot;usług&quot;
services.AddTransient&lt;UserProfileViewModel&gt;();

// 3. Zbuduj kontener (IServiceProvider) na podstawie rejestracji z kroku 2 -
//    to jest moment, w którym &quot;rejestr&quot; zamienia się w działający kontener
var serviceProvider = services.BuildServiceProvider();

// 4. Rozwiązywanie zależności (automatyczne) - kontener SAM wywoła konstruktor
//    UserProfileViewModel, wstrzykując mu ILogger i IUserApiService
var viewModel = serviceProvider.GetRequiredService&lt;UserProfileViewModel&gt;();
</code></pre>
<p><strong>Co robi każdy krok:</strong> <code>ServiceCollection</code> to pusta lista rejestracji - sama nie umie jeszcze niczego tworzyć. Metody <code>Add*</code> (<code>AddSingleton</code>, <code>AddTransient</code>, <code>AddScoped</code>) tylko dopisują wpis "gdy ktoś poprosi o <code>X</code>, dawaj <code>Y</code>". <code>BuildServiceProvider()</code> kompiluje te wpisy w faktyczny, działający kontener - to jest moment, w którym kontener sprawdza, czy da się wszystko poskładać. <code>GetRequiredService&lt;T&gt;()</code> dopiero wtedy faktycznie tworzy instancję, wywołując konstruktor i wstrzykując zarejestrowane zależności.</p>
<p>Popularne przykłady w różnych ekosystemach:
- <strong>Android (Kotlin/Java)</strong>: Hilt, Koin, Dagger
- <strong>iOS (Swift)</strong>: Swinject, Resolver
- <strong>.NET/WPF</strong>: Microsoft.Extensions.DependencyInjection, Autofac
- <strong>Angular</strong>: wbudowany DI container
- <strong>Frontend TS ogólnie</strong>: <code>tsyringe</code>, <code>InversifyJS</code></p>
<h2>Podsumowanie w jednym zdaniu</h2>
<p>DI w MVVM sprawia, że ViewModel <strong>dostaje</strong> swoje zależności (serwisy, repozytoria) zamiast <strong>tworzyć</strong> je sam - dzięki temu można go testować w izolacji od UI i od konkretnych implementacji danych, co jest właściwie sensem istnienia całego wzorca MVVM.</p>
  
  `},

  { id:"di-mvvm-wpf", title:"MVVM + DI w WPF (pełny przykład)", tags:"wpf mvvm di viewmodelbase servicecollection",
  body:`
  <h1>MVVM + DI w WPF (C#)</h1>
<p>Skoro masz duże doświadczenie w C#/.NET, pokażę pełny, realistyczny przepływ na typowej aplikacji WPF.</p>
<h2>Struktura projektu</h2>
<pre><code class="language-csharp">MyApp/
├── Models/
│   └── User.cs
├── Services/
│   ├── IUserService.cs
│   └── UserService.cs
├── ViewModels/
│   ├── ViewModelBase.cs
│   └── UserProfileViewModel.cs
├── Views/
│   └── UserProfileView.xaml
├── App.xaml.cs
</code></pre>
<h2>1. Model</h2>
<pre><code class="language-csharp">public class User
{
    public string Id { get; set; }
    public string Name { get; set; }
    public string Email { get; set; }
}
</code></pre>
<h2>2. Serwis (abstrakcja + implementacja)</h2>
<pre><code class="language-csharp">public interface IUserService
{
    Task&lt;User&gt; GetUserAsync(string id);
}

public class UserService : IUserService
{
    private readonly HttpClient _httpClient;

    public UserService(HttpClient httpClient)
    {
        _httpClient = httpClient;
    }

    public async Task&lt;User&gt; GetUserAsync(string id)
    {
        var response = await _httpClient.GetFromJsonAsync&lt;User&gt;($&quot;api/users/{id}&quot;);
        return response;
    }
}
</code></pre>
<h2>3. ViewModelBase (INotifyPropertyChanged)</h2>
<p>To fundament każdego ViewModelu w WPF - implementuje mechanizm powiadamiania View o zmianach.</p>
<pre><code class="language-csharp">public abstract class ViewModelBase : INotifyPropertyChanged
{
    public event PropertyChangedEventHandler PropertyChanged;

    protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null)
    {
        if (EqualityComparer&lt;T&gt;.Default.Equals(field, value)) return;
        field = value;
        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));
    }
}
</code></pre>
<h2>4. ViewModel z wstrzykniętymi zależnościami</h2>
<pre><code class="language-csharp">public class UserProfileViewModel : ViewModelBase
{
    private readonly IUserService _userService;
    private readonly ILogger&lt;UserProfileViewModel&gt; _logger;

    private User _user;
    public User User
    {
        get =&gt; _user;
        set =&gt; SetProperty(ref _user, value);
    }

    private bool _isLoading;
    public bool IsLoading
    {
        get =&gt; _isLoading;
        set =&gt; SetProperty(ref _isLoading, value);
    }

    public ICommand LoadUserCommand { get; }

    // Zależności przychodzą z zewnątrz przez konstruktor - to jest sedno DI
    public UserProfileViewModel(IUserService userService, ILogger&lt;UserProfileViewModel&gt; logger)
    {
        _userService = userService;
        _logger = logger;
        LoadUserCommand = new RelayCommand(async () =&gt; await LoadUserAsync());
    }

    private async Task LoadUserAsync()
    {
        try
        {
            IsLoading = true;
            _logger.LogInformation(&quot;Loading user...&quot;);
            User = await _userService.GetUserAsync(&quot;123&quot;);
        }
        catch (Exception ex)
        {
            _logger.LogError(ex, &quot;Failed to load user&quot;);
        }
        finally
        {
            IsLoading = false;
        }
    }
}
</code></pre>
<p>Zauważ: ViewModel nic nie wie o <code>HttpClient</code>, o URL-u API, o tym jak działa logowanie - dostaje gotowe, skonfigurowane zależności przez konstruktor. To jest właśnie <strong>constructor injection</strong>, najpopularniejsza forma DI w .NET.</p>
<h2>5. RelayCommand (prosta implementacja ICommand)</h2>
<p>WPF nie ma wbudowanego dobrego <code>ICommand</code>, więc prawie każdy projekt ma swój <code>RelayCommand</code>:</p>
<pre><code class="language-csharp">public class RelayCommand : ICommand
{
    private readonly Func&lt;Task&gt; _execute;
    private readonly Func&lt;bool&gt; _canExecute;

    public RelayCommand(Func&lt;Task&gt; execute, Func&lt;bool&gt; canExecute = null)
    {
        _execute = execute;
        _canExecute = canExecute;
    }

    public bool CanExecute(object parameter) =&gt; _canExecute?.Invoke() ?? true;
    public async void Execute(object parameter) =&gt; await _execute();
    public event EventHandler CanExecuteChanged
    {
        add =&gt; CommandManager.RequerySuggested += value;
        remove =&gt; CommandManager.RequerySuggested -= value;
    }
}
</code></pre>
<h2>6. Konfiguracja kontenera DI w App.xaml.cs</h2>
<p>Tu spina się cała układanka - <code>Microsoft.Extensions.DependencyInjection</code> (ten sam, który znasz z ASP.NET Core) świetnie działa też w WPF.</p>
<pre><code class="language-csharp">public partial class App : Application
{
    private ServiceProvider _serviceProvider;

    protected override void OnStartup(StartupEventArgs e)
    {
        base.OnStartup(e);

        var services = new ServiceCollection();
        ConfigureServices(services);
        _serviceProvider = services.BuildServiceProvider();

        // Rozwiązanie głównego okna z jego ViewModelem
        var mainWindow = _serviceProvider.GetRequiredService&lt;MainWindow&gt;();
        mainWindow.Show();
    }

    private void ConfigureServices(IServiceCollection services)
    {
        services.AddLogging(builder =&gt; builder.AddConsole());

        services.AddHttpClient&lt;IUserService, UserService&gt;(client =&gt;
        {
            client.BaseAddress = new Uri(&quot;https://api.myapp.pl/&quot;);
        });

        // ViewModel jako Transient - nowa instancja przy każdym rozwiązaniu
        services.AddTransient&lt;UserProfileViewModel&gt;();

        // View - MainWindow też może dostać ViewModel przez konstruktor
        services.AddSingleton&lt;MainWindow&gt;();
    }

    protected override void OnExit(ExitEventArgs e)
    {
        _serviceProvider?.Dispose();
        base.OnExit(e);
    }
}
</code></pre>
<h2>7. Wstrzykiwanie ViewModelu do View</h2>
<pre><code class="language-csharp">public partial class MainWindow : Window
{
    public MainWindow(UserProfileViewModel viewModel)
    {
        InitializeComponent();
        DataContext = viewModel; // View &quot;obserwuje&quot; ViewModel przez binding
    }
}
</code></pre>
<p>I w XAML:</p>
<pre><code class="language-xml">&lt;Window x:Class=&quot;MyApp.Views.MainWindow&quot; ...&gt;
    &lt;StackPanel&gt;
        &lt;TextBlock Text=&quot;{Binding User.Name}&quot; /&gt;
        &lt;Button Content=&quot;Załaduj&quot; Command=&quot;{Binding LoadUserCommand}&quot; /&gt;
        &lt;ProgressBar IsIndeterminate=&quot;{Binding IsLoading}&quot; Visibility=&quot;{Binding IsLoading, Converter={StaticResource BoolToVisibility}}&quot; /&gt;
    &lt;/StackPanel&gt;
&lt;/Window&gt;
</code></pre>
<h2>Dlaczego to podejście się opłaca</h2>
<ul>
<li><strong>Testy jednostkowe ViewModelu bez WPF w ogóle</strong> - podmieniasz <code>IUserService</code> na mocka (np. Moq) i testujesz logikę <code>LoadUserAsync</code> bez odpalania okna czy prawdziwego API.</li>
<li><strong>Łatwa podmiana implementacji</strong> - w testach integracyjnych możesz zarejestrować <code>FakeUserService</code> zamiast prawdziwego HTTP.</li>
<li><strong>Zarządzanie cyklem życia</strong> - kontener sam decyduje, czy dana zależność to <code>Singleton</code>, <code>Scoped</code> czy <code>Transient</code>, zamiast ręcznego <code>new</code> rozsianego po kodzie.</li>
<li><strong>Czytelna kompozycja aplikacji w jednym miejscu</strong> (<code>ConfigureServices</code>) - widzisz od razu, z czego składa się cała apka.</li>
</ul>
<h2>Popularne biblioteki DI dla WPF</h2>
<ul>
<li><strong>Microsoft.Extensions.DependencyInjection</strong> - najlżejszy, ten sam co w ASP.NET Core (użyłem powyżej)</li>
<li><strong>Prism</strong> - pełny framework MVVM dla WPF, ma wbudowany DI + nawigację + regiony</li>
<li><strong>CommunityToolkit.Mvvm</strong> - lekki toolkit od Microsoftu z generatorami dla <code>ObservableProperty</code> i <code>RelayCommand</code> (mniej boilerplate'u niż ręczne <code>SetProperty</code>/<code>RelayCommand</code>)</li>
</ul>
<h2>Przykład pełnej aplikacji WPF/MVVM - SimpleTrader</h2>
<p>Jeśli chcesz zobaczyć te wzorce (MVVM, DI, ViewModelBase, RelayCommand, nawigacja między widokami) zastosowane w <strong>kompletnej, realistycznej aplikacji</strong> - nie w wyizolowanym fragmencie kodu - warto obejrzeć projekt <strong>SimpleTrader</strong> autorstwa SingletonSean:</p>
<p><strong>Repozytorium:</strong> <a href="https://github.com/SingletonSean/SimpleTrader">github.com/SingletonSean/SimpleTrader</a>
<strong>Playlista wideo (krok po kroku):</strong> <a href="https://www.youtube.com/playlist?list=PLA8ZIAm2I03jSfo18F7Y65XusYzDusYu5">YouTube - SingletonSean</a></p>
<p>To pełna aplikacja WPF do "handlu" (symulowana giełda), budowana od zera, odcinek po odcinku, obejmująca dokładnie te tematy, które omawialiśmy:</p>
<ul>
<li><strong>MVVM od podstaw</strong> - <code>ViewModelBase</code>, <code>INotifyPropertyChanged</code>, <code>RelayCommand</code></li>
<li><strong>Dependency Injection</strong> - własny, ręcznie pisany kontener DI (bez <code>Microsoft.Extensions.DependencyInjection</code>), co jest edukacyjnie wartościowe - widzisz <strong>jak</strong> kontener DI działa "pod spodem", zanim zaczniesz używać gotowego</li>
<li><strong>Nawigacja między widokami</strong> w WPF bez <code>Frame</code>/<code>NavigationService</code> (WPF go nie ma natywnie jak np. UWP) - własny <code>NavigationStore</code> + <code>NavigationService</code></li>
<li><strong>Warstwa serwisów</strong> - komunikacja z backendem (autentykacja, dane konta) przez HTTP</li>
<li><strong>Wzorzec Store</strong> - współdzielony stan aplikacji (np. zalogowany użytkownik) dostępny z wielu ViewModeli naraz</li>
</ul>
<p><strong>Dlaczego warto:</strong> większość tutoriali o MVVM pokazuje pojedynczy ekran z jednym przyciskiem - SimpleTrader pokazuje, jak te wzorce <strong>skalują się</strong> w aplikacji z wieloma widokami, ekranem logowania, nawigacją i realną komunikacją z backendem, czyli bliżej temu, z czym można się spotkać w pracy.</p>
<div class="callout"><strong>Uwaga:</strong> projekt używa własnoręcznie pisanego kontenera DI (do celów edukacyjnych) - w kodzie produkcyjnym naturalnym wyborem byłby <code>Microsoft.Extensions.DependencyInjection</code>, jak pokazywałem w przykładzie wyżej.</div>
  
  `},

  { id:"lifetimes", title:"Singleton vs Transient vs Scoped", tags:"di lifetime singleton transient scoped captive dependency",
  body:`
  <h1>Singleton vs Transient vs Scoped - cykle życia w DI</h1>
<p>To jeden z klasycznych tematów na rozmowach SE III, bo źle dobrany lifetime to częste źródło bugów (memory leaki, wycieki stanu między requestami, race conditions). Przejdę przez wszystkie trzy z konkretnymi przykładami z .NET.</p>
<h2>Transient</h2>
<p><strong>Nowa instancja przy każdym rozwiązaniu (resolve).</strong></p>
<pre><code class="language-csharp">services.AddTransient&lt;IEmailValidator, EmailValidator&gt;();
</code></pre>
<p>Za każdym razem, gdy ktoś prosi o <code>IEmailValidator</code> - czy to bezpośrednio, czy jako zależność innej klasy - kontener tworzy <strong>nowy obiekt</strong>.</p>
<p><strong>Kiedy używać:</strong>
- Lekkie, bezstanowe serwisy (walidatory, mappery, kalkulatory)
- Klasy bez żadnego stanu, które nie trzymają żadnych zasobów</p>
<p><strong>Pułapka:</strong> jeśli masz Transient serwis, który jest drogi w tworzeniu (np. otwiera połączenie), a wstrzykujesz go w pętli albo wielokrotnie w tym samym request - marnujesz zasoby.</p>
<h2>Scoped</h2>
<p><strong>Jedna instancja na "scope"</strong> - w ASP.NET Core scope = jeden HTTP request. W WPF czy aplikacji desktopowej trzeba scope tworzyć ręcznie (np. jeden per operacja/okno).</p>
<pre><code class="language-csharp">services.AddScoped&lt;IOrderContext, OrderContext&gt;();
</code></pre>
<p>W ramach jednego requestu, niezależnie ile razy <code>IOrderContext</code> jest wstrzykiwany do różnych klas - dostają <strong>tę samą instancję</strong>. Ale kolejny request dostanie już nową.</p>
<p><strong>Kiedy używać:</strong>
- <code>DbContext</code> w Entity Framework - klasyczny przykład. Chcesz, żeby wszystkie repozytoria w ramach jednego requestu współdzieliły ten sam kontekst (ta sama transakcja, ten sam change tracker), ale nie chcesz dzielić go między różnymi użytkownikami/requestami
- Dane specyficzne dla danej operacji biznesowej (np. <code>CurrentUserContext</code> z danymi zalogowanego użytkownika na czas requestu)</p>
<p><strong>Pułapka:</strong> użycie Scoped serwisu poza kontekstem scope (np. w Singleton, który go wstrzykuje) rzuci wyjątkiem albo, gorzej, w niektórych konfiguracjach po cichu da Ci "zamrożoną" instancję z pierwszego scope'a - klasyczny bug do wyłapania.</p>
<h2>Singleton</h2>
<p><strong>Jedna instancja na cały czas życia aplikacji.</strong></p>
<pre><code class="language-csharp">services.AddSingleton&lt;ICacheService, MemoryCacheService&gt;();
</code></pre>
<p>Tworzona raz (przy pierwszym użyciu albo od razu przy starcie, zależnie od konfiguracji), i ta sama instancja jest zwracana przez całe życie aplikacji, dla wszystkich requestów/wątków.</p>
<p><strong>Kiedy używać:</strong>
- Cache w pamięci
- Konfiguracja aplikacji (odczytana raz z pliku/env)
- Klienci do zewnętrznych usług, które same zarządzają swoim connection pool (np. <code>HttpClient</code> przez <code>IHttpClientFactory</code>, klient do Redis)
- Logger (choć zwykle to <code>ILoggerFactory</code> jest Singletonem, a konkretne <code>ILogger&lt;T&gt;</code> mogą być Transient)</p>
<p><strong>Pułapki:</strong>
- <strong>Musi być thread-safe</strong> - Singleton żyje przez całą aplikację, więc będzie używany współbieżnie przez wiele wątków/requestów naraz. Jeśli trzyma mutowalny stan bez synchronizacji - masz race condition.
- <strong>Wycieki pamięci</strong> - jeśli Singleton trzyma referencje do dużych obiektów i nigdy ich nie zwalnia, rośnie przez cały czas działania aplikacji.
- <strong>Captive Dependency</strong> - najbardziej klasyczny błąd na rozmowach: <strong>Singleton nie powinien zależeć od Scoped ani Transient ze stanem</strong>. Jeśli Singleton wstrzyknie sobie Scoped serwis w konstruktorze, to ten Scoped serwis zostaje "uwięziony" (captive) i żyje tak długo jak Singleton - czyli w praktyce przestaje być Scoped. Większość kontenerów DI (w tym Microsoft.Extensions.DependencyInjection) <strong>wykryje to i rzuci wyjątkiem przy starcie</strong> w trybie walidacji scope'ów.</p>
<pre><code class="language-csharp">// Błąd: Captive Dependency
services.AddSingleton&lt;INotificationManager, NotificationManager&gt;();
services.AddScoped&lt;IUserContext, UserContext&gt;();

public class NotificationManager : INotificationManager
{
    // BŁĄD: IUserContext (Scoped) zostanie &quot;zamrożony&quot; na czas życia Singletona
    public NotificationManager(IUserContext userContext) { ... }
}
</code></pre>
<p>Rozwiązanie: wstrzyknij <code>IServiceScopeFactory</code> do Singletona i twórz scope ręcznie, kiedy faktycznie potrzebujesz Scoped zależności.</p>
<h2>Tabela porównawcza</h2>
<table>
<thead>
<tr>
<th></th>
<th>Transient</th>
<th>Scoped</th>
<th>Singleton</th>
</tr>
</thead>
<tbody>
<tr>
<td>Nowa instancja</td>
<td>Za każdym razem</td>
<td>Raz na scope</td>
<td>Raz na aplikację</td>
</tr>
<tr>
<td>Thread-safety wymagane?</td>
<td>Zwykle nie</td>
<td>Zwykle nie (jeden scope = jeden wątek/request)</td>
<td><strong>Tak, obowiązkowo</strong></td>
</tr>
<tr>
<td>Typowy przykład</td>
<td>Walidator, mapper</td>
<td><code>DbContext</code>, kontekst requestu</td>
<td>Cache, konfiguracja, klient HTTP</td>
</tr>
<tr>
<td>Największa pułapka</td>
<td>Marnowanie zasobów przy drogim tworzeniu</td>
<td>Użycie poza scope</td>
<td>Captive dependency, brak thread-safety</td>
</tr>
</tbody>
</table>
<h2>Pytanie, które mogą Ci zadać na rozmowie</h2>
<p><em>"Co się stanie, jeśli Singleton wstrzyknie Transient?"</em> - To jest OK, ale z zastrzeżeniem: ten Transient obiekt <strong>też stanie się efektywnie singletonem</strong>, bo Singleton tworzy go raz przy swoim konstruktorze i trzyma tę samą referencję przez całe życie aplikacji. Nie ma tu błędu technicznego (w przeciwieństwie do Scoped w Singletonie), ale trzeba mieć świadomość konsekwencji, jeśli ten Transient miał być "świeży" przy każdym użyciu.</p>
<hr />
<p>W kontekście WPF: skoro nie ma tam pojęcia "request" jak w ASP.NET Core, Scoped ma sens głównie jeśli sam tworzysz scope'y (np. jeden per otwarte okno/dialog, albo per operacja typu "import pliku"). W prostszych aplikacjach desktopowych często wystarczy Singleton + Transient.</p>
  
  `},

  { id:"scope-factory-threadsafe", title:"IServiceScopeFactory i thread-safety", tags:"scope factory singleton thread safe lock interlocked",
  body:`
  <h1>IServiceScopeFactory - pełny przykład</h1>
<h2>Problem, który rozwiązujemy</h2>
<pre><code class="language-csharp">services.AddSingleton&lt;INotificationManager, NotificationManager&gt;();
services.AddScoped&lt;IUserContext, UserContext&gt;();

// BŁĄD - Captive Dependency
public class NotificationManager : INotificationManager
{
    public NotificationManager(IUserContext userContext) { ... } // ❌
}
</code></pre>
<h2>Rozwiązanie: wstrzyknij factory, nie sam serwis</h2>
<pre><code class="language-csharp">public class NotificationManager : INotificationManager
{
    private readonly IServiceScopeFactory _scopeFactory;

    // Wstrzykujemy fabrykę scope'ów - to jest bezpieczne dla Singletona,
    // bo IServiceScopeFactory sam jest zarejestrowany jako Singleton
    public NotificationManager(IServiceScopeFactory scopeFactory)
    {
        _scopeFactory = scopeFactory;
    }

    public async Task SendNotificationAsync(string message)
    {
        // Tworzymy NOWY scope w momencie, gdy faktycznie potrzebujemy
        // Scoped zależności - nie wcześniej, nie &quot;na zapas&quot;
        using (IServiceScope scope = _scopeFactory.CreateScope())
        {
            // Rozwiązujemy IUserContext DOPIERO wewnątrz tego scope'a
            var userContext = scope.ServiceProvider.GetRequiredService&lt;IUserContext&gt;();

            Console.WriteLine($&quot;Wysyłam powiadomienie do: {userContext.CurrentUserName}&quot;);
            await SomeExternalService.SendAsync(userContext.CurrentUserName, message);
        }
        // Po wyjściu z using() - scope i wszystkie jego Scoped/Transient
        // zależności są zwalniane (Dispose)
    }
}
</code></pre>
<p><strong>Kluczowa różnica:</strong> zamiast dostać <code>IUserContext</code> raz w konstruktorze (i trzymać go "na zawsze"), <code>NotificationManager</code> dostaje <strong>fabrykę</strong>, która przy każdym wywołaniu metody tworzy <strong>świeży, tymczasowy kontener</strong> ze swoim własnym <code>IUserContext</code>. Scope żyje tylko na czas bloku <code>using</code>, więc nic się nie "zamraża".</p>
<h2>Jak to wygląda w praktyce z wieloma zależnościami</h2>
<pre><code class="language-csharp">public class ReportGeneratorBackgroundService : BackgroundService
{
    private readonly IServiceScopeFactory _scopeFactory;
    private readonly ILogger&lt;ReportGeneratorBackgroundService&gt; _logger;

    public ReportGeneratorBackgroundService(
        IServiceScopeFactory scopeFactory,
        ILogger&lt;ReportGeneratorBackgroundService&gt; logger)
    {
        _scopeFactory = scopeFactory;
        _logger = logger;
    }

    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
    {
        while (!stoppingToken.IsCancellationRequested)
        {
            using (var scope = _scopeFactory.CreateScope())
            {
                // DbContext jest Scoped - w tle działającym Singletonie
                // (BackgroundService) nie mógłbyś go normalnie wstrzyknąć
                var dbContext = scope.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();
                var reportService = scope.ServiceProvider.GetRequiredService&lt;IReportService&gt;();

                var pendingOrders = await dbContext.Orders
                    .Where(o =&gt; !o.ReportGenerated)
                    .ToListAsync(stoppingToken);

                foreach (var order in pendingOrders)
                {
                    await reportService.GenerateAsync(order);
                }
            }

            await Task.Delay(TimeSpan.FromMinutes(5), stoppingToken);
        }
    }
}
</code></pre>
<p>To jest bardzo częsty wzorzec - <strong><code>BackgroundService</code> w .NET jest zawsze Singletonem</strong>, więc jeśli potrzebuje <code>DbContext</code> (Scoped), zawsze musi przejść przez <code>IServiceScopeFactory</code>.</p>
<h2>Rejestracja - nic dodatkowego nie trzeba robić</h2>
<p><code>IServiceScopeFactory</code> jest <strong>automatycznie dostępny</strong> w każdym <code>IServiceCollection</code> z <code>Microsoft.Extensions.DependencyInjection</code> - nie trzeba go rejestrować ręcznie.</p>
<hr />
<h1>Co znaczy "thread-safe"?</h1>
<p><strong>Thread-safe</strong> oznacza, że kod działa poprawnie, gdy <strong>wiele wątków wykonuje go jednocześnie</strong> i sięga do tych samych danych - bez uszkodzenia stanu, race conditions czy nieprzewidywalnych wyników.</p>
<h2>Przykład kodu, który NIE jest thread-safe</h2>
<pre><code class="language-csharp">public class CounterService
{
    private int _count = 0;

    public void Increment()
    {
        _count++; // ⚠️ To wygląda na jedną operację, ale nią nie jest!
    }

    public int GetCount() =&gt; _count;
}
</code></pre>
<p><code>_count++</code> to w rzeczywistości <strong>trzy oddzielne kroki</strong>:
1. Odczytaj wartość <code>_count</code>
2. Dodaj 1
3. Zapisz wynik z powrotem do <code>_count</code></p>
<p>Jeśli dwa wątki wykonują to <strong>jednocześnie</strong>:</p>
<pre><code class="language-csharp">Wątek A: odczytuje _count = 5
Wątek B: odczytuje _count = 5      (jeszcze zanim A zapisał!)
Wątek A: liczy 5 + 1 = 6
Wątek B: liczy 5 + 1 = 6
Wątek A: zapisuje _count = 6
Wątek B: zapisuje _count = 6       ← nadpisuje wynik wątku A!
</code></pre>
<p>Efekt: wywołałeś <code>Increment()</code> dwa razy, a <code>_count</code> zwiększył się tylko o 1 zamiast o 2. To jest <strong>race condition</strong> - wynik zależy od tego, "który wątek zdąży pierwszy", czyli od przypadku/timingu.</p>
<h2>Dlaczego to jest istotne akurat dla Singletona</h2>
<p>Jeśli <code>CounterService</code> jest zarejestrowany jako Singleton:</p>
<pre><code class="language-csharp">services.AddSingleton&lt;CounterService&gt;();
</code></pre>
<p>...to <strong>wszystkie requesty/wątki w całej aplikacji dzielą tę samą instancję</strong> i to samo pole <code>_count</code>. Przy dużym ruchu, gdy wiele requestów przychodzi równolegle, ten race condition <strong>będzie się realnie zdarzał</strong> - i to sporadycznie, trudno do odtworzenia (klasyczny "heisenbug" - działa w debugerze, bo debugger spowalnia wykonanie i maskuje problem).</p>
<p>Gdyby <code>CounterService</code> był Transient albo Scoped, każdy wątek/request miałby <strong>swoją własną instancję</strong> ze swoim własnym <code>_count</code> - problem by nie istniał, bo nie ma współdzielonego stanu.</p>
<h2>Jak naprawić - kilka podejść</h2>
<h3>1. <code>lock</code> - najprostsze, ale blokujące</h3>
<pre><code class="language-csharp">public class CounterService
{
    private readonly object _lock = new object();
    private int _count = 0;

    public void Increment()
    {
        lock (_lock)
        {
            _count++; // tylko jeden wątek na raz może wejść do tego bloku
        }
    }
}
</code></pre>
<h3>2. <code>Interlocked</code> - dla prostych operacji atomowych, bez blokady</h3>
<pre><code class="language-csharp">public class CounterService
{
    private int _count = 0;

    public void Increment()
    {
        Interlocked.Increment(ref _count); // atomowa operacja na poziomie CPU
    }

    public int GetCount() =&gt; Interlocked.CompareExchange(ref _count, 0, 0);
}
</code></pre>
<h3>3. <code>ConcurrentDictionary</code>, <code>ConcurrentQueue</code> itd. - gotowe kolekcje thread-safe</h3>
<pre><code class="language-csharp">public class CacheService
{
    // zamiast zwykłego Dictionary&lt;K,V&gt;, które NIE jest thread-safe
    private readonly ConcurrentDictionary&lt;string, User&gt; _cache = new();

    public void Add(string key, User user) =&gt; _cache[key] = user;
    public User Get(string key) =&gt; _cache.TryGetValue(key, out var user) ? user : null;
}
</code></pre>
<h2>Praktyczna zasada dla Singletonów</h2>
<blockquote>
<p><strong>Jeśli Singleton ma mutowalny stan (pola, które się zmieniają po utworzeniu) - musi być thread-safe. Jeśli jest bezstanowy (immutable) albo tylko odczytuje dane raz ustawione przy starcie - problemu nie ma.</strong></p>
</blockquote>
<pre><code class="language-csharp">// OK bez synchronizacji - stan ustawiony raz, tylko odczyt
public class AppConfig
{
    public string ApiUrl { get; }
    public AppConfig(IConfiguration config) =&gt; ApiUrl = config[&quot;ApiUrl&quot;];
}

// WYMAGA synchronizacji - stan się zmienia w trakcie działania
public class RequestCounter
{
    private int _totalRequests; // ⚠️ mutowalne, wielu wątków pisze jednocześnie
}
</code></pre>
<p>To zresztą częste pytanie na rozmowach: <em>"Dlaczego <code>DbContext</code> w EF Core jest Scoped, a nie Singleton?"</em> - odpowiedź brzmi właśnie: <strong><code>DbContext</code> nie jest thread-safe</strong> (ma wewnętrzny change tracker, stan transakcji), więc gdyby był Singletonem, dwa równoległe requesty operujące na tym samym <code>DbContext</code> uszkodziłyby sobie nawzajem stan.</p>
  
  `},

  { id:"di-methods", title:"Sposoby wdrożenia DI", tags:"constructor property method injection service locator anti-pattern",
  body:`
  <h1>Sposoby wdrożenia DI (Dependency Injection)</h1>
<p>Na rozmowie to pytanie zwykle sprawdza, czy znasz nie tylko "DI przez konstruktor", ale też pozostałe warianty i <strong>kiedy</strong> który stosować - to częsty follow-up po temacie DI.</p>
<h2>1. Constructor Injection - domyślny wybór (99% przypadków)</h2>
<p>Zależności przekazywane przez konstruktor, przypisywane do <code>readonly</code> pól.</p>
<pre><code class="language-csharp">public class OrderService : IOrderService
{
    private readonly IOrderRepository _repository;
    private readonly ILogger&lt;OrderService&gt; _logger;

    public OrderService(IOrderRepository repository, ILogger&lt;OrderService&gt; logger)
    {
        _repository = repository ?? throw new ArgumentNullException(nameof(repository));
        _logger = logger;
    }
}
</code></pre>
<p><strong>Zalety:</strong>
- <strong>Immutability</strong> - <code>readonly</code>, zależność nie może się zmienić po utworzeniu obiektu
- <strong>Fail-fast</strong> - obiekt nie może w ogóle powstać bez wymaganych zależności (błąd wykryty od razu przy starcie, nie w trakcie działania)
- <strong>Jawność</strong> - patrząc na konstruktor, od razu widzisz WSZYSTKIE zależności klasy
- Kontenery DI (Microsoft.Extensions.DependencyInjection, Autofac) używają tego jako domyślnego mechanizmu</p>
<p><strong>Wada:</strong> przy wielu zależnościach konstruktor się rozrasta (patrz "constructor bloat" niżej).</p>
<h2>2. Property Injection (Setter Injection)</h2>
<p>Zależność ustawiana przez publiczną właściwość, nie przez konstruktor.</p>
<pre><code class="language-csharp">public class ReportGenerator
{
    // Zależność opcjonalna - jeśli nie ustawiona, klasa i tak działa (z domyślnym zachowaniem)
    public ILogger Logger { get; set; } = NullLogger.Instance;

    public void Generate(Report report)
    {
        Logger.Log(&quot;Generowanie raportu...&quot;);
        // ...
    }
}
</code></pre>
<pre><code class="language-csharp">var generator = new ReportGenerator();
generator.Logger = new FileLogger(); // opcjonalne nadpisanie
</code></pre>
<p><strong>Kiedy używać:</strong>
- Zależność jest <strong>opcjonalna</strong> (klasa działa sensownie bez niej, z wartością domyślną)
- Framework wymusza bezparametrowy konstruktor (np. niektóre starsze frameworki serializacji, kontrolki WPF tworzone przez XAML parser)</p>
<p><strong>Wada:</strong> obiekt może istnieć w niepełnym, "połowicznym" stanie - nic nie gwarantuje, że ktoś ustawi property przed użyciem klasy. Brak fail-fast.</p>
<h2>3. Method Injection (Parameter Injection)</h2>
<p>Zależność przekazywana jako parametr konkretnej metody, nie przechowywana w polu klasy.</p>
<pre><code class="language-csharp">public class OrderProcessor
{
    // Nie każda metoda w klasie potrzebuje tej zależności -
    // tylko ta jedna, więc nie ma sensu trzymać jej jako pole
    public void ProcessOrder(Order order, IDiscountCalculator discountCalculator)
    {
        var discount = discountCalculator.Calculate(order);
        order.TotalAmount -= discount;
    }
}
</code></pre>
<p><strong>Kiedy używać:</strong>
- Zależność potrzebna <strong>tylko w jednej metodzie</strong>, nie w całej klasie
- Zależność zmienia się przy każdym wywołaniu (np. różne strategie przekazywane za każdym razem)
- Klasyczny przykład: <code>IComparer&lt;T&gt;</code> przekazywany do <code>List&lt;T&gt;.Sort(IComparer&lt;T&gt; comparer)</code></p>
<h2>4. Ambient Context (rzadziej, kontrowersyjny)</h2>
<p>Zależność dostępna globalnie, bez jawnego przekazywania - np. przez statyczną właściwość albo <code>AsyncLocal</code>.</p>
<pre><code class="language-csharp">public static class CurrentUser
{
    private static readonly AsyncLocal&lt;string&gt; _userId = new();
    public static string UserId
    {
        get =&gt; _userId.Value;
        set =&gt; _userId.Value = value;
    }
}

// Użycie gdziekolwiek, bez przekazywania przez konstruktor
public class AuditLogger
{
    public void Log(string action)
    {
        Console.WriteLine($&quot;{CurrentUser.UserId}: {action}&quot;);
    }
}
</code></pre>
<p><strong>Rzadko polecane</strong> - ukrywa prawdziwe zależności klasy (nie widać ich w konstruktorze), utrudnia testowanie (globalny stan współdzielony między testami) i thread-safety wymaga ostrożności. Realny przykład wbudowany w .NET: <code>Thread.CurrentPrincipal</code>, <code>HttpContext.Current</code> (stary ASP.NET).</p>
<h2>5. Service Locator - <strong>anty-pattern</strong>, ale warto znać</h2>
<p>Zamiast wstrzykiwać konkretne zależności, klasa dostaje dostęp do "lokalizatora usług" i sama sobie z niego pobiera to, czego potrzebuje.</p>
<pre><code class="language-csharp">// ❌ Anty-pattern
public class OrderService
{
    public void ProcessOrder(Order order)
    {
        var repository = ServiceLocator.Current.GetInstance&lt;IOrderRepository&gt;();
        var logger = ServiceLocator.Current.GetInstance&lt;ILogger&gt;();
        // ...
    }
}
</code></pre>
<p><strong>Dlaczego to anty-pattern (częste pytanie na rozmowie: "dlaczego Service Locator jest zły"):</strong>
- <strong>Ukryte zależności</strong> - patrząc na konstruktor/sygnaturę klasy, nie widzisz, czego ona faktycznie potrzebuje - dowiadujesz się dopiero czytając całą implementację
- Klasa zależy teraz od <strong>samego kontenera DI</strong>, a nie od abstrakcji - to odwraca sens Dependency Inversion Principle
- Błędy brakującej rejestracji wychodzą <strong>w runtime</strong>, przy konkretnym wywołaniu <code>GetInstance&lt;T&gt;()</code>, zamiast <strong>przy starcie aplikacji</strong> (fail-fast) jak w constructor injection
- Trudniejsze testowanie - musisz mockować cały <code>ServiceLocator</code>, zamiast pojedynczej zależności</p>
<p>To jest zresztą różnica względem <code>IServiceScopeFactory</code>, o którym mówiliśmy przy Singletonach - <code>CreateScope()</code> + <code>GetRequiredService&lt;T&gt;()</code> <strong>wygląda podobnie</strong> do Service Locatora, ale różnica jest istotna: robisz to <strong>świadomie, w jednym konkretnym miejscu</strong>, żeby rozwiązać problem cyklu życia (Scoped w Singletonie), a nie jako generalny sposób dostarczania wszystkich zależności w całej aplikacji.</p>
<h2>Porównanie w tabeli</h2>
<table>
<thead>
<tr>
<th>Sposób</th>
<th>Kiedy używać</th>
<th>Fail-fast?</th>
<th>Widoczność zależności</th>
</tr>
</thead>
<tbody>
<tr>
<td>Constructor Injection</td>
<td>Domyślny wybór, zależności wymagane</td>
<td>✅ Tak</td>
<td>✅ Pełna, w sygnaturze</td>
</tr>
<tr>
<td>Property Injection</td>
<td>Zależność opcjonalna</td>
<td>❌ Nie</td>
<td>⚠️ Częściowa</td>
</tr>
<tr>
<td>Method Injection</td>
<td>Zależność tylko w jednej metodzie</td>
<td>✅ Tak (na poziomie metody)</td>
<td>✅ W sygnaturze metody</td>
</tr>
<tr>
<td>Ambient Context</td>
<td>Rzadko - dane przekrojowe (np. user context)</td>
<td>❌ Nie</td>
<td>❌ Ukryte</td>
</tr>
<tr>
<td>Service Locator</td>
<td><strong>Unikać</strong></td>
<td>❌ Nie (dopiero w runtime)</td>
<td>❌ Całkowicie ukryte</td>
</tr>
</tbody>
</table>
<h2>Pytanie, które mogą zadać jako follow-up</h2>
<p><em>"Co robisz, gdy konstruktor ma 8 zależności?"</em> - to jest tzw. <strong>constructor bloat/over-injection</strong>, i dobra odpowiedź to nie "po prostu tak zostawiam", tylko rozpoznanie, że to <strong>sygnał złamania Single Responsibility Principle</strong> (wracamy do SOLID) - klasa robi prawdopodobnie zbyt wiele różnych rzeczy i warto ją rozbić na mniejsze, bardziej wyspecjalizowane klasy, z których każda ma 2-3 zależności.</p>
<hr />
<p>Konstruktor jest tym, czego prawie zawsze będziesz używać w praktyce - ale rozmówca może chcieć usłyszeć, że <strong>rozumiesz kompromisy</strong> pozostałych podejść, a nie tylko znasz jedną nazwę.</p>
  
  `},

  { id:"ioc", title:"Inversion of Control (IoC)", tags:"ioc di hollywood principle template method middleware",
  body:`
  <h1>Inversion of Control (IoC)</h1>
<h2>Fundamentalna idea - odwrócenie kontroli</h2>
<p><strong>Inversion of Control</strong> to zasada projektowa mówiąca: <strong>zamiast Twój kod kontroluje przepływ i sam decyduje, kiedy wywołać zależności - to zewnętrzny framework/kontener kontroluje przepływ i wywołuje Twój kod</strong>. Kontrola zostaje "odwrócona" - stąd nazwa.</p>
<p>To jest <strong>szersza zasada</strong> (koncepcja architektoniczna), a DI to <strong>jedna konkretna technika</strong> realizująca tę zasadę - to jest kluczowa relacja, o którą często pytają wprost: <em>"Czym różni się IoC od DI?"</em> Odpowiedź: <strong>DI jest formą IoC, ale IoC to coś szerszego niż tylko DI</strong>.</p>
<h2>Klasyczny przykład - "Hollywood Principle"</h2>
<p>IoC bywa nazywane <strong>"Hollywood Principle"</strong>: <em>"Don't call us, we'll call you"</em> (Nie dzwoń do nas, my zadzwonimy do Ciebie).</p>
<h2>Kod BEZ IoC - Ty kontrolujesz przepływ</h2>
<pre><code class="language-csharp">class Program
{
    static void Main()
    {
        var validator = new OrderValidator();
        var repository = new OrderRepository();
        var order = new Order();

        // TY decydujesz o kolejności, TY wywołujesz wszystko ręcznie
        if (validator.Validate(order))
        {
            repository.Save(order);
        }
    }
}
</code></pre>
<p>Tutaj <strong>Twój kod jest "szefem"</strong> - to on tworzy obiekty, decyduje o kolejności wywołań, kontroluje cały przepływ programu od początku do końca.</p>
<h2>Kod Z IoC - framework kontroluje przepływ</h2>
<pre><code class="language-csharp">[ApiController]
public class OrdersController : ControllerBase
{
    private readonly IOrderService _orderService;

    // Framework (ASP.NET Core) SAM wywołuje ten konstruktor
    public OrdersController(IOrderService orderService)
    {
        _orderService = orderService;
    }

    [HttpPost]
    public async Task&lt;ActionResult&gt; CreateOrder(Order order)
    {
        // Framework SAM decyduje KIEDY wywołać tę metodę (gdy przyjdzie request HTTP)
        await _orderService.PlaceOrderAsync(order);
        return Ok();
    }
}
</code></pre>
<p>Tutaj <strong>to ASP.NET Core jest "szefem"</strong>:
- Framework sam decyduje, kiedy stworzyć <code>OrdersController</code> (gdy przyjdzie request)
- Framework sam wywołuje konstruktor i <strong>wstrzykuje</strong> zależności (to jest DI - konkretna technika)
- Framework sam decyduje, którą metodę wywołać (na podstawie routingu)
- Framework sam zarządza cyklem życia obiektu</p>
<p><strong>Ty nie piszesz <code>new OrdersController(...)</code> nigdzie w swoim kodzie</strong> - oddałeś kontrolę nad tworzeniem obiektów i wywoływaniem Twojego kodu do frameworka.</p>
<h2>IoC to coś więcej niż tylko DI - inne formy IoC</h2>
<p>To jest właśnie to, co odróżnia dobrą odpowiedź od powierzchownej - IoC realizuje się na <strong>kilka różnych sposobów</strong>, DI to tylko jeden z nich:</p>
<h3>1. Dependency Injection</h3>
<p>Framework wstrzykuje zależności do Twoich klas, zamiast Twój kod je tworzył.</p>
<h3>2. Template Method Pattern</h3>
<pre><code class="language-csharp">public abstract class OrderProcessorBase
{
    // Framework/klasa bazowa kontroluje KOLEJNOŚĆ wykonania
    public void Process(Order order)
    {
        Validate(order);
        Save(order);
        Notify(order);
    }

    // Ty implementujesz TYLKO poszczególne kroki - nie kontrolujesz kiedy są wołane
    protected abstract void Validate(Order order);
    protected abstract void Save(Order order);
    protected abstract void Notify(Order order);
}

public class StandardOrderProcessor : OrderProcessorBase
{
    protected override void Validate(Order order) { /* Twoja logika */ }
    protected override void Save(Order order) { /* Twoja logika */ }
    protected override void Notify(Order order) { /* Twoja logika */ }
}
</code></pre>
<p>Klasa bazowa (<code>Process</code>) kontroluje <strong>kolejność i moment</strong> wywołania Twoich metod - Ty tylko dostarczasz implementację poszczególnych kroków. To też jest IoC - odwrócenie kontroli nad przepływem, tylko bez żadnego DI.</p>
<h3>3. Event-driven / Callbacks</h3>
<pre><code class="language-csharp">button.Click += (sender, e) =&gt; SaveOrder(); // Ty piszesz CO ma się stać
// ale to FRAMEWORK (WPF) decyduje KIEDY to wywoła - gdy user faktycznie kliknie
</code></pre>
<p>To dokładnie ten sam mechanizm "callback", o którym rozmawialiśmy - i to też jest forma IoC. Framework WPF kontroluje pętlę komunikatów, wykrywa kliknięcie, i <strong>sam</strong> wywołuje Twój handler - Ty nie piszesz <code>SaveOrder()</code> bezpośrednio w <code>Main()</code>.</p>
<h3>4. Frameworki webowe w ogóle (ASP.NET Core, Middleware pipeline)</h3>
<pre><code class="language-csharp">app.Use(async (context, next) =&gt;
{
    Console.WriteLine(&quot;Przed requestem&quot;);
    await next(); // oddajesz kontrolę z powrotem do frameworka
    Console.WriteLine(&quot;Po response&quot;);
});
</code></pre>
<p>Framework sam decyduje, kiedy wywołać Twój middleware, w jakiej kolejności, i kiedy wywołać kolejny w łańcuchu (<code>next()</code>).</p>
<h3>5. WPF Dependency Properties / Data Binding</h3>
<pre><code class="language-xml">&lt;TextBlock Text=&quot;{Binding User.Name}&quot; /&gt;
</code></pre>
<p>Ty nie piszesz kodu, który "ręcznie" aktualizuje <code>TextBlock</code> przy zmianie <code>User.Name</code> - <strong>framework WPF sam</strong> obserwuje <code>PropertyChanged</code> i sam decyduje, kiedy odświeżyć UI. To też IoC - oddałeś kontrolę nad "kiedy update'ować UI" do frameworka.</p>
<h2>Diagram myślowy - "kto do kogo dzwoni"</h2>
<pre><code class="language-csharp">BEZ IoC (tradycyjny kod proceduralny):
Twój kod → tworzy obiekty → woła metody → kontroluje wszystko

Z IoC:
Framework → tworzy Twoje obiekty → woła Twoje metody →
            → w momencie, który framework uzna za stosowny
</code></pre>
<h2>Dlaczego IoC jest wartościowe - z perspektywy SOLID</h2>
<p>Wracając do tego, co omawialiśmy na samym początku (Dependency Inversion Principle) - IoC to <strong>mechanizm, który umożliwia</strong> realizację DIP. DIP mówi "zależ od abstrakcji, nie implementacji" - ale <strong>coś</strong> musi faktycznie dostarczyć tę konkretną implementację w runtime. IoC (poprzez kontener DI) to właśnie ten "ktoś", kto się tym zajmuje, żebyś Ty (jako klasa) mógł pozostać niewinny i zależeć tylko od interfejsu.</p>
<h2>Praktyczna odpowiedź na rozmowie</h2>
<p>Dobra, zwięzła odpowiedź na "co to jest IoC":</p>
<blockquote>

  <h1>WPF - co warto odświeżyć przed rozmową SE III</h1>
<p>Poza MVVM/DI, na rozmowach o WPF (zwłaszcza na poziomie III) lubią sprawdzić zrozumienie mechanizmów "pod spodem", nie tylko umiejętność klikania w XAML. Oto co bym przypomniał, pogrupowane tematycznie.</p>
<h2>1. Dependency Properties - fundament WPF</h2>
<p>To prawdopodobnie <strong>najczęściej pytany temat</strong> poza samym MVVM - różnica między zwykłą właściwością C# a Dependency Property.</p>
<pre><code class="language-csharp">public class RatingControl : Control
{
    public static readonly DependencyProperty ValueProperty =
        DependencyProperty.Register(
            nameof(Value),
            typeof(int),
            typeof(RatingControl),
            new FrameworkPropertyMetadata(
                defaultValue: 0,
                FrameworkPropertyMetadataOptions.BindsTwoWayByDefault,
                OnValueChanged));

    public int Value
    {
        get =&gt; (int)GetValue(ValueProperty);
        set =&gt; SetValue(ValueProperty, value);
    }

    private static void OnValueChanged(DependencyObject d, DependencyPropertyChangedEventArgs e)
    {
        // reakcja na zmianę wartości
    }
}
</code></pre>
<p><strong>Dlaczego DP istnieje, a nie zwykłe <code>{ get; set; }</code>:</strong>
- Wbudowane wsparcie dla data bindingu (bez ręcznego <code>INotifyPropertyChanged</code>)
- <strong>Property value inheritance</strong> - dziedziczenie wartości po drzewie wizualnym (np. <code>FontSize</code>, <code>DataContext</code>)
- Wsparcie dla stylów, animacji, triggerów - to wszystko działa tylko na DP
- <strong>Automatyczna redukcja pamięci</strong> - DP nie zajmuje pamięci per-instancja, jeśli ma wartość domyślną (przechowywane w słowniku statycznym)</p>
<p><strong>Attached Property</strong> - podobne, ale "przyczepiane" do dowolnego elementu, nie tylko właściciela:</p>
<pre><code class="language-csharp">// Grid.Row, Grid.Column to klasyczne attached properties
&lt;Button Grid.Row=&quot;0&quot; Grid.Column=&quot;1&quot; /&gt;
</code></pre>
<h2>2. Routed Events - bubbling vs tunneling</h2>
<p>Częste pytanie: <em>"Czym różni się <code>PreviewMouseDown</code> od <code>MouseDown</code>?"</em></p>
<pre><code class="language-csharp">Tunneling (Preview...): od korzenia drzewa W DÓŁ do elementu źródłowego
Bubbling (bez Preview): od elementu źródłowego W GÓRĘ do korzenia
</code></pre>
<pre><code class="language-xml">&lt;StackPanel MouseDown=&quot;Parent_MouseDown&quot;&gt;
    &lt;Button Content=&quot;Kliknij&quot; MouseDown=&quot;Button_MouseDown&quot; /&gt;
&lt;/StackPanel&gt;
</code></pre>
<p>Kliknięcie w przycisk: najpierw leci <code>PreviewMouseDown</code> od okna w dół do przycisku (tunneling), potem <code>MouseDown</code> od przycisku w górę do okna (bubbling). Można zatrzymać propagację przez <code>e.Handled = true</code>.</p>
<h2>3. Data binding - szczegóły, które łatwo zapomnieć</h2>
<pre><code class="language-xml">&lt;!-- Mode: OneWay, TwoWay, OneTime, OneWayToSource, Default --&gt;
&lt;TextBox Text=&quot;{Binding UserName, Mode=TwoWay, UpdateSourceTrigger=PropertyChanged}&quot; /&gt;

&lt;!-- RelativeSource - binding do właściwości przodka w drzewie --&gt;
&lt;TextBlock Text=&quot;{Binding DataContext.Title, RelativeSource={RelativeSource AncestorType=Window}}&quot; /&gt;

&lt;!-- ElementName - binding do innego elementu na tej samej stronie --&gt;
&lt;Slider x:Name=&quot;VolumeSlider&quot; Maximum=&quot;100&quot; /&gt;
&lt;TextBlock Text=&quot;{Binding Value, ElementName=VolumeSlider}&quot; /&gt;
</code></pre>
<p><strong>IValueConverter</strong> - konwersja danych między Model a View:</p>
<pre><code class="language-csharp">public class BoolToVisibilityConverter : IValueConverter
{
    public object Convert(object value, Type targetType, object parameter, CultureInfo culture)
        =&gt; (bool)value ? Visibility.Visible : Visibility.Collapsed;

    public object ConvertBack(object value, Type targetType, object parameter, CultureInfo culture)
        =&gt; throw new NotImplementedException();
}
</code></pre>
<p><strong>ObservableCollection</strong> - dlaczego zwykła <code>List&lt;T&gt;</code> nie wystarczy w bindingu do <code>ItemsControl</code>:</p>
<pre><code class="language-csharp">// Źle - zmiana zawartości NIE powiadomi UI
public List&lt;Order&gt; Orders { get; set; } = new();

// Dobrze - implementuje INotifyCollectionChanged
public ObservableCollection&lt;Order&gt; Orders { get; set; } = new();
</code></pre>
<h2>4. Visual Tree vs Logical Tree</h2>
<p>Częste pytanie koncepcyjne:
- <strong>Logical Tree</strong> - struktura elementów zdefiniowana w XAML (to co Ty piszesz)
- <strong>Visual Tree</strong> - pełna struktura renderowanych elementów, włącznie z tymi wygenerowanymi przez template'y (np. wewnętrzne części <code>Button</code> - <code>Border</code>, <code>ContentPresenter</code>)</p>
<pre><code class="language-csharp">// Przeszukiwanie visual tree - typowe zadanie na &quot;znajdź rodzica/dziecko określonego typu&quot;
public static T FindVisualParent&lt;T&gt;(DependencyObject child) where T : DependencyObject
{
    var parent = VisualTreeHelper.GetParent(child);
    if (parent == null) return null;
    return parent as T ?? FindVisualParent&lt;T&gt;(parent);
}
</code></pre>
<h2>5. Threading - Dispatcher i UI thread</h2>
<p>To jest <strong>bardzo częsty temat na rozmowach</strong> - WPF ma model single-threaded UI (tzw. STA - Single Threaded Apartment).</p>
<pre><code class="language-csharp">// Błąd - wyjątek &quot;The calling thread cannot access this object&quot;
private async Task LoadDataAsync()
{
    var data = await Task.Run(() =&gt; _repository.GetOrders()); // background thread
    OrdersList.ItemsSource = data; // ❌ próba dostępu do UI z innego wątku
}

// Dobrze - Dispatcher.Invoke wraca na UI thread
private async Task LoadDataAsync()
{
    var data = await Task.Run(() =&gt; _repository.GetOrders());
    Application.Current.Dispatcher.Invoke(() =&gt;
    {
        OrdersList.ItemsSource = data;
    });
}

// Jeszcze lepiej - async/await z SynchronizationContext WPF
// automatycznie wraca na UI thread po await, jeśli nie użyjesz ConfigureAwait(false)
private async Task LoadDataAsync()
{
    var data = await _repository.GetOrdersAsync(); // wraca na UI thread automatycznie
    OrdersList.ItemsSource = data; // ✅ OK
}
</code></pre>
<p>Warto umieć wytłumaczyć <strong>dlaczego</strong> - <code>await</code> domyślnie przechwytuje <code>SynchronizationContext</code> i wraca na ten sam wątek (UI thread), chyba że użyjesz <code>ConfigureAwait(false)</code> (co w kodzie ViewModelu zwykle <em>nie</em> chcesz robić, bo potem musisz wrócić na UI thread ręcznie).</p>
<h2>6. Styles, Templates, Triggers</h2>
<pre><code class="language-xml">&lt;Style TargetType=&quot;Button&quot; x:Key=&quot;PrimaryButtonStyle&quot;&gt;
    &lt;Setter Property=&quot;Background&quot; Value=&quot;DodgerBlue&quot; /&gt;
    &lt;Style.Triggers&gt;
        &lt;!-- DataTrigger - reakcja na wartość z bindingu --&gt;
        &lt;DataTrigger Binding=&quot;{Binding IsEnabled, RelativeSource={RelativeSource Self}}&quot; Value=&quot;False&quot;&gt;
            &lt;Setter Property=&quot;Opacity&quot; Value=&quot;0.5&quot; /&gt;
        &lt;/DataTrigger&gt;
        &lt;!-- Trigger - reakcja na właściwość samego elementu --&gt;
        &lt;Trigger Property=&quot;IsMouseOver&quot; Value=&quot;True&quot;&gt;
            &lt;Setter Property=&quot;Background&quot; Value=&quot;RoyalBlue&quot; /&gt;
        &lt;/Trigger&gt;
    &lt;/Style.Triggers&gt;
&lt;/Style&gt;
</code></pre>
<p><strong>ControlTemplate vs DataTemplate</strong> - różnica, którą warto umieć wyjaśnić:
- <code>ControlTemplate</code> - definiuje <strong>jak wygląda kontrolka</strong> (np. jak wygląda <code>Button</code> od środka - Border, ContentPresenter)
- <code>DataTemplate</code> - definiuje <strong>jak wyświetlić dane</strong> (np. jak ma wyglądać pojedynczy element w <code>ListBox</code> bindowany do obiektu <code>Order</code>)</p>
<h2>7. Wydajność - typowe pytanie "co byś zoptymalizował"</h2>
<ul>
<li><strong>UI Virtualization</strong> w <code>ItemsControl</code>/<code>ListBox</code> - żeby nie renderować tysięcy elementów naraz (<code>VirtualizingStackPanel.IsVirtualizing="True"</code>, domyślnie włączone w nowszych wersjach)</li>
<li><strong>Freezable</strong> objects (np. <code>Brush</code>, <code>Geometry</code>) - wywołanie <code>.Freeze()</code> poprawia wydajność, bo WPF nie musi nasłuchiwać zmian</li>
<li>Unikanie zbyt głębokiego zagnieżdżenia <code>Binding</code> z <code>Converter</code> wykonującym ciężkie obliczenia (binding może się odpalać bardzo często)</li>
</ul>
<h2>8. Rzeczy specyficzne dla nowszych wersji (.NET 6/8 WPF)</h2>
<p>Skoro pewnie pytają o aktualny stack:
- <strong>CommunityToolkit.Mvvm</strong> z source generatorami - <code>[ObservableProperty]</code>, <code>[RelayCommand]</code> zamiast ręcznego <code>SetProperty</code>/<code>RelayCommand</code>

public partial class UserProfileViewModel : ObservableObject
{
    [ObservableProperty]

    [RelayCommand]
    private async Task LoadUserAsync()
    {
        User = await _userService.GetUserAsync(&quot;123&quot;);

}
</code></pre>

<hr />
<p>Biorąc pod uwagę doświadczenie w C#, prawdopodobnie większość z tego "siedzi" gdzieś w pamięci mięśniowej - najbardziej prawdopodobne pytania na SE III to te bardziej <strong>konceptualne</strong> (DP vs zwykła property, dlaczego Dispatcher, bubbling vs tunneling, Visual vs Logical Tree), bo sprawdzają zrozumienie <em>dlaczego</em> WPF działa tak jak działa, a nie samą składnię.</p>
