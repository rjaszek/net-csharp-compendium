  { id:"delegates", title:"Delegaty", tags:"delegate action func predicate multicast event",
  body:`
  <h1>Delegaty w C</h1>
<h2>Co to jest delegat - definicja</h2>
<p>Delegat to <strong>typ referencyjny, który wskazuje na metodę</strong> (a właściwie na jedną lub więcej metod) - zamiast przechowywać dane, przechowuje <strong>odniesienie do kodu, który da się wywołać</strong>. To odpowiednik wskaźnika na funkcję ze świata C/C++, ale silnie typowany i bezpieczny.</p>
<p>Widziałeś to już w praktyce, nawet o tym nie wiedząc - w <code>RelayCommand</code>:</p>
<pre><code class="language-csharp">public class RelayCommand : ICommand
{
    private readonly Action&lt;object&gt; _execute;      // ← to jest delegat
    private readonly Predicate&lt;object&gt; _canExecute; // ← to też jest delegat
}
</code></pre>
<p><code>Action&lt;object&gt;</code> i <code>Predicate&lt;object&gt;</code> to <strong>wbudowane, gotowe typy delegatów</strong> w .NET - nie musisz definiować własnych do większości przypadków.</p>
<h2>Deklaracja własnego delegata</h2>
<pre><code class="language-csharp">// Definicja typu delegata - opisuje SYGNATURĘ metody, na którą będzie wskazywał
public delegate void OrderProcessedHandler(Order order, DateTime processedAt);

// Metoda pasująca do tej sygnatury
public void LogOrderProcessed(Order order, DateTime processedAt)
{
    Console.WriteLine($&quot;Zamówienie {order.Id} przetworzone o {processedAt}&quot;);
}

// Użycie
OrderProcessedHandler handler = LogOrderProcessed;
handler(myOrder, DateTime.Now); // wywołuje LogOrderProcessed pod spodem
</code></pre>
<p>Delegat <code>OrderProcessedHandler</code> może wskazywać na <strong>dowolną</strong> metodę o sygnaturze <code>void (Order, DateTime)</code> - nazwa metody nie ma znaczenia, liczy się tylko sygnatura.</p>
<h2>Trzy wbudowane typy delegatów, które pokrywają 95% przypadków</h2>
<p>W praktyce od lat prawie nikt nie definiuje własnych delegatów (jak <code>OrderProcessedHandler</code> wyżej) - .NET dostarcza generyczne, gotowe:</p>
<pre><code class="language-csharp">// Action&lt;&gt; - zwraca void, przyjmuje 0-16 parametrów
Action doSomething = () =&gt; Console.WriteLine(&quot;Zrobione&quot;);
Action&lt;string&gt; log = message =&gt; Console.WriteLine(message);
Action&lt;Order, DateTime&gt; processOrder = (order, date) =&gt; { /* ... */ };

// Func&lt;&gt; - zwraca wartość (ostatni parametr generyczny to typ zwracany), 0-16 parametrów wejściowych
Func&lt;int, int, int&gt; add = (a, b) =&gt; a + b;
Func&lt;Order, bool&gt; isValid = order =&gt; order.Items.Count &gt; 0;
Func&lt;string, Task&lt;User&gt;&gt; getUserAsync = async id =&gt; await _service.GetUserAsync(id);

// Predicate&lt;T&gt; - specjalny przypadek Func&lt;T, bool&gt;, głównie do filtrowania/wyszukiwania
Predicate&lt;Order&gt; hasItems = order =&gt; order.Items.Count &gt; 0;
</code></pre>
<p><code>Predicate&lt;T&gt;</code> to w praktyce dokładnie to samo co <code>Func&lt;T, bool&gt;</code> - istnieje głównie historycznie (był w .NET zanim <code>Func&lt;&gt;</code> się pojawił) i bywa używany w API typu <code>List&lt;T&gt;.Find(Predicate&lt;T&gt;)</code>.</p>
<h2>Multicast - delegat może wskazywać na wiele metod naraz</h2>
<p>To jest coś, czego nie ma w zwykłym wskaźniku na funkcję z C - delegaty w .NET są <strong>multicast</strong>, czyli jeden delegat może "trzymać" listę wielu metod i wywołać je wszystkie po kolei:</p>
<pre><code class="language-csharp">Action&lt;string&gt; logger = null;
logger += msg =&gt; Console.WriteLine($&quot;Console: {msg}&quot;);
logger += msg =&gt; File.AppendAllText(&quot;log.txt&quot;, msg);
logger += msg =&gt; SendToRemoteLoggingService(msg);

logger(&quot;Aplikacja wystartowała&quot;); // wywołuje WSZYSTKIE trzy metody po kolei, w kolejności dodania
</code></pre>
<p><code>+=</code> dodaje metodę do listy wywołań (invocation list), <code>-=</code> usuwa. To jest zresztą dokładnie mechanizm, na którym oparte są <strong>eventy</strong> w C# - <code>event</code> to w gruncie rzeczy delegat multicast z ograniczonym dostępem (patrz niżej).</p>
<p><strong>Pułapka z multicast + <code>Func&lt;&gt;</code>:</strong> jeśli delegat zwraca wartość (<code>Func&lt;&gt;</code>), a masz podpiętych kilka metod, <strong>zwrócona zostanie tylko wartość z OSTATNIEJ</strong> wywołanej metody - reszta wyników jest "gubiona". To częste źródło błędów, gdy ktoś nieświadomie multicastuje <code>Func&lt;&gt;</code>.</p>
<h2>Delegat vs Event - różnica, o którą często pytają</h2>
<pre><code class="language-csharp">public class OrderProcessor
{
    // Zwykły delegat jako pole/property - KAŻDY z zewnątrz może:
    // - wywołać go (Invoke)
    // - CAŁKOWICIE nadpisać listę handlerów przez =
    public Action&lt;Order&gt; OnOrderProcessed;

    // Event - ogranicza to, co można zrobić z zewnątrz klasy
    public event Action&lt;Order&gt; OrderProcessed;

    public void Process(Order order)
    {
        // wewnątrz klasy - dozwolone oba warianty
        OnOrderProcessed?.Invoke(order);
        OrderProcessed?.Invoke(order);
    }
}
</code></pre>
<pre><code class="language-csharp">var processor = new OrderProcessor();

processor.OnOrderProcessed += HandleOrder;  // OK - dodanie
processor.OnOrderProcessed = null;          // ⚠️ OK składniowo - ktoś z zewnątrz może SKASOWAĆ wszystkich innych subskrybentów!
processor.OnOrderProcessed(order);          // ⚠️ OK składniowo - ktoś z zewnątrz może ręcznie ODPALIĆ event!

processor.OrderProcessed += HandleOrder;    // OK - jedyna dozwolona operacja z zewnątrz
processor.OrderProcessed = null;            // ❌ Błąd kompilacji
processor.OrderProcessed(order);            // ❌ Błąd kompilacji - Invoke tylko wewnątrz klasy
</code></pre>
<p><strong><code>event</code> to modyfikator, który ogranicza publiczny dostęp do delegata</strong> tylko do <code>+=</code> i <code>-=</code> - nie da się z zewnątrz ani nadpisać całej listy, ani ręcznie wywołać. To hermetyzacja w czystej postaci - klasa jest właścicielem "kiedy i czy" event się odpala, subskrybenci mogą tylko się dopisać/wypisać.</p>
<h2>Delegaty jako parametry - podstawa LINQ i całego stylu funkcyjnego w C</h2>
<p>To jest chyba najczęstsze praktyczne użycie, z którym stykasz się codziennie, nawet o tym nie myśląc:</p>
<pre><code class="language-csharp">// Where przyjmuje Func&lt;Order, bool&gt; - delegat/predykat
var expensiveOrders = orders.Where(o =&gt; o.Total &gt; 1000);

// Select przyjmuje Func&lt;Order, TResult&gt; - delegat transformujący
var orderIds = orders.Select(o =&gt; o.Id);

// OrderBy przyjmuje Func&lt;Order, TKey&gt;
var sorted = orders.OrderBy(o =&gt; o.CreatedDate);
</code></pre>
<p>Każda z tych metod LINQ <strong>przyjmuje delegat jako parametr</strong> - <code>Where(Func&lt;T, bool&gt; predicate)</code>. Lambda <code>o =&gt; o.Total &gt; 1000</code> to po prostu <strong>skrócona składnia tworzenia instancji delegata</strong> - kompilator "widzi" sygnaturę oczekiwaną przez <code>Where</code> i dopasowuje do niej Twoją lambdę.</p>
<h2>Delegaty jako mechanizm callback / Strategy pattern</h2>
<p>Klasyczny use case - przekazujesz "co zrobić" jako parametr, zamiast hardkodować logikę wewnątrz metody:</p>
<pre><code class="language-csharp">public class RetryHelper
{
    public static async Task&lt;T&gt; ExecuteWithRetryAsync&lt;T&gt;(
        Func&lt;Task&lt;T&gt;&gt; operation,           // co wykonać
        int maxAttempts = 3,
        Action&lt;Exception, int&gt; onRetry = null) // co zrobić przy każdej porażce (opcjonalnie)
    {
        for (int attempt = 1; attempt &lt;= maxAttempts; attempt++)
        {
            try
            {
                return await operation();
            }
            catch (Exception ex) when (attempt &lt; maxAttempts)
            {
                onRetry?.Invoke(ex, attempt);
                await Task.Delay(TimeSpan.FromSeconds(attempt));
            }
        }
        throw new InvalidOperationException(&quot;Nie powinno się zdarzyć&quot;);
    }
}

// Użycie
var user = await RetryHelper.ExecuteWithRetryAsync(
    operation: () =&gt; _userService.GetUserAsync(&quot;123&quot;),
    maxAttempts: 3,
    onRetry: (ex, attempt) =&gt; _logger.LogWarning($&quot;Próba {attempt} nieudana: {ex.Message}&quot;)
);
</code></pre>
<p><code>RetryHelper</code> <strong>nie wie nic</strong> o tym, co konkretnie robi <code>operation</code> - dostaje tylko "przepis" jako delegat i wykonuje go zgodnie z własną logiką retry. To jest praktycznie wzorzec projektowy Strategy, zaimplementowany bez tworzenia hierarchii interfejsów/klas - tylko przez delegaty.</p>
<h2>Delegaty a wyrażenia lambda - co się dzieje "pod spodem"</h2>
<pre><code class="language-csharp">Func&lt;int, int&gt; square = x =&gt; x * x;
</code></pre>
<p>Kompilator generuje w przybliżeniu:</p>
<pre><code class="language-csharp">private static int SquareLambda(int x) =&gt; x * x; // wygenerowana, &quot;ukryta&quot; metoda

Func&lt;int, int&gt; square = new Func&lt;int, int&gt;(SquareLambda);
</code></pre>
<p>Lambda to więc <strong>cukier składniowy</strong> - tworzy metodę (statyczną albo instancyjną, zależnie czy przechwytuje zmienne z otoczenia) i owija ją w instancję odpowiedniego delegata.</p>
<p><strong>Domknięcia (closures)</strong> - lambda może "przechwycić" zmienne z otaczającego zakresu:</p>
<pre><code class="language-csharp">public Func&lt;Order, bool&gt; CreateMinTotalFilter(decimal minTotal)
{
    return order =&gt; order.Total &gt;= minTotal; // &quot;minTotal&quot; jest przechwycone z parametru metody
}

var filter = CreateMinTotalFilter(500m);
filter(someOrder); // &quot;pamięta&quot; wartość 500m, mimo że CreateMinTotalFilter już dawno się zakończyło
</code></pre>
<p>To działa, bo kompilator w takich przypadkach generuje <strong>dodatkową klasę</strong> (tzw. closure class), która przechowuje przechwycone zmienne jako pola, i lambda staje się metodą na instancji tej klasy zamiast zwykłą metodą statyczną.</p>
<h2>Podsumowanie - gdzie to wszystko się łączy</h2>
<ul>
<li><strong><code>ICommand</code>/<code>RelayCommand</code></strong> - <code>Action&lt;object&gt;</code> i <code>Predicate&lt;object&gt;</code> to delegaty przekazane w konstruktorze, dzięki czemu <code>RelayCommand</code> jest reużywalny dla dowolnej logiki, bez tworzenia osobnej klasy <code>ICommand</code> na każdą akcję w aplikacji</li>
<li><strong><code>PropertyChanged</code>/<code>CanExecuteChanged</code></strong> - to eventy, czyli ograniczone (do <code>+=</code>/<code>-=</code>) delegaty multicast</li>
<li><strong>DI z <code>Func&lt;T&gt;</code></strong> - czasem wstrzykuje się <code>Func&lt;IService&gt;</code> zamiast <code>IService</code>, gdy potrzebujesz <strong>fabryki</strong> tworzącej nową instancję na żądanie, zamiast gotowej instancji</li>
<li><strong>LINQ</strong> w repozytoriach (<code>Where</code>, <code>Select</code>) - wszędzie tam, gdzie filtrujesz/mapujesz kolekcje zamówień, użytkowników itd.</li>
</ul>
<p>Delegaty to w praktyce fundament, na którym stoi cały styl "przekaż zachowanie jako parametr" w C# - od najprostszego callbacku, przez LINQ, po eventy i cały system bindingu w WPF.</p>
  
  `},

  { id:"callback-vs-function", title:"Callback vs funkcja", tags:"callback funkcja kontrola przepływu inversion",
  body:`
  <h1>Callback vs Funkcja - różnica</h1>
<p>To pytanie trochę myli poziomy - <strong>callback to nie jest odrębny byt techniczny, tylko rola, jaką funkcja pełni w danym kontekście</strong>. Każdy callback JEST funkcją, ale nie każda funkcja jest callbackiem.</p>
<h2>Funkcja - podstawowa jednostka kodu</h2>
<p>Funkcja (albo metoda w C#) to po prostu nazwany blok kodu, który wykonujesz <strong>bezpośrednio, kiedy go wołasz</strong>:</p>
<pre><code class="language-csharp">int Add(int a, int b) =&gt; a + b;

int result = Add(2, 3); // wywołujesz JĄ, wiesz dokładnie kiedy się wykona - teraz
</code></pre>
<p>Ty decydujesz, kiedy funkcja się wykona - wołasz ją i wynik masz od razu (albo, przy async, wiesz dokładnie w którym miejscu kodu jej rezultat się pojawi).</p>
<h2>Callback - funkcja przekazana jako dane, wywołana przez KOGOŚ INNEGO</h2>
<p>Callback to funkcja, którą <strong>przekazujesz jako parametr do innej funkcji/metody</strong>, a ta inna funkcja decyduje, <strong>kiedy (albo czy w ogóle) ją wywoła</strong>. Ty tracisz bezpośrednią kontrolę nad momentem wykonania.</p>
<pre><code class="language-csharp">public void ProcessOrder(Order order, Action&lt;Order&gt; onSuccess)
{
    // ... logika przetwarzania
    onSuccess(order); // TO metoda ProcessOrder decyduje kiedy (i czy) callback się wykona,
                       // nie kod, który wywołał ProcessOrder
}

// Wywołanie
ProcessOrder(myOrder, processedOrder =&gt;
{
    Console.WriteLine($&quot;Zamówienie {processedOrder.Id} przetworzone!&quot;); // to jest CALLBACK
});
</code></pre>
<p><code>processedOrder =&gt; Console.WriteLine(...)</code> to zwykła funkcja (lambda) - ale w tym kontekście pełni <strong>rolę callbacku</strong>, bo to <code>ProcessOrder</code> decyduje, kiedy (a może wcale, jeśli np. rzuci wyjątek wcześniej) ją odpali.</p>
<h2>Kluczowa różnica w jednym zdaniu</h2>
<blockquote>
<p><strong>Funkcja - Ty wołasz kod i kontrolujesz kiedy. Callback - przekazujesz kod komuś innemu i to on kontroluje kiedy (i czy) się wykona.</strong></p>
</blockquote>
<p>To jest różnica <strong>kontroli przepływu (inversion of control)</strong>, a nie różnica techniczna w budowie samej funkcji.</p>
<h2>Przykłady, które już widzieliśmy</h2>
<p><strong>1. <code>RelayCommand</code></strong> - <code>_execute</code> przekazany do konstruktora to callback:</p>
<pre><code class="language-csharp">SaveOrderCommand = new RelayCommand(execute: _ =&gt; SaveOrder());
</code></pre>
<p>Ty definiujesz <code>SaveOrder()</code> (funkcja), ale to <code>RelayCommand.Execute()</code> decyduje <strong>kiedy</strong> ją wywoła - dokładnie w momencie, gdy WPF stwierdzi, że kliknięto przycisk. Nie masz nad tym bezpośredniej kontroli.</p>
<p><strong>2. <code>PropertyChanged</code> event</strong> - handler podpięty pod event to callback:</p>
<pre><code class="language-csharp">viewModel.PropertyChanged += (sender, e) =&gt; Console.WriteLine($&quot;Zmieniło się: {e.PropertyName}&quot;);
</code></pre>
<p>Twój kod (lambda) nie wykona się, dopóki <code>ViewModelBase.SetProperty</code> nie zawoła <code>PropertyChanged?.Invoke(...)</code> - czyli w zupełnie innym miejscu w czasie, poza Twoją kontrolą.</p>
<p><strong>3. <code>Task.ContinueWith</code> / <code>then</code> w innych językach</strong> - klasyczny callback dla operacji asynchronicznej:</p>
<pre><code class="language-csharp">_userService.GetUserAsync(&quot;123&quot;)
    .ContinueWith(task =&gt; Console.WriteLine($&quot;Załadowano: {task.Result.Name}&quot;));
    // ↑ ten callback wykona się, gdy task się zakończy - w nieznanym momencie w przyszłości
</code></pre>
<p><strong>4. <code>RetryHelper.ExecuteWithRetryAsync</code></strong> - <code>operation</code> i <code>onRetry</code> to callbacki:</p>
<pre><code class="language-csharp">await RetryHelper.ExecuteWithRetryAsync(
    operation: () =&gt; _userService.GetUserAsync(&quot;123&quot;), // callback - wywoła RetryHelper, może wielokrotnie
    onRetry: (ex, attempt) =&gt; _logger.LogWarning(...)   // callback - wywoła się TYLKO jeśli operacja zawiedzie
);
</code></pre>
<p><code>onRetry</code> może się wykonać 0, 1 lub 2 razy, zależnie od tego, co się stanie wewnątrz <code>ExecuteWithRetryAsync</code> - Ty tego nie kontrolujesz, tylko dostarczasz "co zrobić, jeśli zajdzie taka potrzeba".</p>
<h2>Synchroniczny vs asynchroniczny callback - rozróżnienie, o które czasem pytają</h2>
<p>Callback <strong>nie musi</strong> być asynchroniczny - to częste błędne przekonanie:</p>
<pre><code class="language-csharp">// Synchroniczny callback - wykonuje się OD RAZU, w tym samym wątku, zanim List.ForEach zwróci sterowanie
orders.ForEach(order =&gt; Console.WriteLine(order.Id));

// Asynchroniczny callback - wykona się PÓŹNIEJ, po zakończeniu operacji I/O, może na innym wątku
await File.ReadAllTextAsync(path).ContinueWith(t =&gt; Console.WriteLine(t.Result));
</code></pre>
<p>W obu przypadkach to callback (bo kontrolę nad wywołaniem ma metoda, której go przekazałeś), ale różni się <strong>kiedy</strong> i <strong>na jakim wątku</strong> się wykona.</p>
<h2>Analogia</h2>
<ul>
<li><strong>Funkcja</strong> = dzwonisz do kogoś sam i czekasz na odpowiedź na linii - Ty inicjujesz i kontrolujesz rozmowę</li>
<li><strong>Callback</strong> = zostawiasz komuś swój numer telefonu ("oddzwoń, jak będziesz miał wyniki") - nie wiesz dokładnie kiedy (albo czy w ogóle) oddzwonią, to oni decydują</li>
</ul>
<h2>Podsumowanie tabelaryczne</h2>
<table>
<thead>
<tr>
<th></th>
<th>Funkcja (zwykłe wywołanie)</th>
<th>Callback</th>
</tr>
</thead>
<tbody>
<tr>
<td>Kto kontroluje moment wykonania</td>
<td>Wywołujący</td>
<td>Metoda, do której przekazano callback</td>
</tr>
<tr>
<td>Kiedy się wykonuje</td>
<td>Natychmiast, w miejscu wywołania</td>
<td>W nieznanym momencie - później, wielokrotnie, warunkowo, albo wcale</td>
</tr>
<tr>
<td>Przykład w C#</td>
<td><code>Add(2, 3)</code></td>
<td><code>Action</code>/<code>Func</code> przekazany jako parametr, event handler</td>
</tr>
<tr>
<td>Relacja do delegatów</td>
<td>Delegat <em>może</em> wskazywać na funkcję</td>
<td>Callback to <strong>funkcja użyta w roli parametru</strong> - technicznie realizowana właśnie przez delegat</td>
</tr>
</tbody>
</table>
<p>Krótko: <strong>każdy callback w C# jest zaimplementowany jako delegat</strong> (bo tylko przez delegat możesz "przekazać funkcję jako wartość"), ale samo słowo "callback" opisuje <strong>sposób użycia</strong> tej funkcji (przekazanie komuś, kto zdecyduje kiedy ją odpalić), a nie jej budowę techniczną.</p>
  
  `},

  { id:"underscore", title:'Znak "_" w C#', tags:"discard underscore lambda separator cyfr",
  body:`
  <h1>Znak <code>_</code> w C# - wszystkie znaczenia</h1>
<p>To dobre pytanie, bo <code>_</code> w C# ma <strong>kilka zupełnie różnych zastosowań</strong> zależnie od kontekstu - i to jest częsty temat "czy naprawdę rozumiesz różnicę" na rozmowach.</p>
<h2>1. Konwencja nazewnictwa - prywatne pola</h2>
<pre><code class="language-csharp">public class OrderViewModel : ViewModelBase
{
    private readonly IOrderService _orderService; // ← prefiks _ dla private fields
    private readonly ILogger _logger;

    public OrderViewModel(IOrderService orderService)
    {
        _orderService = orderService; // odróżnia pole od parametru konstruktora
    }
}
</code></pre>
<p>To jest <strong>tylko konwencja stylistyczna</strong> (z oficjalnego .NET coding style, powszechnie przyjęta), nie żadna specjalna składnia języka. <code>_orderService</code> to zwykła nazwa identyfikatora - kompilator traktuje <code>_</code> jak każdy inny znak dozwolony w nazwie zmiennej. Przydaje się głównie do <strong>odróżnienia pola klasy od parametru/zmiennej lokalnej</strong> bez potrzeby <code>this.orderService</code>.</p>
<h2>2. Discard (<code>_</code>) - "wyrzucam tę wartość, nie interesuje mnie"</h2>
<p>To jest <strong>prawdziwa cecha języka</strong> (od C# 7.0) - <code>_</code> jako <strong>placeholder</strong> mówiący kompilatorowi "wiem, że coś tu jest, ale świadomie tego nie użyję".</p>
<h3>a) Discard w deconstrukcji tupli</h3>
<pre><code class="language-csharp">(string name, int age, string _) = GetPersonData();
// interesuje mnie name i age, trzeci element (np. email) świadomie ignoruję

var (id, _) = (order.Id, order.InternalDebugCode); // ignoruję drugi element
</code></pre>
<h3>b) Discard w <code>out</code> parametrach</h3>
<pre><code class="language-csharp">// Interesuje mnie tylko CZY się udało, nie interesuje mnie sama wartość
if (int.TryParse(input, out _))
{
    Console.WriteLine(&quot;To jest poprawna liczba&quot;);
}

// Kontrast - gdybym potrzebował wartości:
if (int.TryParse(input, out int parsedValue))
{
    Console.WriteLine($&quot;Sparsowano: {parsedValue}&quot;);
}
</code></pre>
<h3>c) Discard w pattern matching / switch expressions</h3>
<p>To jest szczególnie częste w nowoczesnym C# (8.0+):</p>
<pre><code class="language-csharp">public string DescribeOrder(Order order) =&gt; order switch
{
    { Total: &gt; 1000 } =&gt; &quot;Duże zamówienie&quot;,
    { Items.Count: 0 } =&gt; &quot;Puste zamówienie&quot;,
    _ =&gt; &quot;Zwykłe zamówienie&quot; // ← &quot;default case&quot;, dosłownie &quot;cokolwiek innego&quot;
};
</code></pre>
<p>Tutaj <code>_</code> oznacza <strong>"każda wartość, która nie pasuje do wcześniejszych wzorców"</strong> - odpowiednik <code>default:</code> w tradycyjnym <code>switch</code>.</p>
<h3>d) Discard jako ignorowanie wyniku wywołania</h3>
<pre><code class="language-csharp">_ = _orderService.LogAccessAsync(orderId);
// świadomie &quot;odpalam i zapominam&quot; (fire-and-forget),
// jawnie mówię kompilatorowi że NIE interesuje mnie zwrócony Task
</code></pre>
<p>To jest przydatne, żeby <strong>zagłuszyć warning kompilatora</strong> (CS4014 - "call is not awaited") w sytuacjach, gdy naprawdę świadomie nie chcesz czekać na wynik - bez <code>_ =</code> dostałbyś ostrzeżenie sugerujące, że pewnie zapomniałeś <code>await</code>.</p>
<h2>3. <code>_</code> jako parametr lambdy, którego nie używasz</h2>
<p>Podobna idea co discard, ale w kontekście lambd - konwencja (nie wymuszona przez kompilator, ale czytelna):</p>
<pre><code class="language-csharp">// Timer callback - nie interesują mnie żadne z przekazanych argumentów
timer.Elapsed += (_, _) =&gt; RefreshData();

// W RelayCommand - parametr &quot;object parameter&quot; jest ignorowany
SaveOrderCommand = new RelayCommand(_ =&gt; SaveOrder());
</code></pre>
<p><strong>Ciekawostka techniczna:</strong> od C# 9.0 możesz użyć <strong>wielu</strong> <code>_</code> jako osobnych parametrów w tej samej lambdzie (jak w przykładzie <code>(_, _) =&gt; ...</code> powyżej) i kompilator to zaakceptuje jako dwa oddzielne discardy, mimo że normalnie nie możesz mieć dwóch zmiennych o tej samej nazwie w jednym zakresie.</p>
<h2>4. Podkreślenie jako separator cyfr w literałach liczbowych (C# 7.0+)</h2>
<p>Zupełnie inne zastosowanie - poprawia czytelność dużych liczb:</p>
<pre><code class="language-csharp">int million = 1_000_000; // czytelniejsze niż 1000000
long bigNumber = 1_000_000_000_000L;
double pi = 3.14_15_92;
int binaryFlags = 0b1010_0101_1100_0011; // przydatne przy liczbach binarnych
int hexColor = 0xFF_EC_A5;
</code></pre>
<p><code>_</code> jest tu <strong>czysto kosmetyczny</strong> - kompilator go ignoruje, <code>1_000_000</code> i <code>1000000</code> to dokładnie ta sama wartość. Nie ma znaczenia gdzie dokładnie stawiasz podkreślenia (nie muszą być co 3 cyfry).</p>
<h2>Jak odróżnić, o które znaczenie chodzi w danym kodzie</h2>
<table>
<thead>
<tr>
<th>Kontekst</th>
<th>Znaczenie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>private readonly IFoo _foo;</code></td>
<td>Konwencja nazewnicza pola</td>
</tr>
<tr>
<td><code>out _</code> / <code>(a, _)</code> / <code>_ = SomeCall()</code></td>
<td>Discard - świadome zignorowanie wartości</td>
</tr>
<tr>
<td><code>_ =&gt; DoSomething()</code> w lambdzie</td>
<td>Nieużywany parametr (forma discard)</td>
</tr>
<tr>
<td><code>_</code> jako ostatnia gałąź <code>switch</code></td>
<td>Wzorzec "wszystko inne" (default)</td>
</tr>
<tr>
<td><code>1_000_000</code></td>
<td>Separator cyfr w literale liczbowym</td>
</tr>
</tbody>
</table>
<h2>Dlaczego to jest istotne praktycznie - unikanie ostrzeżeń kompilatora</h2>
<p>Częsty scenariusz, gdzie discard faktycznie coś zmienia w jakości kodu:</p>
<pre><code class="language-csharp">// Źle - tworzysz zmienną, której nigdy nie użyjesz - kompilator/analizator to zgłosi (CS0168/IDE0059)
Dictionary&lt;string, Order&gt;.TryGetValue(id, out var unusedOrder);

// Dobrze - jawnie mówisz &quot;wiem, że to jest ignorowane&quot;
Dictionary&lt;string, Order&gt;.TryGetValue(id, out _);
</code></pre>
<p>To jest zresztą różnica, którą część analizatorów statycznych (Roslyn analyzers, ReSharper) faktycznie wymusza - <code>out _</code> jest traktowane jako <strong>czystszy kod intencji</strong> niż <code>out var ignoredVariable</code>, bo jasno komunikuje "ta wartość jest celowo nieużywana", a nie "zapomniałem jej użyć".</p>
  
  `},

  { id:"class-vs-record", title:"Class vs record", tags:"record class equality value reference with init",
  body:`
  <h1>Różnica między klasą a rekordem w C</h1>
<h2>Fundamentalna różnica - semantyka równości</h2>
<pre><code class="language-csharp">public class OrderClass
{
    public int Id { get; set; }
    public string CustomerName { get; set; }
}

public record OrderRecord(int Id, string CustomerName);
</code></pre>
<pre><code class="language-csharp">var a = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
var b = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
Console.WriteLine(a == b);        // false - RÓŻNE obiekty w pamięci (porównanie referencji)
Console.WriteLine(a.Equals(b));   // false - to samo

var c = new OrderRecord(1, &quot;Jan&quot;);
var d = new OrderRecord(1, &quot;Jan&quot;);
Console.WriteLine(c == d);        // true - TE SAME wartości (porównanie wartościowe)
Console.WriteLine(c.Equals(d));   // true - to samo
</code></pre>
<p><strong>Class</strong> - domyślnie <strong>reference equality</strong> (czy to ten sam obiekt w pamięci).
<strong>Record</strong> - domyślnie <strong>value equality</strong> (czy wszystkie właściwości mają te same wartości).</p>
<h2>Skąd to się bierze - co generuje kompilator</h2>
<p>Dla <code>record</code> kompilator <strong>automatycznie generuje</strong>: konstruktor, właściwości <code>init</code>, przeciążony <code>Equals()</code>/<code>GetHashCode()</code> oparty na porównaniu wszystkich pól, <code>ToString()</code>, operatory <code>==</code>/<code>!=</code>, metodę <code>Deconstruct()</code>. Dla <code>class</code> musisz to wszystko pisać ręcznie, jeśli chcesz podobnego zachowania.</p>
<h2>Mutowalność - kolejna kluczowa różnica</h2>
<pre><code class="language-csharp">public class OrderClass
{
    public int Id { get; set; } // set - można zmieniać w dowolnym momencie
}

public record OrderRecord(int Id); // init - tylko przy tworzeniu

var orderClass = new OrderClass { Id = 1 };
orderClass.Id = 2; // ✅ OK - class jest mutowalny domyślnie

var orderRecord = new OrderRecord(1);
orderRecord.Id = 2; // ❌ Błąd kompilacji - init-only, nie da się zmienić po utworzeniu
</code></pre>
<p><strong>Zmiana z niemutowalnym recordem - <code>with</code>:</strong></p>
<pre><code class="language-csharp">var updated = orderRecord with { Id = 2 }; // NOWA instancja, oryginał niezmieniony
</code></pre>
<h2><code>ToString()</code> - czytelna reprezentacja "za darmo"</h2>
<pre><code class="language-csharp">var orderClass = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
Console.WriteLine(orderClass);
// OrderClass - domyślny ToString() z object, bezużyteczny (chyba że nadpiszesz ręcznie)

var orderRecord = new OrderRecord(1, &quot;Jan&quot;);
Console.WriteLine(orderRecord);
// OrderRecord { Id = 1, CustomerName = Jan } - AUTOMATYCZNIE czytelny format
</code></pre>
<h2>Dekonstrukcja - wbudowana w record</h2>
<pre><code class="language-csharp">public record OrderRecord(int Id, string CustomerName);

var order = new OrderRecord(1, &quot;Jan&quot;);
var (id, customerName) = order; // działa od razu, bez pisania własnego Deconstruct()
</code></pre>
<p>Dla <code>class</code> trzeba by ręcznie zaimplementować <code>Deconstruct()</code>.</p>
<h2>Składnia - positional vs "klasyczna" record</h2>
<pre><code class="language-csharp">// Positional (skrócona) - najczęściej używana
public record OrderDto(int Id, string CustomerName, decimal TotalAmount);

// &quot;Klasyczna&quot; składnia record - jak class, ale z równością wartościową
public record OrderDto
{
    public int Id { get; init; }
    public string CustomerName { get; init; }
    public decimal TotalAmount { get; init; }
}
</code></pre>
<p>Druga forma bywa potrzebna, gdy chcesz mieć dodatkową logikę walidacyjną w konstruktorze albo właściwości obliczane.</p>
<h2>Dziedziczenie - obie wspierają, ale record ma dodatkowe zasady równości</h2>
<pre><code class="language-csharp">public record Animal(string Name);
public record Dog(string Name, string Breed) : Animal(Name);

var dog1 = new Dog(&quot;Rex&quot;, &quot;Labrador&quot;);
var dog2 = new Dog(&quot;Rex&quot;, &quot;Labrador&quot;);
dog1 == dog2; // true - ale UWAGA:

Animal animal = dog1;
Animal sameAnimal = new Dog(&quot;Rex&quot;, &quot;Labrador&quot;);
animal == sameAnimal; // true - record porównuje też RUNTIME TYPE, nie tylko właściwości bazowe!
</code></pre>
<p>To jest subtelna różnica względem <code>class</code> - <code>record</code> sprawdza, czy porównywane obiekty są <strong>dokładnie tego samego typu w runtime</strong>, więc <code>Dog</code> nigdy nie będzie "równy" hipotetycznemu innemu typowi dziedziczącemu po <code>Animal</code>, nawet z tymi samymi wartościami pól.</p>
<h2>record class vs record struct</h2>
<pre><code class="language-csharp">public record OrderDto(int Id);           // domyślnie: record CLASS (typ referencyjny, na stercie)
public record struct PointDto(int X, int Y); // record STRUCT (typ wartościowy, na stosie)
</code></pre>
<p><code>record struct</code> łączy semantykę wartości <code>record</code> z semantyką pamięciową <code>struct</code> - kopiowanie przez wartość, brak alokacji na stercie. Przydatne dla małych, prostych danych.</p>
<h2>Tabela porównawcza</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>class</code></th>
<th><code>record</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Równość domyślna</td>
<td>Referencyjna (ten sam obiekt)</td>
<td>Wartościowa (te same dane)</td>
</tr>
<tr>
<td>Mutowalność</td>
<td>Domyślnie mutowalny (<code>set</code>)</td>
<td>Domyślnie niemutowalny (<code>init</code>)</td>
</tr>
<tr>
<td><code>ToString()</code></td>
<td>Domyślny, bezużyteczny</td>
<td>Automatyczny, czytelny</td>
</tr>
<tr>
<td>Dekonstrukcja</td>
<td>Trzeba pisać ręcznie</td>
<td>Wbudowana (dla positional)</td>
</tr>
<tr>
<td><code>with</code> (kopiowanie ze zmianą)</td>
<td>Nie wspiera</td>
<td>Wspiera natywnie</td>
</tr>
<tr>
<td>Typ pamięciowy</td>
<td>Referencyjny (sterta)</td>
<td>Referencyjny (sterta), chyba że <code>record struct</code></td>
</tr>
<tr>
<td>Kiedy używać</td>
<td>Encje z tożsamością, obiekty z zachowaniem i mutowalnym stanem</td>
<td>Dane (DTO, Command/Query), wartości, gdzie liczy się "co", nie "który"</td>
</tr>
</tbody>
</table>
<h2>Kiedy który wybrać - praktyczna reguła</h2>
<p><strong><code>record</code>:</strong>
- DTO w Web API (<code>OrderDto</code>)
- Command/Query w CQRS (<code>GetOrderQuery(int OrderId)</code>)
- Wszędzie, gdzie dwa obiekty o tych samych danych <strong>powinny być uznane za "te same"</strong>
- Gdy chcesz niemutowalności domyślnie</p>
<p><strong><code>class</code>:</strong>
- Encje EF Core (<code>Order</code> z bazy) - <strong>wymagają mutacji</strong> dla change trackingu (<code>order.Status = "Shipped"</code>), a <code>record</code> z <code>init</code>-only property by to uniemożliwił
- Serwisy, ViewModel, repozytoria - obiekty z <strong>zachowaniem</strong>, nie tylko danymi
- Gdy tożsamość obiektu ma znaczenie niezależnie od wartości pól (dwa <code>Order</code> o tym samym <code>Id</code>, ale różnym <code>Status</code> w czasie, to wciąż "ten sam" order koncepcyjnie - to nie pasuje do "equality po wszystkich wartościach")</p>
<h2>Pytanie-pułapka na rozmowie</h2>
<p><em>"Czy encja EF Core powinna być recordem?"</em> - <strong>Zwykle nie</strong>. EF Core opiera się na <strong>change trackingu przez mutację właściwości</strong> (o czym mówiliśmy przy Change Tracking) - potrzebuje <code>set</code>, nie <code>init</code>. Poza tym semantyka "równości po tożsamości" (ten sam wiersz w bazie, identyfikowany przez klucz główny) lepiej pasuje do <code>class</code> niż "równości po wszystkich wartościach" z <code>record</code> - dwa <code>Order</code> o tym samym <code>Id</code>, ale z jedną zmienioną właściwością, to koncepcyjnie wciąż "ten sam" zamówienie, a <code>record</code> uznałby je za różne obiekty (bo różnią się wartością).</p>
  
  `},

  { id:"record-declaration", title:"Deklaracja record vs class", tags:"record positional syntax deconstruct equals hashcode generowany kod",
  body:`
  <h1>Porównanie deklaracji <code>record</code> i <code>class</code> w C# - składnia obok siebie</h1>
<h2>1. Najprostszy przypadek - dane bez logiki</h2>
<pre><code class="language-csharp">// CLASS - pełna, rozwlekła składnia
public class OrderClass
{
    public int Id { get; set; }
    public string CustomerName { get; set; }
    public decimal TotalAmount { get; set; }
}

// RECORD - positional syntax, jedna linijka
public record OrderRecord(int Id, string CustomerName, decimal TotalAmount);
</code></pre>
<p>Ta jedna linijka <code>record</code> <strong>generuje automatycznie</strong> to, co w <code>class</code> musisz napisać ręcznie (i więcej) - zobaczmy dokładnie <strong>co konkretnie</strong> kryje się pod tą skróconą składnią.</p>
<h2>2. Co faktycznie generuje kompilator dla <code>record</code> - "rozwinięcie" positional record</h2>
<p>Żeby zrozumieć różnicę, warto zobaczyć, do czego <strong>w przybliżeniu</strong> kompiluje się <code>public record OrderRecord(int Id, string CustomerName, decimal TotalAmount);</code>:</p>
<pre><code class="language-csharp">// To, co MUSISZ napisać ręcznie w class, żeby uzyskać RÓWNOWAŻNE zachowanie do record:
public class OrderRecordEquivalent : IEquatable&lt;OrderRecordEquivalent&gt;
{
    // Właściwości - init, nie set (niemutowalność)
    public int Id { get; init; }
    public string CustomerName { get; init; }
    public decimal TotalAmount { get; init; }

    // Konstruktor pozycyjny
    public OrderRecordEquivalent(int id, string customerName, decimal totalAmount)
    {
        Id = id;
        CustomerName = customerName;
        TotalAmount = totalAmount;
    }

    // Equals (wartościowy, nie referencyjny)
    public override bool Equals(object obj) =&gt; Equals(obj as OrderRecordEquivalent);
    public bool Equals(OrderRecordEquivalent other)
    {
        if (other is null) return false;
        if (ReferenceEquals(this, other)) return true;
        return Id == other.Id &amp;&amp; CustomerName == other.CustomerName &amp;&amp; TotalAmount == other.TotalAmount;
    }

    // GetHashCode spójny z Equals
    public override int GetHashCode() =&gt; HashCode.Combine(Id, CustomerName, TotalAmount);

    // Operatory == i !=
    public static bool operator ==(OrderRecordEquivalent left, OrderRecordEquivalent right)
        =&gt; left is null ? right is null : left.Equals(right);
    public static bool operator !=(OrderRecordEquivalent left, OrderRecordEquivalent right) =&gt; !(left == right);

    // ToString - czytelna reprezentacja
    public override string ToString()
        =&gt; $&quot;OrderRecordEquivalent {{ Id = {Id}, CustomerName = {CustomerName}, TotalAmount = {TotalAmount} }}&quot;;

    // Deconstruct - dekonstrukcja
    public void Deconstruct(out int id, out string customerName, out decimal totalAmount)
    {
        id = Id;
        customerName = CustomerName;
        totalAmount = TotalAmount;
    }

    // &quot;with&quot; wymaga specjalnego konstruktora kopiującego - w prawdziwym record generowanego automatycznie
    protected OrderRecordEquivalent(OrderRecordEquivalent original)
    {
        Id = original.Id;
        CustomerName = original.CustomerName;
        TotalAmount = original.TotalAmount;
    }
}
</code></pre>
<p><strong>To wszystko</strong> kryje się pod jedną linijką <code>record</code>. To jest chyba najbardziej przekonujący sposób pokazania różnicy na rozmowie - <code>record</code> to nie "inny słowny kluczowy dla tego samego", tylko <strong>realna redukcja boilerplate'u</strong> o kilkadziesiąt linijek.</p>
<h2>3. Deklaracja właściwości - <code>set</code> vs <code>init</code></h2>
<pre><code class="language-csharp">// CLASS - domyślnie mutowalna (set)
public class OrderClass
{
    public int Id { get; set; }
}

var c = new OrderClass { Id = 1 };
c.Id = 2; // ✅ OK w dowolnym momencie

// RECORD (positional) - domyślnie init-only
public record OrderRecord(int Id);

var r = new OrderRecord(1);
r.Id = 2; // ❌ Błąd kompilacji

// RECORD można też zrobić mutowalny, jeśli jawnie użyjesz &quot;set&quot;
public record MutableOrderRecord
{
    public int Id { get; set; } // jawne &quot;set&quot; zamiast domyślnego init z positional syntax
}
</code></pre>
<p>To pokazuje, że <code>record</code> <strong>nie jest z definicji niemutowalny</strong> - to positional syntax generuje <code>init</code> domyślnie, ale możesz to nadpisać, pisząc właściwości ręcznie z <code>set</code>.</p>
<h2>4. "Klasyczna" składnia record (bez positional) - bliżej wyglądem do <code>class</code></h2>
<pre><code class="language-csharp">// CLASS
public class OrderClass
{
    public int Id { get; set; }
    public string CustomerName { get; set; }

    public OrderClass(int id, string customerName)
    {
        Id = id;
        CustomerName = customerName;
    }
}

// RECORD - &quot;klasyczna&quot; składnia, bardzo podobna do class, RÓŻNI SIĘ tylko słowem kluczowym
public record OrderRecord
{
    public int Id { get; init; }           // init zamiast set - ale możesz dać &quot;set&quot; jeśli chcesz mutowalności
    public string CustomerName { get; init; }

    public OrderRecord(int id, string customerName)
    {
        Id = id;
        CustomerName = customerName;
    }
}
</code></pre>
<p><strong>Kluczowy wniosek:</strong> samo słowo <code>record</code> zamiast <code>class</code> <strong>już samo w sobie</strong> daje Ci wygenerowany <code>Equals</code>/<code>GetHashCode</code>/<code>ToString</code>/operatory <code>==</code>/<code>!=</code> - niezależnie od tego, czy używasz skróconej (positional) czy pełnej składni. Positional to dodatkowy "bonus" (automatyczny konstruktor + właściwości), ale sama zamiana <code>class</code> → <code>record</code> już zmienia semantykę równości.</p>
<h2>5. Dziedziczenie - składnia niemal identyczna, semantyka różna</h2>
<pre><code class="language-csharp">// CLASS
public class Animal
{
    public string Name { get; set; }
    public Animal(string name) =&gt; Name = name;
}
public class Dog : Animal
{
    public string Breed { get; set; }
    public Dog(string name, string breed) : base(name) =&gt; Breed = breed;
}

// RECORD - positional, dużo krócej
public record Animal(string Name);
public record Dog(string Name, string Breed) : Animal(Name); // &quot;base&quot; wywołany w nagłówku dziedziczenia
</code></pre>
<h2>6. <code>record class</code> vs <code>record struct</code> - dodatkowa oś, której <code>class</code> nie ma</h2>
<pre><code class="language-csharp">public record OrderDto(int Id);              // domyślnie: record CLASS (referencyjny, sterta)
public record class OrderDtoExplicit(int Id); // to samo, jawnie
public record struct PointDto(int X, int Y);  // record STRUCT (wartościowy, stos)
</code></pre>
<p><code>class</code> nie ma odpowiednika <code>record struct</code> - zwykły <code>struct</code> <strong>nie generuje</strong> automatycznie <code>Equals</code>/<code>GetHashCode</code> po wartościach tak dokładnie jak <code>record struct</code> (choć <code>struct</code> sam w sobie <strong>domyślnie porównuje pola przez refleksję</strong> w <code>ValueType.Equals</code>, co jest <strong>wolniejsze</strong> niż wygenerowany kod w <code>record struct</code>).</p>
<h2>7. Modyfikator <code>sealed</code> przy dziedziczeniu record - subtelna różnica</h2>
<pre><code class="language-csharp">public record Animal(string Name);
public record Dog(string Name, string Breed) : Animal(Name);
</code></pre>
<p>Kompilator <strong>automatycznie</strong> generuje w <code>Dog</code> metodę porównującą <code>EqualityContract</code> (chronioną właściwość, którą widzieliśmy pośrednio przy dziedziczeniu recordów) - to jest mechanizm <strong>unikalny dla record</strong>, którego <code>class</code> w ogóle nie ma, bo <code>class</code> nie generuje żadnej automatycznej logiki równości.</p>
<h2>Zestawienie - tabela różnic w samej deklaracji</h2>
<table>
<thead>
<tr>
<th>Element składni</th>
<th><code>class</code></th>
<th><code>record</code> (positional)</th>
<th><code>record</code> (klasyczna składnia)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Deklaracja właściwości</td>
<td>Trzeba pisać jawnie</td>
<td>Generowane z parametrów</td>
<td>Trzeba pisać jawnie</td>
</tr>
<tr>
<td>Domyślny accessor</td>
<td><code>{ get; set; }</code> (jeśli tak napiszesz)</td>
<td><code>{ get; init; }</code> automatycznie</td>
<td>Musisz sam wybrać <code>set</code>/<code>init</code></td>
</tr>
<tr>
<td>Konstruktor</td>
<td>Trzeba pisać jawnie (lub domyślny bezparametrowy)</td>
<td>Generowany z parametrów positional</td>
<td>Trzeba pisać jawnie</td>
</tr>
<tr>
<td><code>Equals</code>/<code>GetHashCode</code></td>
<td>Dziedziczone z <code>object</code> (referencja)</td>
<td>Generowane (wartość)</td>
<td>Generowane (wartość)</td>
</tr>
<tr>
<td><code>ToString()</code></td>
<td>Dziedziczony z <code>object</code> (bezużyteczny)</td>
<td>Generowany (czytelny)</td>
<td>Generowany (czytelny)</td>
</tr>
<tr>
<td><code>Deconstruct()</code></td>
<td>Trzeba pisać ręcznie</td>
<td>Generowany automatycznie</td>
<td>Trzeba pisać ręcznie</td>
</tr>
<tr>
<td><code>with</code> expression</td>
<td>Nie wspiera</td>
<td>Wspiera</td>
<td>Wspiera</td>
</tr>
<tr>
<td>Operatory <code>==</code>/<code>!=</code></td>
<td>Dziedziczone (referencja), można przeciążyć ręcznie</td>
<td>Generowane (wartość)</td>
<td>Generowane (wartość)</td>
</tr>
</tbody>
</table>
<h2>Minimalna, zwięzła odpowiedź na to pytanie na rozmowie</h2>
<blockquote>
<p><em>"Składniowo <code>record</code> w wersji positional (<code>record OrderDto(int Id, string Name);</code>) to jedna linijka zastępująca to, co w <code>class</code> wymagałoby osobnej deklaracji właściwości, konstruktora, i ręcznego nadpisania <code>Equals</code>, <code>GetHashCode</code>, <code>ToString</code> oraz operatorów <code>==</code>/<code>!=</code>, jeśli chcemy równości wartościowej. Nawet 'klasyczna' składnia record (bez positional, z jawnymi property) wygląda niemal identycznie jak class, ale samo słowo kluczowe <code>record</code> zamiast <code>class</code> włącza automatyczne generowanie tej całej logiki równości i <code>ToString</code> - to jest różnica semantyczna ukryta pod bardzo podobną składnią."</em></p>
</blockquote>
  
  `},

  { id:"record-vs-class-compare", title:"Jak porównywać record i class", tags:"equals gethashcode referenceequals iequatable iequalitycomparer",
  body:`
  <h1>Jak porównywać instancje <code>record</code> i <code>class</code> w C</h1>
<h2>Domyślne zachowanie - zestawienie</h2>
<pre><code class="language-csharp">public class OrderClass { public int Id { get; set; } public string CustomerName { get; set; } }
public record OrderRecord(int Id, string CustomerName);

var c1 = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
var c2 = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };

var r1 = new OrderRecord(1, &quot;Jan&quot;);
var r2 = new OrderRecord(1, &quot;Jan&quot;);

// CLASS - porównanie referencji
Console.WriteLine(c1 == c2);         // false
Console.WriteLine(c1.Equals(c2));    // false
Console.WriteLine(ReferenceEquals(c1, c2)); // false

// RECORD - porównanie wartości
Console.WriteLine(r1 == r2);         // true
Console.WriteLine(r1.Equals(r2));    // true
Console.WriteLine(ReferenceEquals(r1, r2)); // false - to WCIĄŻ różne obiekty w pamięci!
</code></pre>
<p><strong>Kluczowa obserwacja:</strong> <code>ReferenceEquals</code> <strong>zawsze</strong> sprawdza tożsamość obiektu w pamięci, niezależnie czy to <code>class</code> czy <code>record</code> - <code>record</code> nie zmienia tego, co się fizycznie dzieje w pamięci, tylko <strong>nadpisuje</strong>, co robi <code>Equals()</code>/<code>==</code>.</p>
<h2>Trzy sposoby porównywania - i które którego typu dotyczą</h2>
<h3>1. <code>ReferenceEquals()</code> - zawsze porównanie tożsamości, niezależnie od typu</h3>
<pre><code class="language-csharp">object.ReferenceEquals(c1, c2); // false - różne obiekty w pamięci (dotyczy I class, I record)
object.ReferenceEquals(r1, r1); // true - to TEN SAM obiekt
</code></pre>
<p>To jest jedyny sposób, który <strong>zawsze</strong> działa identycznie, niezależnie od tego, czy masz <code>class</code> czy <code>record</code> - bo sprawdza fizyczną tożsamość w pamięci, ignorując jakąkolwiek nadpisaną logikę <code>Equals</code>.</p>
<h3>2. <code>Equals()</code> - zależy od tego, co dana klasa/record definiuje</h3>
<pre><code class="language-csharp">c1.Equals(c2); // false dla zwykłej class (dziedziczy Equals z object = reference equality)
r1.Equals(r2); // true dla record (kompilator wygenerował Equals oparte na wartościach)
</code></pre>
<h3>3. Operator <code>==</code> - dla <code>class</code> domyślnie to samo co <code>ReferenceEquals</code>, dla <code>record</code> to samo co <code>Equals</code></h3>
<pre><code class="language-csharp">c1 == c2; // false - dla zwykłej class, == to alias na ReferenceEquals (chyba że przeciążysz operator)
r1 == r2; // true - record AUTOMATYCZNIE przeciąża == żeby wywoływał Equals (wartościowe porównanie)
</code></pre>
<h2>Jak sprawić, żeby <code>class</code> porównywała się jak <code>record</code> - nadpisanie <code>Equals</code>/<code>GetHashCode</code></h2>
<p>Jeśli chcesz <strong>równości wartościowej</strong> dla zwykłej klasy (bez przechodzenia na <code>record</code>, np. bo potrzebujesz mutowalności ORAZ porównania po wartości), musisz to napisać ręcznie:</p>
<pre><code class="language-csharp">public class OrderClass : IEquatable&lt;OrderClass&gt;
{
    public int Id { get; set; }
    public string CustomerName { get; set; }

    // Nadpisanie Equals(object) - wymagane, dziedziczone z object
    public override bool Equals(object obj) =&gt; Equals(obj as OrderClass);

    // IEquatable&lt;T&gt;.Equals - bardziej wydajne (bez boxing/rzutowania), dobra praktyka
    public bool Equals(OrderClass other)
    {
        if (other is null) return false;
        if (ReferenceEquals(this, other)) return true; // optymalizacja - ten sam obiekt
        return Id == other.Id &amp;&amp; CustomerName == other.CustomerName;
    }

    // GetHashCode MUSI być spójny z Equals - jeśli Equals zwraca true, hash MUSI być identyczny
    public override int GetHashCode() =&gt; HashCode.Combine(Id, CustomerName);

    // Przeciążenie operatorów == i != - żeby zachowywały się jak Equals
    public static bool operator ==(OrderClass left, OrderClass right)
        =&gt; left is null ? right is null : left.Equals(right);

    public static bool operator !=(OrderClass left, OrderClass right) =&gt; !(left == right);
}
</code></pre>
<pre><code class="language-csharp">var c1 = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
var c2 = new OrderClass { Id = 1, CustomerName = &quot;Jan&quot; };
c1 == c2;       // TERAZ true - bo przeciążyliśmy operator
c1.Equals(c2);  // true
</code></pre>
<p><strong>To jest dokładnie kod, który <code>record</code> generuje za Ciebie automatycznie</strong> - widzisz teraz "cenę" tej wygody: dla <code>class</code> musisz to napisać ręcznie (i pamiętać o <code>GetHashCode</code>, <code>IEquatable&lt;T&gt;</code>, przeciążeniu operatorów), dla <code>record</code> dostajesz to za darmo z jednej linijki.</p>
<h2>Kluczowa zasada: <code>Equals</code> i <code>GetHashCode</code> MUSZĄ być spójne</h2>
<p>To jest <strong>klasyczne pytanie-pułapka</strong> na rozmowie - jeśli nadpiszesz <code>Equals()</code>, <strong>musisz</strong> też nadpisać <code>GetHashCode()</code>, inaczej łamiesz kontrakt:</p>
<pre><code class="language-csharp">// ❌ BŁĄD - Equals nadpisany, GetHashCode NIE
public class Order
{
    public int Id { get; set; }
    public override bool Equals(object obj) =&gt; obj is Order o &amp;&amp; o.Id == Id;
    // BRAK GetHashCode() - kompilator da WARNING (CS0659), ale się skompiluje
}
</code></pre>
<p><strong>Konsekwencja praktyczna</strong> - to psuje <code>HashSet</code>/<code>Dictionary</code>:</p>
<pre><code class="language-csharp">var order1 = new Order { Id = 1 };
var order2 = new Order { Id = 1 };

order1.Equals(order2); // true - &quot;logicznie&quot; to ten sam order

var set = new HashSet&lt;Order&gt;();
set.Add(order1);
set.Contains(order2); // MOŻE zwrócić false! - bo GetHashCode() dziedziczony z object
                        // daje RÓŻNE hashe dla order1 i order2 (bo to różne obiekty w pamięci),
                        // więc HashSet szuka w ZŁYM &quot;kubełku&quot; i nigdy nie znajduje dopasowania
</code></pre>
<p><code>record</code> <strong>zawsze</strong> generuje spójną parę <code>Equals</code>/<code>GetHashCode</code>, więc ten konkretny błąd jest w rekordach <strong>niemożliwy</strong> - to jedna z realnych, praktycznych zalet, nie tylko składniowa wygoda.</p>
<h2>Porównanie kolekcji - <code>record</code> vs <code>class</code> w LINQ</h2>
<pre><code class="language-csharp">var records1 = new List&lt;OrderRecord&gt; { new(1, &quot;Jan&quot;), new(2, &quot;Anna&quot;) };
var records2 = new List&lt;OrderRecord&gt; { new(1, &quot;Jan&quot;), new(2, &quot;Anna&quot;) };

records1.SequenceEqual(records2); // true - porównuje element po elemencie przez Equals (wartościowo)
</code></pre>
<pre><code class="language-csharp">var classes1 = new List&lt;OrderClass&gt; { new() { Id = 1 }, new() { Id = 2 } };
var classes2 = new List&lt;OrderClass&gt; { new() { Id = 1 }, new() { Id = 2 } };

classes1.SequenceEqual(classes2); // false - bo Equals dla class to reference equality, obiekty są różne
</code></pre>
<h2>Porównywanie <code>record</code> z dziedziczeniem - uwzględnia dokładny typ</h2>
<pre><code class="language-csharp">public record Animal(string Name);
public record Dog(string Name, string Breed) : Animal(Name);

Animal a = new Dog(&quot;Rex&quot;, &quot;Labrador&quot;);
Animal b = new Animal(&quot;Rex&quot;); // TYLKO Animal, nie Dog

a.Equals(b); // false - mimo że Name=&quot;Rex&quot; pasuje, RUNTIME TYPE się różni (Dog vs Animal)
</code></pre>
<p>To jest różnica względem "naiwnego" ręcznego <code>Equals</code> w <code>class</code>, gdzie <strong>musisz sam pamiętać</strong> o sprawdzeniu typu (<code>obj is Order o</code>), a przy dziedziczeniu łatwo o błąd - <code>record</code> robi to poprawnie automatycznie przez wygenerowaną właściwość <code>EqualityContract</code>.</p>
<h2><code>IEqualityComparer&lt;T&gt;</code> - porównanie niestandardowe, niezależne od <code>Equals</code>/<code>GetHashCode</code> klasy</h2>
<p>Czasem chcesz porównać obiekty <strong>inaczej</strong> niż domyślne zachowanie klasy - wtedy zamiast nadpisywać <code>Equals</code> na samej klasie, tworzysz <strong>osobny comparer</strong>:</p>
<pre><code class="language-csharp">public class OrderByIdComparer : IEqualityComparer&lt;OrderClass&gt;
{
    public bool Equals(OrderClass x, OrderClass y) =&gt; x?.Id == y?.Id; // porównanie TYLKO po Id
    public int GetHashCode(OrderClass obj) =&gt; obj.Id.GetHashCode();
}

var set = new HashSet&lt;OrderClass&gt;(new OrderByIdComparer());
</code></pre>
<p>To działa <strong>identycznie</strong> dla <code>record</code> i <code>class</code> - <code>IEqualityComparer&lt;T&gt;</code> to zewnętrzny mechanizm, niezależny od tego, jak sam typ definiuje swoją "domyślną" równość.</p>
<h2>Tabela podsumowująca</h2>
<table>
<thead>
<tr>
<th>Metoda porównania</th>
<th><code>class</code> (domyślnie)</th>
<th><code>record</code> (domyślnie)</th>
<th>Po ręcznym nadpisaniu w <code>class</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ReferenceEquals()</code></td>
<td>Tożsamość w pamięci</td>
<td>Tożsamość w pamięci</td>
<td>Tożsamość w pamięci (bez zmian)</td>
</tr>
<tr>
<td><code>Equals()</code></td>
<td>Tożsamość (= <code>ReferenceEquals</code>)</td>
<td>Wartość wszystkich pól</td>
<td>Wartość (jeśli tak zaimplementujesz)</td>
</tr>
<tr>
<td><code>==</code></td>
<td>Tożsamość (alias na <code>ReferenceEquals</code>)</td>
<td>Wartość (przez wygenerowany <code>Equals</code>)</td>
<td>Wartość (jeśli przeciążysz operator)</td>
</tr>
<tr>
<td><code>GetHashCode()</code></td>
<td>Bazuje na tożsamości (domyślny z <code>object</code>)</td>
<td>Bazuje na wartościach pól</td>
<td>Musisz dopasować ręcznie do <code>Equals</code></td>
</tr>
</tbody>
</table>
<h2>Praktyczna rada na rozmowę</h2>
<blockquote>
<p><em>"Domyślnie <code>class</code> porównuje przez referencję, <code>record</code> przez wartość wszystkich właściwości - to wynika z tego, że kompilator generuje dla recordów <code>Equals</code>/<code>GetHashCode</code>/operatory <code>==</code>/<code>!=</code> automatycznie. Jeśli potrzebuję równości wartościowej dla <code>class</code> (np. bo muszę zachować mutowalność, której <code>record</code> z <code>init</code> nie daje), implementuję <code>IEquatable&lt;T&gt;</code> ręcznie, pamiętając o kluczowej zasadzie: <code>Equals</code> i <code>GetHashCode</code> muszą być spójne, inaczej psuje się zachowanie w <code>HashSet</code>/<code>Dictionary</code>. <code>ReferenceEquals</code> zawsze pozostaje niezmienny - sprawdza fizyczną tożsamość w pamięci, niezależnie od typu."</em></p>
</blockquote>
  
  `},

  { id:"abstract-vs-interface", title:"Klasa abstrakcyjna vs interfejs", tags:"abstract interface dziedziczenie wielokrotne template method",
  body:`
  <h1>Klasa abstrakcyjna vs interfejs w C</h1>
<h2>Podstawowa definicja</h2>
<pre><code class="language-csharp">// Interfejs - czysty kontrakt, żadnej implementacji (do C# 7)
public interface IOrderValidator
{
    bool Validate(Order order);
}

// Klasa abstrakcyjna - może mieć implementację, może być częściowa
public abstract class OrderProcessorBase
{
    protected readonly ILogger _logger;

    protected OrderProcessorBase(ILogger logger) // konstruktor - czego interfejs nie ma
    {
        _logger = logger;
    }

    public abstract void Process(Order order); // metoda BEZ implementacji - musi być nadpisana

    public void LogProcessing(Order order) // metoda Z implementacją - dziedziczona wprost
    {
        _logger.Log($&quot;Przetwarzanie zamówienia {order.Id}&quot;);
    }
}
</code></pre>
<h2>Kluczowa różnica #1: Dziedziczenie wielokrotne</h2>
<pre><code class="language-csharp">// ✅ Klasa może implementować WIELE interfejsów
public class Order : IValidatable, IComparable&lt;Order&gt;, IDisposable
{
    public bool Validate() =&gt; true;
    public int CompareTo(Order other) =&gt; 0;
    public void Dispose() { }
}

// ❌ Klasa może dziedziczyć TYLKO z JEDNEJ klasy (abstrakcyjnej lub nie)
public class SpecialOrder : OrderProcessorBase, AnotherBaseClass // BŁĄD KOMPILACJI
{
}
</code></pre>
<p>To jest <strong>najczęściej wymieniana</strong> różnica na rozmowach - C# (jak większość języków OOP poza C++) nie wspiera wielokrotnego dziedziczenia klas, ale <strong>wspiera</strong> implementowanie wielu interfejsów. To bezpośrednio wraca do <strong>Interface Segregation Principle</strong> z SOLID - dlatego lepiej mieć wiele małych interfejsów niż próbować "upchnąć" wszystko w jedną hierarchię klas.</p>
<h2>Kluczowa różnica #2: Stan (pola)</h2>
<pre><code class="language-csharp">public abstract class RepositoryBase&lt;T&gt;
{
    protected readonly AppDbContext _context; // ✅ Klasa abstrakcyjna MOŻE mieć pola/stan

    protected RepositoryBase(AppDbContext context) =&gt; _context = context;
}

public interface IRepository&lt;T&gt;
{
    // ❌ Interfejs NIE MOŻE mieć pól (tylko właściwości - bez backing fieldów)
    // AppDbContext Context; // błąd kompilacji
}
</code></pre>
<p>Klasa abstrakcyjna może trzymać <strong>prawdziwy stan</strong> (pola instancyjne) i logikę operującą na tym stanie. Interfejs definiuje tylko <strong>co</strong> klasa implementująca musi udostępnić, nie <strong>jak</strong> to przechowuje.</p>
<h2>Kluczowa różnica #3: Konstruktory</h2>
<pre><code class="language-csharp">public abstract class ViewModelBase
{
    protected ViewModelBase(ILogger logger) // ✅ konstruktor - inicjalizacja wspólnego stanu
    {
        Logger = logger;
    }

    protected ILogger Logger { get; }
}

public interface IViewModel
{
    // ❌ interfejs NIE MOŻE mieć konstruktora
}
</code></pre>
<p>To ma realną konsekwencję praktyczną - klasa abstrakcyjna może <strong>wymusić</strong> inicjalizację wspólnych zależności przez konstruktor (jak w <code>ViewModelBase</code>), interfejs nie ma takiej możliwości - implementująca klasa musi sama zadbać o inicjalizację.</p>
<h2>Kluczowa różnica #4: Modyfikatory dostępu</h2>
<pre><code class="language-csharp">public abstract class OrderProcessorBase
{
    public abstract void Process(Order order);
    protected virtual void Validate(Order order) { } // protected - dostępne tylko dla klas pochodnych
    private void InternalHelper() { }                 // private - w ogóle niedostępne z zewnątrz
}

public interface IOrderProcessor
{
    void Process(Order order); // wszystko w interfejsie jest implicitly PUBLIC
    // protected void Validate(Order order); // od C# 8+ MOŻLIWE (default interface methods), ale rzadko używane
}
</code></pre>
<p>Klasa abstrakcyjna daje pełną kontrolę nad widocznością (<code>public</code>, <code>protected</code>, <code>private</code>) - interfejs tradycyjnie wymusza wszystko jako <code>public</code> (choć nowoczesny C# częściowo to złagodził, patrz niżej).</p>
<h2>Domyślna implementacja w interfejsach (C# 8+) - zaciera granicę</h2>
<pre><code class="language-csharp">public interface ILogger
{
    void Log(string message);

    // Domyślna implementacja - NOWOŚĆ od C# 8.0
    void LogError(string message) =&gt; Log($&quot;BŁĄD: {message}&quot;); // implementacja WEWNĄTRZ interfejsu
}

public class ConsoleLogger : ILogger
{
    public void Log(string message) =&gt; Console.WriteLine(message);
    // LogError NIE musi być nadpisane - dziedziczy domyślną implementację
}
</code></pre>
<p>To zbliża interfejsy do klas abstrakcyjnych (można mieć "gotowy" kod), ale <strong>wciąż</strong> interfejs nie ma pól/stanu ani konstruktorów - to jest fundamentalna granica, której default interface methods nie przekraczają.</p>
<h2>Kiedy używać klasy abstrakcyjnej</h2>
<p><strong>Gdy klasy pochodne są ze sobą blisko powiązane i dzielą wspólną implementację</strong> - klasyczny <strong>Template Method Pattern</strong>, o którym mówiliśmy przy Inversion of Control:</p>
<pre><code class="language-csharp">public abstract class OrderProcessorBase
{
    // Kontroluje KOLEJNOŚĆ - wspólna dla wszystkich podklas
    public void Process(Order order)
    {
        Validate(order);
        Save(order);
        Notify(order);
    }

    protected virtual void Validate(Order order) { /* domyślna walidacja */ }
    protected abstract void Save(Order order);   // KAŻDA podklasa MUSI dostarczyć własną
    protected virtual void Notify(Order order) { /* domyślne powiadomienie */ }
}

public class StandardOrderProcessor : OrderProcessorBase
{
    protected override void Save(Order order) { /* zapis standardowy */ }
    // Validate i Notify - dziedziczone bez zmian, bo pasuje domyślne zachowanie
}
</code></pre>
<p>To pokazuje siłę klasy abstrakcyjnej - <strong>wspólna logika i kolejność wykonania</strong> żyje w jednym miejscu, podklasy dostarczają tylko to, co faktycznie się różni.</p>
<h2>Kiedy używać interfejsu</h2>
<p><strong>Gdy chcesz zdefiniować kontrakt, niekoniecznie powiązany hierarchią klas</strong> - klasy zupełnie niepowiązane mogą implementować ten sam interfejs:</p>
<pre><code class="language-csharp">public interface IComparable&lt;T&gt; { int CompareTo(T other); }

public class Order : IComparable&lt;Order&gt; { public int CompareTo(Order other) =&gt; 0; }
public class Product : IComparable&lt;Product&gt; { public int CompareTo(Product other) =&gt; 0; }
// Order i Product nie mają ze sobą NIC wspólnego poza tym jednym kontraktem
</code></pre>
<p><strong>Wzorzec, który już wielokrotnie widzieliśmy</strong> - DI operuje właśnie na interfejsach:</p>
<pre><code class="language-csharp">public interface IOrderService { Task&lt;Order&gt; GetOrderAsync(int id); }
services.AddScoped&lt;IOrderService, OrderService&gt;();
</code></pre>
<p>Interfejs jest tu preferowany, bo pozwala na <strong>łatwą podmianę implementacji</strong> (mock w testach, inna implementacja w runtime) - to dokładnie <strong>Dependency Inversion Principle</strong> z SOLID.</p>
<h2>Konkretny przykład - dlaczego <code>ViewModelBase</code> to klasa abstrakcyjna, a <code>IOrderService</code> to interfejs</h2>
<pre><code class="language-csharp">// Klasa abstrakcyjna - bo WSZYSTKIE ViewModel dzielą DOKŁADNIE tę samą logikę SetProperty
public abstract class ViewModelBase : INotifyPropertyChanged
{
    public event PropertyChangedEventHandler PropertyChanged;
    protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null)
    {
        if (EqualityComparer&lt;T&gt;.Default.Equals(field, value)) return;
        field = value;
        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));
    }
}

// Interfejs - bo różne implementacje (UserService, MockUserService w testach)
// mają RÓŻNĄ logikę wewnątrz, łączy je tylko kontrakt
public interface IUserService
{
    Task&lt;User&gt; GetUserAsync(string id);
}
</code></pre>
<p><code>ViewModelBase</code> dostarcza <strong>gotowy, współdzielony kod</strong> (implementację <code>SetProperty</code>) - to jest to, czego interfejs (przed C# 8) nie potrafił. <code>IUserService</code> to <strong>czysty kontrakt</strong> - każda implementacja robi coś zupełnie innego wewnątrz.</p>
<h2>Można łączyć oba naraz</h2>
<pre><code class="language-csharp">public interface IOrderProcessor
{
    void Process(Order order);
}

public abstract class OrderProcessorBase : IOrderProcessor // implementuje interfejs
{
    public void Process(Order order) // dostarcza wspólną implementację
    {
        Validate(order);
        Save(order);
    }

    protected virtual void Validate(Order order) { }
    protected abstract void Save(Order order);
}

public class StandardOrderProcessor : OrderProcessorBase
{
    protected override void Save(Order order) { }
}
</code></pre>
<p>To jest częsty, dobry wzorzec - <strong>interfejs jako kontrakt widoczny na zewnątrz</strong> (do DI, do mockowania w testach), <strong>klasa abstrakcyjna jako wspólna implementacja</strong> dla rodziny pokrewnych klas wewnątrz.</p>
<h2>Tabela porównawcza</h2>
<table>
<thead>
<tr>
<th></th>
<th>Klasa abstrakcyjna</th>
<th>Interfejs</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dziedziczenie wielokrotne</td>
<td>❌ Tylko jedna klasa bazowa</td>
<td>✅ Wiele interfejsów naraz</td>
</tr>
<tr>
<td>Pola/stan</td>
<td>✅ Tak</td>
<td>❌ Nie (tylko properties bez backing field)</td>
</tr>
<tr>
<td>Konstruktor</td>
<td>✅ Tak</td>
<td>❌ Nie</td>
</tr>
<tr>
<td>Implementacja metod</td>
<td>✅ Dowolna (pełna, częściowa, brak)</td>
<td>⚠️ Częściowo od C# 8 (default methods)</td>
</tr>
<tr>
<td>Modyfikatory dostępu</td>
<td>✅ public/protected/private</td>
<td>Domyślnie public (częściowo złagodzone w C# 8+)</td>
</tr>
<tr>
<td>Kiedy używać</td>
<td>Blisko powiązane klasy ze wspólną logiką (Template Method)</td>
<td>Kontrakt dla niepowiązanych klas, DI, testowalność</td>
</tr>
</tbody>
</table>
<h2>Pytanie-pułapka na rozmowie</h2>
<p><em>"Czy klasa abstrakcyjna może nie mieć żadnej metody <code>abstract</code>?"</em> - <strong>Tak, technicznie może.</strong> Sam modyfikator <code>abstract</code> na klasie oznacza tylko "nie można stworzyć instancji tej klasy bezpośrednio" (<code>new OrderProcessorBase()</code> się nie skompiluje) - może zawierać wyłącznie metody <code>virtual</code>/zwykłe, bez ani jednej <code>abstract</code>. To rzadkie w praktyce (zwykle jest jakiś powód, żeby wymusić nadpisanie), ale pokazuje, że <code>abstract class</code> to przede wszystkim <strong>"nie instancjonuj mnie bezpośrednio, jestem bazą do dziedziczenia"</strong>, niezależnie od tego, ile ma metod abstrakcyjnych.</p>
  
  `},

  <h1>Modyfikatory dostępu w C</h1>
<h2><code>public</code> - widoczne wszędzie</h2>
<pre><code class="language-csharp">public class Order
{
    public int Id { get; set; } // dostępne z DOWOLNEGO miejsca - innej klasy, innego assembly
}
</code></pre>
<p>Brak jakichkolwiek ograniczeń widoczności. Używane dla API klasy, które ma być wywoływane z zewnątrz - np. metody serwisów wstrzykiwanych przez DI, właściwości DTO.</p>
<h2><code>private</code> - widoczne tylko wewnątrz tej samej klasy</h2>
<pre><code class="language-csharp">public class OrderService
{
    private readonly AppDbContext _context; // widoczne TYLKO wewnątrz OrderService

    private bool IsValidOrder(Order order) =&gt; order.Items.Count &gt; 0; // tylko ta klasa może wywołać
}
</code></pre>
<p><strong>Domyślny modyfikator</strong>, jeśli nic nie napiszesz (dla pól i metod klasy - <code>class</code> sama w sobie domyślnie jest <code>internal</code>). Standard dla pól przechowujących zależności (<code>_context</code>, <code>_logger</code>) i metod pomocniczych niepotrzebnych na zewnątrz - hermetyzacja w czystej postaci.</p>
<h2><code>protected</code> - widoczne w tej klasie i klasach pochodnych</h2>
<pre><code class="language-csharp">public abstract class ViewModelBase
{
    protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null)
    {
        // ...
    }
}

public class OrderViewModel : ViewModelBase
{
    public void UpdateStatus(string status)
    {
        SetProperty(ref _status, status); // ✅ dostępne, bo OrderViewModel DZIEDZICZY po ViewModelBase
    }
}

var vm = new OrderViewModel();
vm.SetProperty(...); // ❌ Błąd - niedostępne z ZEWNĄTRZ, nawet jeśli masz instancję
</code></pre>
<p>Klasyczne zastosowanie w Template Method Pattern - metody pomocnicze, które mają być używane przez podklasy, ale nie przez "obcy" kod.</p>
<h2><code>internal</code> - widoczne w tym samym assembly (projekcie)</h2>
<pre><code class="language-csharp">// W projekcie MyApp.Core
internal class DatabaseMigrationHelper
{
    internal void RunMigration() { }
}
</code></pre>
<pre><code class="language-csharp">// W tym samym assembly (MyApp.Core) - OK
var helper = new DatabaseMigrationHelper();

// W INNYM assembly (np. MyApp.Web, referencujący MyApp.Core) - błąd kompilacji
var helper = new DatabaseMigrationHelper(); // ❌ niewidoczne
</code></pre>
<p>Przydatne dla klas/typów <strong>wewnętrznej implementacji biblioteki</strong>, które nie powinny być częścią publicznego API - konsument Twojej biblioteki (<code>.dll</code>) nie powinien mieć do nich dostępu, ale różne klasy <strong>wewnątrz</strong> tego samego projektu mogą się nawzajem widzieć.</p>

public class Unrelated
{
    void Test(Base b) =&gt; b.Method(); // ✅ OK - ten sam assembly wystarcza
}

public class DerivedInOtherAssembly : Base

    void Test() =&gt; Method(); // ✅ OK - dziedziczenie wystarcza, mimo innego assembly
}

public class UnrelatedInOtherAssembly
{
    void Test(Base b) =&gt; b.Method(); // ❌ Błąd - ani ten sam assembly, ani dziedziczenie
}
</code></pre>
<h2><code>private protected</code> - iloczyn uprawnień (AND logiczny) - C# 7.2+</h2>
<pre><code class="language-csharp">public class Base
{
    private protected void Method() { }
}

<p>Widoczne tylko, jeśli <strong>oba</strong> warunki są spełnione jednocześnie: klasa pochodna <strong>ORAZ</strong> w tym samym assembly.</p>
<pre><code class="language-csharp">// Ten sam assembly, dziedziczenie - JEDYNY przypadek, który działa
public class Derived : Base
{
    void Test() =&gt; Method(); // ✅ OK
}

// Inny assembly, dziedziczenie - NIE wystarczy
public class DerivedInOtherAssembly : Base
{
    void Test() =&gt; Method(); // ❌ Błąd - inny assembly, mimo dziedziczenia
