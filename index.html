  <h1>SynchronizationContext i ConfigureAwait - dogłębne wyjaśnienie</h1>
<h2>Punkt wyjścia: co to jest SynchronizationContext</h2>
<p><code>SynchronizationContext</code> to abstrakcja w .NET reprezentująca "gdzie" powinien wykonać się kod - a konkretniej, dostarcza mechanizm do "zaplanowania" wykonania delegata na odpowiednim wątku/kontekście.</p>
<p>Różne środowiska mają różne implementacje:
- <strong>WPF/WinForms</strong> - <code>DispatcherSynchronizationContext</code> - kolejkuje pracę na <strong>jeden konkretny wątek UI</strong> (bo WPF ma model STA - Single Threaded Apartment, tylko wątek UI może dotykać obiektów wizualnych)
- <strong>ASP.NET Core</strong> - <strong>nie ma</strong> <code>SynchronizationContext</code> (celowo usunięty w Core, w przeciwieństwie do starego ASP.NET), bo w Core nie ma pojęcia "wątku żądania" - requesty są obsługiwane przez pulę wątków bez przywiązania
- <strong>Konsola / usługa w tle</strong> - brak <code>SynchronizationContext</code> (jest <code>null</code>)</p>
<h2>Co dokładnie robi <code>await</code></h2>
<p>To jest sedno sprawy - <code>await</code> to nie magia, tylko cukier składniowy nad maszyną stanów. Kompilator generuje coś na kształt:</p>
<pre><code class="language-csharp">// To co piszesz:
public async Task LoadUserAsync()
{
    var user = await _userService.GetUserAsync(&quot;123&quot;);
    User = user; // UI update
}
</code></pre>
<p>...kompiluje się (w uproszczeniu) do czegoś takiego:</p>
<pre><code class="language-csharp">public Task LoadUserAsync()
{
    // 1. ZANIM await się zacznie - przechwytuje bieżący SynchronizationContext
    var capturedContext = SynchronizationContext.Current;

    var task = _userService.GetUserAsync(&quot;123&quot;);

    task.ContinueWith(completedTask =&gt;
    {
        var user = completedTask.Result;

        // 2. PO zakończeniu await - jeśli kontekst był przechwycony,
        // &quot;wraca&quot; na niego zamiast wykonać kontynuację na wątku,
        // na którym task się zakończył
        if (capturedContext != null)
        {
            capturedContext.Post(_ =&gt;
            {
                User = user; // ✅ wykonuje się z powrotem na UI thread
            }, null);
        }
        else
        {
            User = user; // wykonuje się na tym wątku, na którym task się skończył
        }
    });

    return task;
}
</code></pre>
<p><strong>Kluczowy moment:</strong> w momencie napotkania <code>await</code>, runtime robi zdjęcie <code>SynchronizationContext.Current</code> z <strong>wątku, na którym <code>await</code> zostało wywołane</strong>. Jeśli to jest wątek UI WPF, <code>SynchronizationContext.Current</code> to <code>DispatcherSynchronizationContext</code> powiązany z konkretnym <code>Dispatcher</code>-em tego okna.</p>
<p>Gdy asynchroniczna operacja się skończy (np. <code>HttpClient.GetAsync</code> zakończy się na jakimś wątku z puli wątków w tle), runtime <strong>nie wykonuje</strong> dalszej części metody na tym wątku tła - zamiast tego woła <code>capturedContext.Post(...)</code>, co <strong>przekazuje pracę z powrotem do kolejki Dispatchera</strong> wątku UI. Dispatcher wykona tę kontynuację, gdy tylko przetworzy swoją kolejkę wiadomości (message loop) - czyli "gdy będzie wolny".</p>
<h2>Dlaczego to jest potrzebne - konkretny scenariusz</h2>
<pre><code class="language-csharp">private async Task LoadUserAsync()
{
    IsLoading = true; // (A) UI thread

    var user = await _userService.GetUserAsync(&quot;123&quot;); // request HTTP - wątek tła

    User = user;        // (B) - MUSI wrócić na UI thread
    IsLoading = false;   // (C) - MUSI wrócić na UI thread
}
</code></pre>
<p><code>User</code> to prawdopodobnie właściwość bindowana w XAML (<code>{Binding User.Name}</code>). Gdy ją ustawisz, WPF wywoła <code>PropertyChanged</code>, co triggeruje aktualizację elementów wizualnych (<code>TextBlock</code>, etc.). <strong>Elementy wizualne w WPF mają wbudowaną kontrolę wątku</strong> (tzw. "thread affinity") - próba dotknięcia ich z innego wątku niż ten, na którym zostały utworzone, rzuca:</p>
<pre><code class="language-csharp">System.InvalidOperationException: The calling thread cannot access this object
because a different thread owns it.
</code></pre>
<p>Dzięki temu, że <code>await</code> domyślnie "pamięta" skąd wystartował i wraca tam automatycznie, <strong>linie (B) i (C) bezpiecznie wykonują się z powrotem na wątku UI</strong> - mimo że fizyczne pobieranie danych z API działo się w tle, na wątku z puli. To jest dokładnie dlatego kod, który pisaliśmy wcześniej w ViewModelu, po prostu "działał" bez ręcznego <code>Dispatcher.Invoke</code>.</p>
<h2>Co robi <code>ConfigureAwait(false)</code></h2>
<pre><code class="language-csharp">var user = await _userService.GetUserAsync(&quot;123&quot;).ConfigureAwait(false);
User = user; // ⚠️ NIE MA GWARANCJI, że to jest UI thread!
</code></pre>
<p><code>ConfigureAwait(false)</code> mówi runtime: <strong>"nie przechwytuj <code>SynchronizationContext</code>, kontynuuj na jakimkolwiek wątku, na którym task się skończył"</strong> (zwykle jakiś wątek z <code>ThreadPool</code>). Efekt:</p>
<ul>
<li>Pomija krok "zdjęcia" kontekstu i powrotu przez <code>Post()</code></li>
<li>Trochę szybsze (mniej narzutu na przełączanie kontekstu)</li>
<li>Ale: <strong>wszystko po tym <code>await</code> w tej metodzie wykonuje się na nieznanym wątku tła</strong> - a jeśli spróbujesz stamtąd dotknąć czegokolwiek związanego z UI (property bindowane w XAML, elementy wizualne), dostaniesz <code>InvalidOperationException</code></li>
</ul>
<h2>Dlaczego w ViewModelu WPF <em>zwykle</em> NIE chcesz <code>ConfigureAwait(false)</code></h2>
<p>W typowym ViewModelu <strong>prawie każda metoda kończy się aktualizacją jakiejś właściwości bindowanej do UI</strong>:</p>
<pre><code class="language-csharp">private async Task LoadUserAsync()
{
    IsLoading = true;
    var user = await _userService.GetUserAsync(&quot;123&quot;).ConfigureAwait(false);

    // ❌ BŁĄD w runtime - jesteśmy teraz na wątku tła (ThreadPool),
    // a User jest bindowane do TextBlock w UI
    User = user;
    IsLoading = false; // też błąd
}
</code></pre>
<p>Gdybyś chciał użyć <code>ConfigureAwait(false)</code>, musiałbyś <strong>ręcznie wrócić</strong> na UI thread za każdym razem, kiedy chcesz zaktualizować cokolwiek bindowanego:</p>
<pre><code class="language-csharp">private async Task LoadUserAsync()
{
    IsLoading = true;
    var user = await _userService.GetUserAsync(&quot;123&quot;).ConfigureAwait(false);

    await Application.Current.Dispatcher.InvokeAsync(() =&gt;
    {
        User = user;
        IsLoading = false;
    });
}
</code></pre>
<p>To dużo więcej boilerplate'u i łatwo o pomyłkę (zapomnisz raz i masz trudny do odtworzenia bug produkcyjny). Dlatego domyślne zachowanie (<strong>bez</strong> <code>ConfigureAwait(false)</code>) jest w ViewModelach po prostu wygodniejsze i bezpieczniejsze - piszesz kod liniowo, "jakby" był synchroniczny, a <code>await</code> sam gwarantuje powrót na właściwy wątek.</p>
<h2>Gdzie <code>ConfigureAwait(false)</code> faktycznie ma sens</h2>
<p>W kodzie, który <strong>nie dotyka UI</strong> - typowo warstwa serwisów/repozytoriów/bibliotek, gdzie nie wiadomo (i nie powinno obchodzić), na jakim wątku się wykonasz:</p>
<pre><code class="language-csharp">// Serwis/repozytorium - nie ma pojęcia o WPF, UI, Dispatcherze
public class UserService : IUserService
{
    private readonly HttpClient _httpClient;

    public async Task&lt;User&gt; GetUserAsync(string id)
    {
        // Tu ConfigureAwait(false) ma sens - ten kod nigdy nie dotyka UI,
        // więc nie ma powodu &quot;płacić&quot; za przechwytywanie i powrót na kontekst
        var response = await _httpClient.GetAsync($&quot;api/users/{id}&quot;).ConfigureAwait(false);
        var json = await response.Content.ReadAsStringAsync().ConfigureAwait(false);
        return JsonSerializer.Deserialize&lt;User&gt;(json);
    }
}
</code></pre>
<p>To była (i częściowo nadal jest) rekomendowana praktyka w bibliotekach: "używaj <code>ConfigureAwait(false)</code> we wszystkim poza kodem, który <em>musi</em> wrócić na oryginalny kontekst" - żeby unikać zbędnego narzutu wydajnościowego i ryzyka <strong>deadlocków</strong> (patrz niżej) w kodzie biblioteki, który nie wie, kto go wywoła.</p>
<h2>Bonus: klasyczny deadlock, który to tłumaczy jeszcze lepiej</h2>
<p>To częste pytanie typu "gotcha" na rozmowach:</p>
<pre><code class="language-csharp">// W ViewModelu - ktoś próbuje &quot;oszukać&quot; async przez blokowanie
private void OnButtonClick(object sender, RoutedEventArgs e)
{
    var user = GetUserAsync().Result; // ❌ DEADLOCK w WPF!
}

private async Task&lt;User&gt; GetUserAsync()
{
    return await _userService.GetUserAsync(&quot;123&quot;); // domyślnie przechwytuje kontekst UI
}
</code></pre>
<p><strong>Co się dzieje krok po kroku:</strong>
1. <code>OnButtonClick</code> wykonuje się na UI thread, woła <code>.Result</code> - <strong>blokuje UI thread</strong>, czekając aż <code>Task</code> się skończy
2. <code>GetUserAsync()</code> startuje, dochodzi do <code>await</code>, przechwytuje <code>SynchronizationContext</code> (UI thread'a)
3. Faktyczny HTTP request kończy się na wątku z puli
4. Kontynuacja (<code>return user</code>) próbuje wrócić przez <code>Post()</code> <strong>na UI thread</strong> - ale UI thread jest <strong>zablokowany</strong> w kroku 1, czekając na <code>.Result</code>!
5. <strong>Deadlock</strong> - UI thread czeka na wynik Taska, a Task czeka, aż UI thread będzie wolny, żeby dokończyć</p>
<p>Gdyby <code>GetUserAsync()</code> użyło <code>ConfigureAwait(false)</code> wewnątrz, kontynuacja <strong>nie próbowałaby</strong> wracać na UI thread - wykonałaby się na wątku z puli, <code>Task</code> by się zakończył, i <code>.Result</code> w kroku 1 by się odblokował. To nadal zła praktyka (<code>.Result</code> w UI kodzie to code smell), ale pokazuje mechanikę problemu.</p>
<p><strong>Poprawne rozwiązanie:</strong> nigdy nie blokuj <code>async</code> przez <code>.Result</code>/<code>.Wait()</code> w kodzie UI - używaj <code>await</code> od góry do dołu (tzw. "async all the way").</p>
<hr />
<h2>Podsumowanie w jednym zdaniu</h2>
<p><code>await</code> bez <code>ConfigureAwait(false)</code> <strong>domyślnie zapamiętuje</strong>, na jakim wątku/kontekście wystartował, i <strong>automatycznie tam wraca</strong> po zakończeniu operacji asynchronicznej - w WPF gwarantuje to bezpieczny powrót na UI thread bez ręcznego <code>Dispatcher.Invoke</code>; <code>ConfigureAwait(false)</code> wyłącza to zachowanie, co jest szybsze i bezpieczniejsze w bibliotekach/serwisach, ale niebezpieczne w ViewModelu, gdzie prawie zawsze kończysz dotykając czegoś bindowanego do UI.</p>
  
  `},

  { id:"icommand", title:"ICommand i RelayCommand", tags:"icommand relaycommand canexecute commandmanager async void",
  body:`
  <h1>ICommand w WPF</h1>
<h2>Problem, który ICommand rozwiązuje</h2>
<p>W code-behind (podejście bez MVVM) obsługa kliknięcia wygląda tak:</p>
<pre><code class="language-xml">&lt;Button Content=&quot;Zapisz&quot; Click=&quot;SaveButton_Click&quot; /&gt;
</code></pre>
<pre><code class="language-csharp">private void SaveButton_Click(object sender, RoutedEventArgs e)
{
    SaveOrder();
}
</code></pre>
<p>To działa, ale <strong>łamie MVVM</strong> - View (code-behind) bezpośrednio zawiera logikę biznesową, ViewModel nie ma jak tego przetestować bez UI, a <code>Click</code> to zwykły event .NET, więc trudno np. automatycznie wyłączyć przycisk, gdy akcja nie ma sensu (np. brak danych do zapisania).</p>
<p><code>ICommand</code> to interfejs, który pozwala <strong>zbindować akcję UI (kliknięcie, skrót klawiszowy, menu) bezpośrednio do metody w ViewModelu</strong>, bez żadnego code-behind, plus dodaje wbudowaną obsługę "czy ta akcja jest w ogóle dostępna teraz".</p>
<h2>Definicja interfejsu</h2>
<pre><code class="language-csharp">public interface ICommand
{
    void Execute(object parameter);
    bool CanExecute(object parameter);
    event EventHandler CanExecuteChanged;
}
</code></pre>
<p>Trzy elementy:
- <strong><code>Execute</code></strong> - co się dzieje, gdy komenda jest wywołana (odpowiednik ciała <code>Click</code> handlera)
- <strong><code>CanExecute</code></strong> - czy komenda jest aktualnie dostępna (zwraca <code>bool</code>) - WPF automatycznie na tej podstawie <strong>wyszarza/aktywuje</strong> kontrolkę
- <strong><code>CanExecuteChanged</code></strong> - event informujący WPF "sprawdź <code>CanExecute</code> jeszcze raz, mogło się coś zmienić"</p>
<h2>Binding w XAML</h2>
<pre><code class="language-xml">&lt;Button Content=&quot;Zapisz&quot; Command=&quot;{Binding SaveOrderCommand}&quot; /&gt;
</code></pre>
<p>Zamiast <code>Click="..."</code> (event w code-behind) - <code>Command="{Binding ...}"</code> wskazuje na właściwość typu <code>ICommand</code> w ViewModelu. To jest zwykły data binding, dokładnie taki sam mechanizm jak przy <code>Text="{Binding Name}"</code>.</p>
<h2>Własna implementacja - RelayCommand</h2>
<p>WPF <strong>nie ma wbudowanej gotowej klasy</strong> implementującej <code>ICommand</code> do ogólnego użytku (ma tylko wyspecjalizowane, np. do edycji tekstu), więc prawie każdy projekt pisze własną, zwykle nazywaną <code>RelayCommand</code> albo <code>DelegateCommand</code>:</p>
<pre><code class="language-csharp">public class RelayCommand : ICommand
{
    private readonly Action&lt;object&gt; _execute;
    private readonly Predicate&lt;object&gt; _canExecute;

    public RelayCommand(Action&lt;object&gt; execute, Predicate&lt;object&gt; canExecute = null)
    {
        _execute = execute ?? throw new ArgumentNullException(nameof(execute));
        _canExecute = canExecute;
    }

    public bool CanExecute(object parameter) =&gt; _canExecute?.Invoke(parameter) ?? true;

    public void Execute(object parameter) =&gt; _execute(parameter);

    public event EventHandler CanExecuteChanged
    {
        // Podpina się pod wbudowany mechanizm WPF, który odpytuje
        // wszystkie komendy przy każdej zmianie fokusu/stanu UI
        add =&gt; CommandManager.RequerySuggested += value;
        remove =&gt; CommandManager.RequerySuggested -= value;
    }
}
</code></pre>
<p>Użycie w ViewModelu:</p>
<pre><code class="language-csharp">public class OrderViewModel : ViewModelBase
{
    private readonly IOrderService _orderService;

    public Order CurrentOrder { get; set; }

    public ICommand SaveOrderCommand { get; }

    public OrderViewModel(IOrderService orderService)
    {
        _orderService = orderService;

        SaveOrderCommand = new RelayCommand(
            execute: _ =&gt; SaveOrder(),
            canExecute: _ =&gt; CurrentOrder != null &amp;&amp; CurrentOrder.Items.Count &gt; 0
        );
    }

    private void SaveOrder()
    {
        _orderService.Save(CurrentOrder);
    }
}
</code></pre>
<p><strong>Efekt w UI:</strong> dopóki <code>CurrentOrder</code> jest <code>null</code> albo nie ma żadnych pozycji, <code>Button</code> bindowany do <code>SaveOrderCommand</code> jest <strong>automatycznie wyszarzony</strong> (<code>IsEnabled = false</code>) - bez ani jednej linijki kodu w code-behind czy XAML odpowiedzialnej za to ręcznie.</p>
<h2><code>CommandManager.RequerySuggested</code> - jak to "automagicznie" działa</h2>
<p>To jest szczegół, o który czasem pytają, bo wygląda jak magia. <code>CommandManager</code> w WPF <strong>nasłuchuje typowych zdarzeń UI</strong> (kliknięcia, naciśnięcia klawiszy, zmiana fokusu) i po każdym z nich <strong>automatycznie wywołuje <code>CanExecute</code> na wszystkich zarejestrowanych komendach</strong>, żeby sprawdzić, czy stan <code>IsEnabled</code> przycisków powinien się zmienić.</p>
<p><strong>Problem z tym podejściem:</strong> <code>RequerySuggested</code> reaguje tylko na zdarzenia <em>inputowe</em> UI - jeśli zmieniasz <code>CurrentOrder.Items</code> <strong>programistycznie</strong> (np. w kodzie po odpowiedzi z API, bez żadnej interakcji użytkownika), <code>CommandManager</code> <strong>nie wie</strong>, że powinien przeliczyć <code>CanExecute</code>. Wtedy trzeba to wymusić ręcznie:</p>
<pre><code class="language-csharp">private void AddItem(OrderItem item)
{
    CurrentOrder.Items.Add(item);
    CommandManager.InvalidateRequerySuggested(); // ręcznie każ WPF przeliczyć wszystkie CanExecute
}
</code></pre>
<h2>Lepsza wersja: RelayCommand z jawną kontrolą nad CanExecuteChanged</h2>
<p>Wielu programistów unika polegania na globalnym <code>CommandManager</code> (bo odpytuje <strong>wszystkie</strong> komendy w aplikacji przy każdym kliknięciu - narzut przy dużych aplikacjach) i zamiast tego kontroluje to jawnie:</p>
<pre><code class="language-csharp">public class RelayCommand : ICommand
{
    private readonly Action&lt;object&gt; _execute;
    private readonly Predicate&lt;object&gt; _canExecute;

    public RelayCommand(Action&lt;object&gt; execute, Predicate&lt;object&gt; canExecute = null)
    {
        _execute = execute;
        _canExecute = canExecute;
    }

    public bool CanExecute(object parameter) =&gt; _canExecute?.Invoke(parameter) ?? true;
    public void Execute(object parameter) =&gt; _execute(parameter);

    public event EventHandler CanExecuteChanged;

    // Wywoływane ręcznie, dokładnie wtedy, kiedy WIADOMO, że coś się zmieniło
    public void RaiseCanExecuteChanged() =&gt; CanExecuteChanged?.Invoke(this, EventArgs.Empty);
}
</code></pre>
<pre><code class="language-csharp">private void AddItem(OrderItem item)
{
    CurrentOrder.Items.Add(item);
    ((RelayCommand)SaveOrderCommand).RaiseCanExecuteChanged(); // precyzyjnie, tylko ta komenda
}
</code></pre>
<p>To bardziej wydajne, ale wymaga pamiętać o ręcznym wywołaniu w każdym miejscu, gdzie zmienia się warunek <code>CanExecute</code>.</p>
<h2>Wersja generyczna - typowany parametr</h2>
<p>W praktyce często chcesz uniknąć rzutowania <code>object</code> w środku:</p>
<pre><code class="language-csharp">public class RelayCommand&lt;T&gt; : ICommand
{
    private readonly Action&lt;T&gt; _execute;
    private readonly Predicate&lt;T&gt; _canExecute;

    public RelayCommand(Action&lt;T&gt; execute, Predicate&lt;T&gt; canExecute = null)
    {
        _execute = execute;
        _canExecute = canExecute;
    }

    public bool CanExecute(object parameter) =&gt; _canExecute?.Invoke((T)parameter) ?? true;
    public void Execute(object parameter) =&gt; _execute((T)parameter);

    public event EventHandler CanExecuteChanged
    {
        add =&gt; CommandManager.RequerySuggested += value;
        remove =&gt; CommandManager.RequerySuggested -= value;
    }
}

// Użycie
public ICommand DeleteOrderCommand =&gt; new RelayCommand&lt;Order&gt;(order =&gt; _orderService.Delete(order));
</code></pre>
<pre><code class="language-xml">&lt;Button Content=&quot;Usuń&quot; Command=&quot;{Binding DeleteOrderCommand}&quot; CommandParameter=&quot;{Binding SelectedOrder}&quot; /&gt;
</code></pre>
<p><code>CommandParameter</code> w XAML pozwala przekazać dowolny obiekt jako argument do <code>Execute</code>/<code>CanExecute</code> - tu np. aktualnie zaznaczone zamówienie z <code>ListBox</code>.</p>
<h2>Async Command - częsty problem praktyczny</h2>
<p><code>ICommand.Execute</code> zwraca <code>void</code>, więc <strong>nie da się</strong> naturalnie zrobić <code>async Task Execute(...)</code> - trzeba to obejść:</p>
<pre><code class="language-csharp">public class AsyncRelayCommand : ICommand
{
    private readonly Func&lt;Task&gt; _execute;
    private readonly Func&lt;bool&gt; _canExecute;
    private bool _isExecuting;

    public AsyncRelayCommand(Func&lt;Task&gt; execute, Func&lt;bool&gt; canExecute = null)
    {
        _execute = execute;
        _canExecute = canExecute;
    }

    public bool CanExecute(object parameter) =&gt; !_isExecuting &amp;&amp; (_canExecute?.Invoke() ?? true);

    public async void Execute(object parameter) // async void - konieczne, bo interfejs wymaga void
    {
        _isExecuting = true;
        RaiseCanExecuteChanged(); // np. wyszarz przycisk na czas trwania operacji

        try
        {
            await _execute();
        }
        finally
        {
            _isExecuting = false;
            RaiseCanExecuteChanged();
        }
    }

    public event EventHandler CanExecuteChanged;
    public void RaiseCanExecuteChanged() =&gt; CanExecuteChanged?.Invoke(this, EventArgs.Empty);
}
</code></pre>
<pre><code class="language-csharp">SaveOrderCommand = new AsyncRelayCommand(
    execute: SaveOrderAsync,
    canExecute: () =&gt; CurrentOrder != null
);

private async Task SaveOrderAsync()
{
    await _orderService.SaveAsync(CurrentOrder);
}
</code></pre>
<p><code>async void Execute(...)</code> to jedyne miejsce, gdzie <code>async void</code> jest <em>akceptowalne</em> (zamiast <code>async Task</code>) - bo interfejs <code>ICommand</code> narzuca sygnaturę <code>void</code>. To zresztą częste pytanie-pułapka na rozmowie: <em>"dlaczego generalnie unikamy <code>async void</code>, i gdzie jest wyjątek?"</em> - odpowiedź: unikamy, bo wyjątki z <code>async void</code> nie da się złapać przez zwykły <code>try/catch</code> wywołującego (lecą prosto do <code>SynchronizationContext</code>/crashują appkę), ale <code>ICommand.Execute</code> to jeden z niewielu miejsc, gdzie nie mamy wyboru.</p>
<h2>CommunityToolkit.Mvvm - nowoczesne podejście (mniej boilerplate'u)</h2>
<p>Skoro wspominałem to wcześniej - większość tego kodu można dziś zastąpić atrybutem:</p>
<pre><code class="language-csharp">public partial class OrderViewModel : ObservableObject
{
    [ObservableProperty]
    private Order _currentOrder;

    [RelayCommand(CanExecute = nameof(CanSaveOrder))]
    private async Task SaveOrderAsync()
    {
        await _orderService.SaveAsync(CurrentOrder);
    }

    private bool CanSaveOrder() =&gt; CurrentOrder != null &amp;&amp; CurrentOrder.Items.Count &gt; 0;
}
</code></pre>
<p>Generator źródłowy sam tworzy <code>SaveOrderCommand</code> jako <code>IAsyncRelayCommand</code>, z pełną obsługą <code>CanExecute</code> i <code>RaiseCanExecuteChanged</code> wywoływanym automatycznie przy zmianie <code>CurrentOrder</code> (dzięki <code>[ObservableProperty]</code>).</p>
<h2>Podsumowanie - dlaczego to jest lepsze niż zwykły <code>Click</code></h2>
<table>
<thead>
<tr>
<th></th>
<th><code>Click</code> (event)</th>
<th><code>ICommand</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Gdzie logika</td>
<td>Code-behind (łamie MVVM)</td>
<td>ViewModel (zgodne z MVVM)</td>
</tr>
<tr>
<td>Testowalność</td>
<td>Trudna (wymaga UI)</td>
<td>Łatwa (wywołujesz <code>Execute()</code> bezpośrednio w teście)</td>
</tr>
<tr>
<td>Automatyczne enable/disable</td>
<td>Musisz robić ręcznie</td>
<td>Wbudowane przez <code>CanExecute</code></td>
</tr>
<tr>
<td>Reużywalność</td>
<td>Handler przywiązany do konkretnej kontrolki</td>
<td>Ta sama komenda może być bindowana z wielu miejsc (przycisk, menu, skrót klawiszowy)</td>
</tr>
</tbody>
</table>
<p>Ostatni punkt jest niedoceniany - jedna komenda <code>SaveOrderCommand</code> może być jednocześnie podpięta pod przycisk, pozycję w menu <strong>i</strong> skrót klawiszowy <code>Ctrl+S</code>, bez duplikowania logiki:</p>
<pre><code class="language-xml">&lt;Button Command=&quot;{Binding SaveOrderCommand}&quot; Content=&quot;Zapisz&quot; /&gt;
&lt;MenuItem Command=&quot;{Binding SaveOrderCommand}&quot; Header=&quot;Zapisz&quot; /&gt;
&lt;Window.InputBindings&gt;
    &lt;KeyBinding Command=&quot;{Binding SaveOrderCommand}&quot; Key=&quot;S&quot; Modifiers=&quot;Control&quot; /&gt;
&lt;/Window.InputBindings&gt;
</code></pre>
<p>Wszystkie trzy automatycznie się wyłączą/włączą razem, bo współdzielą ten sam <code>CanExecute</code>.</p>
  
  `},

  { id:"callermembername", title:"[CallerMemberName]", tags:"callermembername inotifypropertychanged magic string nameof",
  body:`
  <h1><code>[CallerMemberName]</code> w C</h1>
<h2>Co to jest - atrybut wstrzykiwany przez kompilator</h2>
<p><code>[CallerMemberName]</code> to atrybut z przestrzeni <code>System.Runtime.CompilerServices</code>, który <strong>automatycznie wypełnia parametr metody nazwą członu (property, metody), z którego ta metoda została wywołana</strong> - kompilator robi to <strong>w czasie kompilacji</strong>, nie w runtime, więc nie ma żadnego narzutu wydajnościowego (to nie jest refleksja).</p>
<p>Widziałeś go już wielokrotnie, w <code>ViewModelBase</code>:</p>
<pre><code class="language-csharp">protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null)
{
    if (EqualityComparer&lt;T&gt;.Default.Equals(field, value)) return;
    field = value;
    PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));
}
</code></pre>
<h2>Problem, który rozwiązuje</h2>
<p>Implementacja <code>INotifyPropertyChanged</code> wymaga podania <strong>nazwy właściwości jako string</strong> przy każdej zmianie - to jest podatne na błędy i nieporęczne:</p>
<pre><code class="language-csharp">// BEZ CallerMemberName - musisz ręcznie wpisywać nazwę jako string
private string _customerName;
public string CustomerName
{
    get =&gt; _customerName;
    set
    {
        _customerName = value;
        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(&quot;CustomerName&quot;)); // ⚠️ magic string!
    }
}
</code></pre>
<p><strong>Problem z magic stringiem <code>"CustomerName"</code>:</strong> jeśli ktoś zmieni nazwę property przez refaktoryzację (Rename w IDE), <strong>string się NIE zmieni automatycznie</strong> - kompilator tego nie sprawdzi, bo to zwykły tekst, nie odwołanie do symbolu. Skutek: binding w WPF przestaje działać, a błąd wychodzi dopiero w runtime (UI po prostu się nie aktualizuje), bez żadnego ostrzeżenia kompilatora.</p>
<h2>Rozwiązanie z <code>[CallerMemberName]</code></h2>
<pre><code class="language-csharp">private string _customerName;
public string CustomerName
{
    get =&gt; _customerName;
    set =&gt; SetProperty(ref _customerName, value); // BEZ podawania nazwy jawnie!
}

protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null)
{
    field = value;
    PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));
}
</code></pre>
<p>Gdy <code>set</code> właściwości <code>CustomerName</code> wywołuje <code>SetProperty(ref _customerName, value)</code>, <strong>kompilator automatycznie wstawia</strong> <code>"CustomerName"</code> jako wartość parametru <code>propertyName</code> - dokładnie tak, jakbyś napisał:</p>
<pre><code class="language-csharp">set =&gt; SetProperty(ref _customerName, value, &quot;CustomerName&quot;); // to dzieje się NIEJAWNIE
</code></pre>
<p><strong>Kluczowa korzyść:</strong> jeśli zmienisz nazwę property przez Rename w IDE (np. <code>CustomerName</code> → <code>ClientName</code>), wywołanie <code>SetProperty</code> <strong>nie musi być w ogóle dotykane</strong> - kompilator przy następnej kompilacji <strong>sam</strong> wstawi nową, poprawną nazwę. Błąd typu "zapomniałem zaktualizować string po refaktoryzacji" <strong>nie może się zdarzyć</strong>, bo nie ma już żadnego ręcznie wpisywanego stringa.</p>
<h2>Jak dokładnie działa - "nazwa członu WYWOŁUJĄCEGO"</h2>
<pre><code class="language-csharp">public class OrderViewModel : ViewModelBase
{
    private decimal _totalAmount;
    public decimal TotalAmount
    {
        get =&gt; _totalAmount;
        set =&gt; SetProperty(ref _totalAmount, value); // wywołane WEWNĄTRZ setter'a TotalAmount
    }

    public void RecalculateTotal()
    {
        TotalAmount = 100; // to WYWOŁA setter, który wywoła SetProperty z &quot;TotalAmount&quot;
    }

    public void LogSomething([CallerMemberName] string caller = null)
    {
        Console.WriteLine($&quot;Wywołane z: {caller}&quot;);
    }
}
</code></pre>
<pre><code class="language-csharp">vm.RecalculateTotal();
// Wewnątrz RecalculateTotal(), jeśli TAM wywołasz LogSomething() bezpośrednio:
vm.LogSomething(); // wypisze &quot;RecalculateTotal&quot; - bo STAMTĄD zostało wywołane
</code></pre>
<p><code>[CallerMemberName]</code> <strong>zawsze</strong> odnosi się do <strong>bezpośredniego</strong> wywołującego (metody/property, w którym fizycznie znajduje się wywołanie) - nie do "pierwotnego" wywołania gdzieś wyżej w stosie.</p>
<h2>Wymagania składniowe</h2>
<pre><code class="language-csharp">// ✅ Poprawnie - parametr musi mieć wartość domyślną
public void Method([CallerMemberName] string caller = null) { }
public void Method([CallerMemberName] string caller = &quot;&quot;) { }

// ❌ Błąd kompilacji - CallerMemberName wymaga wartości domyślnej
public void Method([CallerMemberName] string caller) { }
</code></pre>
<p>Musi to być <strong>ostatni parametr</strong> (albo przynajmniej mieć wartość domyślną, żeby dało się wywołać metodę bez podawania go jawnie) - dokładnie ta sama zasada co przy zwykłych parametrach opcjonalnych w C#.</p>
<h2>Można nadal podać wartość jawnie - <code>[CallerMemberName]</code> to tylko wartość DOMYŚLNA</h2>
<pre><code class="language-csharp">protected void SetProperty&lt;T&gt;(ref T field, T value, [CallerMemberName] string propertyName = null) { }

// Normalne użycie - kompilator wstawia automatycznie
SetProperty(ref _customerName, value); // propertyName = &quot;CustomerName&quot; (automatycznie)

// Można NADAL podać jawnie, gdy potrzeba
SetProperty(ref _customerName, value, &quot;InnaWlasciwosc&quot;); // propertyName = &quot;InnaWlasciwosc&quot; (jawnie)
</code></pre>
<p>To bywa przydatne, gdy <strong>jedna</strong> właściwość musi powiadomić o zmianie <strong>innej</strong>, powiązanej właściwości - np. gdy <code>TotalAmount</code> zmienia się, a chcesz też odświeżyć <code>FormattedTotalAmount</code> w UI:</p>
<pre><code class="language-csharp">private decimal _totalAmount;
public decimal TotalAmount
{
    get =&gt; _totalAmount;
    set
    {
        SetProperty(ref _totalAmount, value); // propertyName = &quot;TotalAmount&quot; (automatycznie)
        OnPropertyChanged(nameof(FormattedTotalAmount)); // jawnie - inna właściwość się zmieniła
    }
}

public string FormattedTotalAmount =&gt; $&quot;{TotalAmount:C}&quot;; // właściwość obliczana, bez backing field
</code></pre>
<h2>Powiązane atrybuty z tej samej rodziny (<code>System.Runtime.CompilerServices</code>)</h2>
<p>Warto wspomnieć, bo czasem pytają o "resztę rodziny":</p>
<pre><code class="language-csharp">public void LogError(
    string message,
    [CallerMemberName] string memberName = &quot;&quot;,
    [CallerFilePath] string filePath = &quot;&quot;,
    [CallerLineNumber] int lineNumber = 0)
{
    Console.WriteLine($&quot;[{filePath}:{lineNumber}] {memberName}: {message}&quot;);
}
</code></pre>
<ul>
<li><strong><code>[CallerFilePath]</code></strong> - pełna ścieżka pliku źródłowego, z którego nastąpiło wywołanie</li>
<li><strong><code>[CallerLineNumber]</code></strong> - numer linii, w której nastąpiło wywołanie</li>
</ul>
<p>To jest bardzo przydatne do <strong>logowania diagnostycznego</strong> - bez ręcznego wpisywania <code>"OrderService.cs"</code> czy numeru linijki, kompilator wstawia to automatycznie, i <strong>zawsze aktualne</strong>, nawet po przesunięciu kodu.</p>
<h2>Alternatywa - <code>nameof()</code> (dla porównania, inny mechanizm, podobny cel)</h2>
<p>Warto odróżnić <code>[CallerMemberName]</code> od <code>nameof()</code> - oba rozwiązują podobny problem (unikanie magic stringów), ale działają inaczej:</p>
<pre><code class="language-csharp">// nameof() - jawne, w miejscu WYWOŁANIA, dowolna nazwa symbolu
OnPropertyChanged(nameof(TotalAmount)); // &quot;TotalAmount&quot; - sprawdzane przez kompilator, ale trzeba napisać jawnie

// CallerMemberName - niejawne, AUTOMATYCZNE, zawsze nazwa WYWOŁUJĄCEGO
SetProperty(ref _totalAmount, value); // &quot;TotalAmount&quot; wstawione samo, bo STĄD wywołane
</code></pre>
<p><strong>Kiedy <code>nameof()</code>:</strong> gdy chcesz odwołać się do <strong>konkretnej, dowolnej</strong> nazwy symbolu (może być innej niż ta, w której się aktualnie znajdujesz) - jak w przykładzie z <code>FormattedTotalAmount</code> wyżej.</p>
<p><strong>Kiedy <code>[CallerMemberName]</code>:</strong> gdy chcesz <strong>automatycznie</strong> wiedzieć, "skąd mnie wywołano", bez zmuszania wywołującego kodu do jawnego podawania tej informacji za każdym razem.</p>
<h2>Podsumowanie - dlaczego to ważne dla WPF/MVVM</h2>
<blockquote>
<p><code>[CallerMemberName]</code> eliminuje magic stringi w implementacji <code>INotifyPropertyChanged</code> - zamiast ręcznie wpisywać nazwę właściwości jako tekst przy każdym <code>SetProperty</code>/<code>OnPropertyChanged</code> (co jest kruche przy refaktoryzacji, bo string nie jest sprawdzany przez kompilator ani aktualizowany przez Rename), kompilator <strong>automatycznie</strong> wstawia nazwę właściwości/metody, z której nastąpiło wywołanie. To jeden z tych detali, które sprawiają, że <code>ViewModelBase</code> jest bezpieczny na refaktoryzację - zmiana nazwy property przez IDE nigdy nie "cichnie zepsuje" bindingu w WPF.</p>
</blockquote>
  
  `},

  ]
