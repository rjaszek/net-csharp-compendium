  <h1>Apache Kafka - podstawy</h1>
<h2>Co to jest Kafka - rozproszony log zdarzeń</h2>
<p>Kafka to platforma do przesyłania strumieni zdarzeń (event streaming), działająca jako <strong>rozproszony, trwały log</strong> (append-only log) - w przeciwieństwie do tradycyjnego brokera wiadomości (jak RabbitMQ), gdzie wiadomość jest <strong>usuwana</strong> po odebraniu, Kafka <strong>przechowuje</strong> wiadomości przez skonfigurowany czas (retencję), niezależnie od tego, czy zostały już odebrane.</p>
<p>To jest właśnie technologia, którą naturalnie wykorzystałbyś do implementacji <code>IEventBus</code> z przykładów Sagi/Outboxa, o których mówiliśmy wcześniej.</p>
<h2>Kluczowe pojęcia</h2>
<h3>Topic - kanał, do którego publikujesz wiadomości</h3>
<pre><code class="language-csharp">Topic: &quot;order-events&quot;
</code></pre>
<p>Analogicznie do tabeli w bazie danych albo kolejki w RabbitMQ - logiczna kategoria zdarzeń o podobnym charakterze (np. wszystkie zdarzenia dotyczące zamówień).</p>
<h3>Partycje - jak Kafka skaluje przepustowość</h3>
<p>Każdy topic jest podzielony na <strong>partycje</strong> - niezależne, uporządkowane logi, które mogą być rozmieszczone na różnych serwerach (brokerach) w klastrze:</p>
<pre><code class="language-csharp">Topic: &quot;order-events&quot; (3 partycje)
├── Partition 0: [msg1, msg4, msg7, ...]
├── Partition 1: [msg2, msg5, msg8, ...]
└── Partition 2: [msg3, msg6, msg9, ...]
</code></pre>
<p><strong>Kluczowa właściwość - kolejność zachowana TYLKO wewnątrz jednej partycji.</strong> Kafka <strong>gwarantuje</strong> porządek wiadomości w ramach jednej partycji, ale <strong>nie</strong> między różnymi partycjami tego samego topicu.</p>
<pre><code class="language-csharp">// Klucz partycjonowania decyduje, do KTÓREJ partycji trafi wiadomość
await producer.ProduceAsync(&quot;order-events&quot;, new Message&lt;string, string&gt;
{
    Key = order.Id.ToString(), // wszystkie zdarzenia dla TEGO SAMEGO orderId trafią do TEJ SAMEJ partycji
    Value = JsonSerializer.Serialize(orderEvent)
});
</code></pre>
<p>To jest <strong>praktyczna konsekwencja</strong> dla Sagi - jeśli chcesz, żeby zdarzenia dotyczące <strong>jednego</strong> zamówienia były przetwarzane <strong>w kolejności</strong> (np. <code>OrderPlaced</code> przed <code>PaymentCompleted</code>), musisz użyć <code>orderId</code> jako klucza partycjonowania - Kafka zagwarantuje, że wszystkie zdarzenia z tym samym kluczem trafią do tej samej partycji, a więc zostaną przetworzone w kolejności publikacji.</p>
<h3>Consumer Groups - jak wiele instancji dzieli pracę</h3>
<pre><code class="language-csharp">var config = new ConsumerConfig
{
    GroupId = &quot;inventory-service-group&quot;, // WSZYSTKIE instancje InventoryService należą do tej samej grupy
    BootstrapServers = &quot;localhost:9092&quot;
};
</code></pre>
<p><strong>Kluczowa zasada:</strong> wewnątrz <strong>jednej</strong> consumer group, <strong>każda partycja jest przypisana do TYLKO JEDNEGO konsumenta</strong> w danym momencie - to jest naturalny mechanizm <strong>równoważenia obciążenia</strong> (load balancing) między wieloma instancjami tego samego serwisu.</p>
<pre><code class="language-csharp">Topic &quot;order-events&quot; (3 partycje), Consumer Group &quot;inventory-service-group&quot; (3 instancje InventoryService)

Partition 0 → Consumer Instance A
Partition 1 → Consumer Instance B
Partition 2 → Consumer Instance C
</code></pre>
<p>Jeśli uruchomisz <strong>więcej</strong> instancji <code>InventoryService</code> niż partycji, <strong>dodatkowe instancje pozostają bezczynne</strong> (idle) - to jest praktyczne ograniczenie, o którym trzeba pamiętać przy planowaniu skalowania: <strong>liczba partycji ograniczą maksymalny równoległy przepustowość</strong> wewnątrz jednej consumer group.</p>
<p><strong>Wiele różnych consumer groups może czytać ten sam topic niezależnie</strong> - to jest przydatne, gdy zarówno <code>InventoryService</code>, jak i <code>AnalyticsService</code> chcą przetwarzać te same zdarzenia <code>order-events</code>, ale niezależnie od siebie:</p>
<pre><code class="language-csharp">Topic &quot;order-events&quot;
├── Consumer Group &quot;inventory-service-group&quot; - czyta i przetwarza dla logiki magazynowej
└── Consumer Group &quot;analytics-service-group&quot; - czyta te SAME zdarzenia, niezależnie, do raportowania
</code></pre>
<h2>Producer - publikowanie wiadomości</h2>
<pre><code class="language-csharp">public class KafkaEventBus : IEventBus
{
    private readonly IProducer&lt;string, string&gt; _producer;

    public async Task PublishAsync&lt;T&gt;(T @event) where T : class
    {
        var topic = typeof(T).Name.ToLower(); // np. &quot;orderplacedevent&quot;
        var payload = JsonSerializer.Serialize(@event);

        await _producer.ProduceAsync(topic, new Message&lt;string, string&gt;
        {
            Key = Guid.NewGuid().ToString(),
            Value = payload
        });
    }
}
</code></pre>
<h2>Consumer - pętla nasłuchująca</h2>
<pre><code class="language-csharp">public class InventoryEventConsumer : BackgroundService
{
    private readonly IConsumer&lt;string, string&gt; _consumer;

    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
    {
        _consumer.Subscribe(&quot;order-events&quot;);

        while (!stoppingToken.IsCancellationRequested)
        {
            var result = _consumer.Consume(stoppingToken); // BLOKUJE, dopóki nie przyjdzie wiadomość

            try
            {
                var orderEvent = JsonSerializer.Deserialize&lt;OrderPlacedEvent&gt;(result.Message.Value);
                await ProcessEventAsync(orderEvent); // idempotentna logika, jak omawialiśmy przy Sadze/Outboksie

                _consumer.Commit(result); // potwierdzenie przetworzenia - &quot;offset&quot; przesunięty
            }
            catch (Exception ex)
            {
                _logger.LogError(ex, &quot;Błąd przetwarzania wiadomości&quot;);
                // BRAK Commit() - ta sama wiadomość zostanie dostarczona PONOWNIE
            }
        }
    }
}
</code></pre>
<h2>Offset - "zakładka" mówiąca, gdzie konsument skończył czytać</h2>
<pre><code class="language-csharp">Partition 0: [msg1, msg2, msg3, msg4, msg5]
                              ↑
                    Consumer offset = 3 (przetworzył msg1, msg2, msg3)
</code></pre>
<p>Kafka <strong>zapamiętuje</strong>, jaki offset (pozycję) osiągnął dany consumer group w każdej partycji - jeśli konsument padnie i wróci, <strong>kontynuuje</strong> od zapamiętanego offsetu, nie od początku. To jest mechanizm dający <strong>"at-least-once delivery"</strong> (dokładnie ta sama gwarancja, o której mówiliśmy przy Outbox Pattern) - jeśli konsument przetworzył wiadomość, ale padł <strong>przed</strong> zatwierdzeniem (<code>Commit</code>) nowego offsetu, ta sama wiadomość zostanie dostarczona ponownie po restarcie.</p>
<h2>Retencja - dlaczego Kafka to nie tylko "kolejka"</h2>
<pre><code class="language-csharp">Konfiguracja topicu: retention.ms = 604800000 (7 dni)
</code></pre>
<p>W przeciwieństwie do RabbitMQ (gdzie wiadomość jest usuwana po odebraniu przez konsumenta), Kafka <strong>przechowuje</strong> wiadomości przez skonfigurowany okres <strong>niezależnie</strong> od tego, czy zostały odebrane. To umożliwia:
- <strong>Replay</strong> - nowy konsument (albo nowa consumer group) może "odtworzyć" historię zdarzeń od początku
- <strong>Wielu niezależnych konsumentów</strong> czytających te same dane w różnym tempie</p>
<h2>Kafka vs tradycyjny broker wiadomości (RabbitMQ) - kiedy który</h2>
<table>
<thead>
<tr>
<th></th>
<th>Kafka</th>
<th>RabbitMQ</th>
</tr>
</thead>
<tbody>
<tr>
<td>Model</td>
<td>Rozproszony log (retencja czasowa)</td>
<td>Kolejka (usuwanie po odebraniu)</td>
</tr>
<tr>
<td>Przepustowość</td>
<td>Bardzo wysoka (miliony wiadomości/s)</td>
<td>Wysoka, ale niższa niż Kafka</td>
</tr>
<tr>
<td>Replay historii</td>
<td>✅ Tak (dane trzymane przez okres retencji)</td>
<td>❌ Nie (wiadomość usunięta po odebraniu)</td>
</tr>
<tr>
<td>Złożoność routingu</td>
<td>Prostsza (topic + partycje)</td>
<td>Bogatsza (exchanges, routing keys, bindings)</td>
</tr>
<tr>
<td>Typowe zastosowanie</td>
<td>Event streaming, event sourcing, duże wolumeny logów/zdarzeń</td>
<td>Klasyczne kolejkowanie zadań, RPC między serwisami</td>
</tr>
</tbody>
</table>
<h2>Podsumowanie - relacja do Sagi/Outboxa</h2>
<blockquote>
<p>Kafka jest naturalną technologią implementującą <code>IEventBus</code> w architekturze Choreography Sagi - <strong>partycjonowanie po kluczu</strong> (np. <code>orderId</code>) gwarantuje kolejność zdarzeń dotyczących tego samego zamówienia, <strong>consumer groups</strong> dają równoważenie obciążenia między wieloma instancjami tego samego serwisu, a mechanizm <strong>offsetów + brak automatycznego usuwania wiadomości</strong> wspiera dokładnie ten typ gwarancji dostarczenia ("at-least-once"), którego wymagaliśmy od Outbox Pattern - z koniecznością, żeby każdy konsument był <strong>idempotentny</strong>, bo ta sama wiadomość może zostać dostarczona więcej niż raz.</p>
</blockquote>
  
  `},

  { id:"docker-k8s", title:"Docker, kontenery, Kubernetes", tags:"docker container image kubernetes pod deployment service self healing",
  body:`
  <h1>Docker i Kubernetes - podstawy w kontekście mikroserwisów</h1>
<h2>Docker - konteneryzacja pojedynczego serwisu</h2>
<p>Docker pozwala <strong>spakować</strong> aplikację (kod + runtime + zależności + konfigurację) w <strong>przenośny, izolowany obraz</strong>, który działa identycznie niezależnie od maszyny, na której jest uruchamiany.</p>
<pre><code class="language-dockerfile"># Dockerfile dla ASP.NET Core Web API (dokładnie ten OrderService, o którym mówiliśmy)
FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY *.csproj .
RUN dotnet restore
COPY . .
RUN dotnet publish -c Release -o /app

FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS runtime
WORKDIR /app
COPY --from=build /app .
ENTRYPOINT [&quot;dotnet&quot;, &quot;OrderService.dll&quot;]
</code></pre>
<p><strong>Wieloetapowy build (multi-stage)</strong> - pierwszy etap (<code>build</code>) ma pełny SDK (kompilator, narzędzia), drugi etap (<code>runtime</code>) ma <strong>tylko</strong> runtime potrzebny do wykonania - finalny obraz jest <strong>znacznie mniejszy</strong>, bo nie zawiera niepotrzebnych narzędzi budowania.</p>
<pre><code class="language-bash">docker build -t order-service:latest .
docker run -p 5000:80 order-service:latest
</code></pre>
<h2>Docker Compose - uruchamianie wielu powiązanych serwisów lokalnie</h2>
<p>To jest praktyczne narzędzie do <strong>lokalnego developmentu</strong> architektury mikroserwisów - jednym plikiem opisujesz <strong>całą</strong> infrastrukturę (serwisy + baza + Kafka), którą <code>docker-compose up</code> uruchamia naraz:</p>
<pre><code class="language-yaml">version: '3.8'
services:
  order-service:
    build: ./OrderService
    ports:
      - &quot;5001:80&quot;
    environment:
      - ConnectionStrings__DefaultConnection=Server=order-db;Database=OrderDb;User=sa;Password=Pass123!
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - order-db
      - kafka

  inventory-service:
    build: ./InventoryService
    ports:
      - &quot;5002:80&quot;
    depends_on:
      - inventory-db
      - kafka

  order-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Pass123!
    ports:
      - &quot;1433:1433&quot;

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - &quot;9092:9092&quot;
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
</code></pre>
<p><strong>Kluczowa obserwacja architektoniczna</strong> - każdy mikroserwis (<code>order-service</code>, <code>inventory-service</code>) ma <strong>własną, dedykowaną bazę</strong> (<code>order-db</code>, <code>inventory-db</code>) - to jest wprost realizacja zasady, o której mówiliśmy przy Sadze: <strong>brak</strong> jednej, współdzielonej bazy danych między serwisami, stąd potrzeba Sagi/Outboxa do koordynacji zamiast klasycznej transakcji SQL.</p>
<h2>Kubernetes - orkiestracja na produkcji (skala, którą Docker Compose nie obsługuje)</h2>
<p>Docker Compose jest świetny <strong>lokalnie</strong>, ale nie jest przeznaczony do produkcji na dużą skalę - brak automatycznego skalowania, brak samo-naprawiania (self-healing) przy awarii, brak rozproszenia między wiele maszyn fizycznych. Tym zajmuje się <strong>Kubernetes (K8s)</strong>.</p>
<h3>Pod - najmniejsza jednostka wdrożenia</h3>
<pre><code class="language-yaml">apiVersion: v1
kind: Pod
metadata:
  name: order-service-pod
spec:
  containers:
    - name: order-service
      image: order-service:latest
      ports:
        - containerPort: 80
</code></pre>
<p>Pod to <strong>jeden lub więcej</strong> kontenerów (najczęściej jeden) współdzielących sieć i storage - to jest podstawowa jednostka, którą Kubernetes zarządza (uruchamia, restartuje, skaluje).</p>
<h3>Deployment - zarządzanie wieloma replikami Poda</h3>
<pre><code class="language-yaml">apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
spec:
  replicas: 3 # 3 NIEZALEŻNE instancje OrderService, dla wysokiej dostępności i przepustowości
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - containerPort: 80
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: connectionString
</code></pre>
<p><strong>Deployment</strong> gwarantuje, że <strong>zawsze</strong> działa zadana liczba replik (<code>replicas: 3</code>) - jeśli jeden Pod padnie (crash, awaria maszyny), Kubernetes <strong>automatycznie</strong> tworzy nowy, żeby przywrócić żądaną liczbę. To jest właśnie <strong>self-healing</strong>, czego Docker Compose nie zapewnia.</p>
<p><strong>Nawiązanie do Kafka Consumer Groups</strong> - jeśli te 3 repliki <code>OrderService</code> nasłuchują z tego samego topicu Kafki jako jedna consumer group, Kubernetes <strong>automatycznie</strong> utrzymuje 3 działające instancje do dzielenia partycji między sobą, dokładnie jak omawialiśmy wcześniej.</p>
<h3>Service - stabilny punkt dostępu do zmiennych Podów</h3>
<pre><code class="language-yaml">apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service # kieruje ruch do WSZYSTKICH Podów z tą etykietą
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP # dostępne tylko WEWNĄTRZ klastra (inne serwisy mogą się połączyć)
</code></pre>
<p><strong>Problem, który Service rozwiązuje:</strong> Pody są <strong>efemeryczne</strong> - mogą być tworzone/usuwane/restartowane, każdy z <strong>własnym, zmiennym</strong> adresem IP. <code>Service</code> daje <strong>stabilną nazwę</strong> (<code>order-service</code>), przez którą inne serwisy (np. <code>InventoryService</code> wywołujący <code>OrderService</code> przez HTTP) <strong>zawsze</strong> mogą się połączyć, niezależnie od tego, które konkretne Pody aktualnie działają "pod spodem" - Kubernetes automatycznie kieruje ruch (load balancing) do zdrowych Podów.</p>
<pre><code class="language-csharp">// InventoryService wywołujący OrderService - używa STABILNEJ nazwy Service, nie konkretnego IP Poda
builder.Services.AddHttpClient&lt;IOrderServiceClient, OrderServiceClient&gt;(client =&gt;
    client.BaseAddress = new Uri(&quot;http://order-service&quot;)); // &quot;order-service&quot; to nazwa K8s Service
</code></pre>
<h3>ConfigMap i Secret - konfiguracja i dane wrażliwe</h3>
<pre><code class="language-yaml">apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
type: Opaque
stringData:
  connectionString: &quot;Server=order-db;Database=OrderDb;User=sa;Password=Pass123!&quot;
</code></pre>
<p><code>Secret</code> (dla danych wrażliwych, jak connection stringi z hasłami) i <code>ConfigMap</code> (dla zwykłej konfiguracji) pozwalają <strong>odseparować konfigurację od obrazu kontenera</strong> - ten sam obraz <code>order-service:latest</code> może być wdrożony w różnych środowiskach (dev/staging/prod) z różną konfiguracją, bez przebudowywania obrazu.</p>
<h2>Podsumowanie - jak to się łączy w jedną architekturę</h2>
<blockquote>
<p>Docker pakuje <strong>pojedynczy</strong> mikroserwis w przenośny, izolowany obraz. Docker Compose lokalnie uruchamia <strong>całą</strong> architekturę (wiele serwisów + bazy + Kafka) do developmentu, jednocześnie <strong>naturalnie wymuszając</strong> myślenie o niej jako o zbiorze <strong>niezależnych</strong> serwisów z własnymi bazami danych (stąd potrzeba Sagi/Outboxa do koordynacji). Kubernetes przenosi to na produkcję w dużej skali - <code>Deployment</code> gwarantuje żądaną liczbę zawsze-działających replik (self-healing, automatyczne skalowanie), a <code>Service</code> daje stabilny punkt wejścia do dynamicznie zmieniającego się zestawu Podów, przez który inne serwisy komunikują się (np. przez HTTP albo publikując/konsumując zdarzenia z Kafki, jak omawialiśmy wcześniej).</p>
</blockquote>
  
  `},

    { id:"rebus-servicebus", title:"Rebus (.NET Service Bus)", tags:"rebus servicebus messagebus rabbitmq masstransit saga",
  body:`
  <h1>Rebus - lekki Service Bus dla .NET</h1>
<h2>Co to jest - filozofia "dumb pipes, smart endpoints"</h2>
<p><strong>Rebus</strong> to open-source'owa biblioteka .NET do komunikacji asynchronicznej między serwisami - koncepcyjnie w tej samej kategorii co <strong>MassTransit</strong> i <strong>NServiceBus</strong> (o którym mówiliśmy przy Sadze/Kafce), ale zaprojektowana jako <strong>znacznie prostsza i "leaner"</strong> - mniej magii, mniej zależności, prostsza konfiguracja.</p>
<p>Rebus realizuje zasadę, którą ThoughtWorks nazwał w 2010 roku <strong>"message bus without smarts"</strong> - sama biblioteka <strong>nie próbuje</strong> być inteligentna (routing, orkiestracja, transformacje) - to logika biznesowa w Twoich handlerach ma być "smart", a sam transport ma być maksymalnie prosty i przewidywalny ("dumb pipes, smart endpoints").</p>
<h2>Podstawowa konfiguracja i użycie</h2>
<pre><code class="language-csharp">using var activator = new BuiltinHandlerActivator();

// Rejestracja handlera - podobnie jak Handler w MediatR, o którym mówiliśmy przy CQRS
activator.Handle&lt;OrderPlacedEvent&gt;(async message =&gt;
{
    Console.WriteLine($&quot;Otrzymano zamówienie: {message.OrderId}&quot;);
    await ProcessOrderAsync(message);
});

Configure.With(activator)
    .Transport(t =&gt; t.UseRabbitMq(&quot;amqp://localhost&quot;, &quot;order-queue&quot;))
    .Options(o =&gt; o.SetNumberOfWorkers(5)) // liczba równoległych wątków przetwarzających wiadomości
    .Start();

var bus = activator.Bus;

// Publikacja zdarzenia - dokładnie ten sam wzorzec co IEventBus z rozmowy o Sadze/Outboksie
await bus.Publish(new OrderPlacedEvent(orderId: 5));

// Wysłanie komendy do KONKRETNEGO odbiorcy (point-to-point, nie broadcast)
await bus.Send(new ReserveStockCommand(orderId: 5));
</code></pre>
<h2>Integracja z kontenerem DI (Microsoft.Extensions.DependencyInjection)</h2>
<pre><code class="language-csharp">services.AddRebus(configure =&gt; configure
    .Transport(t =&gt; t.UseRabbitMq(&quot;amqp://localhost&quot;, &quot;order-queue&quot;))
    .Routing(r =&gt; r.TypeBased().Map&lt;ReserveStockCommand&gt;(&quot;inventory-queue&quot;))
);

// Handler jako zwykła klasa rozwiązywana przez DI - constructor injection, jak wszędzie
public class OrderPlacedHandler : IHandleMessages&lt;OrderPlacedEvent&gt;
{
    private readonly IOrderRepository _repository;

    public OrderPlacedHandler(IOrderRepository repository) =&gt; _repository = repository;

    public async Task Handle(OrderPlacedEvent message)
    {
        await _repository.MarkAsPlacedAsync(message.OrderId);
    }
}
</code></pre>
<p>To wygląda bardzo podobnie do rejestracji <code>IRequestHandler&lt;T&gt;</code> w MediatR - <code>IHandleMessages&lt;T&gt;</code> to interfejs analogiczny, tylko dla wiadomości <strong>przychodzących z zewnątrz</strong> (przez broker), nie wywoływanych bezpośrednio w procesie.</p>
<h2>Pluggable transporty - jedna linia konfiguracji</h2>
<p>Kluczowa zaleta Rebusa - transport jest <strong>całkowicie wymienny</strong>, logika handlerów się nie zmienia:</p>
<pre><code class="language-csharp">.Transport(t =&gt; t.UseRabbitMq(connectionString, &quot;my-queue&quot;))
.Transport(t =&gt; t.UseAzureServiceBus(connectionString, &quot;my-queue&quot;))
.Transport(t =&gt; t.UseSqlServer(connectionString, &quot;my-queue&quot;)) // KOLEJKA jako tabela SQL - bez brokera!
.Transport(t =&gt; t.UseInMemoryTransport(network, &quot;my-queue&quot;))   // do testów jednostkowych/integracyjnych
</code></pre>
<p><strong><code>UseSqlServer</code> jako transport</strong> jest szczególnie praktyczne dla mniejszych systemów - eliminuje potrzebę wdrażania osobnego brokera (RabbitMQ/Kafka), kolejka po prostu żyje jako tabela w tej samej bazie SQL Server, którą już masz. To nawiązuje do Outbox Pattern, o którym rozmawialiśmy - Rebus z transportem SQL Server w praktyce <strong>realizuje</strong> podobną ideę "natywnie".</p>
<h2>Wbudowana obsługa Sagi</h2>
<p>To jest bardzo praktyczne odniesienie do wcześniejszej rozmowy o Saga Pattern - Rebus ma <strong>natywny</strong> mechanizm sag (Orchestration), bez potrzeby sięgania po zewnętrzną bibliotekę:</p>
<pre><code class="language-csharp">public class OrderSaga : Saga&lt;OrderSagaData&gt;,
    IAmInitiatedBy&lt;OrderPlacedEvent&gt;,
    IHandleMessages&lt;StockReservedEvent&gt;,
    IHandleMessages&lt;PaymentFailedEvent&gt;
{
    protected override void CorrelateMessages(ICorrelationConfig&lt;OrderSagaData&gt; config)
    {
        config.Correlate&lt;OrderPlacedEvent&gt;(m =&gt; m.OrderId, d =&gt; d.OrderId);
        config.Correlate&lt;StockReservedEvent&gt;(m =&gt; m.OrderId, d =&gt; d.OrderId);
        config.Correlate&lt;PaymentFailedEvent&gt;(m =&gt; m.OrderId, d =&gt; d.OrderId);
    }

    public async Task Handle(OrderPlacedEvent message)
    {
        Data.OrderId = message.OrderId;
        await Bus.Send(new ReserveStockCommand(message.OrderId));
    }

    public async Task Handle(StockReservedEvent message)
    {
        await Bus.Send(new ChargePaymentCommand(message.OrderId));
    }

    public async Task Handle(PaymentFailedEvent message)
    {
        await Bus.Send(new ReleaseStockCommand(message.OrderId)); // KOMPENSACJA
        MarkAsComplete();
    }
}
</code></pre>
<p><code>CorrelateMessages</code> to mechanizm mówiący Rebusowi, <strong>jak dopasować</strong> przychodzącą wiadomość do <strong>konkretnej instancji</strong> stanu sagi (przez <code>OrderId</code>) - to jest ten sam problem, o którym mówiliśmy przy MassTransit State Machine (<code>InstanceState</code>), tylko inaczej nazwany.</p>
<h2>Retry i Error Queue - "z pudełka"</h2>
<pre><code class="language-csharp">.Options(o =&gt; o.RetryStrategy(maxDeliveryAttempts: 5, errorQueueName: &quot;error-queue&quot;))
</code></pre>
<p>Jeśli handler rzuci wyjątek, Rebus <strong>automatycznie</strong> ponawia próbę (zgodnie z ustawioną liczbą prób) - a po przekroczeniu limitu, wiadomość trafia do <strong>dedykowanej kolejki błędów</strong>, gdzie można ją później zdiagnozować/ręcznie przetworzyć, zamiast bezpowrotnie zgubić. To jest wbudowany odpowiednik tego, co przy Kafce musieliśmy budować ręcznie (logika retry + idempotencja w konsumencie).</p>
<h2>Rebus vs MassTransit vs NServiceBus - kiedy które</h2>
<table>
<thead>
<tr>
<th></th>
<th>Rebus</th>
<th>MassTransit</th>
<th>NServiceBus</th>
</tr>
</thead>
<tbody>
<tr>
<td>Filozofia</td>
<td>Minimalizm, mało "magii"</td>
<td>Bogatszy, więcej wbudowanych wzorców</td>
<td>Najbardziej "enterprise", kompleksowy</td>
</tr>
<tr>
<td>Krzywa nauki</td>
<td>Niższa</td>
<td>Średnia/wyższa</td>
<td>Wyższa</td>
</tr>
<tr>
<td>Licencja</td>
<td>W pełni darmowa (open source)</td>
<td>Darmowa (część funkcji płatna w nowszych wersjach)</td>
<td>Płatna (poza małymi projektami)</td>
</tr>
<tr>
<td>Ekosystem/community</td>
<td>Mniejszy, ale aktywny</td>
<td>Największy w .NET, "mainstream"</td>
<td>Duży, komercyjne wsparcie</td>
</tr>
<tr>
<td>Sagi</td>
<td>Wbudowane, proste (<code>Saga&lt;TState&gt;</code>)</td>
<td>Wbudowane, rozbudowane (state machine)</td>
<td>Wbudowane, bardzo rozbudowane</td>
</tr>
<tr>
<td>Transport SQL Server bez brokera</td>
<td>✅ Tak</td>
<td>Ograniczone</td>
<td>Ograniczone</td>
</tr>
</tbody>
</table>
<h2>Kiedy wybrać Rebus w praktyce</h2>
<blockquote>
<p>Rebus ma sens, gdy chcesz <strong>prostoty</strong> i <strong>przewidywalności</strong> ponad bogactwo funkcji - mniejsze/średnie systemy, zespoły, które nie chcą inwestować czasu w naukę złożonego frameworka, albo sytuacje, gdzie transport <strong>SQL Server jako kolejka</strong> (bez wdrażania RabbitMQ/Kafki) jest wystarczający. Dla dużych, złożonych architektur mikroserwisowych z wieloma zespołami, <strong>MassTransit</strong> ma zwykle przewagę dzięki większemu ekosystemowi i społeczności - ale sama <strong>koncepcja</strong> (publikowanie zdarzeń, handlery, sagi, retry) jest niemal identyczna między wszystkimi trzema bibliotekami, więc znajomość jednej łatwo przenosi się na pozostałe.</p>
</blockquote>
<h2>Podsumowanie</h2>
<blockquote>
<p>Rebus to lekka alternatywa dla MassTransit/NServiceBus w .NET, realizująca te same fundamentalne wzorce, o których mówiliśmy przy Sadze i Kafce - publikowanie/konsumowanie zdarzeń, retry z error queue, i wbudowane sagi do orkiestracji rozproszonych transakcji - ale z filozofią "dumb pipes, smart endpoints" kładącą nacisk na prostotę konfiguracji i minimalną liczbę zależności, aż do możliwości użycia zwykłej tabeli SQL Server jako transportu, bez potrzeby wdrażania osobnego brokera wiadomości.</p>
</blockquote>
<h2>Pełny przykład - Serwer i Klient</h2>
<p>Poniżej kompletny, działający przykład: biblioteka ze wspólnymi kontraktami, serwer (konsument) i klient (nadawca), komunikujące się przez RabbitMQ.</p>
<h3>Wspólne kontrakty wiadomości</h3>
<pre><code class="language-csharp">namespace RebusDemo.Messages;

// Komenda wysyłana przez klienta do serwera (point-to-point, przez bus.Send)
public record PlaceOrderCommand(Guid OrderId, string CustomerName, decimal Amount);

// Zdarzenie publikowane przez serwer po przetworzeniu zamówienia (przez bus.Publish)
public record OrderPlacedEvent(Guid OrderId, DateTime PlacedAtUtc);
</code></pre>
<h3>Serwer (konsument) - <code>Program.cs</code></h3>
<pre><code class="language-csharp">using Microsoft.Extensions.DependencyInjection;
using Microsoft.Extensions.Hosting;
using Rebus.Bus;
using Rebus.Config;
using Rebus.Handlers;
using Rebus.Retry.Simple;
using Rebus.ServiceProvider;
using RebusDemo.Messages;

var builder = Host.CreateApplicationBuilder(args);

builder.Services.AddRebus(configure =&gt; configure
    // Transport - ta kolejka to &quot;adres&quot; tego serwera; klient wysyła TU wiadomości
    .Transport(t =&gt; t.UseRabbitMq(&quot;amqp://guest:guest@localhost:5672&quot;, &quot;orders-queue&quot;))
    .Options(o =&gt; o.SetNumberOfWorkers(4))
    // Retry - po 5 nieudanych próbach wiadomość trafia do kolejki błędów.
    // Uwaga: metoda nazywała się SimpleRetryStrategy() do Rebus 7.x,
    // od Rebus 8.0.0 nazywa się RetryStrategy() (identyczna funkcjonalność).
    .Options(o =&gt; o.RetryStrategy(errorQueueAddress: &quot;orders-error&quot;, maxDeliveryAttempts: 5))
);

// Automatyczna rejestracja WSZYSTKICH IHandleMessages&lt;T&gt; znalezionych w tym assembly
builder.Services.AutoRegisterHandlersFromAssemblyOf&lt;Program&gt;();

var host = builder.Build();
// Rebus.ServiceProvider rejestruje bus jako zwykły IHostedService - NIE trzeba
// (i nie da się) go &quot;startować&quot; żadnym UseRebus(); host.RunAsync() poniżej
// odpali wszystkie hosted services, w tym Rebusa, samo.

Console.WriteLine(&quot;Nasłuchuję na kolejce 'orders-queue'. Ctrl+C aby zakończyć.&quot;);
await host.RunAsync();

// Handler wywoływany AUTOMATYCZNIE przez Rebus, gdy przyjdzie PlaceOrderCommand
public class PlaceOrderHandler : IHandleMessages&lt;PlaceOrderCommand&gt;
{
    private readonly IBus _bus;
    public PlaceOrderHandler(IBus bus) =&gt; _bus = bus; // zwykłe DI, jak wszędzie

    public async Task Handle(PlaceOrderCommand message)
    {
        Console.WriteLine($&quot;[SERWER] Odebrano zamówienie {message.OrderId} od '{message.CustomerName}' na {message.Amount:C}&quot;);

        await Task.Delay(300); // symulacja przetwarzania (zapis do bazy, walidacja itd.)

        // Publikacja zdarzenia - każdy zainteresowany subskrybent mógłby je odebrać,
        // dokładnie tak jak przy Kafce/Sadze, o których mówiliśmy wcześniej
        await _bus.Publish(new OrderPlacedEvent(message.OrderId, DateTime.UtcNow));
    }
}
</code></pre>
<h3>Klient (nadawca) - <code>Program.cs</code></h3>
<pre><code class="language-csharp">using Microsoft.Extensions.DependencyInjection;
using Microsoft.Extensions.Hosting;
using Rebus.Bus;
using Rebus.Config;
using Rebus.Routing.TypeBased;
using Rebus.ServiceProvider;
using RebusDemo.Messages;

var builder = Host.CreateApplicationBuilder(args);

builder.Services.AddRebus(configure =&gt; configure
    // Klient NIE ma własnej kolejki wejściowej - &quot;one-way client&quot;,
    // bo tylko WYSYŁA wiadomości, nigdy nie odbiera
    .Transport(t =&gt; t.UseRabbitMqAsOneWayClient(&quot;amqp://guest:guest@localhost:5672&quot;))
    // Routing - mówimy Rebusowi: &quot;PlaceOrderCommand wysyłaj do kolejki 'orders-queue'&quot;
    // (czyli tam, gdzie nasłuchuje Serwer)
    .Routing(r =&gt; r.TypeBased().Map&lt;PlaceOrderCommand&gt;(&quot;orders-queue&quot;))
);

var host = builder.Build();
// Klient nie wywołuje host.RunAsync() (potrzebuje interaktywnej pętli), więc
// musi jawnie wystartować hosted services (w tym Rebusa) przez StartAsync(),
// i zamknąć je StopAsync() na końcu - nie ma tu żadnego UseRebus().
await host.StartAsync();

var bus = host.Services.GetRequiredService&lt;IBus&gt;();

Console.WriteLine(&quot;Wpisz nazwę klienta i Enter, aby wysłać zamówienie (albo 'exit').&quot;);
while (true)
{
    Console.Write(&quot;Nazwa klienta: &quot;);
    var name = Console.ReadLine();
    if (string.IsNullOrWhiteSpace(name) || name.Equals(&quot;exit&quot;, StringComparison.OrdinalIgnoreCase))
        break;

    var command = new PlaceOrderCommand(Guid.NewGuid(), name, Random.Shared.Next(10, 500));

    // bus.Send() = wiadomość point-to-point, trafia do JEDNEJ konkretnej kolejki,
    // zgodnie z mapowaniem Routing() ustawionym wyżej
    await bus.Send(command);

    Console.WriteLine($&quot;[KLIENT] Wysłano zamówienie {command.OrderId} ({command.Amount:C}) -&gt; orders-queue&quot;);
}

await host.StopAsync(); // poprawne zamknięcie hosted services (w tym Rebusa)
</code></pre>
<h3>Co się dzieje "pod spodem"</h3>
<pre><code class="language-csharp">KLIENT                          RabbitMQ                       SERWER
  |  bus.Send(PlaceOrderCommand)  |                              |
  |-------------------------------&gt;|  kolejka &quot;orders-queue&quot;     |
  |                                |-----------------------------&gt;|
  |                                |                    Handle(PlaceOrderCommand)
  |                                |                              |
  |                                |  bus.Publish(OrderPlacedEvent)|
  |                                |&lt;-----------------------------|
</code></pre>
<ul>
<li><strong><code>bus.Send(command)</code></strong> (klient) - wiadomość <strong>point-to-point</strong>, trafia do jednej konkretnej kolejki wskazanej przez <code>Routing().TypeBased().Map&lt;T&gt;(...)</code>.</li>
<li><strong><code>bus.Publish(event)</code></strong> (serwer) - wiadomość <strong>broadcastowa</strong>, trafi do każdego, kto się na nią zasubskrybuje (<code>await bus.Subscribe&lt;OrderPlacedEvent&gt;()</code> w subskrybencie).</li>
<li><strong><code>IHandleMessages&lt;T&gt;</code></strong> - handler wywoływany automatycznie przez Rebus; rejestracja przez <code>AutoRegisterHandlersFromAssemblyOf&lt;T&gt;()</code>.</li>
</ul>
<h3>Uruchomienie</h3>
<pre><code class="language-bash"># 1. Broker (RabbitMQ) w Dockerze
docker run -d --hostname my-rabbit --name rebus-rabbit -p 5672:5672 -p 15672:15672 rabbitmq:3-management

# 2. Serwer (pierwszy terminal)
cd RebusDemo.Server &amp;&amp; dotnet run

# 3. Klient (drugi terminal)
cd RebusDemo.Client &amp;&amp; dotnet run
</code></pre>
<p>Panel administracyjny RabbitMQ (podgląd kolejek i wiadomości w locie) dostępny pod <code>http://localhost:15672</code> (login/hasło: <code>guest</code>/<code>guest</code>).</p>

  { id:"rabbitmq-fundamentals", title:"Jak działa RabbitMQ (AMQP vs HTTP)", tags:"rabbitmq amqp broker exchange queue push pull",
  body:`
  <h1>Jak działa RabbitMQ - AMQP, nie HTTP</h1>
<p>To ważne pytanie, bo RabbitMQ (i szerzej - brokery wiadomości) działają na fundamentalnie innym modelu niż HTTP, mimo że oba "wysyłają dane przez sieć". Odpowiedź krótka: <strong>nie</strong>, wiadomości NIE idą jako request HTTP - RabbitMQ używa własnego protokołu binarnego (AMQP) nad zwykłym, długo trwającym połączeniem TCP.</p>
<h2>AMQP vs HTTP - różny model komunikacji</h2>
<p><strong>HTTP</strong> to model <strong>request-response</strong>: klient otwiera połączenie (albo używa istniejącego), wysyła request, czeka na response, połączenie się kończy (albo jest reużywane, ale zawsze w schemacie "zapytanie → odpowiedź").</p>
<p><strong>AMQP</strong> (Advanced Message Queuing Protocol) to protokół <strong>binarny</strong>, zaprojektowany specjalnie do przesyłania wiadomości - RabbitMQ domyślnie mówi AMQP 0-9-1 (nowsze wersje wspierają też AMQP 1.0). Kluczowa różnica: to nie jest "zapytanie o coś" - to <strong>wysłanie wiadomości do struktury (kolejki), która istnieje niezależnie od tego, czy ktoś akurat słucha</strong>.</p>
<h2>Jak to fizycznie działa - jedno połączenie, wiele kanałów</h2>
<pre><code class="language-csharp">Aplikacja .NET (np. RebusDemo.Server)
        |
        | 1x TCP connection (port 5672), OTWARTE NA STAŁE
        |
   RabbitMQ Broker
</code></pre>
<p>Gdy aplikacja woła <code>UseRabbitMq("amqp://guest:guest@localhost:5672", ...)</code>, biblioteka <code>RabbitMQ.Client</code> (na której bazuje <code>Rebus.RabbitMq</code>) otwiera <strong>jedno, długotrwałe połączenie TCP</strong> do brokera na porcie <strong>5672</strong> - i to połączenie <strong>zostaje otwarte przez cały czas życia aplikacji</strong>, nie zamyka się po każdej wiadomości.</p>
<p>Wewnątrz tego jednego połączenia TCP tworzone są <strong>kanały (channels)</strong> - lekkie, wirtualne "podpołączenia" multipleksowane na jednym gnieździe sieciowym, żeby nie trzeba było otwierać nowego TCP connection dla każdej operacji (wysłania, odebrania, deklaracji kolejki itd.) - to jest dużo bardziej wydajne niż HTTP bez keep-alive, gdzie każdy request to potencjalnie nowe połączenie.</p>
<h2>Model komunikacji - Producer → Exchange → Queue → Consumer</h2>
<pre><code class="language-csharp">KLIENT (Producer)                RabbitMQ                          SERWER (Consumer)
    |                                |                                    |
    | bus.Send(command)              |                                    |
    |-------------------------------&gt;|  Exchange -&gt; routing -&gt; Queue      |
    | (AMQP &quot;basic.publish&quot;)         |  (wiadomość CZEKA w kolejce,      |
    |                                |   nawet jeśli Serwer jest offline) |
    |                                |                                    |
    |                                |------- PUSH, gdy Consumer gotowy -&gt;|
    |                                |  (AMQP &quot;basic.deliver&quot;)            |
</code></pre>
<p>Kluczowe elementy modelu AMQP:
- <strong>Exchange</strong> - punkt wejścia dla publikowanych wiadomości; decyduje (na podstawie routing key / typu exchange) do <strong>której kolejki</strong> (albo kolejek) wiadomość trafi
- <strong>Queue</strong> - bufor, w którym wiadomość <strong>czeka</strong>, nawet jeśli żaden konsument akurat nie jest podłączony
- <strong>Binding</strong> - reguła łącząca exchange z kolejką</p>
<p>To dokładnie to, co dzieje się "pod spodem" przy <code>bus.Send()</code> i <code>bus.Publish()</code> w Rebusie - <code>bus.Send()</code> to publikacja z routingiem do <strong>jednej konkretnej</strong> kolejki (np. <code>orders-queue</code>), a <code>bus.Subscribe&lt;T&gt;()</code> z <code>bus.Publish()</code> to mechanizm, w którym Rebus tworzy <strong>exchange typu topic</strong> i dopisuje kolejkę subskrybenta (np. <code>notifier-queue</code>) jako binding do tego exchange.</p>
<h2>Kluczowa różnica praktyczna - PUSH, nie PULL</h2>
<p>To jest chyba najważniejsza koncepcyjna różnica względem HTTP:</p>
<ul>
<li><strong>HTTP</strong> - klient <strong>pyta</strong> ("czy jest coś nowego?") - to model <strong>pull</strong></li>
<li><strong>AMQP</strong> (w typowym użyciu) - broker <strong>wypycha</strong> wiadomość do konsumenta, gdy tylko jest dostępna i konsument jest gotowy (<code>basic.consume</code> rejestruje "callback" po stronie klienta, broker wywołuje go, gdy przyjdzie wiadomość) - to model <strong>push</strong></li>
</ul>
<p>Dlatego w handlerach typu <code>IHandleMessages&lt;T&gt;</code> (Rebus) czy <code>IHandleMessages&lt;T&gt;</code> nie ma żadnej pętli odpytującej "czy jest nowa wiadomość?" - <code>Handle()</code> jest wywoływane <strong>automatycznie</strong>, bo RabbitMQ <strong>sam</strong> przesyła wiadomość do klienta w momencie, gdy jest dostępna. To jest zresztą dokładnie ten mechanizm, dzięki któremu serwer "nasłuchuje" bez busy-loopingu i bez zużywania CPU na czekanie.</p>
<h2>A co z portem 15672 - czy to nie jest HTTP?</h2>
<p>Tu jest istotne rozróżnienie, o które łatwo się pomylić: <strong>port 15672 (panel administracyjny) to zupełnie inny, dodatkowy interfejs</strong> - to jest <strong>prawdziwy HTTP/REST API</strong> (plugin <code>rabbitmq_management</code>), służący <strong>wyłącznie do zarządzania i podglądu</strong> (ile wiadomości w kolejce, statystyki, tworzenie kolejek ręcznie z UI). <strong>Żadna wiadomość biznesowa nigdy nie przechodzi przez ten port</strong> - to jest osobny, "boczny" kanał administracyjny, kompletnie niezależny od portu 5672, po którym faktycznie płynie ruch AMQP.</p>
<h2>Podsumowanie - tabela</h2>
<table>
<thead>
<tr>
<th></th>
<th>HTTP</th>
<th>AMQP (RabbitMQ, port 5672)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Model</td>
<td>Request-response, pull</td>
<td>Broker push do gotowego konsumenta</td>
</tr>
<tr>
<td>Połączenie</td>
<td>Zwykle krótkotrwałe / per-request</td>
<td>Jedno długotrwałe TCP + multipleksowane kanały</td>
</tr>
<tr>
<td>Kto inicjuje dostarczenie</td>
<td>Klient (pytając)</td>
<td>Broker (wypychając, gdy wiadomość jest gotowa)</td>
</tr>
<tr>
<td>Trwałość danych</td>
<td>Nie - response ginie, jeśli klient nie odebrał</td>
<td>Tak - wiadomość CZEKA w kolejce, nawet gdy konsument jest offline</td>
</tr>
<tr>
<td>Typowy port</td>
<td>80/443 (HTTP/HTTPS), tu: 15672 (tylko panel admina)</td>
<td>5672 (faktyczny ruch wiadomości)</td>
</tr>
</tbody>
</table>
<h2>Podsumowanie - zwięzła odpowiedź na rozmowie</h2>
<blockquote>
<p>RabbitMQ komunikuje się przez protokół <strong>AMQP</strong>, binarny protokół zaprojektowany do przesyłania wiadomości, nie przez HTTP. Klient otwiera <strong>jedno długotrwałe połączenie TCP</strong> do brokera (port 5672 domyślnie), wewnątrz którego multipleksowane są lekkie kanały do poszczególnych operacji. Wiadomości płyną przez <strong>Exchange → Queue → Consumer</strong>, a model dostarczenia jest <strong>push, nie pull</strong> - broker sam wypycha wiadomość do gotowego konsumenta, gdy tylko jest dostępna, bez potrzeby odpytywania. Port 15672, jeśli jest widoczny, to osobny panel administracyjny HTTP - nie ma nic wspólnego z faktycznym przesyłaniem wiadomości biznesowych.</p>
</blockquote>
  `},

  ]
},

  { id:"memory-management", title:"Zarządzanie pamięcią: Framework, Core, .NET", tags:"garbage collector gc generacje loh workstation server gc cgroups datas",
  body:`
  <h1>Zarządzanie pamięcią w .NET - Garbage Collector</h1>
<h2>Generational Garbage Collector - fundamentalna architektura</h2>
<p>.NET GC opiera się na obserwacji: <strong>większość obiektów żyje krótko</strong> (zmienne lokalne, tymczasowe DTO), a <strong>mniejszość żyje długo</strong> (Singletony, statyczne cache). GC dzieli stertę na <strong>generacje</strong>, optymalizując pod tę obserwację.</p>
<pre><code class="language-csharp">Gen 0 (młode obiekty)     → Gen 1 (przetrwały jedno GC)  → Gen 2 (długo żyjące)
Zbierane BARDZO często     Zbierane rzadziej                Zbierane najrzadziej
</code></pre>
<pre><code class="language-csharp">var order = new Order(); // trafia do Gen 0
</code></pre>
<p>Każdy nowo utworzony obiekt referencyjny trafia do <strong>Gen 0</strong>. Gdy Gen 0 się zapełni, GC wykonuje <strong>kolekcję Gen 0</strong> - sprawdza, które obiekty są jeszcze "żywe" (mają aktywne referencje), usuwa resztę. Obiekty, które <strong>przetrwały</strong> kolekcję (bo wciąż są używane), są <strong>awansowane</strong> do Gen 1.</p>
<p><strong>Dlaczego to jest wydajne:</strong> kolekcja Gen 0 jest <strong>bardzo szybka</strong> (mała ilość pamięci do przeskanowania, większość obiektów krótko żyjących i tak już jest "martwa"). Gdyby GC musiał <strong>zawsze</strong> skanować całą stertę, byłoby to drastycznie wolniejsze - stąd podział na generacje, gdzie <strong>rzadko</strong> trzeba skanować Gen 2 (bo mało się tam zmienia).</p>
<h2>Mark-and-Sweep - jak faktycznie działa kolekcja</h2>
<pre><code class="language-csharp">1. MARK (oznaczanie) - GC przechodzi od &quot;korzeni&quot; (root - zmienne lokalne na stosie, statyczne pola)
   i oznacza WSZYSTKIE obiekty osiągalne przez referencje jako &quot;żywe&quot;

2. SWEEP (zbieranie) - wszystko NIEOZNACZONE (nieosiągalne) jest uznawane za &quot;śmieć&quot; i pamięć jest zwalniana

3. COMPACT (kompaktowanie) - żywe obiekty są PRZESUWANE, żeby scalić wolną pamięć w jeden ciągły blok
   (eliminuje fragmentację)
</code></pre>
<p>To wyjaśnia, dlaczego <strong>cykliczne referencje NIE są problemem</strong> w .NET (w przeciwieństwie do prostego zliczania referencji, jak np. w starym COM) - jeśli dwa obiekty referencjonują się nawzajem, ale <strong>żaden korzeń</strong> nie prowadzi do nich, GC i tak je uzna za nieosiągalne i zwolni.</p>
<h2>LOH (Large Object Heap) - specjalne traktowanie dużych obiektów</h2>
<pre><code class="language-csharp">var bigArray = new byte[100_000]; // &gt; 85 000 bajtów → trafia do LOH, NIE do Gen 0!
</code></pre>
<p>Obiekty <strong>większe niż ~85 KB</strong> trafiają do <strong>osobnej</strong> części stosu (Large Object Heap), która jest <strong>rzadko kompaktowana</strong> (przesuwanie dużych blików pamięci jest kosztowne) - to może prowadzić do <strong>fragmentacji</strong> LOH przy częstym tworzeniu/zwalnianiu dużych tablic, co jest częstym źródłem problemów wydajnościowych w aplikacjach przetwarzających duże dane (np. duże bufory przy przetwarzaniu plików).</p>
<h2>.NET Framework vs .NET Core/.NET 5+ - różnice w GC</h2>
<table>
<thead>
<tr>
<th></th>
<th>.NET Framework</th>
<th>.NET Core / .NET 5+</th>
</tr>
</thead>
<tbody>
<tr>
<td>Domyślny GC</td>
<td>Workstation GC (jeden wątek)</td>
<td>Server GC (wielowątkowy, domyślny w ASP.NET Core)</td>
</tr>
<tr>
<td>Konfigurowalność</td>
<td>Ograniczona</td>
<td>Bardziej szczegółowa (<code>runtimeconfig.json</code>, zmienne env)</td>
</tr>
<tr>
<td>Wydajność dla serwerów</td>
<td>Słabsza pod dużym obciążeniem</td>
<td>Znacznie lepsza (Server GC skaluje się z liczbą rdzeni CPU)</td>
</tr>
</tbody>
</table>
<pre><code class="language-json">// runtimeconfig.json - konfiguracja GC w .NET Core/.NET 5+
{
  &quot;configProperties&quot;: {
    &quot;System.GC.Server&quot;: true,        // Server GC - wielowątkowy, lepszy dla wysokiego throughput
    &quot;System.GC.Concurrent&quot;: true      // Background GC - część pracy w tle, mniej pauz
  }
}
</code></pre>
<p><strong>Server GC</strong> tworzy <strong>osobny wątek GC per rdzeń CPU</strong> i osobną stertę per wątek - znacznie lepiej skaluje się na serwerach wielordzeniowych (typowe dla ASP.NET Core w produkcji), kosztem większego zużycia pamięci w porównaniu do Workstation GC (lepszego dla aplikacji desktopowych typu WPF, gdzie liczy się responsywność UI, nie maksymalny throughput).</p>
<h2><code>IDisposable</code>/<code>using</code> - zasoby NIEZARZĄDZANE, których GC nie widzi</h2>
<p>To jest kluczowe rozróżnienie - GC zarządza <strong>pamięcią zarządzaną</strong> (.NET objects), ale <strong>nie wie</strong> o zasobach <strong>niezarządzanych</strong> (uchwyty plików, połączenia sieciowe, uchwyty systemu operacyjnego):</p>
<pre><code class="language-csharp">public class FileProcessor : IDisposable
{
    private readonly FileStream _stream; // zasób NIEZARZĄDZANY - uchwyt systemu operacyjnego

    public FileProcessor(string path) =&gt; _stream = File.OpenRead(path);

    public void Dispose() =&gt; _stream?.Dispose(); // MUSISZ zwolnić RĘCZNIE, GC tego nie zrobi za Ciebie
}
</code></pre>
<pre><code class="language-csharp">using (var processor = new FileProcessor(&quot;data.txt&quot;))
{
    // ...
} // Dispose() wywołane AUTOMATYCZNIE na końcu bloku, nawet jeśli wyjątek zostanie rzucony
</code></pre>
<p><strong>Dlaczego to jest ważne:</strong> bez <code>using</code>/<code>Dispose()</code>, uchwyt pliku <strong>zostaje otwarty</strong>, mimo że sam obiekt <code>FileProcessor</code> (pamięć zarządzana) może już dawno zostać zebrany przez GC - to prowadzi do <strong>wyczerpania zasobów</strong> systemu operacyjnego (np. "too many open files"), zupełnie niezależnie od tego, ile "wolnej pamięci RAM" masz.</p>
<h2>Finalizery - "ostatnia linia obrony", ale kosztowna</h2>
<pre><code class="language-csharp">public class FileProcessor : IDisposable
{
    private readonly FileStream _stream;

    ~FileProcessor() // finalizer - wywoływany przez GC, jeśli Dispose() NIE został wywołany
    {
        _stream?.Dispose();
    }

    public void Dispose()
    {
        _stream?.Dispose();
        GC.SuppressFinalize(this); // &quot;nie musisz mnie finalizować, JUŻ się posprzątałem ręcznie&quot;
    }
}
</code></pre>
<p>Obiekty z finalizerem wymagają <strong>dwóch przebiegów GC</strong> do pełnego zwolnienia (najpierw finalizer jest wykonywany, obiekt trafia do specjalnej kolejki, dopiero <strong>następna</strong> kolekcja faktycznie zwalnia pamięć) - stąd <code>GC.SuppressFinalize(this)</code> w <code>Dispose()</code> jest ważną optymalizacją, informującą GC, że finalizer jest <strong>niepotrzebny</strong>, bo zasoby już zostały zwolnione ręcznie.</p>
<h2>Podsumowanie - praktyczne konsekwencje dla codziennego kodu</h2>
<blockquote>
<p>.NET GC dzieli stertę na generacje (Gen 0/1/2), optymalizując pod obserwację, że większość obiektów żyje krótko - kolekcja Gen 0 jest częsta i szybka, Gen 2 rzadka i kosztowna. Server GC (domyślny w ASP.NET Core) skaluje się wielowątkowo z liczbą rdzeni CPU, kosztem większego zużycia pamięci. Kluczowa praktyczna zasada: GC zarządza <strong>tylko</strong> pamięcią .NET - zasoby niezarządzane (pliki, sockets, połączenia do baz danych) wymagają <strong>jawnego</strong> <code>Dispose()</code>/<code>using</code>, niezależnie od tego, kiedy GC zwolni sam obiekt "kontenera" tych zasobów.</p>
</blockquote>
  
  `},

  { id:"async-thread", title:"Czy async tworzy nowy wątek?", tags:"async await thread pool i/o completion ports task run state machine",
  body:`
  <h1>Czy <code>async</code>/<code>await</code> tworzy nowe wątki?</h1>
<h2>Krótka odpowiedź: <strong>NIE, nie automatycznie</strong></h2>
<p>To jest jedno z <strong>najczęstszych błędnych przekonań</strong> w C# - <code>async</code>/<code>await</code> <strong>sam z siebie nie tworzy nowego wątku</strong>. To jest fundamentalne nieporozumienie, warte dokładnego wyjaśnienia, bo dotyka samego serca modelu asynchroniczności w .NET.</p>
<h2>Co faktycznie się dzieje - I/O-bound vs CPU-bound</h2>
<p>To rozróżnienie jest <strong>kluczowe</strong> do zrozumienia całego tematu:</p>
<h3>I/O-bound (operacje wejścia/wyjścia) - BRAK nowego wątku</h3>
<pre><code class="language-csharp">public async Task&lt;Order&gt; GetOrderAsync(int id)
{
    var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;); // I/O-bound - operacja SIECIOWA
    return await response.Content.ReadFromJsonAsync&lt;Order&gt;();
}
</code></pre>
<p>Gdy wywołujesz <code>HttpClient.GetAsync()</code>, .NET <strong>nie blokuje</strong> żadnego wątku, czekając na odpowiedź z sieci. Zamiast tego wykorzystuje <strong>I/O Completion Ports</strong> (mechanizm systemu operacyjnego) - wątek <strong>wraca do puli wątków</strong> i jest <strong>wolny</strong> do obsługi innej pracy, podczas gdy karta sieciowa/system operacyjny <strong>asynchronicznie</strong> czeka na odpowiedź. Gdy odpowiedź przyjdzie, system operacyjny <strong>powiadamia</strong> .NET, a runtime <strong>pobiera wątek z puli</strong> (może to być <strong>inny</strong> wątek niż ten, który zaczął operację!) do wykonania kontynuacji (<code>ReadFromJsonAsync</code> i dalej).</p>
<p><strong>Kluczowy wniosek:</strong> podczas <strong>całego czasu czekania</strong> na odpowiedź sieciową, <strong>żaden wątek</strong> nie jest zajęty - to jest właśnie powód, dla którego async I/O jest tak wydajne w Web API pod dużym obciążeniem: 1000 równoczesnych requestów czekających na bazę danych <strong>nie blokuje</strong> 1000 wątków, tylko może być obsłużone przez np. 10 wątków, które "odskakują" do innej pracy, gdy nie ma co robić.</p>
<h3>CPU-bound (operacje intensywne obliczeniowo) - <code>Task.Run</code> faktycznie ZLECA prace do innego wątku</h3>
<pre><code class="language-csharp">public async Task&lt;decimal&gt; CalculateComplexDiscountAsync(Order order)
{
    // TO jest CPU-bound - ciężkie obliczenia, nie I/O
    return await Task.Run(() =&gt; PerformExpensiveCalculation(order));
}

private decimal PerformExpensiveCalculation(Order order)
{
    // np. skomplikowana symulacja, przeszukanie dużego zbioru danych w pamięci
    decimal result = 0;
    for (int i = 0; i &lt; 10_000_000; i++) { result += Math.Sqrt(i); }
    return result;
}
</code></pre>
<p><code>Task.Run()</code> <strong>faktycznie</strong> zleca wykonanie delegata do <strong>wątku z <code>ThreadPool</code></strong> - to jest jedyny scenariusz, w którym można powiedzieć, że "coś tworzy nowy wątek pracy" (a właściwie: <strong>pożycza</strong> wątek z puli, nie tworzy go od zera przy każdym wywołaniu, bo <code>ThreadPool</code> zarządza pulą i reużywa wątki).</p>
<p><strong>Ważne rozróżnienie:</strong> to <code>Task.Run()</code> powoduje użycie wątku z puli, <strong>nie</strong> sam <code>async</code>/<code>await</code>. <code>await</code> to tylko mechanizm <strong>czekania</strong> na zakończenie Task-a (I/O-bound albo CPU-bound) bez blokowania wątku wywołującego.</p>
<h2>Diagram myślowy - co się dzieje "pod maską"</h2>
<pre><code class="language-csharp">I/O-bound (HttpClient, EF Core, File I/O):
[Wątek A] → wywołuje operację I/O → ODDAJE wątek do puli (BRAK zajętego wątku podczas czekania)
                                    → system operacyjny/sprzęt wykonuje pracę
[Wątek B, może inny niż A] ← pobrany z puli, gdy I/O się zakończy → kontynuacja metody

CPU-bound (Task.Run):
[Wątek A] → Task.Run() → ZAJMUJE wątek Z PULI na czas obliczeń (wątek jest FAKTYCZNIE zajęty)
[Wątek B z ThreadPool] → wykonuje obliczenia → zwraca wynik
[Wątek A] → wraca do wykonania po await, gdy obliczenia się zakończą
</code></pre>
<h2>Dlaczego to rozróżnienie ma praktyczne znaczenie - antywzorzec</h2>
<pre><code class="language-csharp">// ❌ ANTYWZORZEC - I/O-bound owinięte w Task.Run to strata zasobów
public async Task&lt;Order&gt; GetOrderBadAsync(int id)
{
    return await Task.Run(async () =&gt; // ❌ NIEPOTRZEBNE - HttpClient.GetAsync JUŻ jest async I/O
    {
        var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;);
        return await response.Content.ReadFromJsonAsync&lt;Order&gt;();
    });
}

// ✅ Poprawnie - I/O-bound BEZ Task.Run, bo HttpClient JUŻ zarządza tym asynchronicznie
public async Task&lt;Order&gt; GetOrderAsync(int id)
{
    var response = await _httpClient.GetAsync($&quot;api/orders/{id}&quot;);
    return await response.Content.ReadFromJsonAsync&lt;Order&gt;();
}
</code></pre>
<p><code>Task.Run()</code> na operacji I/O-bound <strong>niepotrzebnie zajmuje</strong> wątek z puli na czas, kiedy w rzeczywistości <strong>nie trzeba by go zajmować w ogóle</strong> - to jest realny problem wydajnościowy w Web API pod dużym obciążeniem, bo marnujesz wątki, które mogłyby obsługiwać inne requesty.</p>
<h2>Gdzie <code>Task.Run</code> faktycznie ma sens</h2>
<pre><code class="language-csharp">// W kontekście UI (WPF) - żeby NIE blokować wątku UI dla ciężkich obliczeń CPU-bound
private async void CalculateButton_Click(object sender, RoutedEventArgs e)
{
    IsCalculating = true;
    var result = await Task.Run(() =&gt; PerformExpensiveCalculation(data)); // ✅ SENSOWNE - CPU-bound, UI thread wolny
    ResultText = result.ToString();
    IsCalculating = false;
}
</code></pre>
<p>To nawiązuje wprost do rozmowy o <code>SynchronizationContext</code>/Dispatcher w WPF - <code>Task.Run</code> jest właściwym narzędziem, gdy chcesz <strong>odciążyć wątek UI</strong> od kosztownych obliczeń CPU-bound, żeby interfejs nie "zamarzał" - ale w kodzie serwerowym/API, gdzie i tak operujesz na wątkach z <code>ThreadPool</code>, <code>Task.Run</code> na operacji I/O-bound po prostu <strong>nie ma sensu</strong> i szkodzi wydajności.</p>
<h2>Podsumowanie - precyzyjna odpowiedź na rozmowie</h2>
<blockquote>
<p><strong><code>async</code>/<code>await</code> sam z siebie NIE tworzy nowych wątków.</strong> Dla operacji I/O-bound (sieć, dysk, baza danych) .NET wykorzystuje mechanizm I/O Completion Ports systemu operacyjnego - żaden wątek nie jest zajęty w czasie oczekiwania na odpowiedź, co jest właśnie fundamentem skalowalności async w Web API. Nowe (a właściwie: pożyczone z <code>ThreadPool</code>) wątki są używane <strong>tylko</strong> wtedy, gdy jawnie użyjesz <code>Task.Run()</code> do zlecenia pracy <strong>CPU-bound</strong> - i to jest jedyny scenariusz, w którym "async" faktycznie wiąże się z zajęciem osobnego wątku pracy. Mylenie tych dwóch przypadków (i owijanie I/O-bound w niepotrzebny <code>Task.Run</code>) jest częstym antywzorcem wydajnościowym.</p>
</blockquote>
  
  `},

  ]
},

  { id:"mvc-mvvm-mvp", title:"MVC, MVVM, MVP — porównanie", tags:"mvc mvvm mvp controller presenter viewmodel przykłady",
  body:`
  <h1>MVC vs MVVM vs MVP - porównanie wzorców architektonicznych</h1>
<h2>Wspólny mianownik - separacja odpowiedzialności</h2>
<p>Wszystkie trzy wzorce rozwiązują ten sam podstawowy problem: <strong>jak rozdzielić logikę prezentacji od danych i logiki biznesowej</strong>, żeby kod był testowalny i łatwy w utrzymaniu. Różnią się <strong>tym, kto o czym wie</strong> i <strong>jak dokładnie płynie komunikacja</strong>.</p>
<h2>MVC (Model-View-Controller)</h2>
<pre><code class="language-csharp">User → Controller → Model
         ↓
       View (renderuje na podstawie Modelu)
</code></pre>
<ul>
<li><strong>Controller</strong> odbiera akcję użytkownika, <strong>aktualizuje Model</strong>, wybiera <strong>View</strong> do wyświetlenia</li>
<li><strong>View</strong> renderuje dane z Modelu - w klasycznym MVC (webowym) View jest <strong>generowany na nowo</strong> przy każdym requeście</li>
<li>Controller <strong>wie</strong> o View (wybiera, którą zwrócić) - to jest istotna różnica względem MVVM</li>
</ul>
<pre><code class="language-csharp">// ASP.NET Core MVC - klasyczny przykład
public class OrdersController : Controller
{
    public IActionResult Details(int id)
    {
        var order = _orderService.GetOrder(id); // aktualizacja/pobranie Modelu
        return View(order); // Controller JAWNIE wybiera View i przekazuje dane
    }
}
</code></pre>
<h2>MVP (Model-View-Presenter)</h2>
<pre><code class="language-csharp">User → View → Presenter → Model
                ↓
              View (Presenter JAWNIE mówi View co wyświetlić)
</code></pre>
<ul>
<li><strong>View</strong> jest <strong>pasywny</strong> (passive view) - nie ma żadnej logiki, tylko wystawia interfejs, przez który Presenter go "steruje"</li>
<li><strong>Presenter</strong> zawiera <strong>całą</strong> logikę prezentacji, <strong>jawnie</strong> wywołuje metody na View (np. <code>view.ShowOrder(order)</code>), zamiast automatycznego bindingu</li>
<li>View <strong>wie</strong> o Presenterze (żeby przekazać zdarzenia), a Presenter <strong>wie</strong> o View (przez interfejs) - <strong>dwustronna, ale jawna</strong> komunikacja</li>
</ul>
<pre><code class="language-csharp">// Interfejs, który View musi zaimplementować
public interface IOrderView
{
    void ShowOrder(OrderDto order);
    void ShowError(string message);
}

public class OrderPresenter
{
    private readonly IOrderView _view; // Presenter WIE o View, przez interfejs
    private readonly IOrderService _service;

    public async void LoadOrder(int id) // JAWNE wywołanie, nie automatyczny binding
    {
        try
        {
            var order = await _service.GetOrderAsync(id);
            _view.ShowOrder(order); // Presenter RĘCZNIE mówi View, co wyświetlić
        }
        catch (Exception ex)
        {
            _view.ShowError(ex.Message);
        }
    }
}
</code></pre>
<h2>MVVM (Model-View-ViewModel)</h2>
<pre><code class="language-csharp">View ←→ ViewModel (przez BINDING, nie jawne wywołania)
           ↓
         Model
</code></pre>
<ul>
<li><strong>ViewModel NIE WIE nic o View</strong> (kluczowa różnica względem MVP!) - komunikacja odbywa się przez <strong>binding</strong> (<code>INotifyPropertyChanged</code>, <code>ICommand</code>), automatycznie, bez jawnych wywołań</li>
<li>To dokładnie ten model, który szczegółowo omawialiśmy przy WPF - <code>SetProperty</code> → <code>PropertyChanged</code> → automatyczna aktualizacja UI, bez ręcznego <code>view.ShowOrder(...)</code></li>
</ul>
<pre><code class="language-csharp">public class OrderViewModel : ViewModelBase
{
    private OrderDto _order;
    public OrderDto Order // ViewModel NIE WIE, że jakikolwiek View w ogóle istnieje
    {
        get =&gt; _order;
        set =&gt; SetProperty(ref _order, value); // automatyczne powiadomienie, jeśli KTOŚ nasłuchuje
    }

    public async Task LoadOrderAsync(int id)
    {
        Order = await _service.GetOrderAsync(id); // po prostu ustawia property
        // ŻADNEGO wywołania metody na View - binding w XAML sam się zaktualizuje
    }
}
</code></pre>
<h2>Kluczowa różnica MVP vs MVVM - kto inicjuje komunikację</h2>
<p>To jest <strong>najczęściej mylony</strong> punkt na rozmowach - obie wyglądają podobnie ("pośrednik między View i Model"), ale różnią się fundamentalnie:</p>
<table>
<thead>
<tr>
<th></th>
<th>MVP</th>
<th>MVVM</th>
</tr>
</thead>
<tbody>
<tr>
<td>Czy pośrednik wie o View</td>
<td>✅ Tak (przez interfejs)</td>
<td>❌ Nie (żadnej referencji)</td>
</tr>
<tr>
<td>Jak View się aktualizuje</td>
<td>Presenter <strong>jawnie</strong> wywołuje metody na View</td>
<td><strong>Automatyczny</strong> binding (View "obserwuje" ViewModel)</td>
</tr>
<tr>
<td>Testowalność Presentera/ViewModelu</td>
<td>Wymaga mockowania interfejsu View</td>
<td>Nie wymaga NIC związanego z View - czysta logika</td>
</tr>
<tr>
<td>Typowy framework</td>
<td>Android (przed Jetpack), starsze WinForms</td>
<td>WPF, Xamarin.Forms, Angular (koncepcyjnie), Blazor (częściowo)</td>
</tr>
</tbody>
</table>
<h2>Tabela zbiorcza wszystkich trzech</h2>
<table>
<thead>
<tr>
<th></th>
<th>MVC</th>
<th>MVP</th>
<th>MVVM</th>
</tr>
</thead>
<tbody>
<tr>
<td>Kto wybiera View</td>
<td>Controller</td>
<td>Nikt jawnie - Presenter steruje istniejącym View</td>
<td>Nikt - View "obserwuje" ViewModel</td>
</tr>
<tr>
<td>Kto wie o kim</td>
<td>Controller wie o View i Modelu</td>
<td>Presenter i View wiedzą o SOBIE (przez interfejs)</td>
<td>ViewModel NIE WIE o View</td>
</tr>
<tr>
<td>Mechanizm aktualizacji UI</td>
<td>Nowe renderowanie (web) / ręczne (desktop)</td>
<td>Jawne wywołania metod</td>
<td>Automatyczny binding</td>
</tr>
<tr>
<td>Typowe zastosowanie</td>
<td>ASP.NET Core MVC, Ruby on Rails</td>
<td>Starszy Android, WinForms</td>
<td>WPF, Blazor (częściowo), Xamarin</td>
</tr>
</tbody>
</table>
<h2>Dlaczego MVVM jest tak dobre dla WPF - nawiązanie do wcześniejszej rozmowy</h2>
<p>To jest właśnie powód, dla którego cała nasza wcześniejsza rozmowa o DI/testowalności ViewModelu działała tak dobrze - <strong>ViewModel nie ma ŻADNEJ zależności od View</strong>, więc testy jednostkowe ViewModelu (jak pokazywałem z Moq) <strong>nie wymagają w ogóle uruchamiania WPF</strong> - nie trzeba mockować <code>IOrderView</code> (jak w MVP), bo taki interfejs <strong>nie istnieje</strong>. To jest czystsza separacja niż MVP, kosztem tego, że <strong>binding</strong> (mechanizm <code>INotifyPropertyChanged</code> + XAML) musi być dostarczony przez framework (WPF, nie każdy framework UI to wspiera natywnie).</p>
<h2>Podsumowanie - zwięzła odpowiedź na rozmowę</h2>
<blockquote>
<p>Wszystkie trzy wzorce rozdzielają logikę prezentacji od Modelu, różnią się <strong>kierunkiem i mechanizmem</strong> komunikacji z View. MVC - Controller jawnie wybiera i renderuje View. MVP - Presenter jawnie <strong>wywołuje metody</strong> na View przez interfejs (View i Presenter <strong>znają się nawzajem</strong>). MVVM - ViewModel <strong>nie wie nic</strong> o View, komunikacja przez automatyczny <strong>binding</strong> (View "obserwuje" zmiany ViewModelu) - to jest najbardziej "odseparowany" model z trzech, stąd jego popularność w WPF, gdzie testowalność ViewModelu bez UI jest kluczowa.</p>
</blockquote>
  
  `},

  { id:"dto-mvvm-placement", title:"Gdzie umieszczać DTO w projekcie MVVM", tags:"dto models folder struktura projektu wpf",
  body:`
  <h1>Gdzie umieszczać DTO w projekcie MVVM (WPF)</h1>
<h2>Problem - DTO żyje "między" warstwami</h2>
<p>DTO (Data Transfer Object) to obiekt reprezentujący dane <strong>w formie, w jakiej przemieszczają się</strong> między warstwami (np. z Web API do klienta WPF) - nie jest to ani czysty Model domenowy, ani ViewModel. Pytanie "gdzie go umieścić" dotyka fundamentalnej struktury projektu.</p>
<h2>Typowa struktura projektu WPF z DI (nawiązanie do wcześniejszej rozmowy)</h2>
<pre><code class="language-csharp">MyApp/
├── Models/              ← Model domenowy (jeśli lokalny, nie tylko przez API)
│   └── User.cs
├── DTOs/                ← DTO - format wymiany danych z API
│   └── OrderDto.cs
├── Services/            ← serwisy, klienci API (Services/OrderApiClient.cs z wcześniejszej rozmowy)
│   ├── IOrderApiClient.cs
│   └── OrderApiClient.cs
├── ViewModels/
│   ├── ViewModelBase.cs
│   └── OrderDetailsViewModel.cs
├── Views/
│   └── OrderDetailsView.xaml
</code></pre>
<p><strong>DTO żyje w osobnym folderze <code>DTOs/</code></strong> (albo <code>Contracts/</code>), <strong>równolegle</strong> do <code>Models/</code> - to jest kluczowa decyzja architektoniczna: DTO <strong>nie jest</strong> Modelem domenowym, mimo że mogą wyglądać podobnie.</p>
<h2>Dlaczego NIE używać DTO bezpośrednio jako Property w ViewModelu (częsty błąd)</h2>
<pre><code class="language-csharp">// ❌ Wątpliwa praktyka - ViewModel bezpośrednio operuje na DTO z API
public class OrderDetailsViewModel : ViewModelBase
{
    private OrderDto _order; // DTO z API, jako typ Property ViewModelu
    public OrderDto Order
    {
        get =&gt; _order;
        set =&gt; SetProperty(ref _order, value);
    }
}
</code></pre>
<p><strong>Problem:</strong> DTO jest zaprojektowane dla <strong>kontraktu API</strong> (format JSON), nie dla <strong>potrzeb UI</strong>. Jeśli serwer zmieni kontrakt API (np. zmieni nazwę pola), ViewModel <strong>i</strong> binding w XAML łamią się <strong>równocześnie</strong> - DTO "przecieka" przez wszystkie warstwy aż do UI.</p>
<h2>Lepsze podejście - osobny model dla UI (czasem nazywany "Presentation Model" albo po prostu właściwości na samym ViewModelu)</h2>
<pre><code class="language-csharp">// DTOs/OrderDto.cs - kontrakt z API, format 1:1 z JSON
public record OrderDto(int Id, string CustomerName, decimal TotalAmount, string Status, DateTime CreatedAt);
</code></pre>
<pre><code class="language-csharp">// ViewModels/OrderDetailsViewModel.cs - właściwości dopasowane do POTRZEB UI, nie do kontraktu API
public class OrderDetailsViewModel : ViewModelBase
{
    private readonly IOrderApiClient _apiClient;

    private int _orderId;
    public int OrderId { get =&gt; _orderId; set =&gt; SetProperty(ref _orderId, value); }

    private string _customerName;
    public string CustomerName { get =&gt; _customerName; set =&gt; SetProperty(ref _customerName, value); }

    // Właściwość WYLICZONA, potrzebna TYLKO w UI - DTO jej nie ma i nie powinien mieć
    private string _formattedTotal;
    public string FormattedTotal { get =&gt; _formattedTotal; set =&gt; SetProperty(ref _formattedTotal, value); }

    // Kolor/status specyficzny dla WYŚWIETLANIA - też nie ma sensu w DTO
    private Brush _statusColor;
    public Brush StatusColor { get =&gt; _statusColor; set =&gt; SetProperty(ref _statusColor, value); }

    public OrderDetailsViewModel(IOrderApiClient apiClient) =&gt; _apiClient = apiClient;

    public async Task LoadOrderAsync(int id)
    {
        var result = await _apiClient.GetOrderAsync(id); // pobiera DTO z API

        if (result.IsSuccess)
        {
            var dto = result.Value;

            // MAPOWANIE z DTO na właściwości ViewModelu - tu następuje &quot;rozprzęgnięcie&quot;
            OrderId = dto.Id;
            CustomerName = dto.CustomerName;
            FormattedTotal = dto.TotalAmount.ToString(&quot;C&quot;); // logika PREZENTACJI, nie należy do DTO
            StatusColor = dto.Status == &quot;Shipped&quot; ? Brushes.Green : Brushes.Orange; // logika UI
        }
    }
}
</code></pre>
<p><strong>Kluczowa zasada:</strong> DTO <strong>wchodzi</strong> do ViewModelu (jako parametr metody, tymczasowa zmienna), ale <strong>nie zostaje</strong> jako Property bindowana w XAML - ViewModel <strong>mapuje</strong> dane z DTO na własne właściwości, dopasowane do <strong>potrzeb UI</strong> (sformatowane, wyliczone, wzbogacone o logikę prezentacji).</p>
<h2>Kiedy DTO JAKO Property jest akceptowalne - prostsze przypadki</h2>
<p>Dla <strong>bardzo prostych</strong> ViewModeli, gdzie DTO 1:1 odpowiada temu, co UI potrzebuje wyświetlić (bez transformacji), bezpośrednie użycie DTO bywa pragmatycznym kompromisem - <strong>ale</strong> trzeba być tego świadomym jako decyzji, a nie przypadkowej konsekwencji "tak było łatwiej":</p>
<pre><code class="language-csharp">// Akceptowalne dla PROSTEJ listy, gdzie UI wyświetla dane 1:1
public class OrderListViewModel : ViewModelBase
{
    public ObservableCollection&lt;OrderDto&gt; Orders { get; } = new(); // ObservableCollection z wcześniejszej rozmowy o WPF
}
</code></pre>
<p>To jest kompromis praktyczny - dla listy wyświetlającej proste dane bez dodatkowej logiki prezentacji, tworzenie osobnego "Presentation Model" bywa niepotrzebnym narzutem.</p>
<h2>Automapper - naturalne zastosowanie tu (nawiązanie do wcześniejszej rozmowy)</h2>
<pre><code class="language-csharp">// Profile mapujący DTO na &quot;model&quot; ViewModelu, jeśli różnice są nietrywialne
public class OrderPresentationMappingProfile : Profile
{
    public OrderPresentationMappingProfile()
    {
        CreateMap&lt;OrderDto, OrderPresentationModel&gt;()
            .ForMember(dest =&gt; dest.FormattedTotal, opt =&gt; opt.MapFrom(src =&gt; src.TotalAmount.ToString(&quot;C&quot;)))
            .ForMember(dest =&gt; dest.StatusColor, opt =&gt; opt.MapFrom(src =&gt; src.Status == &quot;Shipped&quot; ? &quot;Green&quot; : &quot;Orange&quot;));
    }
}
</code></pre>
<h2>Podsumowanie - reguła praktyczna</h2>
<blockquote>
<p>DTO powinien żyć w <strong>osobnym</strong> folderze/namespace (<code>DTOs/</code>), reprezentując <strong>wyłącznie</strong> kontrakt komunikacji z API - nigdy Model domenowy. W ViewModelu, DTO <strong>przechodzi przez</strong> metody ładujące dane, ale dla nietrywialnych przypadków (potrzeba formatowania, logiki prezentacji, właściwości wyliczanych) powinien być <strong>zmapowany</strong> na właściwości samego ViewModelu (albo dedykowany "Presentation Model"), żeby zmiana kontraktu API nie łamała bezpośrednio bindingu w XAML. Dla prostych, statycznych list bez transformacji, bezpośrednie bindowanie DTO jest pragmatycznym, akceptowalnym kompromisem.</p>
</blockquote>
  
  `},

  { id:"code-review-example", title:"Przykład code review — HttpClientFactory", tags:"singleton anti-pattern socket exhaustion httpclientfactory code review",
  body:`
  <h1>Code Review - przykład z antywzorcami HttpClientFactory</h1>
<h2>Kod poddany review</h2>
<pre><code class="language-csharp">public class WeatherApiClient
{
    private readonly HttpClient _httpClient;

    // ❌ PROBLEM 1: publiczny konstruktor bezparametrowy tworzący WŁASNY HttpClient
    public WeatherApiClient()
    {
        _httpClient = new HttpClient();
        _httpClient.BaseAddress = new Uri(&quot;https://api.weather.com/&quot;);
    }

    public async Task&lt;WeatherDto&gt; GetWeatherAsync(string city)
    {
        try
        {
            var response = await _httpClient.GetAsync($&quot;weather?city={city}&quot;);
            var json = await response.Content.ReadAsStringAsync();
            return JsonSerializer.Deserialize&lt;WeatherDto&gt;(json);
        }
        catch (Exception ex) // ❌ PROBLEM 2: łapanie WSZYSTKICH wyjątków, myląca obsługa błędów
        {
            Console.WriteLine(&quot;Błąd: &quot; + ex.Message);
            return null; // ❌ PROBLEM 3: ukrywa błąd, wywołujący nie wie CO się nie udało
        }
    }
}
</code></pre>
<h2>Problem #1: Socket Exhaustion - <code>new HttpClient()</code> w konstruktorze</h2>
<p>To jest <strong>najbardziej krytyczny</strong> i najczęściej pytany problem na rozmowach o .NET/Web API. <code>HttpClient</code> implementuje <code>IDisposable</code>, więc intuicyjnie ktoś mógłby pomyśleć, że trzeba go <code>using</code>-ować przy każdym użyciu:</p>
<pre><code class="language-csharp">// ❌ JESZCZE GORZEJ - jeśli ktoś &quot;naprawi&quot; to przez using
public async Task&lt;WeatherDto&gt; GetWeatherAsync(string city)
{
    using var httpClient = new HttpClient(); // NOWY klient przy KAŻDYM wywołaniu!
    // ...
}
</code></pre>
<p><strong>Dlaczego to jest katastrofalne:</strong> każde utworzenie <code>HttpClient</code> tworzy <strong>nowe gniazdo sieciowe (socket)</strong>. System operacyjny <strong>nie zwalnia</strong> natychmiast socketów po zamknięciu połączenia - wchodzą w stan <code>TIME_WAIT</code> (typowo 240 sekund w Windows). Przy dużym ruchu (setki/tysiące requestów na minutę), aplikacja <strong>wyczerpuje</strong> dostępne porty/sockety systemu operacyjnego, co prowadzi do <code>SocketException: Address already in use</code> albo ogólnego zawieszenia aplikacji pod obciążeniem.</p>
<p><strong>To jest dokładnie ten problem, o którym mówiliśmy przy Singleton/thread-safety</strong> - <code>HttpClient</code> jest <strong>zaprojektowany, żeby być reużywalny i thread-safe</strong> dla wielu równoczesnych requestów - tworzenie nowej instancji przy każdym wywołaniu <strong>niweluje</strong> tę zaletę.</p>
<h3>Poprawne rozwiązanie - <code>IHttpClientFactory</code></h3>
<pre><code class="language-csharp">// Program.cs - rejestracja
builder.Services.AddHttpClient&lt;IWeatherApiClient, WeatherApiClient&gt;(client =&gt;
{
    client.BaseAddress = new Uri(&quot;https://api.weather.com/&quot;);
});
</code></pre>
<pre><code class="language-csharp">public class WeatherApiClient : IWeatherApiClient
{
    private readonly HttpClient _httpClient;

    // ✅ Konstruktor injection - HttpClient WSTRZYKNIĘTY, nie tworzony ręcznie
    public WeatherApiClient(HttpClient httpClient)
    {
        _httpClient = httpClient;
    }

    public async Task&lt;WeatherDto&gt; GetWeatherAsync(string city)
    {
        var response = await _httpClient.GetAsync($&quot;weather?city={city}&quot;);
        response.EnsureSuccessStatusCode();
        return await response.Content.ReadFromJsonAsync&lt;WeatherDto&gt;();
    }
}
</code></pre>
<p><strong><code>IHttpClientFactory</code></strong> (rejestrowane przez <code>AddHttpClient&lt;TInterface, TImplementation&gt;</code>) zarządza <strong>poolem</strong> handlerów HTTP pod spodem - <strong>reużywa</strong> połączenia TCP między requestami, a jednocześnie <strong>automatycznie odświeża</strong> handlery po pewnym czasie (domyślnie 2 minuty), żeby respektować zmiany DNS (co jest problemem, gdyby <code>HttpClient</code> był <strong>czystym</strong> Singletonem żyjącym wiecznie bez odświeżania).</p>
<h2>Problem #2: Zbyt ogólne <code>catch (Exception)</code> - myląca obsługa błędów</h2>
<pre><code class="language-csharp">catch (Exception ex) // łapie WSZYSTKO - włącznie z OutOfMemoryException, StackOverflowException...
{
    Console.WriteLine(&quot;Błąd: &quot; + ex.Message);
    return null;
}
</code></pre>
<p><strong>Dlaczego to jest problematyczne:</strong>
1. <strong>Łapanie zbyt szerokiej kategorii wyjątków</strong> - <code>catch (Exception)</code> przechwytuje <strong>wszystko</strong>, w tym błędy programistyczne (<code>NullReferenceException</code>, <code>ArgumentException</code>), które <strong>powinny</strong> wywalić się głośno w developmencie, a nie zostać "połknięte"
2. <strong><code>Console.WriteLine</code> jako "logowanie"</strong> - w prawdziwej aplikacji serwerowej to jest bezużyteczne (nikt nie czyta konsoli produkcyjnego serwera) - powinno być <code>ILogger&lt;T&gt;</code> (wstrzykiwane przez DI, jak omawialiśmy)
3. <strong>Zwrócenie <code>null</code> przy błędzie</strong> - to jest <strong>Problem #3</strong>, patrz niżej</p>
<h3>Poprawione podejście - selektywna obsługa błędów</h3>
<pre><code class="language-csharp">public async Task&lt;WeatherDto&gt; GetWeatherAsync(string city)
{
    try
    {
        var response = await _httpClient.GetAsync($&quot;weather?city={city}&quot;);
        response.EnsureSuccessStatusCode(); // rzuci HttpRequestException dla 4xx/5xx
        return await response.Content.ReadFromJsonAsync&lt;WeatherDto&gt;();
    }
    catch (HttpRequestException ex) // ✅ KONKRETNY typ wyjątku, oczekiwany scenariusz
    {
        _logger.LogWarning(ex, &quot;Nie udało się pobrać pogody dla miasta {City}&quot;, city);
        throw new WeatherServiceUnavailableException(city, ex); // przetłumaczony na wyjątek DOMENOWY
    }
    // Wyjątki NIEoczekiwane (NullReferenceException itp.) LECĄ DALEJ, nie są &quot;połknięte&quot;
}
</code></pre>
<h2>Problem #3: Zwracanie <code>null</code> przy błędzie - ukrywanie informacji o awarii</h2>
<pre><code class="language-csharp">return null; // wywołujący NIE WIE, czy: (a) miasto nie istnieje, (b) API padło, (c) błąd sieci
</code></pre>
<p><strong>Konsekwencja dla wywołującego kodu:</strong></p>
<pre><code class="language-csharp">var weather = await _weatherApiClient.GetWeatherAsync(&quot;Warszawa&quot;);
Console.WriteLine(weather.Temperature); // ❌ NullReferenceException, jeśli GetWeatherAsync zwróciło null!
</code></pre>
<p>Wywołujący <strong>musi pamiętać</strong> o sprawdzeniu <code>null</code> <strong>wszędzie</strong>, gdzie używa tej metody - a <strong>nie wie</strong>, <strong>dlaczego</strong> dostał <code>null</code> (miasto nie istnieje? serwis padł? błąd sieci?) - to utrudnia <strong>odpowiednią</strong> reakcję (np. "spróbuj ponownie" dla błędu sieci vs "pokaż błąd użytkownikowi" dla nieistniejącego miasta).</p>
<h3>Lepsze podejście - <code>Result&lt;T&gt;</code> (nawiązanie do wcześniejszej rozmowy o ActionResult po stronie klienta)</h3>
<pre><code class="language-csharp">public async Task&lt;ApiResult&lt;WeatherDto&gt;&gt; GetWeatherAsync(string city)
{
    try
    {
        var response = await _httpClient.GetAsync($&quot;weather?city={city}&quot;);

        if (response.StatusCode == HttpStatusCode.NotFound)
            return ApiResult&lt;WeatherDto&gt;.Failure($&quot;Miasto '{city}' nie zostało znalezione&quot;, response.StatusCode);

        response.EnsureSuccessStatusCode();
        var weather = await response.Content.ReadFromJsonAsync&lt;WeatherDto&gt;();
        return ApiResult&lt;WeatherDto&gt;.Success(weather, response.StatusCode);
    }
    catch (HttpRequestException ex)
    {
        _logger.LogWarning(ex, &quot;Błąd połączenia przy pobieraniu pogody dla {City}&quot;, city);
        return ApiResult&lt;WeatherDto&gt;.Failure(&quot;Serwis pogodowy niedostępny&quot;, HttpStatusCode.ServiceUnavailable);
    }
}
</code></pre>
<p>Wywołujący <strong>jawnie</strong> dostaje informację o <strong>rodzaju</strong> niepowodzenia, dokładnie jak w przykładzie <code>ApiResult&lt;T&gt;</code>, który omawialiśmy przy konsumpcji <code>ActionResult</code> po stronie klienta.</p>
<h2>Podsumowanie zbiorcze problemów i poprawek</h2>
<table>
<thead>
<tr>
<th>Problem</th>
<th>Konsekwencja</th>
<th>Rozwiązanie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>new HttpClient()</code> w konstruktorze</td>
<td>Socket exhaustion pod obciążeniem</td>
<td><code>IHttpClientFactory</code> przez <code>AddHttpClient&lt;T&gt;()</code>, wstrzykiwany <code>HttpClient</code></td>
</tr>
<tr>
<td><code>catch (Exception)</code> ogólny</td>
<td>Łapie błędy programistyczne, utrudnia debugowanie</td>
<td>Łap <strong>konkretne</strong> typy wyjątków (<code>HttpRequestException</code>), reszta leci dalej</td>
</tr>
<tr>
<td><code>Console.WriteLine</code> jako logowanie</td>
<td>Bezużyteczne na produkcji</td>
<td><code>ILogger&lt;T&gt;</code> przez DI</td>
</tr>
<tr>
<td><code>return null</code> przy błędzie</td>
<td>Ukrywa przyczynę, wymusza sprawdzanie null wszędzie</td>
<td><code>Result&lt;T&gt;</code>/wyjątek domenowy z jasną informacją o przyczynie</td>
</tr>
</tbody>
</table>
<h2>Dlaczego ten typ pytania jest częsty na rozmowach SE III</h2>
<p>Code review to <strong>praktyczny test integrujący wiele tematów naraz</strong> - ten jeden fragment kodu dotyka: zarządzania zasobami (<code>HttpClient</code>/DI), dobrych praktyk obsługi wyjątków, jakości logowania, i projektowania API zwracanych wartości (<code>null</code> vs <code>Result&lt;T&gt;</code>). Dobra odpowiedź na rozmowie <strong>nie kończy się</strong> na "HttpClient powinien być z DI" - pokazuje zrozumienie <strong>wszystkich</strong> warstw problemu i <strong>dlaczego</strong> każda poprawka ma znaczenie w kontekście produkcyjnej aplikacji pod obciążeniem.</p>
